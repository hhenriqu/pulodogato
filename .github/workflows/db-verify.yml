name: db-verify

# Prova, a cada mudanca em database/, que o schema versionado ainda sobe do zero
# e que a RLS continua isolando um usuario do outro. Se este job ficar vermelho,
# o repositorio perdeu a capacidade de reconstruir o banco -- que e exatamente o
# problema que a HMO-117 existiu para resolver.

on:
  push:
    branches: [main]
    paths: ['database/**', 'scripts/db-*.sh', '.github/workflows/db-verify.yml']
  pull_request:
    paths: ['database/**', 'scripts/db-*.sh', '.github/workflows/db-verify.yml']
  workflow_dispatch:

jobs:
  migrations:
    name: schema do zero + isolamento de RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulodogato_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pulodogato_ci
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      # Tem que ser o 17: o ubuntu-latest traz o cliente 16, e o pg_dump se
      # recusa a falar com um servidor mais novo que ele.
      - name: Instalar o cliente Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      # O Supabase de verdade ja tem schema auth e roles anon/authenticated;
      # num Postgres cru e preciso recria-los antes.
      - name: Shim do Supabase
        run: $PSQL -f database/tests/00_supabase_shim.sql

      - name: 001_baseline
        run: $PSQL -f database/migrations/001_baseline.sql

      - name: 002_rls_lockdown
        run: $PSQL -f database/migrations/002_rls_lockdown.sql

      # O teste prova ausencia de vazamento. Uma tabela sem RLS e vazia passaria
      # nele, entao a cobertura e checada separadamente logo abaixo.
      - name: Teste de isolamento de RLS
        run: $PSQL -f database/tests/rls_isolation_test.sql

      - name: Nenhuma tabela pode ficar sem RLS
        run: |
          semrls=$($PSQL -tAc "
            SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relkind = 'r'
               AND NOT c.relrowsecurity;")
          if [ -n "$semrls" ]; then
            echo "::error::Tabelas em public sem RLS: $semrls"
            exit 1
          fi
          echo "Todas as tabelas de public estao com RLS ligada."

      # A chave anon vai embutida no bundle JS publico: qualquer privilegio que
      # ela tenha alem das duas tabelas de referencia e dado aberto na internet.
      - name: anon so pode ler as tabelas de referencia
        run: |
          extra=$($PSQL -tAc "
            SELECT string_agg(DISTINCT table_name, ', ')
              FROM information_schema.role_table_grants
             WHERE grantee = 'anon' AND table_schema = 'public'
               AND table_name NOT IN ('financial_services', 'transaction_categories');")
          if [ -n "$extra" ]; then
            echo "::error::A role anon tem privilegio em tabelas que nao sao de referencia: $extra"
            exit 1
          fi
          echo "anon limitada a financial_services e transaction_categories."

      - name: Seed carregado
        run: |
          $PSQL -tAc "SELECT 'financial_services=' || count(*) FROM financial_services"
          $PSQL -tAc "SELECT 'transaction_categories=' || count(*) FROM transaction_categories"

      # Os passos acima rodam num banco limpo, onde as unicas policies sao as
      # que o 002 cria. Producao nao e assim: pode ter policy feita pelo painel
      # do Supabase, com nome que o DROP POLICY IF EXISTS nominal do 002 nunca
      # alcancaria. Uma sobrevivente com USING (true) vaza os dados de um
      # usuario logado para outro - e a auditoria anonima passa verde, porque
      # ela testa sem login. Este job planta essa policy e exige que o 002 a
      # remova. Vai em banco proprio: o estado sujo nao pode contaminar o
      # drill de backup abaixo.
      - name: Deriva de policies legadas
        env:
          PGDATABASE: pulodogato_drift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_drift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/legacy_policy_drift_test.sql

      # Backup que nunca foi restaurado nao e backup. O ciclo inteiro
      # (dump -> banco vazio -> conferencia) roda aqui a cada mudanca, para o
      # drill de verdade contra producao nunca ser a primeira execucao.
      - name: Drill de backup e restauracao
        env:
          PGDATABASE: pulodogato_ci
        run: |
          set -euo pipefail
          URL_ORIGEM="postgresql://postgres:postgres@localhost:5432/pulodogato_ci"
          URL_DESTINO="postgresql://postgres:postgres@localhost:5432/pulodogato_drill"

          $PSQL -d postgres -c "CREATE DATABASE pulodogato_drill"

          # Uma linha reconhecivel, para provar que o dado atravessou o ciclo.
          $PSQL <<'SQL'
          INSERT INTO auth.users (id, email)
            VALUES ('11111111-1111-1111-1111-111111111111', 'drill@ci.local');
          INSERT INTO public.profiles (id, full_name)
            VALUES ('11111111-1111-1111-1111-111111111111', 'Drill CI');
          INSERT INTO public.financial_accounts (id, user_id, name, account_type)
            VALUES ('22222222-2222-2222-2222-222222222222',
                    '11111111-1111-1111-1111-111111111111', 'Conta Drill', 'checking');
          INSERT INTO public.financial_transactions
                 (user_id, account_id, amount, transaction_date, description)
            VALUES ('11111111-1111-1111-1111-111111111111',
                    '22222222-2222-2222-2222-222222222222',
                    1234.56, '2026-01-01', 'Transacao do drill');
          SQL

          chmod +x scripts/db-backup.sh scripts/db-restore.sh
          SUPABASE_DB_URL="$URL_ORIGEM" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-backup.sh "$RUNNER_TEMP/drill"

          # Prova que o backup sai criptografado e que o restore abre o .gpg.
          ls "$RUNNER_TEMP/drill"/*-data.sql.gz.gpg > /dev/null

          RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-restore.sh "$RUNNER_TEMP/drill"

          valor=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT amount FROM public.financial_transactions WHERE description = 'Transacao do drill'")
          if [ "$valor" != '1234.56' ]; then
            echo "::error::O ciclo de backup/restauracao perdeu dados (esperado 1234.56, obtido '$valor')"
            exit 1
          fi
          echo "Ciclo completo: o dado atravessou dump, criptografia e restauracao."
