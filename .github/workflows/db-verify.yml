jobs:
  migrations:
    name: schema do zero + isolamento de RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulodogato_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pulodogato_ci
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      # O `npm ci` e so pelo tsc: o teste de recorrencia compila
      # lib/recurrence.ts com o TypeScript que ja e devDependency, em vez de
      # trazer um runner de teste novo so para conferir aritmetica de data.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # A COMPILACAO DAS SUITES, UMA VEZ SO (HMO-263).
      #
      # Os alvos test:* disparavam uma invocacao de tsc por suite -- 98 hoje,
      # 209s medidos. O custo era a partida do compilador e o reparse dos
      # MESMOS arquivos de lib/: 573 arquivos distintos lidos 18.368 vezes.
      #
      # Aqui os 98 saem de um processo unico que reaproveita o AST ja parseado:
      # ~28s. Cada alvo continua sendo seu proprio programa, com o seu tsconfig
      # e o seu outDir -- nao ha uniao de include, porque varios tsconfig sao
      # estreitos de proposito (provam que um modulo compila SEM um import).
      # A saida foi comparada byte a byte com a dos 98 tsc separados: 98
      # diretorios, 470 arquivos, zero diferencas.
      #
      # Depois daqui, cada `npm run test:*` encontra a saida dele pronta e so
      # roda as assercoes. O reaproveitamento e por sha256 das ENTRADAS, entao
      # um mutante de controle negativo muda o hash e FORCA recompilacao: ele
      # nao pode morrer verde sobre o artefato de antes.
      #
      # O que este passo NAO acelera: os blocos de controle negativo. Eles
      # rodam a suite numa COPIA da arvore, uma vez por mutante -- um alvo, um
      # processo, nada a compartilhar. La o alvo e delegado ao tsc, para ficar
      # exatamente na velocidade de antes em vez de pagar travessia sem lote.
      - name: Compilar a saida de todas as suites de uma vez, num processo so
        run: npm run compila-suites

      # Tem que ser o 17: o ubuntu-latest traz o cliente 16, e o pg_dump se
      # recusa a falar com um servidor mais novo que ele.
      - name: Instalar o cliente Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      # O Supabase de verdade ja tem schema auth e roles anon/authenticated;
      # num Postgres cru e preciso recria-los antes.
      # O bundle de database/validation/ e uma copia gerada das migrations, para
      # o dono do projeto colar no SQL Editor do Supabase. Copia que sai de
      # sincronia e pior do que nao ter copia: ele validaria um schema que nao e
      # mais o nosso e o relatorio sairia verde. O --check nao toca no banco.
      - name: Bundle de validacao em dia com as migrations
        run: node scripts/gen-validation-bundle.mjs --check

      - name: Shim do Supabase
        run: $PSQL -f database/tests/00_supabase_shim.sql

      - name: 001_baseline
        run: $PSQL -f database/migrations/001_baseline.sql

      - name: 002_rls_lockdown
        run: $PSQL -f database/migrations/002_rls_lockdown.sql

      # O 002 ligou RLS nas tabelas derivadas, que sao mantidas por trigger --
      # e trigger roda com o privilegio de quem disparou o comando. Sem o 003
      # (SECURITY DEFINER) o cadastro de usuario e a aprovacao de divisao
      # batem na propria RLS e derrubam a transacao. Ver HMO-123 / HMO-125.
      - name: 003_fix_trigger_privileges
        run: $PSQL -f database/migrations/003_fix_trigger_privileges.sql

      # O 004 fecha os triggers que sobraram do 003 (HMO-125). Ficou de fora
      # deste job ate 2026-09-22, entao o CI validava uma cadeia que nao era a
      # de producao.
      - name: 004_fix_remaining_trigger_privileges
        run: $PSQL -f database/migrations/004_fix_remaining_trigger_privileges.sql

      - name: 005_recurring_and_scheduled
        run: $PSQL -f database/migrations/005_recurring_and_scheduled.sql

      # Aplicar duas vezes tem que ser inofensivo: o 005 e re-executavel de
      # proposito, porque depois que ele entrar em producao o 001 regerado ja
      # vai trazer as tabelas dele.
      - name: 005 e idempotente
        run: $PSQL -f database/migrations/005_recurring_and_scheduled.sql

      # O teste prova ausencia de vazamento. Uma tabela sem RLS e vazia passaria
      # nele, entao a cobertura e checada separadamente logo abaixo.
      - name: Teste de isolamento de RLS
        run: $PSQL -f database/tests/rls_isolation_test.sql

      # HMO-190: entrada por codigo em grupo privado nasce `pending`, e quem
      # tira dela e o admin. Roda aqui porque so depende do 001 e do 002.
      - name: Teste de aprovacao de entrada por codigo (HMO-190)
        run: $PSQL -f database/tests/hmo190_aprovar_entrada_por_codigo_test.sql

      - name: 006_budgets_and_card_invoices
        run: $PSQL -f database/migrations/006_budgets_and_card_invoices.sql

      # Mesmo motivo do 005: depois que o 006 entrar em producao, o 001
      # regerado ja vai trazer budgets e as duas views.
      - name: 006 e idempotente
        run: $PSQL -f database/migrations/006_budgets_and_card_invoices.sql

      # Contas previstas: isolamento, a view security_invoker e as invariantes
      # de dinheiro (paga sem transacao, ocorrencia duplicada).
      - name: Teste das contas previstas
        run: $PSQL -f database/tests/scheduled_rls_test.sql

      # Orcamento e fatura: o consumo soma as transacoes certas, o teto pessoal
      # nao se confunde com o do grupo, as duas views respeitam a RLS e a
      # aritmetica da fatura acerta os meses curtos.
      #
      # A assercao que mais importa e a do SINAL: despesa e gravada NEGATIVA
      # neste banco, entao um SUM(amount) cru na view de consumo devolveria -800
      # para quem gastou 800 -- ratio negativo, status 'ok' para sempre, alerta
      # de estouro que nunca dispara, e nenhum erro em lugar nenhum.
      - name: Teste do orcamento e da fatura
        run: $PSQL -f database/tests/budget_invoice_test.sql

      - name: 007_group_settlements
        run: $PSQL -f database/migrations/007_group_settlements.sql

      # Mesmo motivo do 005 e do 006. O 007 tem um agravante proprio: ele faz
      # um UPDATE de manutencao em financial_transactions (backfill de
      # group_id), e rodar duas vezes nao pode mexer no saldo das contas na
      # segunda passada. A propria migration aborta se mexer.
      - name: 007 e idempotente
        run: $PSQL -f database/migrations/007_group_settlements.sql

      # Acerto de contas do grupo. A assercao que mais importa e o SINAL:
      # registrar um pagamento tem que APROXIMAR o saldo de zero. O erro
      # simetrico dobra a divida a cada Pix registrado e a tela mostraria a
      # sugestao de transferencia CRESCENDO depois de cada pagamento -- sem
      # erro nenhum em lugar nenhum.
      #
      # Cobre tambem os tres defeitos que o 007 conserta no schema herdado:
      # o rateio que perdia centavo (grupo nunca fechava), o trigger que
      # reescrevia divisao personalizada como igualitaria, e o trigger de saldo
      # que cobrava o valor de novo a cada edicao de lancamento.
      - name: Teste do acerto de contas do grupo
        run: $PSQL -f database/tests/group_settlement_test.sql

      - name: 008_goals_and_reports
        run: $PSQL -f database/migrations/008_goals_and_reports.sql

      # Mesmo motivo do 005, 006 e 007: depois que o 008 entrar em producao, o
      # 001 regerado ja vai trazer as metas e as cinco views.
      - name: 008 e idempotente
        run: $PSQL -f database/migrations/008_goals_and_reports.sql

      # Metas e relatorios. A assercao que mais importa e de novo o SINAL:
      # despesa e gravada NEGATIVA, e um SUM cru nas views devolveria gasto
      # negativo -- barra para baixo e um "voce economizou" onde houve gasto,
      # sem erro em lugar nenhum. Mesma familia do erro que quase passou no 006.
      #
      # Cobre tambem as tres armadilhas proprias desta fase:
      #   - 'transfer' nao e receita nem despesa no fluxo de caixa, mas CONTA
      #     no patrimonio (o trigger de saldo mexe em qualquer tipo);
      #   - previsto x realizado casa o mes pessoal, onde group_id e NULL dos
      #     dois lados -- com `=` em vez de IS NOT DISTINCT FROM a tela diria
      #     que o usuario nao realizou nada do que planejou;
      #   - o progresso da meta sai dos APORTES, nunca do saldo da conta.
      - name: Teste das metas e dos relatorios
        run: $PSQL -f database/tests/goals_reports_test.sql

      - name: 009_statements_alerts_receipts
        run: $PSQL -f database/migrations/009_statements_alerts_receipts.sql

      # Mesmo motivo do 005 ao 008. A SECAO 11 do 009 (bucket de comprovantes)
      # se pula sozinha aqui: o schema `storage` so existe num Supabase de
      # verdade. As outras dez secoes sao provadas normalmente.
      - name: 009 e idempotente
        run: $PSQL -f database/migrations/009_statements_alerts_receipts.sql

      # Extrato, avisos e comprovantes. A assercao central e a DEDUPLICACAO,
      # nas duas metades: reimportar o mesmo arquivo nao pode duplicar nada, e
      # a mesma linha em OUTRA conta tem que entrar. Sem a primeira, cada
      # reimportacao dobra o mes; sem a segunda, o extrato da poupanca perde
      # lancamentos que existiram de verdade.
      #
      # Cobre tambem:
      #   - o SINAL do extrato (debito importado continua NEGATIVO, e portanto
      #     continua sendo despesa nas views do 008);
      #   - a paridade status <-> transaction_id, que impede uma linha ficar
      #     'imported' sem lancamento -- invisivel para sempre sem nunca ter
      #     virado dinheiro;
      #   - o COALESCE(3) da janela de aviso: um INNER JOIN em
      #     notification_preferences daria view vazia e o cron sairia verde sem
      #     avisar ninguem, que e a pior falha possivel por ser silenciosa;
      #   - a UNIQUE que impede o mesmo aviso sair todo dia -- e o adiamento,
      #     que merece aviso novo.
      #
      # Tem dois controles negativos: sem security_invoker o vazamento aparece,
      # e sem o indice unico o duplicado entra.
      - name: Teste do extrato, dos avisos e dos comprovantes
        run: $PSQL -f database/tests/statements_alerts_test.sql

      - name: 010_user_connections
        run: $PSQL -f database/migrations/010_user_connections.sql

      # Mesmo motivo do 005 ao 009.
      - name: 010 e idempotente
        run: $PSQL -f database/migrations/010_user_connections.sql

      # Conexoes entre usuarios. A assercao central e o CONSENTIMENTO: quem
      # pede a conexao nao pode aceita-la sozinho. Sem o `status = 'pending'`
      # no WITH CHECK da policy de INSERT, qualquer usuario logado gravaria
      # (eu, a vitima, 'accepted') e passaria a constar como conexao aceita
      # dela -- e conexao aceita e o que habilita puxar alguem para o rateio
      # de uma despesa. Nada falharia, e a vitima so descobriria vendo um
      # estranho na propria lista de divisao.
      #
      # Cobre tambem: o par unico nos DOIS sentidos (A->B e B->A viram dois
      # pendentes, e aceitar um deixa o outro pendente para sempre), o
      # bloqueio que dura (com DELETE simetrico, quem foi recusado apaga a
      # linha e pede de novo indefinidamente), e os NOMES das duas foreign
      # keys -- a PostgREST resolve o embed do perfil pelo nome da constraint,
      # entao com nome gerado a tabela existe e a tela continua quebrada.
      #
      # Tem dois controles negativos: as duas regras sao reintroduzidas
      # quebradas no fim do arquivo e o defeito tem que voltar a acontecer.
      - name: Teste das conexoes entre usuarios
        run: $PSQL -f database/tests/user_connections_test.sql

      # O 011 entrou na main pelo PR #20 e nunca foi exercitado aqui: o CI
      # validava uma cadeia que parava no 010 enquanto producao ja tinha o 011.
      - name: 011_detected_recurrences
        run: $PSQL -f database/migrations/011_detected_recurrences.sql

      # Mesmo motivo do 005 ao 010.
      - name: 011 e idempotente
        run: $PSQL -f database/migrations/011_detected_recurrences.sql

      - name: 012_payroll
        run: $PSQL -f database/migrations/012_payroll.sql

      - name: 012 e idempotente
        run: $PSQL -f database/migrations/012_payroll.sql

      # Contracheque. A assercao central e QUAL valor vira lancamento: tem que
      # ser o LIQUIDO e POSITIVO. Gravando o bruto, o fluxo de caixa do 008
      # mostraria uma receita que nunca foi recebida; gravando o liquido com
      # sinal trocado, as views do 008 leriam salario como DESPESA. Nos dois
      # casos o saldo da conta continua fechando -- que e o que torna o erro
      # invisivel.
      #
      # Cobre tambem: o teto do desconto (um IRRF com um zero a mais produz
      # liquido negativo, que vira despesa nos relatorios), o UNIQUE que impede
      # a renda do mes dobrar, e o security_invoker da view do liquido.
      #
      # Tem dois controles negativos: sem security_invoker a view vaza o
      # salario alheio, e sem o trigger o liquido fica negativo.
      - name: Teste do contracheque
        run: $PSQL -f database/tests/payroll_test.sql

      # O 013 fecha a unica view do schema que ficou sem security_invoker: a
      # `user_subscription_details`, criada no 001_baseline antes de a 002
      # ligar RLS. As migrations que ligaram a opcao (006, 008, 012) so
      # cobriram as views que elas mesmas criaram, e essa passou por doze
      # migrations devolvendo nome, email e plano de TODOS os usuarios para
      # qualquer usuario logado (HMO-145).
      - name: 013_fix_user_subscription_details_leak
        run: $PSQL -f database/migrations/013_fix_user_subscription_details_leak.sql

      # Mesmo motivo do 005 ao 012.
      - name: 013 e idempotente
        run: $PSQL -f database/migrations/013_fix_user_subscription_details_leak.sql

      - name: 014_categorization_rules
        run: $PSQL -f database/migrations/014_categorization_rules.sql

      # Mesmo motivo do 005 ao 013. Aqui a re-execucao prova tambem que a
      # SECAO 7 do proprio arquivo (a prova que aborta se a RLS, as 4 policies,
      # o UNIQUE, a trigger ou o fechamento do anon nao tiverem pegado) passa
      # num banco onde a tabela JA existe -- que e o caso de producao no dia em
      # que alguem rodar a migration duas vezes.
      - name: 014 e idempotente
        run: $PSQL -f database/migrations/014_categorization_rules.sql

      - name: 015_card_invoice_payment
        run: $PSQL -f database/migrations/015_card_invoice_payment.sql

      # Mesmo motivo do 005 ao 014, com um agravante proprio: o 015 ESCREVE em
      # dado existente (desfaz baixas de fatura tortas). Rodar duas vezes prova
      # que a segunda passada nao desfaz uma baixa correta feita no meio.
      - name: 015 e idempotente
        run: $PSQL -f database/migrations/015_card_invoice_payment.sql

      # Pagar a fatura do cartao contava a mesma despesa DUAS vezes: a baixa
      # lancava a fatura como despesa no PROPRIO cartao, entao o cartao ficava
      # mais negativo e a conta de onde o dinheiro saiu nao se mexia. Nada
      # quebrava -- o patrimonio ficava 25% menor, plausivel, com duas casas.
      #
      # O teste tem controle POSITIVO: ele reproduz o bug antes de consertar
      # (patrimonio caindo de 4.000 para 3.000, fluxo de caixa acusando 3.000
      # de despesa num mes de 2.000). Sem isso, o teste do conserto passaria
      # num banco onde o bug nunca existiu.
      #
      # E tem os dois controles negativos que mais importam, porque um reparo
      # ingenuo destruiria dado bom: a assinatura cobrada NO cartao (pagar
      # aquela conta com o cartao e despesa de verdade -- um reparo por
      # account_type apagaria o lancamento e a despesa desapareceria do
      # relatorio) e a nota escrita a mao que so PARECE a chave canonica.
      #
      # lib/card-invoice.ts prova a aritmetica das duas pernas; o que so o SQL
      # alcanca e o trigger de saldo e as views do 006/008, que e exatamente a
      # junta onde o bug vivia -- o VALOR estava certo, a CONTA estava errada.
      - name: Pagamento de fatura nao conta a despesa duas vezes
        run: $PSQL -f database/tests/card_invoice_payment_test.sql

      # A auditoria e o arquivo que o Helio COLA no SQL Editor de producao
      # antes de aplicar a 015. Um nome de coluna errado ali nao aparece em
      # lugar nenhum ate o momento em que ele precisa da resposta -- e a
      # resposta que ele precisa e sobre dinheiro ja gravado.
      #
      # `BEGIN READ ONLY` faz o proprio postgres provar as duas coisas que o
      # arquivo promete: que toda referencia a tabela, coluna e funcao resolve
      # contra o schema real (001 -> 015 ja aplicados acima), e que ele NAO
      # ESCREVE -- um INSERT, UPDATE ou DELETE que entrasse aqui por descuido
      # aborta a transacao em vez de passar despercebido. O ROLLBACK no fim e
      # cinto e suspensorio: nada a desfazer, por construcao.
      #
      # Nenhum outro script de database/maintenance/ tinha cobertura de CI ate
      # aqui, incluindo o 007. Este e o primeiro.
      - name: A auditoria de faturas roda e nao escreve nada
        run: |
          printf 'BEGIN READ ONLY;\n\\i database/maintenance/015_auditoria_faturas.sql\nROLLBACK;\n' \
            | $PSQL

      - name: 016_recurrence_notifications
        run: $PSQL -f database/migrations/016_recurrence_notifications.sql

      # Mesmo motivo do 005 ao 015. O risco proprio deste e o ALTER: a segunda
      # passada nao pode quebrar na coluna que ja existe nem recriar constraint.
      - name: 016 e idempotente
        run: $PSQL -f database/migrations/016_recurrence_notifications.sql

      # A HMO-148 existe por UM motivo: nao avisar o usuario duas vezes do mesmo
      # alerta de assinatura. A varredura roda no cron diario E ao fim de cada
      # importacao de extrato, entao sem deduplicacao quem importa tres extratos
      # numa tarde recebe o mesmo push tres vezes, desliga a notificacao do app,
      # e perde junto o aviso de vencimento -- que e o que ele mais precisa.
      #
      # O assert que justifica o arquivo: o `ON CONFLICT (recurrence_id, kind,
      # reference_date)` que a rota manda -- lista de colunas NUA, que e tudo o
      # que o PostgREST sabe mandar -- tem que RESOLVER contra o indice do 016.
      # O desenho original da issue pedia um indice unico PARCIAL, e indice
      # parcial nao serve de arbitro de ON CONFLICT sem repetir o predicado na
      # clausula: com ele o cron responderia 500 em toda execucao e ninguem
      # receberia aviso nenhum. Nenhum teste de TypeScript com cliente dublado
      # pega isso -- so o Postgres.
      #
      # E tem os controles negativos que importam: uma cobranca NOVA tem que
      # gerar aviso novo (senao um indice sem a data passaria verde e o reajuste
      # do ano seguinte sairia calado), e duas contas previstas vencendo no mesmo
      # dia continuam gerando dois avisos (o que so funciona porque NULL nao
      # colide com NULL no indice novo).
      - name: O aviso de assinatura nao sai duas vezes
        run: $PSQL -f database/tests/recurrence_notifications_test.sql

      - name: 017_monthly_summary_notifications
        run: $PSQL -f database/migrations/017_monthly_summary_notifications.sql

      # Mesmo motivo do 005 ao 016. O risco proprio deste e o ALTER: a segunda
      # passada nao pode quebrar na coluna que ja existe nem recriar constraint.
      - name: 017 e idempotente
        run: $PSQL -f database/migrations/017_monthly_summary_notifications.sql

      # O resumo do mes fechado e a TERCEIRA familia de aviso, e a unica que nao
      # aponta para objeto nenhum -- e sobre um mes, nao sobre uma conta nem
      # sobre uma assinatura. Dois riscos que so o Postgres pega:
      #
      #   - o `ON CONFLICT (user_id, kind, summary_month)` que o cron manda e
      #     lista de colunas NUA (e tudo o que o PostgREST sabe mandar) e tem
      #     que resolver contra o indice. Trocar o indice por um PARCIAL -- que
      #     e a forma que parece mais limpa -- faz o cron responder 500 em toda
      #     execucao, e a mensagem nao aponta para o indice;
      #   - a familia ANTIGA tem que sobreviver: duas contas vencendo no mesmo
      #     dia continuam gerando DOIS avisos. Um indice ingenuo sobre
      #     (user_id, kind, reference_date) recusaria o segundo, trocando aviso
      #     repetido por aviso PERDIDO -- o erro caro dos dois.
      - name: O resumo do mes nao sai duas vezes, e nao engole o aviso de conta
        run: $PSQL -f database/tests/monthly_summary_notifications_test.sql

      - name: 018_goal_monthly_contribution
        run: $PSQL -f database/migrations/018_goal_monthly_contribution.sql

      # Mesmo motivo do 005 ao 017. O risco proprio deste e o CREATE OR REPLACE
      # VIEW: a segunda passada nao pode quebrar por a coluna ja estar no fim do
      # SELECT, e nao pode derrubar o security_invoker da view.
      - name: 018 e idempotente
        run: $PSQL -f database/migrations/018_goal_monthly_contribution.sql

      - name: 019_cron_runs
        run: $PSQL -f database/migrations/019_cron_runs.sql

      # Re-executavel: o IF NOT EXISTS de cada CHECK e o DO/IF da policy tem
      # que atravessar a segunda passada sem erro. A policy tem um ramo a mais
      # que os outros arquivos -- ela so nasce se o papel `paperclip_ro`
      # existir, e aqui ele NAO existe (e credencial de producao). Este step
      # exercita justamente o ramo do RAISE NOTICE.
      - name: 019 e idempotente
        run: $PSQL -f database/migrations/019_cron_runs.sql

      - name: 020_group_archive_schema
        run: $PSQL -f database/migrations/020_group_archive_schema.sql

      # Re-executavel: as colunas entram com ADD COLUMN IF NOT EXISTS, as FKs
      # passam por um DO/IF sobre pg_constraint, e os dois CHECK sao
      # DROP IF EXISTS + ADD.
      - name: 020 e idempotente
        run: $PSQL -f database/migrations/020_group_archive_schema.sql

      # O schema que a feature de grupos arquivados sempre pediu e nunca teve.
      # O que so o Postgres pega aqui:
      #
      #   - `group_members_status_check` NAO aceitava 'archived', e o codigo
      #     grava exatamente esse valor ao arquivar. So criar as colunas deixaria
      #     a tela vazia para sempre, porque as duas consultas da rota filtram
      #     por esse status -- com cara de "voce nao tem grupos arquivados";
      #   - o `ON DELETE SET NULL` de `archived_by` ESCREVE a linha, e o CHECK e
      #     avaliado nessa escrita. A primeira versao da 020 usava o par
      #     simetrico e tornava impossivel apagar um perfil que ja arquivou um
      #     grupo -- este teste foi quem reprovou;
      #   - o caso 5 e controle POSITIVO: sem ele, os casos de recusa ficariam
      #     satisfeitos por um CHECK que recusa tudo.
      - name: A 020 recusa a linha errada e aceita a certa
        run: $PSQL -f database/tests/020_group_archive_test.sql

      - name: 021_investments
        run: $PSQL -f database/migrations/021_investments.sql

      # Re-executavel, e aqui houve um detalhe: o UNIQUE (id, user_id) da tabela
      # de ativos NAO pode usar o padrao DROP IF EXISTS + ADD do resto do
      # arquivo. A FK composta da tabela de lancamentos depende do indice dele, e
      # o DROP falha com "other objects depend on it" na segunda passada -- este
      # passo foi quem pegou. Ele entra por um DO/IF sobre pg_constraint.
      - name: 021 e idempotente
        run: $PSQL -f database/migrations/021_investments.sql

      # A carteira de investimentos. O que so o Postgres pega:
      #
      #   - a politica de INSERT (`user_id = auth.uid()`) olha a coluna user_id da
      #     LINHA NOVA, que o atacante preenche corretamente com a propria
      #     identidade -- nada nela olha de QUEM e o asset_id. Sem a FK COMPOSTA
      #     para (id, user_id), o usuario A grava lancamento dentro da carteira do
      #     usuario B e a soma de proventos de B muda sem B fazer nada. A RLS de
      #     SELECT esconde o ativo de B, mas esconder na leitura nao impede a
      #     escrita. O caso 1 do teste e exatamente esse, e o mutante (FK simples
      #     para `id`) morre nele;
      #   - o par `current_price` / `current_price_at`: preco sem data e um numero
      #     que o usuario nao sabe de quando e, e e nele que ele decide se vende;
      #   - `symbol = upper(symbol)` com o UNIQUE por usuario. Sem isso "petr4" e
      #     "PETR4" viram duas linhas e a carteira mostra o mesmo ativo duas
      #     vezes, cada uma com METADE da posicao -- os dois numeros parecem
      #     plausiveis e nenhum esta certo;
      #   - os CHECK de valor positivo, que e onde a convencao desta tabela se
      #     separa de `financial_transactions`: aqui o sinal NAO carrega
      #     significado, quem carrega e `kind`. Quem tentar representar venda como
      #     quantidade negativa bate no CHECK em vez de produzir preco medio
      #     errado em silencio;
      #   - o caso 8 e controle POSITIVO da RLS: ele grava um ativo do usuario A
      #     de volta antes de checar o isolamento, porque o caso 7 apagou o unico
      #     que existia -- sem isso "B nao ve ativo do A" passaria por AUSENCIA de
      #     dado, que e a assercao mais convincente que existe e nao prova nada.
      - name: A 021 recusa a linha errada e aceita a certa
        run: $PSQL -f database/tests/021_investments_test.sql

      - name: 022_currency
        run: $PSQL -f database/migrations/022_currency.sql

      - name: 022 e idempotente
        run: $PSQL -f database/migrations/022_currency.sql

      # A moeda por conta e por lancamento. O que so o Postgres pega:
      #
      #   - a 022 nao acrescenta coluna, ela muda o GRAO das tres views de
      #     relatorio do 008. Guardar a moeda sem isso e o pior resultado
      #     possivel: o app ganharia o seletor e `SUM(ABS(amount))` passaria a
      #     somar 1000 reais com 180 dolares e devolver 1180 -- um numero que nao
      #     esta em moeda nenhuma, com cara de total, e para MAIS, que e o lado do
      #     qual ninguem reclama. Nenhum teste de TypeScript le view;
      #   - `planned_vs_actual` nao pediu nada nesta issue e quebra do mesmo jeito:
      #     ela le `monthly_cash_flow` por LEFT JOIN LATERAL sem agregado e sem
      #     LIMIT. Uma linha por mes virou uma por MOEDA, e o LATERAL multiplica a
      #     chave -- o mes sai duplicado com o previsto repetido inteiro em cada
      #     copia. O caso 5 do teste e o controle negativo disso: ele reproduz o
      #     LATERAL antigo sobre a view nova e EXIGE que 900 previstos virem 1800.
      #     Sem ele, o caso 4 nao distingue "a correcao funciona" de "o cenario
      #     nunca exercitou o bug";
      #   - a moeda que vale e a do LANCAMENTO, nao a da conta ("os-dois" na
      #     interaction). Um mutante que le a moeda da conta por JOIN aplica
      #     limpo e devolve 1080 no lugar de 1000 -- o gasto em dolar no cartao
      #     em reais contado como real;
      #   - o default 'BRL' e a decisao "ficam-brl": o INSERT sem moeda -- que e
      #     o INSERT de todo codigo anterior a esta issue -- tem de dar BRL;
      #   - as tres views sao recriadas, e `CREATE OR REPLACE` preserva
      #     reloptions apenas em teoria. Sem `security_invoker`, `monthly_cash_flow`
      #     devolve a renda mensal de TODOS os usuarios para qualquer um logado.
      - name: A moeda entra no grao e o total para de misturar
        run: $PSQL -f database/tests/022_currency_test.sql

      - name: 023_categoria_de_transferencia
        run: $PSQL -f database/migrations/023_categoria_de_transferencia.sql

      # Re-executavel: o seed entra por `WHERE NOT EXISTS` sobre (service_id,
      # name), que e a UNIQUE da tabela. Um `ON CONFLICT (id)` sozinho passaria
      # na primeira passada e estouraria por nome duplicado na segunda.
      - name: 023 e idempotente
        run: $PSQL -f database/migrations/023_categoria_de_transferencia.sql

      # A categoria reservada da transferencia. Este passo existe por um defeito
      # que atravessou o CI inteiro e ficou 100% quebrado em producao:
      #
      #   - `transaction_categories` e tabela de REFERENCIA (sem user_id). O 002
      #     so deu `GRANT SELECT`, e a unica policy dela e FOR SELECT. A HMO-164
      #     criava a categoria reservada SOB DEMANDA, de dentro da rota -- um
      #     INSERT que volta 42501 em toda chamada, de todo usuario, para sempre;
      #   - e o SELECT anterior a ele tambem nao achava nada, porque a policy de
      #     leitura e `USING (is_active = TRUE)` e a linha reservada precisa
      #     nascer FALSE para ficar fora dos seletores. As duas metades falhavam;
      #   - nada disso aparece em teste de unidade: `pernasDaTransferencia` e
      #     funcao pura e devolvia -- e devolve -- as duas pernas certas. O
      #     defeito mora na PERMISSAO, e so um INSERT de verdade o encontra;
      #   - a policy nova tem que ser ESTREITA. "Toda categoria inativa e
      #     legivel" passa na assercao de leitura e ressuscita, na tela de todo
      #     mundo, qualquer categoria que alguem desativou -- o terceiro caso do
      #     teste e o controle negativo disso;
      #   - e `authenticated` tem que continuar SEM escrever na tabela: abrir o
      #     INSERT faria a rota funcionar e e o conserto errado, porque a tabela
      #     e global. O teste recusa esse conserto explicitamente.
      - name: A transferencia acha a categoria reservada e grava as duas pernas
        run: $PSQL -f database/tests/023_categoria_de_transferencia_test.sql

      - name: 024_edicao_de_despesa_de_grupo
        run: $PSQL -f database/migrations/024_edicao_de_despesa_de_grupo.sql

      # Re-executavel: as funcoes entram por CREATE OR REPLACE, o gemeo sai por
      # DROP IF EXISTS, o indice unico e IF NOT EXISTS e o reparo da SECAO 4 nao
      # acha nada para consertar na segunda passada -- ele so olha divergencia,
      # e a primeira passada ja a desfez.
      - name: 024 e idempotente
        run: $PSQL -f database/migrations/024_edicao_de_despesa_de_grupo.sql

      # Editar despesa de grupo. O que so o Postgres pega aqui:
      #
      #   - o recalculo tem que passar pelo `calculate_equal_split` do 007, e
      #     nao por uma divisao nova: R$ 100 entre 3 depois da edicao da
      #     33,34 / 33,33 / 33,33. Uma formula propria daria 33,33 tres vezes e
      #     deixaria um centavo de saldo residual que nenhum pagamento zera --
      #     o defeito que o 007 existiu para tirar, voltando pela edicao;
      #   - SECURITY INVOKER passa neste teste se ele rodar so como postgres. A
      #     SECAO 6 edita como `authenticated` sendo membro COMUM, que e quem a
      #     policy de DELETE de group_expense_splits (so admin) barraria -- em
      #     silencio, afetando zero linhas, e so para quem nao e admin;
      #   - e a contrapartida do DEFINER: a SECAO 6 tambem chama
      #     `refazer_rateio_do_grupo` na mao, com a despesa de OUTRO usuario, e
      #     exige 42501. Sem essa checagem a funcao seria uma porta para
      #     reescrever a divisao de qualquer grupo do banco;
      #   - rateio combinado (70/30) tem que ser reescalado pela porcentagem, e
      #     nao achatado para partes iguais -- o achatamento e exatamente a
      #     regressao que o 007 tirou, e refazer a divisao "do zero" a traria de
      #     volta pela porta dos fundos;
      #   - a trava da opcao (b) nao pode ser meia trava: depois do PDG01 o
      #     teste exige que o VALOR da transacao tenha ficado como estava. Uma
      #     trava que so impede o rateio deixaria valor novo com partes velhas,
      #     que e o bug original com outra roupa.
      - name: Editar despesa de grupo refaz a divisao, e parte aprovada trava
        run: $PSQL -f database/tests/024_edicao_de_despesa_de_grupo_test.sql

      - name: 025_travar_repontamento_de_divisao
        run: $PSQL -f database/migrations/025_travar_repontamento_de_divisao.sql

      # Re-executavel: a funcao entra por CREATE OR REPLACE e o trigger sai por
      # DROP IF EXISTS antes de ser recriado. A prova da migration nao depende
      # de estado anterior -- ela so olha o catalogo.
      - name: 025 e idempotente
        run: $PSQL -f database/migrations/025_travar_repontamento_de_divisao.sql

      # A trava de repontamento de divisao (HMO-130). O que so o Postgres pega:
      #
      #   - o vazamento nao esta em nenhuma policy nem em nenhuma rota: ele sai
      #     da COMBINACAO de `expense_splits_update` (que alcanca a linha
      #     inteira, porque policy de RLS nao compara OLD com NEW) com
      #     `calculate_split_amount` em SECURITY DEFINER (que le
      #     financial_transactions sem RLS). Ler qualquer um dos dois sozinho
      #     nao mostra nada -- so um UPDATE de verdade, como `authenticated`,
      #     junta as duas metades;
      #   - a SECAO 2 e CONTROLE POSITIVO: ela DERRUBA o trigger dentro da
      #     transacao e exige que o ataque devolva 777,77, o valor da despesa
      #     que o participante nao enxerga. Sem ela o arquivo estaria provando
      #     que um ataque impossivel continua impossivel, e passaria verde num
      #     banco onde a 025 nem tivesse sido aplicada;
      #   - a SECAO 6 e a contrapartida: o DONO tem que continuar remanejando a
      #     porcentagem. Congelar a coluna para todo mundo tranca o vazamento e
      #     o produto junto -- e passa em todas as outras assercoes;
      #   - a SECAO 5 roda o que a rota de divisoes realmente escreve (status,
      #     approved_at, rejection_reason). Uma trava larga demais aqui refaria
      #     a HMO-125, em que aprovar divisao ficou quebrado em producao sem
      #     ninguem notar;
      #   - e a SECAO 8 prova que `amount` nao precisa de trava propria: e
      #     coluna derivada, reescrita pelo recalculo em toda passada. Se um dia
      #     deixar de ser, o participante baixa a propria divida na mao.
      - name: Participante nao reaponta a divisao nem le valor de despesa alheia
        run: $PSQL -f database/tests/025_travar_repontamento_de_divisao_test.sql

      - name: 026_cambio_do_grupo
        run: $PSQL -f database/migrations/026_cambio_do_grupo.sql

      # Re-executavel: as colunas entram por ADD COLUMN IF NOT EXISTS, os CHECKs
      # so sao criados quando `pg_constraint` nao os tem, e as duas views entram
      # por CREATE OR REPLACE.
      - name: 026 e idempotente
        run: $PSQL -f database/migrations/026_cambio_do_grupo.sql

      # O cambio do grupo (HMO-138 item 3). O que so o Postgres pega aqui:
      #
      #   - as duas views que somavam dinheiro sem saber de moeda. A 022 resolveu
      #     o relatorio PESSOAL mostrando separado por moeda; grupo nao pode
      #     mostrar separado -- um acerto de contas em duas colunas nao e um
      #     acerto de contas. O teste mede o erro que a soma cega produz: no
      #     cenario dele a credora de R$ 81,50 aparece devendo R$ 310, ou seja o
      #     defeito erra o SINAL e o acerto manda o dinheiro na direcao
      #     contraria. E a conta cega FECHA (os saldos somam zero, residual
      #     zero), entao nenhuma assercao de consistencia a pega;
      #   - a SECAO 3 e CONTROLE POSITIVO: reproduz a formula do 007 sobre os
      #     mesmos dados e exige o numero errado. Sem ela o arquivo passaria
      #     verde num banco onde a 026 nem tivesse sido aplicada;
      #   - a conversao tem que ser por LINHA, dentro do SUM. Aplicada ao total
      #     (`SUM(...) * MAX(exchange_rate)`) ela da o MESMO numero enquanto cada
      #     pessoa tiver uma moeda so -- medido: esse mutante sobreviveu a 39
      #     assercoes. Por isso o cenario tem uma pessoa pagando nas duas moedas;
      #   - o CHECK `(currency = 'BRL') = (exchange_rate = 1)`, que e o que fecha
      #     o unico caminho de perda silenciosa que sobra: lancamento em dolar
      #     gravado com a cotacao DEFAULT de 1 vale um quinto do que deveria, a
      #     tela mostra "US$ 180,00" certinho e o saldo do grupo fecha. O teste
      #     exige as DUAS metades -- recusa a cotacao 1 no dolar E aceita 5,35 --,
      #     porque uma trava que recusasse toda moeda estrangeira passaria em
      #     todas as assercoes de bloqueio;
      #   - e o acerto pago em moeda estrangeira. Ele entra na mesma soma das
      #     despesas: US$ 10 lidos como R$ 10 abatem um quinto da divida, e a
      #     tela continua pedindo o resto DEPOIS de o dinheiro ter sido pago.
      - name: Cambio do grupo converte saldo e orcamento, e cotacao ausente e recusada
        run: $PSQL -f database/tests/026_cambio_do_grupo_test.sql

      # HISTORICO PLANTADO ANTES DA 027, E POR QUE ELE E UM STEP PROPRIO
      #
      # A 027 tem tres UPDATEs de backfill. Este job constroi o banco do ZERO:
      # quando a 027 roda, as tabelas estao vazias, os tres UPDATEs tocam zero
      # linhas e nenhuma assercao sobre o estado final consegue distinguir um
      # backfill correto de um errado ou ausente.
      #
      # Medido: sem este step, TRES mutantes da 027 sobreviveram ao arquivo de
      # teste inteiro -- `launch_date = CURRENT_DATE` (reescreve o historico como
      # se tudo tivesse sido anotado no dia da migration), o backfill da direcao
      # removido, e um `expected_date = transaction_date` que inventa previsao
      # para todo lancamento do passado. Com as linhas plantadas, os tres morrem.
      #
      # Este arquivo COMITA, ao contrario dos testes: a 027 roda noutra sessao e
      # nao veria nada dentro de uma transacao aberta.
      - name: Historico anterior a 027, para o backfill ter em que morder
        run: $PSQL -f database/tests/027_historico_antes_da_027.sql

      - name: 027_previsto_e_realizado_no_lancamento
        run: $PSQL -f database/migrations/027_previsto_e_realizado_no_lancamento.sql

      # Re-executavel: as colunas entram por ADD COLUMN IF NOT EXISTS, o CHECK so
      # e criado quando `pg_constraint` nao o tem, os backfills tem `IS NULL` no
      # WHERE, e a view entra por DROP + CREATE.
      #
      # A segunda passada tem um agravante proprio: os backfills NAO podem mexer
      # em nada. Se o da direcao rodasse sem o `transaction_type IS NULL`, ele
      # reescreveria como 'expense' uma direcao que alguem tivesse corrigido a
      # mao -- e o teste que roda depois confere justamente isso.
      - name: 027 e idempotente
        run: $PSQL -f database/migrations/027_previsto_e_realizado_no_lancamento.sql

      # Previsto x realizado no lancamento (HMO-188). O que so o Postgres pega:
      #
      #   - a DIRECAO da previsao. `scheduled_transactions.amount` tem
      #     `CHECK (amount > 0)`, entao a ocorrencia nao guarda sinal, e antes da
      #     027 a direcao saia so da REGRA -- uma previsao avulsa caia no
      #     `?? 'expense'` da rota de baixa. Confirmar o recebimento de um
      #     salario de R$ 7.000 lancado como previsao avulsa gravaria -7000: o
      #     dinheiro entrando SAINDO da conta, com valor, descricao e categoria
      #     certos e nenhum erro. O teste tem o defeito nomeado ao lado da
      #     assercao (a leitura antiga, reproduzida, responde 'expense');
      #   - a PRECEDENCIA ocorrencia -> regra -> expense. Um COALESCE na ordem
      #     inversa passa em todas as outras assercoes do arquivo;
      #   - o LEFT JOIN. Com INNER, a agenda perde TODO boleto lancado a mao e a
      #     tela abre com a lista mais curta, sem erro;
      #   - a view refeita por DROP + CREATE, que joga fora `security_invoker` e
      #     o ACL. Sem eles a view roda com o privilegio do dono e devolve a
      #     agenda inteira para qualquer usuario logado -- o furo que o 005
      #     fechou, reaberto por uma migration que so queria uma coluna. O ACL e
      #     lido do catalogo e nao por comportamento: um GRANT sobrando para anon
      #     NAO muda o comportamento (a tabela base ainda recusa) e sobreviveu ao
      #     arquivo inteiro antes dessa assercao existir;
      #   - a AUSENCIA de um `CHECK (expected_date >= launch_date)`. Ele parece
      #     higiene e recusaria o caso comum de anotar hoje uma conta que venceu
      #     semana passada -- e quebraria a edicao de qualquer linha antiga.
      - name: Direcao da previsao, dia do lancamento e dia previsto
        run: $PSQL -f database/tests/027_previsto_e_realizado_test.sql

      - name: 028_fundamento_cvm
        run: $PSQL -f database/migrations/028_fundamento_cvm.sql

      # Re-executavel: as tabelas entram por CREATE TABLE IF NOT EXISTS, os
      # indices por CREATE INDEX IF NOT EXISTS, as policies por DROP + CREATE e a
      # view por DROP VIEW IF EXISTS + CREATE.
      - name: 028 e idempotente
        run: $PSQL -f database/migrations/028_fundamento_cvm.sql

      # Fundamento da CVM (HMO-194). O que so o Postgres pega:
      #
      #   - a RLS de tabela de REFERENCIA. `cvm_fundamentos` guarda o balanco da
      #     Petrobras, que nao e de ninguem: RLS ligada, policy so de SELECT e
      #     nenhuma de escrita. Uma policy `FOR ALL` no lugar de `FOR SELECT`
      #     deixaria o usuario logado editar o lucro liquido da empresa, e nada
      #     no TypeScript nota isso;
      #   - `cvm_tickers_sem_fundamento` com RLS ligada e ZERO policy, de
      #     proposito: e diagnostico de ingestao, nao conteudo de tela. "Ligada
      #     sem policy" e indistinguivel de esquecimento quando lida no arquivo,
      #     entao o teste afirma que `authenticated` NAO le;
      #   - o CHECK de que `radical` e o prefixo de `ticker`. E a regra da ponte
      #     gravada no banco: sem ela um ingestor com defeito penduraria o codigo
      #     CVM da ACU PETROLEO no ticker PETR4 e o banco aceitaria calado, que e
      #     o defeito silencioso que a HMO-194 existe para fechar. O teste usa um
      #     ticker NOVO ('ACPE4') porque com 'PETR4' a chave primaria levantava
      #     `unique_violation` e o controle negativo passava mesmo com o CHECK
      #     removido -- medido, o mutante sobrevivia;
      #   - o CHECK de `data_base` pertencer ao `ano_exercicio`. Balanco de um ano
      #     na linha de outro e o erro que a propria referencia da issue trazia
      #     (o dividendo de R$ 101,2 bi e de 2024, citado junto com o lucro de
      #     2025) -- dois numeros plausiveis, nenhum erro;
      #   - o ROE com patrimonio NEGATIVO. -50 de prejuizo sobre -100 de
      #     patrimonio da "ROE 50%" numa divisao ingenua, e um crivo de
      #     rentabilidade aprovaria a empresa mais quebrada da lista como a
      #     melhor. A view devolve NULO, e isso so se prova consultando;
      #   - `divida_liquida` NULA para quem nao publicou divida nenhuma. Com
      #     `coalesce` sem o CASE, um banco apareceria com "caixa liquido" igual
      #     ao caixa, parecendo quem so nao reportou.
      #
      # `security_invoker` da view nao e conferido aqui: quem cobre e o
      # view_security_invoker_test.sql, que varre o schema inteiro e pega
      # qualquer view nova sem a opcao (verificado contra esta view).
      - name: Fundamento da CVM -- referencia sem escrita, ponte coerente e indicador nulo em vez de errado
        run: $PSQL -f database/tests/hmo194_fundamento_cvm_test.sql

      # A aritmetica da ponte ticker -> CNPJ e da leitura dos CSVs e TypeScript, e
      # roda aqui junto com o schema que ela enche. PETR4, VALE3 e RANI3 estao na
      # suite porque sao os tres tickers em que o PRIMEIRO resultado da consulta da
      # B3 e outra empresa -- um piloto com blue chips acerta 100% por falta de
      # concorrente no nome e leva o defeito para producao.
      - name: Ponte ticker->CNPJ por igualdade exata, DMPL sem contar em triplo e escala MIL/UNIDADE
        run: npm run test:fundamento-cvm

      - name: 029_pedido_de_entrada_visivel
        run: $PSQL -f database/migrations/029_pedido_de_entrada_visivel.sql

      # Re-executavel: as duas funcoes entram por CREATE OR REPLACE FUNCTION, e
      # os GRANT/REVOKE sao declarativos.
      - name: 029 e idempotente
        run: $PSQL -f database/migrations/029_pedido_de_entrada_visivel.sql

      # HMO-190, segunda volta. O que so o Postgres pega aqui:
      #   - pedir o mesmo codigo duas vezes devolvia 23505 tanto para quem estava
      #     `active` quanto para quem estava `pending`, e a rota traduzia os dois
      #     para "voce ja e membro deste grupo". Para a pendente isso era falso em
      #     cima de invisivel -- foi a frase que fez a usuaria do relato ir cobrar
      #     acesso do dono do grupo;
      #   - o contrario tambem precisa continuar valendo, e e o controle negativo
      #     da suite: membro ATIVO pedindo de novo AINDA leva 23505. Sem essa
      #     assercao, apagar o IF inteiro "conserta" o sintoma e transforma a RPC
      #     num "entra sempre";
      #   - `my_pending_group_requests()` e SECURITY DEFINER, entao quem garante
      #     que ela nao vira um vazamento e o par de assercoes que prova que a
      #     pendente ve SO o proprio pedido e CONTINUA sem ler `expense_groups`.
      - name: Pedido de entrada pendente e dizivel e visivel sem abrir o grupo
        run: $PSQL -f database/tests/hmo190_pedido_de_entrada_visivel_test.sql
      - name: 031_renda_fixa_indexada
        run: $PSQL -f database/migrations/031_renda_fixa_indexada.sql

      # Re-executavel: as colunas entram por ADD COLUMN IF NOT EXISTS e cada
      # constraint (todas com nome fixo) por DROP CONSTRAINT IF EXISTS + ADD.
      # Conferido tambem como COLAGEM EM LOTE UNICO (`psql -c "$(cat ...)"`), que
      # e como uma pessoa aplica em producao -- o `-f` daqui nao prova isso.
      - name: 031 e idempotente
        run: $PSQL -f database/migrations/031_renda_fixa_indexada.sql

      # Renda fixa indexada (HMO-192). `ADD COLUMN` nunca falha, entao "as seis
      # colunas existem" nao e prova de nada -- o que a 031 entrega sao as regras
      # que impedem a combinacao que rende numero errado sem erro:
      #
      #   - acao com indexador. Nenhum CHECK de valor barra uma PETR4 com
      #     `index_kind = 'cdi'`, e a tela somaria o rendimento do CDI POR CIMA da
      #     variacao de preco: o mesmo ganho contado duas vezes. O teste cobre o
      #     INSERT e os dois sentidos do UPDATE (por o campo numa acao, e virar
      #     acao sem limpar os campos) -- CHECK pega os dois, policy de RLS nao
      #     pegaria nenhum, porque policy nao ve OLD;
      #   - prefixado com percentual. `index_percentage = 110` num papel de 13%
      #     a.a. le-se como "110% de um indice" que a linha nao tem, e projeta 13
      #     vezes o rendimento real;
      #   - produto ISENTO fora do dominio ('LCI', 'lci '). LCI, LCA, CRI, CRA e
      #     poupanca nao pagam IR; um valor que o codigo nao reconhece cai no
      #     caminho generico e a tela desconta 22,5% de quem nao deve nada --
      #     errando contra o usuario no unico numero que ele abriu a tela para ver;
      #   - aplicacao no FUTURO. Ela e o inicio da contagem do IR (tabela
      #     regressiva por dias corridos): data adiante devolve prazo negativo;
      #   - as seis colunas continuarem NULAVEIS. Ha renda fixa em producao desde
      #     a 021 sem nenhuma delas, e um NOT NULL aqui abortaria a colagem no
      #     SQL Editor e travaria cadastro que hoje funciona.
      #
      # Os 15 mutantes rodados antes de confiar nisto (9 derrubando cada
      # constraint, 6 AFROUXANDO-as: teto do percentual removido, `>=` no
      # vencimento, tolerancia de 365 dias na aplicacao, 'cdb' aceito como
      # indexador, comparacao case-insensitive do produto, cross-check olhando so
      # `index_kind`) morreram todos, e o teste REPROVA um banco sem a 031.
      - name: Renda fixa indexada -- indexador fora de fixed_income, prefixado com percentual e produto isento desconhecido
        run: $PSQL -f database/tests/hmo192_renda_fixa_test.sql

      - name: 030_convite_de_grupo_no_app
        run: $PSQL -f database/migrations/030_convite_de_grupo_no_app.sql

      # Re-executavel: as duas funcoes entram por CREATE OR REPLACE FUNCTION, e
      # os GRANT/REVOKE sao declarativos. Nao ha DDL de tabela no arquivo.
      - name: 030 e idempotente
        run: $PSQL -f database/migrations/030_convite_de_grupo_no_app.sql

      # HMO-196, o convite entregue dentro do app. O que so o Postgres pega:
      #
      #   - as duas assercoes de CONTROLE, que sao o defeito em si: a convidada LE
      #     a propria linha de `group_invitations`, e NAO le `expense_groups` nem
      #     o `profiles` de quem convidou. Era dai que vinham os dois embeds nulos
      #     que o sino descartava em silencio. Se alguem "consertar a tela"
      #     afrouxando `expense_groups_select` ou `profiles_select_own_or_public`,
      #     estas duas quebram e dizem que o conserto abriu o grupo inteiro;
      #   - `list_my_group_invitations()` e `respond_to_group_invitation()` sao
      #     SECURITY DEFINER, ou seja leem por cima da RLS. Quem garante que nao
      #     viraram vazamento sao as assercoes de que a ESTRANHA nao lista nada e
      #     nao consegue aceitar nem sabendo o UUID do convite -- a autorizacao
      #     mora no corpo da funcao, nao no argumento;
      #   - aceitar entra como `active`, nao `pending`. Convite de admin nao vai
      #     para a fila de aprovacao da 029: quem chamou foi o proprio admin. Um
      #     mutante trocando por 'pending' devolve a pessoa ao limbo que a HMO-190
      #     acabou de fechar, e a tela nao nota;
      #   - o filtro `g.is_active`. Arquivar o grupo (020) nao apaga os convites
      #     pendentes dele, entao sem o filtro um convite antigo ressuscita a
      #     pessoa dentro de um grupo que o admin ja tirou do ar;
      #   - que a funcao NAO devolve `group_code`. E assercao sobre a ASSINATURA,
      #     via information_schema: o sino antigo exibia o codigo, e quem recusa um
      #     convite nao deve sair com a chave de entrada do grupo na mao.
      #
      # Medido: 15 mutantes na 030, 14 morreram. O unico sobrevivente e trocar o
      # `LEFT JOIN public.profiles` por JOIN interno, e nao e furo do teste -- os
      # dois sao equivalentes enquanto `invited_by` for NOT NULL com FK para
      # `profiles(id)`. Esta anotado no proprio teste para ninguem "cobrir" isso
      # com uma fixture impossivel.
      - name: Convite de grupo chega a quem foi convidado, sem abrir o grupo para quem recusa
        run: $PSQL -f database/tests/hmo196_convite_no_app_test.sql

      # O TEMPLATE PRE-032, TIRADO AQUI PORQUE AQUI E O PRE-032 (HMO-330).
      #
      # Mesma razao do retrato pre-040 mais abaixo: a prova de mutacao da 032
      # ("A chave Pix do grupo sabe falhar") precisa de um banco com a cadeia
      # ATE A 031 e SEM a 032. A 032 e `CREATE TABLE IF NOT EXISTS` mais
      # `DROP POLICY IF EXISTS` antes de cada `CREATE POLICY` -- entao aplicar
      # um mutante sobre um banco que JA tem a versao boa deixa a policy boa
      # de pe, o teste passa, e o mutante aparece como SOBREVIVENTE sem nunca
      # ter existido. O placar viraria ficcao na direcao mais perigosa: ele
      # diria que falta assercao num teste que esta certo.
      #
      # Isso foi MEDIDO, nao deduzido (2026-10-07). Contra um template com a
      # 032 ja aplicada o runner cai de 6/6 para 4/6: `aceita_chave_em_branco`
      # e `aceita_qualquer_tipo` SOBREVIVEM, porque o `CREATE TABLE IF NOT
      # EXISTS` nao recria a tabela e os dois CHECK bons ficam de pe. Ou seja,
      # este step nao e decoracao -- sem ele o placar acusa dois furos
      # inexistentes no hmo201_chave_pix_test.sql.
      #
      # Custa quase nada: `CREATE DATABASE ... TEMPLATE` e copia de arquivo no
      # lado do servidor, e entre dois steps nao ha conexao aberta no template.
      - name: Retrato da cadeia em 031, para a prova de mutacao da 032
        run: $PSQL -d postgres -c "CREATE DATABASE hmo330_pre032 TEMPLATE $PGDATABASE"

      - name: 032_chave_pix_do_membro
        run: $PSQL -f database/migrations/032_chave_pix_do_membro.sql

      # Re-executavel: CREATE TABLE IF NOT EXISTS, CREATE OR REPLACE FUNCTION e
      # DROP POLICY IF EXISTS antes de cada CREATE POLICY.
      - name: 032 e idempotente
        run: $PSQL -f database/migrations/032_chave_pix_do_membro.sql

      # HMO-201. A chave Pix nao pode morar em `profiles`: a policy
      # `profiles_select_own_or_public` do 002 combinada com o DEFAULT TRUE de
      # `is_public` entrega o perfil inteiro a toda conta autenticada, e RLS nao
      # tranca COLUNA. Este teste e o que impede alguem de "simplificar" a 032 de
      # volta para um ADD COLUMN sem enxergar que isso publica o CPF de cada
      # usuario para a base inteira.
      #
      # As assercoes que so o Postgres pega:
      #
      #   - o CONTROLE NEGATIVO em par: a estranha NAO le a chave, mas LE o
      #     `profiles` da mesma pessoa. Sem a segunda metade, a primeira passaria
      #     tambem num mundo em que ninguem le nada;
      #   - as DUAS direcoes de `compartilha_grupo_ativo`. Quem esta `pending`
      #     nao le a chave dos outros E nao tem a dele exposta ao grupo. A
      #     primeira versao do teste so cobria a primeira direcao, e o mutante
      #     que apagava o `status` do OUTRO lado sobrevivia;
      #   - mover a linha para outro `user_id` nas DUAS formas do comando. Com
      #     `WHERE`, quem barra e a policy de SELECT (o Postgres exige que a
      #     linha nova siga visivel para quem escreveu); a policy de UPDATE so e
      #     load-bearing no `UPDATE` SEM WHERE, que nao le nada antes de
      #     escrever. Medido: com a policy de UPDATE escancarada, a forma com
      #     WHERE continua levando 42501.
      #
      # Medido: 6 mutantes na 032, 6 mortos (npm run mutantes:chave-pix).
      - name: A chave Pix e do grupo, nao de toda conta autenticada do app
        run: $PSQL -f database/tests/hmo201_chave_pix_test.sql

      - name: 033_minha_parte_no_realizado
        run: $PSQL -f database/migrations/033_minha_parte_no_realizado.sql

      # Re-executavel: so tem CREATE OR REPLACE VIEW, COMMENT, ALTER VIEW,
      # REVOKE e GRANT.
      - name: 033 e idempotente
        run: $PSQL -f database/migrations/033_minha_parte_no_realizado.sql

      # HMO-202. A quarta parte da HMO-201: lancamento de grupo tem que entrar no
      # REALIZADO das financas pessoais. O previsto ja contava so a minha parte
      # desde a HMO-177; o realizado nao contava NADA -- medido 0,00 tanto para
      # quem pagou quanto para quem devia a parte.
      #
      # Este teste existe porque quase todo jeito errado de escrever a 033
      # devolve um numero plausivel e silencioso, e dois deles ja foram medidos:
      # 400 (o valor cheio, que e o que acontece ao simplesmente remover o filtro
      # `group_id IS NULL`) e 0 (o buraco original). As duas assercoes centrais
      # NEGAM esses dois numeros, alem de exigirem 200 nos dois lados.
      #
      # As assercoes que so o Postgres pega:
      #
      #   - a SOMA entre os membros ser a despesa inteira. E ela que distingue
      #     "minha parte" de qualquer divisao que acerte UM lado: valor cheio
      #     para o pagador e zero para o outro tambem somaria 400, e por isso a
      #     soma vem acompanhada das duas pernas;
      #   - o CONTROLE POSITIVO da RLS: sem filtro de `user_id` a consulta
      #     devolve 400, porque as policies de grupo tem `OR is_group_member(...)`
      #     e a parte do OUTRO membro entra. E o que prova que o `eq("user_id")`
      #     das duas rotas e load-bearing, e nao higiene;
      #   - a parte vir LIDA e nao recalculada: R$ 300 por 3 da 100,00 pelo
      #     metodo do maior resto (o do banco, 007) e 99,99 pela porcentagem
      #     arredondada. O teste exige 100,00 e NEGA 99,99 -- e o bug de centavo
      #     que o 007 foi a producao consertar, e recalcular na view o traria de
      #     volta so no realizado, fazendo-o discordar do saldo do grupo;
      #   - parte pendurada em RECEITA nao vira despesa. O trigger so rateia
      #     `amount < 0`, mas nada no schema impede a linha, e o teste da 024
      #     insere uma a mao;
      #   - quem SAIU do grupo mantem a parte das despesas antigas. Um filtro por
      #     `status = 'active'` reescreveria o passado da pessoa no dia em que ela
      #     sai, e um mes fechado mudaria de valor;
      #   - fluxo = soma das categorias, nas duas moedas. Pizza que nao fecha em
      #     100% e o sintoma de ter acrescentado a parte de grupo em so uma das
      #     duas views.
      #
      # Medido: 24 mutantes na 033, 24 mortos, mais o controle do preflight
      # (npm run mutantes:minha-parte-no-realizado). NAO ha mutante de `anon`
      # na lista de proposito: eles sao equivalentes -- `security_invoker` faz
      # anon bater nas tabelas-base que o 002 ja revogou, entao abrir so a 033
      # nao abre nada. Esta anotado no proprio harness.
      - name: Lancamento de grupo entra no realizado pessoal, pela MINHA parte
        run: $PSQL -f database/tests/033_minha_parte_no_realizado_test.sql

      # O RETRATO PRE-034, TIRADO AQUI PORQUE AQUI E O PRE-034 (HMO-331).
      #
      # Mesmo desenho do `hmo322_pre040` mais abaixo, e pela mesma razao: a 034
      # e um DO com `IF NOT EXISTS`, entao aplicar um mutante dela sobre um
      # banco que JA tem a versao boa e no-op -- todo mutante "sobrevive" sem
      # que nada tenha sido medido. `CREATE DATABASE ... TEMPLATE` e copia de
      # arquivo no lado do servidor: nao replica a cadeia, e o retrato nao pode
      # divergir do que o job acabou de provar, porque E ele.
      #
      # O runner nao confia nisto de graca: o CONTROLE NEGATIVO dele roda o
      # teste da 034 contra o template cru e EXIGE que reprove.
      - name: Retrato da cadeia em 033, para a prova de mutacao da 034
        run: $PSQL -d postgres -c "CREATE DATABASE hmo331_pre034 TEMPLATE $PGDATABASE"

      - name: 034_moeda_da_conta_prevista
        run: $PSQL -f database/migrations/034_moeda_da_conta_prevista.sql

      # Re-executavel: um DO com IF NOT EXISTS e um COMMENT.
      - name: 034 e idempotente
        run: $PSQL -f database/migrations/034_moeda_da_conta_prevista.sql

      # HMO-184. A 022 deu `currency` a `scheduled_transactions`, o app nunca a
      # escreveu, e nao existe `exchange_rate` ali. Toda soma de conta prevista
      # -- summary, safe-to-spend, fluxo de caixa, projecao e a secao "Previstas"
      # do grupo -- soma `amount` sem converter: certo enquanto tudo for BRL, e
      # certo POR ACIDENTE. A 034 troca o acidente por um CHECK.
      #
      # A trava, e nao a feature, porque a saida "converte na baixa" nao existe:
      # [id]/pay insere em `financial_transactions` SEM mandar `currency` nem
      # `exchange_rate`, e o par (BRL, 1) do DEFAULT e consistente consigo
      # mesmo -- o CHECK da 026 nao pega. US$ 180 viravam R$ 180 calados.
      #
      # Medido: 6 mutantes na 034, 6 mortos, mais o controle positivo
      # (npm run mutantes:moeda-da-conta-prevista). O par que importa e
      # `sem_trava` x `trava_larga_demais`: so morrem juntos porque o teste tem
      # assercao de recusa E de aceitacao -- `CHECK (false)` tambem recusa USD.
      - name: A conta prevista e em real, e o banco garante
        run: $PSQL -f database/tests/hmo184_moeda_da_conta_prevista_test.sql

      # O RETRATO PRE-035 (HMO-331). Ver a nota do `hmo331_pre034` acima: aqui
      # a guarda que tornaria o mutante inofensivo e o `DO ... IF NOT EXISTS`
      # da constraint, mais os `ADD COLUMN IF NOT EXISTS`.
      - name: Retrato da cadeia em 034, para a prova de mutacao da 035
        run: $PSQL -d postgres -c "CREATE DATABASE hmo331_pre035 TEMPLATE $PGDATABASE"

      - name: 035_parcela_n_de_m
        run: $PSQL -f database/migrations/035_parcela_n_de_m.sql

      # Re-executavel: dois ADD COLUMN IF NOT EXISTS, um DO com IF NOT EXISTS
      # para a constraint (ADD CONSTRAINT nao tem IF NOT EXISTS, e repetir sem o
      # DO aborta a transacao inteira com 42710), CREATE INDEX IF NOT EXISTS,
      # CREATE OR REPLACE VIEW e COMMENTs.
      - name: 035 e idempotente
        run: $PSQL -f database/migrations/035_parcela_n_de_m.sql

      # HMO-211. O rotulo "parcela 3 de 10" sai de DUAS COLUNAS novas em
      # `financial_transactions`, e nao do parsing da descricao: a descricao
      # gravada e "Notebook (3/10)" e o usuario pode reescreve-la -- o sintoma de
      # uma descricao renomeada seria o rotulo desaparecer de uma parcela e
      # aparecer na vizinha, na mesma fatura.
      #
      # "A coluna existe" nao prova nada aqui. O que o teste afirma e que a
      # parcela cai NA FATURA DO MES CERTO, e esse numero erra calado de varios
      # jeitos plausiveis: duas parcelas na mesma fatura (um mes fecha com o
      # dobro e o ultimo vazio), a serie comecando em 1 quando a pessoa lancou
      # "3 de 10" (duas linhas de dinheiro que ninguem digitou), o par
      # meio-preenchido que a tela mostra como "parcela 3 de ", e a fatura
      # somando com o sinal trocado (a compra ABATENDO em vez de somar).
      #
      # O CHECK nao esta escrito da forma obvia por um motivo medido: a forma
      # intuitiva (`(a IS NULL AND b IS NULL) OR (a >= 1 AND b >= 2 ...)`) resulta
      # NULL para `(3, NULL)` -- `FALSE OR NULL` e NULL --, e um CHECK que resulta
      # NULL ACEITA a linha. A versao obvia deixa passar exatamente o que ela
      # existe para barrar. O mutante `check_intuitivo` e esse.
      #
      # A SECAO 6 nao e enfeite: foi MEDIDO que `CREATE OR REPLACE VIEW` APAGA as
      # reloptions da view (Postgres 17.11). A `card_invoice_lines` sai da 006 com
      # `{security_invoker=true}`, e o REPLACE da 035 a deixaria sem opcao
      # nenhuma -- rodando com o privilegio do DONO, a RLS das tabelas base sem se
      # aplicar, e a fatura de qualquer usuario indo para qualquer usuario logado,
      # sem erro, so com linhas a mais. O `ALTER VIEW ... SET (security_invoker)`
      # da 035 e LOAD-BEARING, nao defensivo.
      #
      # Medido: 35 assercoes verdes; 11 mutantes na 035, 11 mortos, mais o
      # controle positivo (npm run mutantes:parcela-n-de-m). O par que importa e
      # `check_ausente` x `check_largo_demais`: so morrem juntos porque o teste
      # tem as quatro recusas E o controle de aceitacao da compra avulsa --
      # `CHECK (false)` tambem recusa o par incoerente, e quebraria TODO
      # lancamento do app. E `indice_nao_parcial` so morre pela SECAO 4b: quando
      # o `WHERE` do indice cai, nenhuma consulta muda de resposta (um indice
      # cheio responde o mesmo) -- muda o tamanho, e tamanho nao aparece em
      # count(*). Por isso a assercao e sobre `pg_index.indpred`.
      - name: A parcela N de M cai na fatura do mes certo, e o par incoerente e recusado
        run: $PSQL -f database/tests/035_parcela_n_de_m_test.sql

      # HMO-216. Categoria da PESSOA, personalizacao do catalogo e subcategoria.
      #
      # ENTRA AQUI, no fim da cadeia, e nao colada no 034: a 035 (HMO-211) esta
      # sendo escrita em paralelo e vai se inserir entre as duas. Nada na 036
      # depende da 035 nem o contrario -- as duas sao aditivas sobre o 034.
      - name: 036_categorias_do_usuario
        run: $PSQL -f database/migrations/036_categorias_do_usuario.sql

      # Re-executavel: ADD COLUMN IF NOT EXISTS, DO com IF NOT EXISTS para cada
      # constraint, CREATE UNIQUE INDEX IF NOT EXISTS, DROP POLICY IF EXISTS
      # antes de cada CREATE POLICY, e os dois seeds por INSERT ... WHERE NOT
      # EXISTS. Nao ha ON CONFLICT em lugar nenhum da 036 de proposito: as
      # unicidades dela sao indices PARCIAIS, e indice parcial nao serve de
      # arbitro de ON CONFLICT.
      - name: 036 e idempotente
        run: $PSQL -f database/migrations/036_categorias_do_usuario.sql

      # O que esta suite guarda, em uma linha: a policy que estava em producao
      # desde o 002 e `USING (is_active = TRUE)`, SEM filtro de usuario -- no
      # instante em que `transaction_categories` ganha `user_id`, ela publica a
      # lista de categorias de cada pessoa para o app inteiro, e essa lista
      # conta onde a pessoa gasta. A 036 aperta a policy; a assercao do estranho
      # e o que impede que o aperto seja desfeito por "simplificacao".
      #
      # O par que importa e "o estranho NAO ve Terapia" x "o estranho VE
      # Alimentação": so morrem juntos, porque `USING (FALSE)` tambem esconde a
      # categoria da outra pessoa.
      #
      # Medido: 8 mutantes na 036, 8 mortos, mais o controle positivo
      # (npm run mutantes:categorias). O `insert_larga` sobreviveu na primeira
      # passada -- com a policy de INSERT da categoria TOTALMENTE ABERTA, criar
      # categoria no nome de outra pessoa continua levando 42501, mas vindo da
      # SUBCATEGORIA (o trigger do "Outros" tenta gravar com o user_id da
      # vitima). A sonda do teste passou a devolver QUAL tabela recusou.
      - name: A categoria da pessoa e dela, e toda categoria nasce com Outros
        run: $PSQL -f database/tests/hmo216_categorias_do_usuario_test.sql

      # A metade de JavaScript: o que a pessoa VE (nome efetivo = pref sobre
      # catalogo), a ordem do seletor, e a coerencia entre os dois seletores --
      # trocar de categoria sem trocar a subcategoria e o caminho direto para um
      # 23503 na hora de salvar.
      - name: O nome efetivo da categoria, a ordem do seletor e a subcategoria coerente
        run: npm run test:categorias

      # HMO-181. O backfill de `transaction_type`. O POST de
      # /api/personal-finance/transactions nunca gravou a coluna, e as tres
      # views da 008 filtram `transaction_type IN ('expense','income')` -- a
      # linha aparece na lista de lancamentos e desaparece do fluxo de caixa,
      # dos relatorios e do orcamento, sem erro nenhum.
      #
      # ADITIVA E SEM TRAVA, de proposito: a 037 nao poe NOT NULL nem CHECK na
      # coluna. Ela e colada no SQL Editor ANTES de o codigo novo subir, e o
      # codigo que esta no ar e justamente o que grava NULL -- uma trava aqui
      # derrubaria todo lancamento feito pela tela entre a colagem e o deploy.
      - name: 037_tipo_do_lancamento
        run: $PSQL -f database/migrations/037_tipo_do_lancamento.sql

      # Re-executavel: CREATE OR REPLACE FUNCTION, e o UPDATE tem
      # `WHERE transaction_type IS NULL` dentro da funcao. A segunda aplicacao
      # conserta 0 linhas, e e isso que o NOTICE diz.
      - name: 037 e idempotente
        run: $PSQL -f database/migrations/037_tipo_do_lancamento.sql

      # Backfill nao e testavel num banco construido do zero: quando a 037 roda
      # nao existe linha antiga para ela preencher, e "sobrou linha sem tipo?"
      # responderia 0 de 0 mesmo se o UPDATE nunca tivesse rodado. Por isso a
      # regra mora numa FUNCAO: a suite PLANTA as linhas ruins e chama a mesma
      # funcao que a migration chama.
      #
      # O par que importa e a view medida ANTES e DEPOIS: so o depois provaria
      # que a linha esta na view, nunca que ela podia nao estar -- que e o
      # defeito. E a NEGACAO que guarda o resto: a perna de transferencia nao
      # pode virar despesa nem receita. Esse erro nao teria sintoma, porque as
      # duas pernas se anulam e o SALDO continuaria certo; so Receitas e
      # Despesas, olhadas em separado, o denunciam.
      - name: O lancamento sem tipo volta para as tres views, e a transferencia nao
        run: $PSQL -f database/tests/037_tipo_do_lancamento_test.sql
      # HMO-172. A transferencia recorrente: `destination_account_id` nas duas
      # tabelas da agenda, e o CHECK do 027 alargado para aceitar 'transfer'.
      #
      # A 027 tinha excluido 'transfer' DE PROPOSITO, e vale registrar aqui por
      # que a exclusao caiu: o motivo escrito era "o tratamento esquecido seria
      # contar a perna de saida como despesa prevista", e as duas perguntas que a
      # agenda faz hoje tem dono e ja tratam transferencia -- `direcaoDaAgenda`
      # conta a saida datada no "a vencer", `direcaoNoPainel` devolve NULL para
      # nao contar como gasto do periodo. O terceiro caso que a 027 temia existe
      # e esta tratado nos dois sentidos.
      #
      # ENTRA DEPOIS DA 037 (HMO-181) por numero, nao por dependencia: a 037 faz
      # backfill de `financial_transactions.transaction_type` e nao toca em
      # `scheduled_transactions` nem no CHECK que esta migration alarga. As duas
      # sao aditivas e independentes.
      # O RETRATO PRE-038 (HMO-331). Ver a nota do `hmo331_pre034` acima: aqui
      # as guardas que tornariam o mutante inofensivo sao o `ADD COLUMN IF NOT
      # EXISTS` e o `IF NOT EXISTS (pg_constraint)` de cada CHECK cruzado.
      - name: Retrato da cadeia em 037, para a prova de mutacao da 038
        run: $PSQL -d postgres -c "CREATE DATABASE hmo331_pre038 TEMPLATE $PGDATABASE"

      - name: 038_transferencia_recorrente
        run: $PSQL -f database/migrations/038_transferencia_recorrente.sql

      # Re-executavel: ADD COLUMN IF NOT EXISTS, DO com IF NOT EXISTS para cada FK
      # e para cada CHECK cruzado, e DROP CONSTRAINT IF EXISTS antes do ADD do
      # CHECK de `transaction_type`.
      #
      # O DROP+ADD daquele CHECK e o unico passo NAO guardado por IF NOT EXISTS, e
      # tem de ser assim: a constraint JA EXISTE com o texto estreito da 027, e um
      # bloco que so cria quando falta nao faria nada -- a migration ficaria verde
      # e a primeira transferencia prevista levaria 23514.
      - name: 038 e idempotente
        run: $PSQL -f database/migrations/038_transferencia_recorrente.sql

      # O que esta suite guarda: as tres formas de gravar MEIA transferencia.
      # Transferencia sao duas pernas que se anulam, entao a regra que gera uma
      # perna so deixa o saldo das duas contas errado em direcoes OPOSTAS com o
      # total geral CERTO -- `net_worth_history` fecha em zero, `monthly_cash_flow`
      # e `category_monthly_totals` filtram income/expense e nem olham. Nenhum
      # agregado acusa, e por isso a trava e no banco.
      #
      # O par que importa e "transfer sem destino e recusado" x "a despesa fixa de
      # sempre PASSA": so morrem juntos. Um CHECK (false) -- a trava larga demais,
      # que quebra a criacao de qualquer conta prevista no app -- passaria na
      # assercao de recusa sozinha.
      #
      # Medido: 10 mutantes, 10 mortos, mais o controle positivo
      # (npm run mutantes:transferencia-recorrente). Dois acharam furo real na
      # primeira passada. `drop_sem_add` sobreviveu por EQUIVALENCIA -- como
      # `transaction_type` e o enum de tres valores, apagar o CHECK aceita
      # exatamente os mesmos valores que a lista nova, e nenhum INSERT distingue;
      # o teste passou a afirmar que a constraint CONTINUA existindo. E a guarda do
      # passo 1 nao e alcancavel por este arquivo (ela so dispara num banco que JA
      # tenha regra 'transfer'), entao tem sonda propria no mutador, que fabrica a
      # linha ruim.
      - name: A transferencia prevista tem destino, e ele nao e a conta de origem
        run: $PSQL -f database/tests/038_transferencia_recorrente_test.sql

      # Convite de grupo para um email que ainda nao tem conta (HMO-197).
      #
      # Este fixture tem de rodar ANTES da 039, e e o que da ao backfill dela algo
      # em que morder: num banco construido do zero `group_invitations` esta vazia
      # quando a 039 roda, o UPDATE da SECAO 3 toca zero linhas, e "o backfill nao
      # roda" passa verde. Medido -- era o unico mutante sobrevivente, e e o que
      # mais custa em producao: sao os convites orfaos JA gravados que ele deixaria
      # invisiveis para sempre.
      #
      # Ele COMITA, ao contrario dos testes: a 039 roda noutra sessao e nao veria
      # nada dentro de uma transacao aberta.
      - name: Historico anterior a 039, para o backfill ter em que morder
        run: $PSQL -f database/tests/039_historico_antes_da_039.sql

      - name: 039_convite_por_email_sem_conta
        run: $PSQL -f database/migrations/039_convite_por_email_sem_conta.sql

      # Re-executavel: as duas funcoes sao CREATE OR REPLACE, o trigger tem
      # DROP TRIGGER IF EXISTS antes do CREATE, e o backfill da SECAO 3 so encosta
      # em linha com `invited_user_id` NULO -- recolar nao reclama convite duas
      # vezes nem troca o dono de nenhum.
      - name: 039 e idempotente
        run: $PSQL -f database/migrations/039_convite_por_email_sem_conta.sql

      # O que esta suite guarda: o convite endereçado a um email SEM conta era
      # gravado e ficava inalcancavel para sempre -- `list_my_group_invitations`,
      # `has_pending_invitation` e `respond_to_group_invitation` todas exigem
      # `invited_user_id = auth.uid()`, e nada preenchia esse campo no cadastro.
      #
      # A secao de SEGURANCA e a que nao pode sair: o casamento e por
      # `auth.users.email`, nunca por `profiles.email`. A policy `profiles_update_own`
      # da 002 deixa qualquer um escrever qualquer string no proprio
      # `profiles.email` (policy de RLS trava linha, nao coluna), entao casar por
      # ali seria entregar o convite de uma pessoa a quem digitou o email dela.
      # O teste forja esse ataque pelos dois caminhos (INSERT e UPDATE) e exige
      # que os dois falhem -- com a contraprova de que a dona de verdade recebe.
      #
      # Medido: 12 mutantes na 039, 12 mortos, mais o controle positivo
      # (BANCO_BASE=... bash scripts/mutantes-convite-sem-conta.sh).
      - name: Convite para quem ainda nao tem conta espera a conta, e nao se rouba por email
        run: $PSQL -f database/tests/hmo197_convite_sem_conta_test.sql

      # A metade de JavaScript da HMO-197. O SQL acima prova a ENTREGA; estas 13
      # assercoes cobrem as tres regras da rota que erram calado -- a duplicata
      # nao detectada (convidar duas vezes quem nao se cadastrou grava duas linhas
      # e o trigger reclama as duas), a normalizacao do email (tem de ser a mesma
      # do `LOWER(btrim(...))` da 039, senao o convite nasce num formato que o
      # cadastro nao casa) e a MENSAGEM.
      #
      # A assercao que vale o job e uma negacao: sem conta, a frase NAO pode dizer
      # "convite enviado". Era isso que mandava o admin esperar uma notificacao
      # que nao existia -- e foi assim que 5 convites invisiveis foram criados em
      # producao.
      #
      # O runner que media isso (`scripts/mutantes-convite-de-grupo.mjs`, 9
      # mutantes, 9 mortos) foi APAGADO na triagem da HMO-330, e esta linha
      # deixa de citar um comando que nao existe mais. O motivo esta no commit:
      # a afirmacao dele e sobre TEXTO de notificacao, nao sobre dinheiro, e
      # custava 57s. A suite abaixo continua rodando; o que se perdeu foi a
      # prova de que ela mede o que diz medir.
      #
      # Reclassificar em vez de apagar foi considerado e RECUSADO: nenhum bloco
      # deste workflow roda um subconjunto daqueles mutantes, entao
      # `ferramenta-de-autor` ou `coberto-por-outro` seriam promessa falsa. O
      # guard `check-mutantes-in-ci` teria aceitado -- o step abaixo e ativo e
      # o nome casaria exato --, e e justamente por isso que a linha nao foi
      # escrita: a peneira e mecanica, a promessa e semantica.
      - name: O convite guardado nao se anuncia como enviado
        run: npm run test:convite-de-grupo

      # O TEMPLATE PRE-040, TIRADO AQUI PORQUE AQUI E O PRE-040 (HMO-322).
      #
      # A prova de mutacao da 040 (mais abaixo, "A trava de membro sabe
      # falhar") exige um banco com a cadeia ATE A 039 e SEM a 040: a 040 e
      # `CREATE OR REPLACE FUNCTION` mais `DROP TRIGGER IF EXISTS`, entao
      # aplicar um mutante sobre um banco que ja tem a versao boa REESCREVE a
      # funcao boa -- e o placar viraria ficcao.
      #
      # Este step custa quase nada porque nao replica a cadeia: `CREATE
      # DATABASE ... TEMPLATE` e copia de arquivo no lado do servidor. O unico
      # requisito e que ninguem esteja conectado ao template, e entre dois
      # steps nao ha conexao aberta -- cada `$PSQL` abre e fecha a sua.
      #
      # Tirar o retrato DEPOIS, replicando 001 -> 039 num banco novo, seria
      # ~109 steps de psql pagos de novo. E tirar o retrato aqui tem uma
      # segunda vantagem: ele nao pode divergir da cadeia que o job acabou de
      # provar, porque E ela.
      - name: Retrato da cadeia em 039, para a prova de mutacao da 040
        run: $PSQL -d postgres -c "CREATE DATABASE hmo322_pre040 TEMPLATE $PGDATABASE"

      - name: 040_trava_de_percentual_e_papel_do_membro
        run: $PSQL -f database/migrations/040_trava_de_percentual_e_papel_do_membro.sql

      # Re-executavel: a funcao e CREATE OR REPLACE e o trigger tem
      # DROP TRIGGER IF EXISTS antes do CREATE. Nao ha ALTER, CHECK novo nem
      # backfill -- recolar nao duplica trigger nem mexe em linha nenhuma.
      - name: 040 e idempotente
        run: $PSQL -f database/migrations/040_trava_de_percentual_e_papel_do_membro.sql

      # A trava de percentual e papel do membro (HMO-268, fase 2 de 7 da
      # HMO-245). `group_members_update` (002:526) e
      # `USING (user_id = auth.uid() OR is_group_admin(group_id))` dos dois
      # lados -- policy de RLS diz quais LINHAS alguem alcanca, nunca quais
      # COLUNAS, e nao compara OLD com NEW. O ramo `user_id = auth.uid()`
      # entrega ao membro comum a propria linha INTEIRA, pelo PostgREST, com a
      # chave anon que sai do bundle. Por isso e trigger, e nao policy.
      #
      # O que so o Postgres pega aqui:
      #
      #   - a diferenca entre "barrado pelo trigger" e "0 linhas pela RLS".
      #     UPDATE filtrado pela RLS volta SUCESSO com zero linhas, sem erro --
      #     um teste que so conferisse "o percentual nao mudou" ficaria verde
      #     com trigger nenhum instalado. O helper `pg_temp.recusa` do teste
      #     exige o SQLSTATE 42501 E a mensagem do trigger, e a SECAO 3 mostra
      #     esse falso verde de corpo presente;
      #   - `IS DISTINCT FROM` e nao `<>` na guarda de `percentage`, que e a
      #     UNICA das quatro colunas que aceita nulo (001:1215). Com `<>`,
      #     comparar 50.00 com NULL da NULL, o IF nao entra, e o membro comum
      #     zera o proprio peso mandando `{"percentage": null}` em vez do 0.01
      #     que as outras tentativas mandam. MEDIDO: esse mutante sobreviveu ao
      #     teste com 31 assercoes verdes, e a assercao 'B anulando o proprio
      #     percentual' da SECAO 2 entrou por causa dele;
      #   - o par BEFORE / FOR EACH ROW. Um trigger de STATEMENT nao tem
      #     OLD/NEW, que e a unica coisa que esta migration tem para olhar, e
      #     BEFORE INSERT aparece em `pg_trigger` igual sem olhar UPDATE
      #     nenhum -- e por isso que o bloco de prova da 040 confere `tgtype`,
      #     e nao so a presenca do nome;
      #   - a dependencia do GRANT do 002 em `is_group_admin(uuid)`. Sem ele o
      #     trigger falha FECHADO com um 42501 que se le como recusa legitima,
      #     e o que quebra e o caminho do ADMIN. A SECAO 7 revoga o GRANT de
      #     proposito e exige que a mensagem seja a outra.
      #
      # Medido: 13 mutantes, 13 mortos, com controle positivo (a 040 intacta
      # passa) e controle NEGATIVO (sem a 040 o teste reprova -- e o que detecta
      # um template montado com a migration dentro).
      # PG_TEMPLATE=<cadeia ate a 039> npm run mutantes:trava-de-membro
      - name: Nao-admin nao muda o proprio percentual nem o proprio papel no grupo
        run: $PSQL -f database/tests/040_trava_de_percentual_e_papel_do_membro_test.sql

      - name: 041_fatura_escolhida_no_lancamento
        run: $PSQL -f database/migrations/041_fatura_escolhida_no_lancamento.sql

      # Re-executavel: a coluna entra por ADD COLUMN IF NOT EXISTS, o CHECK so e
      # criado quando `pg_constraint` nao o tem, e a view entra por
      # CREATE OR REPLACE. O risco proprio deste passo e o REPLACE: a segunda
      # passada nao pode quebrar por a coluna ja estar no fim do SELECT nem
      # derrubar o `security_invoker` da view.
      - name: 041 e idempotente
        run: $PSQL -f database/migrations/041_fatura_escolhida_no_lancamento.sql

      # A fatura ESCOLHIDA no lancamento (HMO-281, PR 1 de 3). Esta migration so
      # mexe em schema -- o formulario e a validacao vem na PR 2, e por isso ela
      # entra sozinha: `FormularioDeLancamento.tsx` escreve em
      # `financial_transactions` direto pelo supabase-js, do navegador, e codigo
      # novo rodando contra um banco sem a coluna responde PGRST204 em TODA
      # despesa no cartao, nao so na de quem usa o campo.
      #
      # O que so o Postgres pega aqui:
      #
      #   - o COALESCE tem de entrar nas DUAS ocorrencias da view. Com ele so no
      #     `invoice_month`, a compra aparece na fatura escolhida COM O
      #     VENCIMENTO DA FATURA DA DATA: a tela fica certa e o "fechar fatura"
      #     do 015 gera a conta a pagar com data de outro mes. O cartao do
      #     fixture fecha dia 20 e vence dia 5 de proposito -- e o caso em que
      #     `card_invoice_due_date` empurra para o mes seguinte, e sem essa
      #     escolha os dois vencimentos coincidiriam e o defeito nao mediria;
      #   - o CHECK do dia 1. A coluna e um MES e `date` nao sabe disso:
      #     '2026-12-15' sobrevive ao COALESCE e a tela passa a listar duas
      #     "faturas de dezembro", cada uma com parte das compras, as duas com
      #     total plausivel;
      #   - a AUSENCIA de DEFAULT. `ADD COLUMN ... DEFAULT` PREENCHE as linhas
      #     que ja existem -- todo o historico de cartao do banco mudaria de
      #     fatura de uma vez. A assercao e pelo catalogo (`atthasdef`) E pelo
      #     comportamento, porque um default de `date_trunc(CURRENT_DATE)` cai no
      #     mes em que o teste roda e pode coincidir com a fatura esperada;
      #   - e o `security_invoker`, que o `CREATE OR REPLACE VIEW` APAGA (medido
      #     no Postgres 17.11, registrado na 035). A 041 tem cara de aditiva e
      #     nao fala de permissao em lugar nenhum; sem reafirmar a opcao ela
      #     entrega a fatura de qualquer usuario a qualquer usuario logado.
      #
      # Medido: 10 mutantes, 10 mortos, com controle positivo (a 041 intacta
      # passa) e controle NEGATIVO (sem a 041 o teste reprova -- e o que detecta
      # um template montado com a migration dentro, que faria todo mutante virar
      # no-op). PG_TEMPLATE=<cadeia ate a 040> npm run mutantes:fatura-escolhida
      #
      # RE-MEDIDO na HMO-289, e a primeira medida NAO valia: o runner lia `dir`
      # fora de escopo, entao toda aplicacao de SQL estourava `ReferenceError`, o
      # `catch` a contava como "o teste reprovou" e os 10 mutantes "morriam" pelo
      # erro de script. O 10/10 acima e o de depois do conserto -- com o controle
      # positivo verde, que e justamente o unico caso que o bug derrubava.
      - name: A fatura escolhida manda no mes e no vencimento, e a view nao vaza
        run: $PSQL -f database/tests/041_fatura_escolhida_no_lancamento_test.sql

      - name: 042_rateio_do_trigger_honra_o_percentual
        run: $PSQL -f database/migrations/042_rateio_do_trigger_honra_o_percentual.sql

      # Re-executavel: a 042 e so CREATE OR REPLACE FUNCTION mais REVOKE. Nao
      # ha ALTER, CHECK novo nem backfill -- despesa que ja existe fica com a
      # divisao com que nasceu, de proposito (reescrever o historico mudaria o
      # valor de partes que alguem JA APROVOU, que e o que as travas PDG01 da
      # 024 existem para impedir).
      - name: 042 e idempotente
        run: $PSQL -f database/migrations/042_rateio_do_trigger_honra_o_percentual.sql

      # HMO-304. O trigger passa a honrar `group_members.percentage`: num grupo
      # 70/30 a mesma conta valia R$ 300 PREVISTA (o fechamento do mes rateia
      # por `ratearPorPeso` desde a HMO-270) e R$ 500 depois de PAGA, porque a
      # SECAO 2c de `refazer_rateio_do_grupo` gravava `split_type = 'equal'`
      # fixo e o `calculate_equal_split` (007) achatava tudo para partes iguais.
      # Medido na cadeia 001..041 antes do conserto: 500/500 com 70/30
      # configurado.
      #
      # O que so o Postgres pega aqui:
      #
      #   - o DEGRAU DO 0/0. `group_members.percentage` e `numeric(5,2)
      #     DEFAULT 0.00` e NULLABLE: grupo que nunca passou pela tela de
      #     divisao tem soma de pesos ZERO e PRECISA continuar dividindo igual.
      #     Sao dois casos de teste e nao um, porque 0.00 e NULL chegam ao `IF`
      #     por caminhos diferentes (`SUM` de tudo NULL e NULL, nao zero). Sem
      #     esse ramo, esta migration mudaria o dinheiro de TODO grupo que
      #     existe hoje;
      #   - a soma que NAO fecha 100. `percentage` e PESO e o rateio divide pela
      #     SOMA -- 70/27 em R$ 1.000 da 721,65/278,35 e fecha EXATO. Tratar 70
      #     como "70 de 100" deixaria R$ 30 sem dono e o saldo do grupo pararia
      #     de fechar em zero. A escolha e a de `ratearPorPeso`, que e quem
      #     decide o lado PREVISTO: qualquer outra manteria a discordancia que
      #     esta issue existe para fechar;
      #   - o membro de peso ZERO. `group_expense_splits_percentage_check`
      #     (001:1165) exige `percentage > 0`, entao gravar 0,00 na coluna de
      #     DISPLAY derrubaria o INSERT -- e com ele o lancamento inteiro. Sai
      #     com piso de 0,01 e `amount` 0,00, a mesma escolha que o 007 ja fez
      #     na propria funcao ("quem manda e o valor");
      #   - as travas PDG01 da 024. A 042 faz `CREATE OR REPLACE` do corpo
      #     INTEIRO de `refazer_rateio_do_grupo`, e o teste da 024 roda ANTES
      #     dela nesta cadeia -- daqui em diante quem prova que apagar uma trava
      #     nao passa verde e a SECAO 8 deste arquivo.
      #
      # Medido: 13 mutantes, 11 mortos, com controle positivo (a 042 intacta
      # passa) e controle NEGATIVO (sem a 042 o teste reprova na PRIMEIRA
      # assercao -- e o que detecta este arquivo rodando fora da posicao dele).
      # Os DOIS sobreviventes sao equivalentes, nao furos de assercao, e estao
      # nomeados no cabecalho da migration: o cast numeric->bigint ja arredonda
      # (o `ROUND` e redundante com `numeric(15,2)`), e `SUM` de tudo NULL cai no
      # mesmo ramo que zero (o `COALESCE` faz do zero uma decisao explicita).
      - name: O rateio da baixa honra o percentual, e o grupo legado divide igual
        run: $PSQL -f database/tests/042_rateio_do_trigger_honra_o_percentual_test.sql

      - name: 043_direcao_do_previsto_avulso
        run: $PSQL -f database/migrations/043_direcao_do_previsto_avulso.sql

      # Re-executavel: a 043 e um `CREATE OR REPLACE VIEW` mais o ALTER do
      # security_invoker e os GRANTs. Nao cria objeto, nao reescreve dado e nao
      # tem backfill -- a segunda aplicacao produz o mesmo estado da primeira.
      - name: 043 e idempotente
        run: $PSQL -f database/migrations/043_direcao_do_previsto_avulso.sql

      # HMO-256, a terceira perna do mesmo defeito. As outras duas sao
      # TypeScript (a rota do "posso gastar", consertada na HMO-308, e a
      # /api/projection, nesta issue) e vivem no `verificacao.yml`; esta e a
      # unica que e SQL, porque o criterio estava dentro da view.
      #
      # O defeito: `planned_vs_actual` decidia a direcao do previsto por
      # `COALESCE(r.transaction_type, 'expense')` -- o tipo da REGRA. Previsao
      # AVULSA nao tem regra, entao TODA receita prevista avulsa era contada
      # como conta a pagar. Medido em producao (04/10/2026, conta de teste da
      # HMO-255, outubro/2026): `planned_expense` 1.365,00 incluindo um bonus de
      # 50,00 que e receita, e `planned_income` 2.700,00 sem ele.
      #
      # O que so o Postgres pega:
      #
      #   - nenhum teste de TypeScript le view. A rota de orcamento recebe dois
      #     numeros, os dois no formato certo e os dois plausiveis. O erro so
      #     aparece comparando com a agenda, e ele erra para o lado que nao gera
      #     reclamacao: o app diz que a pessoa tem MENOS do que tem;
      #   - o CASO 3 e o controle negativo, e e o que justifica o arquivo. Ele
      #     reproduz o FILTER antigo sobre a fixture nova e EXIGE 350,00 -- sem
      #     ele, os casos 1 e 2 nao distinguem "a 043 funciona" de "o cenario
      #     nunca exercitou o defeito";
      #   - o CASO 4 (a moeda) esta aqui porque o guarda original NAO ALCANCA a
      #     043: os casos 4 e 5 do `022_currency_test.sql` guardam este mesmo
      #     LATERAL, mas aquele arquivo roda antes da 026 e NAO e re-executavel
      #     depois -- medido, ele morre em
      #     `financial_transactions_rate_matches_currency`, porque a fixture em
      #     dolar dele nasceu antes daquele CHECK. A 043 troca o `FROM` daquele
      #     LATERAL, entao a cobertura da duplicacao por moeda veio para ca;
      #   - o CASO 5 e a RLS pela view com a role de aplicacao. `CREATE OR
      #     REPLACE VIEW` ja apagou `reloptions` neste repositorio, e sem
      #     `security_invoker` esta view entrega o previsto de TODOS para
      #     qualquer um logado.
      #
      # Medido: 12 assercoes verdes contra a cadeia com a 043, e o arquivo
      # INTEIRO reprovando contra a cadeia sem ela (ERROR na primeira assercao,
      # 350,00 onde se espera 300,00) -- o controle que prova que ele mede.
      - name: A receita prevista AVULSA sai de planned_expense
        run: $PSQL -f database/tests/043_direcao_do_previsto_avulso_test.sql

      # A SUITE DA VIEW ANTIGA, RE-RODADA DEPOIS DA 043 (e o motivo e a regra).
      #
      # `goals_reports_test.sql` e quem guarda `planned_vs_actual` desde o 008,
      # e ele roda na POSICAO dele -- muito antes da 043. Sem este step ele
      # nunca veria a definicao nova: a 043 reescreveria o objeto que ele
      # protege e a protecao continuaria medindo a definicao velha, verde.
      #
      # Ele e re-executavel (medido: passa contra a cadeia com a 043 aplicada),
      # e e por isso que ele cabe aqui e o `022_currency_test.sql` NAO -- aquele
      # morre no CHECK da 026, por posicao, e nao por defeito.
      - name: O previsto x realizado do 008 continua valendo depois da 043
        run: $PSQL -f database/tests/goals_reports_test.sql

      - name: 044_expiracao_de_convite_sem_sorteio
        run: $PSQL -f database/migrations/044_expiracao_de_convite_sem_sorteio.sql

      # Re-executavel: sao tres DROP ... IF EXISTS e um COMMENT. A segunda
      # passada so imprime os tres NOTICE de "does not exist, skipping".
      - name: 044 e idempotente
        run: $PSQL -f database/migrations/044_expiracao_de_convite_sem_sorteio.sql

      # HMO-344: o `random()` sai do trigger de convites. O 001 deixou em
      # `group_invitations` o trigger `cleanup_expired_invitations` (AFTER
      # INSERT, FOR EACH ROW) que chamava `expire_old_invitations()` sob
      # `IF random() < 0.1` -- cada INSERT de convite tinha 10% de chance de
      # varrer a tabela inteira carimbando `status = 'expired'`.
      #
      # ISTO NAO ERA TEORICO: na HMO-197 o mutante `sem_prazo` sobreviveu em 4
      # de 8 execucoes sobre clones identicos do mesmo banco, porque a linha
      # pendente-E-expirada do teste virava `expired` e quem a excluia passava a
      # ser o filtro de status sozinho -- mutante EQUIVALENTE, nao furo de
      # assercao. Custou uma passada inteira de investigacao.
      #
      # Apagar e o conserto INTEIRO, e sem backfill, porque ninguem le o rotulo
      # persistido e todo leitor de `status = 'pending'` ja carrega o prazo ao
      # lado: `list_my_group_invitations()` e `respond_to_group_invitation()`
      # (030), `has_pending_invitation()` (002), `reclamar_convites_orfaos()`
      # (039) e a rota `invite/route.ts`. A SECAO 4 do teste prova isso nas
      # quatro do banco, cada uma com CONTROLE POSITIVO (um convite pendente e
      # NAO vencido que elas tem de devolver) -- sem ele uma fixture quebrada
      # daria zero em tudo e a secao passaria vacua.
      #
      # O que so o Postgres pega aqui:
      #
      #   - o DETERMINISMO, que e o defeito em si. A SECAO 3 insere 120 convites
      #     e exige que a linha vencida chegue ainda `pending`. MEDIDO: no banco
      #     PRE-044 esta secao reprova (8/8 com apenas 60 insercoes; sob
      #     `random() < 0.1`, 0.9^120 = 0.0003%). Depois da 044 nao ha sorteio
      #     nenhum e ela e deterministica, nao "provavelmente verde";
      #   - que `expire_old_invitations()` era uma primitiva de escrita ANONIMA.
      #     Ela e SECURITY DEFINER e nasceu no 001 sem REVOKE, entao herdou
      #     EXECUTE para PUBLIC: `has_function_privilege('anon', ...)` dava
      #     true para um UPDATE de tabela inteira que ignora RLS. So o catalogo
      #     mostra isso -- nenhum grep no app acha um chamador, porque nao havia.
      #     A SECAO 5 exige que a funcao nao exista mais;
      #   - a guarda de REINTRODUCAO da SECAO 2, que nao cita nome de funcao:
      #     ela reprova qualquer trigger de `group_invitations` com `random()`
      #     no corpo, inclusive um que alguem crie amanha com outro nome.
      - name: Convite vencido nao muda de status por sorteio, e as leituras seguram pelo prazo
        run: $PSQL -f database/tests/044_expiracao_de_convite_sem_sorteio_test.sql

      - name: 045_realizado_de_grupo_no_previsto_x_realizado
        run: $PSQL -f database/migrations/045_realizado_de_grupo_no_previsto_x_realizado.sql

      # Re-executavel: a 045 e so CREATE OR REPLACE VIEW, COMMENT, GRANT e
      # ALTER VIEW. Nao ha ALTER de tabela, CHECK novo nem backfill.
      - name: 045 e idempotente
        run: $PSQL -f database/migrations/045_realizado_de_grupo_no_previsto_x_realizado.sql

      # HMO-258. `planned_vs_actual` apagava a despesa de grupo inteira do lado
      # REALIZADO: `monthly_cash_flow` tem `group_id` no grao e a rota pessoal
      # filtra `group_id IS NULL`, entao uma despesa de grupo nunca caia na
      # linha lida. Medido na fixture de maio da conta A da HMO-255: 900,00 onde
      # as outras duas leituras da MESMA pagina diziam 950,00.
      #
      # Isso nao era uma convencao a mais, era defeito: a pergunta da issue
      # ("90 ou 30?") tem tres respostas defensaveis e nenhuma delas e ZERO. E
      # num relatorio de VARIANCIA o estrago e pior que um total baixo -- com
      # 700,00 previstos ele mostrava 200,00 de estouro onde havia 250,00,
      # parabenizando por uma economia que nao houve.
      #
      # O QUE SO ESTA SUITE PEGA:
      #
      #   - a TERCEIRA ORIGEM de `chaves` (secao 4). Um mes em que a minha unica
      #     despesa foi paga por OUTRO membro nao tem linha minha em
      #     `financial_transactions`, entao sem a chave nova o mes nao vem zero:
      #     vem AUSENTE. Um mes ausente le-se na tela como "nao houve movimento".
      #
      #   - as DUAS PERNAS do LATERAL sendo mutuamente exclusivas (secao 3). Ela
      #     conta LINHAS, nao dinheiro: se as duas casassem, a chave viraria duas
      #     linhas e o relatorio contaria o PREVISTO duas vezes. Nenhuma assercao
      #     sobre `actual_expense` pega isso -- o valor de cada linha continuaria
      #     certo.
      #
      #   - o `group_id` da chave nova sendo NULL (secao 2b). Com o `group_id`
      #     real, o membro que SO DEVE parte perde o mes inteiro do relatorio
      #     pessoal e ganha uma linha de 0,00 no do grupo. (A primeira versao
      #     deste comentario dizia "dobraria o realizado" -- medir o mutante
      #     mostrou que a despesa DESAPARECE, nao dobra.)
      #
      #   - a FRONTEIRA DA 033 (secao 2): o relatorio do grupo continua no valor
      #     CHEIO. "A leitura pessoal ficou certa" e "a do grupo continuou certa"
      #     sao duas afirmacoes diferentes. A primeira versao dessa secao
      #     esquecia o filtro de `user_id`, somava as linhas da A e da B e
      #     fechava em 150,00 por acidente -- verde medindo outra coisa.
      #
      #   - o controle negativo da RLS (secao 5): com o ALTER do
      #     `security_invoker` removido, a Dora ve 2 linhas da A. Medido.
      #
      # A 045 tambem RECOLA o lado previsto da 043 (`s.direction`), porque
      # `CREATE OR REPLACE VIEW` exige a definicao inteira. O step do
      # `043_direcao_do_previsto_avulso_test.sql` roda acima, na posicao dele; o
      # step abaixo o re-roda DEPOIS da 045, que e o que prova que ela nao
      # reverteu a 043.
      - name: O previsto x realizado conta a minha parte de grupo, e o do grupo nao muda
        run: $PSQL -f database/tests/045_realizado_de_grupo_no_previsto_x_realizado_test.sql

      # A 045 reescreve `planned_vs_actual`, que e o objeto que a 043 acabou de
      # consertar. Sem este step o conserto da 043 ficaria protegido so por um
      # teste que roda ANTES da 045 -- exatamente o buraco pelo qual a primeira
      # versao da 045 revertia a 043 em silencio.
      - name: A receita prevista AVULSA continua fora de planned_expense depois da 045
        run: $PSQL -f database/tests/043_direcao_do_previsto_avulso_test.sql

      # E a suite do 008, pela mesma razao da linha de cima.
      - name: O previsto x realizado do 008 continua valendo depois da 045
        run: $PSQL -f database/tests/goals_reports_test.sql

      # HMO-258, a decisao de produto que a issue dizia vir antes do codigo.
      # Respondida em 08/10/2026: o custo pessoal e "bruto + reembolso" --
      # INTEIRO quando eu paguei, MINHA PARTE quando outro pagou. O painel e os
      # dois relatorios saem de 950,00 para 1.010,00 na fixture de maio da conta
      # A, e passam a concordar com Financas Pessoais (HMO-275).
      #
      # A 046 sao DUAS mudancas numa view, e cada metade sozinha e um defeito que
      # ja foi medido em banco -- por isso o teste nega cinco numeros, nao um:
      #   920  so a metade 2: a despesa que EU paguei desaparece
      #  1040  so a metade 1: valor cheio + a minha parte dele (dupla contagem)
      #   950  a 033 intacta -- a terceira convencao, sem rotulo
      #   990  a perna do grupo descartada -- fluxo de caixa, que e o criterio
      #        CERTO de outra leitura
      #  1020  a polaridade de `paguei_eu` invertida
      #
      # As duas secoes que NAO sao sobre o criterio escolhido:
      #
      #   - RATEIO RECUSADO (secao 4). Eu pago 200,00 pelo grupo e todos recusam
      #     a parte: ninguem me devolve nada, logo os 200 sao meus. Antes da 046 o
      #     painel mostrava ZERO -- `group_share_entries` exclui rejected (certo,
      #     deliberado na 033) e o `group_id IS NULL` jogava a despesa fora do
      #     outro lado. Isso era defeito sob QUALQUER um dos tres criterios.
      #
      #   - O `eq("user_id")` DO LEITOR (secao 7). A perna pessoal perdeu o
      #     `group_id IS NULL`, que antes descartava de graca as linhas dos outros
      #     membros; a RLS de grupo (002) permite le-las desde sempre. Os tres
      #     leitores filtram user_id e o codigo diz que isso e load-bearing -- a
      #     assercao fixa a DIRECAO do sintoma (sem filtro, total MAIOR) sem
      #     travar o valor, que depende do tamanho do grupo na fixture.
      - name: 046_um_criterio_de_custo_pessoal
        run: $PSQL -f database/migrations/046_um_criterio_de_custo_pessoal.sql

      - name: 046 e idempotente
        run: $PSQL -f database/migrations/046_um_criterio_de_custo_pessoal.sql

      - name: O custo pessoal fala UM numero -- 1.010,00, o mesmo de Financas Pessoais
        run: $PSQL -f database/tests/046_um_criterio_de_custo_pessoal_test.sql

      # POR QUE A SUITE DA 045 **NAO** E RE-RODADA AQUI, AO CONTRARIO DO QUE A
      # PROPRIA 045 FEZ COM A DA 043.
      #
      # A 045 precisou re-rodar a suite da 043 porque as duas fazem
      # `CREATE OR REPLACE VIEW` no MESMO objeto (`planned_vs_actual`): quem vem
      # depois carrega a definicao inteira e pode reverter quem veio antes em
      # silencio. A 046 nao toca `planned_vs_actual` -- ela mexe em
      # `personal_category_monthly_totals` e no rollup da parte de grupo --,
      # entao nao existe reversao a vigiar.
      #
      # E re-rodar a suite da 045 aqui REPROVARIA, corretamente: a secao 1 dela
      # exige 950,00, que e o realizado pessoal pelo criterio da 033. A 046 troca
      # esse criterio para 1.010,00. Aquela suite roda na POSICAO dela, antes da
      # 046, e continua certa la -- igual ao teste da 033, que segue exigindo o
      # criterio da 033. Pendurar a suite antiga depois da migration que a
      # substitui obrigaria a "consertar" o teste, que e como um criterio velho
      # volta escondido.
      #
      # A suite da 043, essa sim, roda de novo: a 046 nao mexe no previsto, e um
      # verde aqui e barato.
      - name: A receita prevista AVULSA continua fora de planned_expense depois da 046
        run: $PSQL -f database/tests/043_direcao_do_previsto_avulso_test.sql

      # HMO-183 (destravada pela HMO-234). O canal de e-mail do aviso de
      # vencimento. Aditiva sobre o 009: duas colunas novas em
      # bill_notifications, uma em notification_preferences, e `bill_alerts`
      # recriada para expor a preferencia de canal.
      #
      # ESTA MIGRATION NASCEU 038 E HOJE E A 047. O numero foi tomado duas
      # vezes enquanto o PR estava parado em conflito (a 038 virou
      # `transferencia_recorrente`, e a corrida seguinte levou 045 e 046). Nada
      # no corpo dela depende da posicao: ela so le `bill_alerts` como o 009 a
      # deixou, e nenhuma migration entre o 009 e a 046 toca essa view --
      # conferido com `git grep bill_alerts` na main antes de renumerar. Se ela
      # for renumerada de novo, estes tres passos e os comentarios acima
      # precisam andar junto.
      - name: 047_aviso_por_email
        run: $PSQL -f database/migrations/047_aviso_por_email.sql

      # Re-executavel: ADD COLUMN IF NOT EXISTS nos tres, DROP CONSTRAINT IF
      # EXISTS antes do ADD CONSTRAINT, e CREATE OR REPLACE na view.
      - name: 047 e idempotente
        run: $PSQL -f database/migrations/047_aviso_por_email.sql

      # O que esta suite guarda, em uma linha: rodar o cron duas vezes no mesmo
      # dia nao pode mandar dois e-mails -- e quem garante isso nao e contador
      # nenhum no TypeScript, e a UNIQUE (scheduled_transaction_id, kind,
      # reference_date) do 009, que faz o upsert devolver lista VAZIA na segunda
      # execucao.
      #
      # E o motivo de ela rodar DEPOIS da 047, e nao antes: a maioria das
      # assercoes e sobre a definicao nova de bill_alerts, e na posicao errada o
      # arquivo veria a view do 009 e passaria verde sem exercitar nada.
      #
      # A assercao que menos parece necessaria e a que mais e: `bill_alerts tem
      # security_invoker=true no catalogo`. CREATE OR REPLACE VIEW APAGA os
      # reloptions -- medido num Postgres 17 local, a view sai da 047 sem a
      # opcao se o ALTER VIEW nao estiver la. Sem ele a view roda como o DONO,
      # a RLS de scheduled_transactions para de valer, e o sino de cada pessoa
      # passa a listar as contas a vencer de TODO MUNDO, sem erro nenhum.
      #
      # Medido: 6 mutantes na 047, 6 mortos, mais o controle negativo (a suite
      # inteira fica vermelha quando roda ANTES da 047).
      - name: Dois crons no mesmo dia nao mandam dois e-mails, e a view nao perde o invoker
        run: $PSQL -f database/tests/047_aviso_por_email_test.sql

      # O retrato para a prova de mutacao da 048, tirado AQUI porque aqui a
      # cadeia esta exatamente em 047 -- e para esta migration o retrato importa
      # mais do que para as outras: `ALTER COLUMN ... SET NOT NULL` sobre uma
      # coluna que JA e NOT NULL e um no-op silencioso no Postgres. Num template
      # contaminado com a 048, TODO mutante "morreria" (o banco ja estaria
      # travado) e o placar sairia 4/4 sem ter medido nada. O controle NEGATIVO
      # do runner existe para detectar isso, e ele so funciona se o retrato for
      # tirado deste lado da migration.
      #
      # Custa quase nada: `CREATE DATABASE ... TEMPLATE` e copia de arquivo no
      # lado do servidor, e entre dois steps nao ha conexao aberta no template.
      - name: Retrato da cadeia em 047, para a prova de mutacao da 048
        run: $PSQL -d postgres -c "CREATE DATABASE hmo232_pre048 TEMPLATE $PGDATABASE"

      # HMO-232, a SEGUNDA METADE DA 037 -- e a unica migration deste
      # repositorio que NAO e segura de colar com a `main` velha.
      #
      # A 037 preencheu `transaction_type` onde ele era nulo e de proposito nao
      # travou a coluna: migration aqui e colada a mao ANTES de o codigo subir,
      # e o codigo no ar naquele momento era justamente o que gravava NULL -- um
      # NOT NULL ali derrubaria em 23502 todo lancamento feito pela tela entre a
      # colagem e o deploy. O conserto das rotas (PR #139) esta na main desde
      # 2026-10-02 e deploy leva codigo sozinho, entao a condicao venceu.
      #
      # A auditoria dos escritores foi REFEITA na main de 2026-10-08 e esta no
      # cabecalho da migration: 12 caminhos de escrita, TRES deles criados
      # depois da auditoria original da issue (card-invoices/ajuste,
      # settlements, settlements/[id]/perna). As duas funcoes do banco que
      # inserem na tabela foram achadas pelo CATALOGO (`pg_proc.prosrc`), nao
      # pela leitura das migrations.
      - name: 048_trava_de_tipo_do_lancamento
        run: $PSQL -f database/migrations/048_trava_de_tipo_do_lancamento.sql

      # Re-executavel sem nenhum `IF NOT EXISTS` em volta: SET NOT NULL numa
      # coluna que ja e NOT NULL e no-op (nao e erro e nao reescreve a tabela), e
      # o backfill da 037 e idempotente pelo `WHERE transaction_type IS NULL` de
      # dentro da funcao -- na segunda passagem ele conserta 0 linhas.
      - name: 048 e idempotente
        run: $PSQL -f database/migrations/048_trava_de_tipo_do_lancamento.sql

      # As DUAS assercoes que esta suite tem de ter, e nenhuma delas basta:
      #
      #   * o CATALOGO (`is_nullable = 'NO'`). Sem ela, um
      #     `CHECK (transaction_type IS NOT NULL)` posto no lugar do NOT NULL
      #     passa verde: ele barra o nulo DE VERDADE, com 23514, e deixa
      #     `is_nullable` em 'YES' -- entao o `\d`, o Supabase Studio, o gerador
      #     de tipos e `gen-schema-columns.mjs` continuam todos dizendo "aceita
      #     nulo", e o proximo a mexer aqui acredita neles;
      #   * a RECUSA com o SQLSTATE 23502 exato. Sem ela, o catalogo sozinho
      #     prova que uma coluna do information_schema tem um valor, nao que o
      #     banco recusa escrita nenhuma.
      #
      # E a terceira, que parece sobrar: a coluna continua SEM DEFAULT. Um
      # `SET DEFAULT 'expense'` junto da trava faz o INSERT sem a coluna voltar
      # a PASSAR -- a linha nasce despesa em silencio, inclusive a perna de
      # transferencia, que viraria uma despesa a mais no mes com o saldo
      # continuando certo (o estrago da HMO-162 de novo).
      #
      # Medido: 4 mutantes, 4 mortos, com controle positivo (a 048 intacta
      # passa) e controle NEGATIVO (sem a 048 o teste reprova). Dois mutantes
      # sao os dois CHECKs plausiveis -- o que aceita NULL e o que nao aceita --
      # e cada um morre por UMA das duas assercoes de cima, nunca pelas duas.
      # PG_TEMPLATE=hmo232_pre048 npm run mutantes:trava-de-tipo
      - name: transaction_type nao aceita mais nulo, e a trava e NOT NULL e nao CHECK
        run: $PSQL -f database/tests/048_trava_de_tipo_do_lancamento_test.sql
      # HMO-347. O segundo dos dois leitores que a 033 anotou em "O QUE ESTA
      # MIGRATION NAO TOCA": `budget_consumption` responde "quanto do meu
      # orcamento eu gastei" e ignorava despesa de grupo INTEIRA. A 045/046
      # fecharam o primeiro (`planned_vs_actual`); este fecha o segundo, com o
      # MESMO criterio decidido na HMO-258 em 08/10/2026 -- bruto + reembolso.
      #
      # Medido na fixture de maio da conta A, com um teto pessoal de 700,00 na
      # categoria do mercado: 500,00 e 'ok' antes, 610,00 e 'alert' depois. A
      # barra ficava VERDE num mes em que o teto ja passou dos 80%.
      - name: 049_consumo_de_orcamento_do_grupo
        run: $PSQL -f database/migrations/049_consumo_de_orcamento_do_grupo.sql

      # Re-executavel: so CREATE OR REPLACE VIEW, COMMENT, ALTER VIEW e GRANT,
      # mais um preflight que so le o catalogo.
      - name: 049 e idempotente
        run: $PSQL -f database/migrations/049_consumo_de_orcamento_do_grupo.sql

      # A 049 sao DUAS mudancas numa view, e cada metade sozinha e um numero
      # plausivel que a barra do orcamento mostraria sem erro -- a suite nega os
      # seis que foram medidos em banco (500, 520, 550, 590, 620, 640).
      #
      # As tres assercoes que valem o step:
      #
      #   1. 610,00 e 'alert' no teto PESSOAL -- a issue em uma linha.
      #   2. 150,00 no teto de GRUPO, que a 049 NAO muda. A perna do reembolso
      #      fica desligada nele; vazando, a barra da viagem sobe a cada membro
      #      novo (170 com um membro, mais a cada um).
      #   3. 600,00 num teto em REAIS de uma viagem em DOLAR. A 026 trouxe a
      #      conversao para esta view; a perna 2 e nova e precisa dela tambem, e
      #      a cotacao dela vem do JOIN com financial_transactions. Os quatro
      #      mundos (600 / 520 / 200 / 120) sao distinguiveis de proposito.
      #
      # Medido: 14 mutantes, 14 mortos, mais o controle negativo (a suite fica
      # vermelha num banco que para na 048) e o positivo.
      - name: O consumo de orcamento conta a despesa de grupo pelo criterio aprovado
        run: $PSQL -f database/tests/049_consumo_de_orcamento_do_grupo_test.sql

      # O runner que prova que a suite ACIMA mede o que ela diz medir.
      #
      # O que ele falsifica e que a suite sozinha nao garante: as duas metades
      # da migration separadamente (cada uma da um numero plausivel), a
      # conversao de moeda em CADA perna (variar so um lado deixaria o outro sem
      # medida), os tres recortes da perna nova (categoria, mes, usuario -- sem
      # eles o teto consome gasto de outra categoria, de outro mes ou de outra
      # pessoa) e o `security_invoker`, que `CREATE OR REPLACE VIEW` apaga.
      #
      # Barato: a cadeia 001 -> 048 sobe UMA vez num template e cada mutante sai
      # de `CREATE DATABASE ... TEMPLATE`. A mutacao vai para uma sombra em
      # /tmp; a arvore nunca e tocada.
      # Medido num Postgres 17 local (2026-10-08): 14 mutantes, 14 mortos.
      - name: O consumo de orcamento sabe falhar (14 mutantes)
        run: PGURL=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-consumo-de-orcamento-do-grupo.mjs

      # OS 12 PASSOS DE SUITE ABAIXO RODAM COM A TRAVA DA 048 DE PE, e isso nao
      # e acidente: sao eles que provam que a trava nao barra escrita legitima.
      # Sete deles inserem em `financial_transactions` direto (hmo190,
      # group_settlement, budget_invoice, aprovacao_de_parte, ajuste_de_fatura,
      # hmo245 e a 043), e nenhum foi tocado por esta migration. Se a 048
      # travasse mais do que devia, o vermelho apareceria AQUI e nao no teste
      # dela. MEDIDO num Postgres 17 local antes de escrever estes steps: as 12
      # passam com a trava aplicada.
      #
      # A 049 (HMO-347) entrou ACIMA, entre a 048 e estes 12 passos, entao eles
      # rodam com as DUAS de pe -- e o `budget_invoice_test.sql` deixou de ser
      # so testemunha da trava: nesta posicao ele e o SEGUNDO MUNDO do
      # condicional da 049 (ver o step "O contrato do 006 e do 007 sobrevive as
      # views reescritas", abaixo, e o cabecalho de
      # `pg_temp.conta_a_parte_de_grupo` no proprio arquivo de teste). Remedido
      # num Postgres 17 local com a 049 na cadeia: as 12 continuam verdes.
      #
      # O hmo197 roda na POSICAO dele, muito acima, onde o trigger do 001 ainda
      # existe e ele o desliga com DISABLE TRIGGER. A 044 apaga esse trigger,
      # entao aquele arquivo passou a envolver o DISABLE/ENABLE num `IF EXISTS`
      # -- do contrario rodar o teste a mao contra um banco com a cadeia INTEIRA
      # estouraria `trigger ... does not exist`, que se le como regressao e nao
      # e. Este passo e o que PROVA o outro mundo do condicional: o mesmo
      # arquivo, agora sem o trigger na frente. Sem ele, o `IF EXISTS` seria uma
      # defesa que ninguem exercita.
      - name: hmo197 continua verde depois da 044 (o condicional do DISABLE TRIGGER)
        run: $PSQL -f database/tests/hmo197_convite_sem_conta_test.sql

      # HMO-245, o fechamento do mes do grupo. A conta de grupo que ainda nao
      # aconteceu (a internet no cartao, vencendo dia 15) vive em
      # `scheduled_transactions` e nao em `group_transactions`, entao ela nao
      # entrava em total nenhum do mes -- e o rateio dela nao existia em lugar
      # algum, porque `group_expense_splits` so nasce na baixa.
      #
      # As tres assercoes que valem o job sao numericas e TODAS tem controle:
      #
      #   1. previsto (+159,90) e realizado (-159,90) SOMAM 319,80. Os dois
      #      lados do app guardam sinal oposto (`financial_transactions.amount`
      #      e negativo; `scheduled_transactions.amount` tem CHECK > 0), entao a
      #      soma crua da ZERO -- com as duas despesas na lista ao lado.
      #   2. a conta prevista com baixa NAO entra junto com a transacao que ela
      #      gerou. Sem isso a internet aparece duas vezes no mes em que foi
      #      paga: 319,80 de uma conta de 159,90.
      #   3. 2.000 entre tres SOMA 2.000. Arredondar cada parte por conta
      #      propria da 666,67 x 3 = 2.000,01, e todo grupo de tres passa a
      #      exibir "as contas nao fecham por R$ 0,01".
      #
      # Roda nos DOIS fusos (o npm script chama o node duas vezes, em
      # America/Sao_Paulo e em UTC): o controle do dia 1 do mes so e capaz de
      # falhar em fuso negativo, e este job roda em UTC -- sem a passada em Sao
      # Paulo aquela assercao nao mede nada aqui.
      #
      # A QUARTA assercao, da fase 4 (HMO-270): o rateio deixou de ser SEMPRE
      # igual. 70/30 de R$ 2.000 fecha em 1.400,00 / 600,00, somando 2.000,00
      # cravado, e membro em 0% fica com ZERO -- nao com o centavo de sobra,
      # que e o que um maior-resto escrito ao contrario lhe daria.
      #
      # Medido: 21 mutantes, 21 mortos (npm run mutantes:fechamento-do-grupo).
      # Um 22o sobreviveu com razao -- a guarda `data.length < 7` era codigo
      # morto diante da regex, e a conclusao foi apagar a guarda do modulo.
      - name: O fechamento do mes soma previsto com realizado e rateia exato
        run: npm run test:fechamento-do-grupo

      # O runner que prova que a suite ACIMA mede o que ela diz medir (HMO-330).
      #
      # Ele era um dos 43 que nenhum job executava (HMO-322). A afirmacao que
      # ele defende vale o step porque o erro aqui sai em reais na tela do
      # grupo, e os tres piores mutantes passam pela aritmetica inteira sem
      # quebrar nada: `sem_abs` faz previsto (+) e realizado (-) se CANCELAREM
      # e o mes fechar em ZERO com as duas despesas visiveis na lista;
      # `paga_entra` conta a internet de R$ 159,90 DUAS vezes no mes da baixa
      # (R$ 319,80); `rateio_por_linha` transforma 2.000 entre tres em
      # 666,67 x 3 = 2.000,01, e todo grupo de tres passa a exibir "as contas
      # nao fecham por R$ 0,01".
      #
      # O que a suite sozinha nao cobre: o mes do exemplo dela tem UMA conta,
      # e varias contas erradas devolvem 159,90 para uma linha so -- a assercao
      # fica verde por acaso. E o que o runner falsifica.
      #
      # Barato porque usa o motor de bloco da HMO-319: UMA compilacao para os
      # 21 mutantes, mutados na sombra, sem escrever na arvore.
      # Medido num Postgres 17 local (2026-10-07): 21 mutantes, 21 mortos, 38s.
      - name: O fechamento do grupo sabe falhar (21 mutantes)
        run: node scripts/mutantes-fechamento-do-grupo.mjs

      # HMO-298/303/305/306 -- A MEDICAO DAS QUATRO LEITURAS DO «TOTAL DE CONTAS».
      #
      # Ela constroi um Postgres PROPRIO (dropdb/createdb do banco `hmo298`),
      # aplica as migrations reais, carrega o fixture e IMPORTA as leituras de
      # lib/ -- `painelDePapel`, `linhasDaTela`/`resumoDaTela`, `ratearPorPeso`
      # e, desde a HMO-306, `parteConfiguradaDoMembro` para a conta do
      # /api/safe-to-spend. Nao reescreve conta nenhuma: uma tabela construida
      # sobre uma reimplementacao mediria a reimplementacao.
      #
      # O QUE ESTA MEDICAO NAO ALCANCA e a FIACAO das rotas -- ela importa de
      # lib/, entao uma rota que parasse de chamar a funcao a deixaria verde.
      # Quem cobra isso e `npm run check-fatura-escolhida`, no verificacao.yml,
      # com os nove mutantes do controle negativo dele.
      #
      # Na HMO-298 este script existia para provar que as tres DISCORDAVAM
      # (painel R$ 4.100 x tela R$ 2.600, R$ 1.500 de diferenca). Depois do
      # conserto da HMO-303 ele cobra o contrario, e cobra DUAS coisas por
      # linha, porque igualdade sozinha nao e controle -- um bug que zerasse as
      # tres leituras passaria verde:
      #
      #   1. as colunas do par concordam (tolerancia R$ 0,004); e
      #   2. batem com um valor ABSOLUTO digitado no script -- R$ 0,00 na
      #      transferencia, R$ 900,00 / R$ 300,00 nas duas contas de grupo,
      #      R$ 1.200,00 na parte do mes e R$ 2.800,00 nos dois totais.
      #
      # A quarta leitura tem uma TERCEIRA cobranca, com esperado PROPRIO
      # (`safeEsperado`), porque ela nao responde a mesma pergunta das outras
      # tres: ela filtra por `user_id` e nao chama `classeDaAgenda`. Cobrar
      # dela o mesmo `esperado` reprovaria o comportamento certo em duas das
      # quatro faces.
      #
      # E (c) = (d) + (d): 900 + 300 = 1.200. Essa identidade e o que torna a
      # medicao mais do que um teste de igualdade.
      #
      # A QUARTA LEITURA ENTROU NA HMO-306, E ELA ERA O CONTROLE NEGATIVO AQUI.
      # Enquanto /api/safe-to-spend nao chamava `parteConfiguradaDoMembro`, o
      # numero dela tinha de sair R$ 8.500,00 antes e depois do conserto da
      # HMO-303, e era essa imobilidade que provava que nada havia escapado do
      # escopo. A HMO-306 e a issue que o move: a MINHA conta de grupo deixou de
      # ser descontada cheia (R$ 1.000,00) e passou a entrar pela parte
      # configurada (R$ 300,00), entao o total caiu para R$ 7.800,00 -- os
      # R$ 700,00 da diferenca, e nada mais.
      #
      # E A HMO-308 E O SEGUNDO DEGRAU, deliberadamente separado do primeiro: a
      # rota lia a TABELA `scheduled_transactions` e deduzia a direcao do tipo
      # da REGRA, e previsao AVULSA nao tem regra -- R$ 6.200,00 de salario e
      # aluguel recebido entravam como contas a pagar. Consertar isso no PR da
      # HMO-306 faria DOIS numeros se moverem na mesma linha da medicao, e
      # nenhum dos dois ficaria conferivel. A cadeia inteira:
      #
      #   8.500 - 700 (HMO-306) - 6.200 (HMO-308) = 1.600
      #
      # O script cobra os DOIS degraus separados, para que desfazer a parte do
      # grupo e inflar a receita na mesma medida nao passe verde. E cobra a
      # METADE QUE A SUBTRACAO NAO PROVA: os R$ 6.200,00 que sairam de «A pagar»
      # tem de APARECER em «A receber». O defeito da HMO-308 era duplo (`tipo`
      # decide as duas somas), e sem essa cobranca um conserto que simplesmente
      # DESCARTASSE a linha de receita daria o mesmo R$ 1.600,00 e esconderia
      # R$ 6.200,00 que a pessoa vai receber.
      #
      # E cobra duas faces em que a quarta leitura DIVERGE do «Total de contas»
      # de proposito: ela desconta a transferencia de R$ 500,00 (a pergunta dela
      # e caixa, e e `direcaoDaAgenda` que a produz -- nao `classeDaAgenda`) e
      # NAO conta a conta de grupo do outro membro (R$ 0,00 -- a parte dele sai
      # da carteira dele).
      #
      # O ELO EXPLICITO DA FATURA -- HMO-305, o mecanismo (b).
      #
      # A mesma divida em dois lugares: a previsao digitada a mao na conta
      # corrente e a fatura aberta que o app sintetiza das compras do cartao. O
      # conserto aprovado nao adivinha -- ele rotula a suspeita e da a acao, e a
      # de-duplicacao acontece pela chave canonica que `chavesPersistidas` ja le.
      #
      # Esta suite mede a DETECCAO (cinco casos em que o rotulo NAO pode acender,
      # porque rotulo na linha errada vira um botao que esconde divida real) e as
      # FRASES que a pessoa le antes de mexer no numero. O efeito em dinheiro --
      # R$ 1.600,00 -> R$ 800,00 -> R$ 1.600,00 -- esta na medicao logo abaixo, e
      # a fiacao da tela no caso J da sonda de navegador do painel do modo, que
      # roda em verificacao.yml (o nome do script nao e citado aqui de proposito:
      # o check-tests-in-ci.mjs procura `npm run test:...` no texto do workflow,
      # inclusive em comentario, e passaria a cobrar o `paths:` deste arquivo).
      #
      # Nao abre job novo -- o custo de CI deste projeto e o NUMERO de jobs.
      - name: O elo da fatura nao acende rotulo sem citar o cartao, e grava a chave exata
        run: npm run test:elo-da-fatura

      # Nao abre job novo -- o custo de CI deste projeto e o NUMERO de jobs.
      - name: As quatro leituras do «Total de contas» concordam em R$ 2.800,00
        run: npm run test:medicao-hmo298

      # Controle negativo da medicao acima.
      #
      # "As tres leituras concordam" e uma afirmacao que fica verde tambem
      # quando o script deixa de medir: um erro no caminho da mutacao, uma
      # ancora que outra issue reescreveu, um `bate()` que compara um numero com
      # ele mesmo. Os dois mutantes abaixo sao os que viram dinheiro, e cada um
      # desfaz UM dos mecanismos da HMO-303.
      #
      # Aqui a medicao roda SEM reconstruir o banco (o `npm run` acima ja o
      # deixou pronto): recompila lib/ e chama o .mjs direto. Reconstruir o
      # Postgres duas vezes mais nao mediria nada a mais.
      - name: 'A medicao sabe falhar (o percentual e a transferencia)'
        run: |
          set -uo pipefail

          # A impressao digital ANTES do primeiro mutante. A conferencia no fim
          # e contra ELA, e nao contra o `git diff`: na maquina de quem roda
          # isto na mao o git enxergaria tambem o trabalho nao commitado e
          # reprovaria por um motivo que nao tem nada a ver com o controle.
          PARTE=lib/parte-do-grupo.ts
          PAINEL=lib/papel-de-pao.ts
          ANTES_PARTE=$(md5sum "$PARTE" | cut -d' ' -f1)
          ANTES_PAINEL=$(md5sum "$PAINEL" | cut -d' ' -f1)

          # O `cmp` existe porque um `sed` que nao casa SAI 0: sem ele, uma
          # ancora reescrita por outra issue faria este passo medir a arvore
          # INTACTA e ficar verde para sempre, com o rotulo mentindo.
          estragar() {
            local arquivo="$1" de="$2" para="$3" rotulo="$4"
            cp "$arquivo" "$arquivo.orig303"
            sed -i "s@$de@$para@" "$arquivo"
            if cmp -s "$arquivo" "$arquivo.orig303"; then
              mv "$arquivo.orig303" "$arquivo"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            rm -rf .tmp-medicao-hmo298
            if npx tsc -p scripts/tsconfig.medicao-hmo298-test.json > /dev/null 2>&1 \
               && node scripts/resolve-aliases.mjs .tmp-medicao-hmo298 lib --espelha-raiz > /dev/null 2>&1 \
               && node scripts/medicao-hmo298.mjs > /dev/null 2>&1; then
              mv "$arquivo.orig303" "$arquivo"
              echo "::error::Verde com a leitura estragada: $rotulo"
              exit 1
            fi
            mv "$arquivo.orig303" "$arquivo"
            echo "  vermelho em: $rotulo"
          }

          # 1) O PERCENTUAL VOLTA A SER DIVISAO IGUAL. E o defeito que a issue
          #    existe para tirar: um grupo 70/30 cobrando 50/50 nas telas. As
          #    tres leituras continuariam CONCORDANDO entre si (todas erradas
          #    pelo mesmo motivo) -- quem pega isso e o valor absoluto digitado,
          #    e esta linha e o que prova que ele esta sendo cobrado.
          estragar "$PARTE" \
                   'const partes = ratearPorPeso(toCents(cheio), participantes);' \
                   'const partes = ratearPorPeso(toCents(cheio), participantes.map((p) => ({ ...p, peso: 1 })));' \
                   'o percentual e ignorado -- o grupo 70/30 volta a dividir igual'

          # 2) A TRANSFERENCIA VOLTA PARA O «TOTAL DE CONTAS». Trocar a peneira
          #    de `classeDaAgenda` por `direcaoDaAgenda` e exatamente o estado
          #    anterior a esta issue: R$ 500,00 guardados na poupanca contados
          #    como conta a pagar, e o total saindo R$ 3.300 em vez de R$ 2.800.
          estragar "$PAINEL" \
                   'classeDaAgenda(linha.direction) === "expense"' \
                   'direcaoDaAgenda(linha.direction) === "expense"' \
                   'a transferencia volta para o «Total de contas» -- o total vai a R$ 3.300'

          # A arvore tem de voltar intacta: um `.orig303` esquecido viajaria no
          # commit, e arquivo mutado e indistinguivel do certo a olho nu.
          for f in "$PARTE" "$PAINEL"; do
            if [ -e "$f.orig303" ]; then
              echo "::error::sobrou um $f.orig303 -- a arvore nao foi restaurada"
              exit 1
            fi
          done
          if [ "$(md5sum "$PARTE" | cut -d' ' -f1)" != "$ANTES_PARTE" ] \
             || [ "$(md5sum "$PAINEL" | cut -d' ' -f1)" != "$ANTES_PAINEL" ]; then
            echo "::error::lib/ nao voltou ao conteudo que tinha antes do controle negativo"
            exit 1
          fi
          echo "  a arvore voltou intacta"

      # Controle negativo do rateio COM PESO (HMO-270).
      #
      # As assercoes da fase 4 sao sobre uma SOMA ("fecha em 2.000 cravado") e
      # sobre um ZERO ("membro em 0% nao tem parte"), e as duas passam verde
      # tambem quando deixam de medir o que deveriam: um modulo que ignorasse o
      # peso continuaria somando 2.000, e um membro que recebesse zero por nao
      # existir na lista tambem "nao tem parte". Os tres mutantes abaixo sao os
      # que viram dinheiro; o conjunto inteiro esta em
      # `scripts/mutantes-fechamento-do-grupo.mjs`.
      #
      # Nao abre job novo -- o custo de CI deste projeto e o NUMERO de jobs
      # (cada um arredonda para cima), nao o minuto a mais num job que ja existe.
      - name: 'A verificacao sabe falhar (o rateio por peso)'
        run: |
          set -uo pipefail
          RATEIO=lib/fechamento-do-grupo.ts

          # A impressao digital do arquivo ANTES do primeiro mutante. A
          # conferencia no fim e contra ELA, e nao contra o git: o `git diff`
          # aqui enxergaria tambem o trabalho nao commitado de quem roda este
          # script na propria maquina, e passaria a reprovar por um motivo que
          # nao tem nada a ver com o controle negativo.
          ANTES=$(md5sum "$RATEIO" | cut -d' ' -f1)

          # O `cmp` existe porque um `sed` que nao casa SAI 0: sem ele, uma
          # ancora reescrita por outra issue faria este passo medir a arvore
          # INTACTA e ficar verde para sempre, com o rotulo mentindo sobre o que
          # foi provado.
          estragar() {
            local de="$1" para="$2" rotulo="$3"
            cp "$RATEIO" "$RATEIO.orig270"
            sed -i "s@$de@$para@" "$RATEIO"
            if cmp -s "$RATEIO" "$RATEIO.orig270"; then
              mv "$RATEIO.orig270" "$RATEIO"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            if npm run test:fechamento-do-grupo > /dev/null 2>&1; then
              mv "$RATEIO.orig270" "$RATEIO"
              echo "::error::Verde com o rateio estragado: $rotulo"
              exit 1
            fi
            mv "$RATEIO.orig270" "$RATEIO"
            echo "  vermelho em: $rotulo"
          }

          # 1) O PESO E IGNORADO. O defeito que a fase 4 existe para nao ter: o
          #    grupo configurado em 70/30 fecha 1.000/1.000 de um mes de
          #    R$ 2.000. O total fecha, a tela de configuracao mostra 70/30 ao
          #    lado, e nada denuncia o numero errado.
          estragar 'const efetivos = somaPesos > 0 ? limpos : limpos\.map(() => 1);' \
                   'const efetivos = limpos.map(() => 1);' \
                   'o peso e ignorado -- 70/30 volta a fechar 1.000/1.000'

          # 2) MAIOR RESTO -> ARREDONDAMENTO. O controle que a issue nomeia.
          #    2.000 entre tres da 666,67 x 3 = 2.000,01, e todo grupo de tres
          #    passa a exibir "as contas nao fecham por R$ 0,01".
          estragar 'const base = efetivos\.map((p) => Math\.floor((absoluto \* p) / soma));' \
                   'const base = efetivos.map((p) => Math.round((absoluto * p) / soma));' \
                   'o maior resto vira arredondamento -- o mes fecha em 2.000,01'

          # 3) O CENTAVO VAI PARA O MENOR RESTO. Num grupo 70/30/0% ele cai
          #    justamente no membro que configurou NAO dividir a conta, e o
          #    fechamento cobra R$ 0,01 de quem esta em zero.
          estragar '.sort((a, b) => (b\.resto !== a\.resto ? b\.resto - a\.resto : a\.i - b\.i));' \
                   '.sort((a, b) => (b.resto !== a.resto ? a.resto - b.resto : a.i - b.i));' \
                   'o centavo de sobra vai para o menor resto -- cai no membro em 0%'

          # A arvore tem de voltar intacta: um `.orig270` esquecido viajaria no
          # commit, e o arquivo mutado e indistinguivel do certo a olho nu.
          if [ -e "$RATEIO.orig270" ]; then
            echo "::error::sobrou um $RATEIO.orig270 -- a arvore nao foi restaurada"
            exit 1
          fi
          if [ "$(md5sum "$RATEIO" | cut -d' ' -f1)" != "$ANTES" ]; then
            echo "::error::$RATEIO nao voltou ao conteudo que tinha antes do controle negativo"
            exit 1
          fi
          echo "  a arvore voltou intacta"

      # A fase 10 (HMO-277): o lado da RECEITA, que ate aqui nao existia -- zero
      # ocorrencias de credito de grupo em qualquer cartao ou lista de receita.
      # No mes da internet do C6 o Helio tem R$ 106,60 a receber da Lais e da
      # Bia, e nada na tela dele dizia isso.
      #
      # O QUE AS ASSERCOES PROVAM, E POR QUE SAO SEPARADAS POR CARTAO
      # -------------------------------------------------------------
      # O risco desta fase e somar o credito em "Receitas". `fecharMes` soma
      # PREVISTO JUNTO COM REALIZADO por desenho, entao os R$ 106,60 do exemplo
      # sao credito sobre uma conta que NINGUEM PAGOU: publicar isso como
      # receita realizada e a familia de defeito do "a vencer", que este app ja
      # pagou uma vez.
      #
      # E um defeito que o SALDO NAO DENUNCIA -- inflar receita e despesa pelo
      # mesmo valor deixa `receitas - despesas` exato. Por isso cada bloco
      # afirma sobre "Receitas" e sobre o credito EM SEPARADO, com o numero que
      # a conta errada produziria escrito ao lado, mais o controle "mesmo mes
      # sem despesa de grupo".
      #
      # Nos DOIS fusos (America/Sao_Paulo e UTC, no proprio npm script): o
      # recorte do mes e por prefixo de string, e um `new Date()` que voltasse
      # ao modulo erraria o mes da conta do dia 1 so em fuso negativo -- este
      # job roda em UTC e nao veria.
      - name: O credito de grupo entra como A RECEBER, e nao em Receitas
        run: npm run test:credito-de-grupo

      # Controle negativo da fase 10.
      #
      # O total de R$ 106,60 do exemplo sai CERTO por caminhos errados: o mes
      # tem UMA conta e DOIS devedores com a mesma parte, entao somar o saldo em
      # vez das linhas, ou trocar o lado da transferencia, devolve 106,60 do
      # mesmo jeito. Os dois mutantes que mais importam sao `total_do_saldo` (o
      # numero grande deixa de bater com a soma dos nomes listados) e
      # `credito_por_valor` (`amount` e positivo nos DOIS sentidos, entao o mes
      # em que eu DEVO R$ 300 apareceria como R$ 300 a receber).
      #
      # Medido: 12 mutantes, 12 mortos. Dois outros foram RETIRADOS por
      # sobreviverem com razao -- os dois `Math.max` do residuo cobrem um ao
      # outro, e viraram um mutante unico; a nota esta no runner.
      #
      # O runner traz o controle POSITIVO e a conferencia de ancora dentro: um
      # trecho que outra issue reescreveu e reprovado como mutante invalido, em
      # vez de sair verde medindo a arvore intacta.
      #
      # Nao abre job novo -- o custo de CI deste projeto e o NUMERO de jobs
      # (cada um arredonda para cima), nao o minuto a mais num job que ja existe.
      - name: A verificacao sabe falhar (o credito a receber)
        run: npm run mutantes:credito-de-grupo

      # A outra metade da HMO-245: o CAMINHO entre a rota e o cartao. O calculo
      # acima pode estar perfeito e a tela mostrar zero, porque
      # `await res.json()` e `any` -- um campo renomeado em um dos dois lados
      # chega `undefined`, o componente o pinta como R$ 0,00 e nada reclama. Foi
      # exatamente isso na HMO-201 (`transaction_count` ausente do grao `mes`:
      # tile exibindo 0 sobre um mes com 180 USD de despesa).
      #
      # Aqui os campos em risco sao `total`, `devido` e `amount` -- os numeros
      # que a pessoa usa para fazer o Pix do acerto.
      - name: O cartao de fechamento e a rota dele falam dos mesmos campos
        run: npm run test:contrato-do-fechamento

      # O mesmo risco, do lado da RECEITA (HMO-277). Aqui ele tem uma volta a
      # mais: se o campo renomear, o bloco "A receber dos grupos" nao aparece --
      # e INVISIVEL se le como "ninguem te deve nada", que e uma frase errada
      # dita com confianca, nao um espaco em branco.
      #
      # Este teste tambem e o unico lugar que tranca a decisao da fase: o
      # credito e previsto e fica FORA de `calculateBalance`. Somar os R$ 106,60
      # em "Receitas" seria uma linha, publicaria dinheiro que ninguem pagou, e
      # o saldo continuaria fechando -- a familia do "a vencer". A funcao pura
      # nao pode pegar isso, porque nao e nela que o defeito acontece.
      - name: O credito a receber nao entra nos tres cartoes
        run: npm run test:contrato-do-credito

      # HMO-248, o recorte de mes da aba de Despesas do grupo. Uma despesa fixa
      # nao grava uma linha: grava uma regra e MATERIALIZA uma parcela por mes
      # do horizonte. O cartao "Previstas" somava todas elas, sem recorte de
      # data nenhum: um aluguel de R$ 1.800 com tres parcelas materializadas
      # aparecia tres vezes e a legenda dizia "Total: R$ 5.400" -- o aluguel de
      # tres meses num cartao que nao diz de qual mes fala.
      #
      # As assercoes que valem o job, todas com o numero do ANTES junto:
      #
      #   1. o aluguel de tres meses vira UMA conta de 1.800 no mes escolhido.
      #      O controle e o 5.400 que a tela mostrava.
      #   2. a conta que vence no DIA 1 pertence ao mes dela. O recorte antigo
      #      era `new Date(data).getMonth()`, e `new Date("2026-10-01")` e
      #      meia-noite UTC -- em America/Sao_Paulo isso e 30/09 e a despesa do
      #      dia 1 caia no mes ANTERIOR. O bug so aparece em fuso negativo, que
      #      e o do celular de quem usa o app e NAO o deste job: por isso o npm
      #      script fixa TZ=America/Sao_Paulo, e o controle do dia 1 so afirma
      #      quando o fuso e capaz de mostrar o defeito.
      #   3. o que o recorte deixou de fora e CONTADO. Recortar no mes escondia
      #      a parcela vencida de um mes passado -- a que pede acao -- e sumir
      #      sem rotulo e indistinguivel de "nao foi gravada".
      #
      # Medido: 14 mutantes, 14 mortos (npm run mutantes:periodo-do-grupo). O
      # mutante `mes_invalido_devolve_tudo` sobreviveu na primeira rodada: a
      # guarda parecia redundante com o filtro, e so NAO e por causa da linha
      # sem data (`mesDaData(null) === ""` casa com um mes invalido, que tambem
      # e ""). A conclusao foi escrever o caso, nao apagar a guarda.
      - name: As previstas do grupo sao do mes escolhido, e o dia 1 e desse mes
        run: npm run test:periodo-do-grupo

      # O runner que prova que a suite ACIMA mede o que ela diz medir (HMO-330).
      #
      # Tambem um dos 43 sem job (HMO-322). Vale o step pelo mesmo motivo do
      # fechamento: `sem_recorte_de_mes` faz o cartao somar o aluguel de
      # outubro, novembro e dezembro num total de R$ 5.400 onde o mes tem
      # R$ 1.800 -- o defeito que a HMO-248 existiu para consertar, de volta.
      # E `mes_por_new_date` devolve o recorte para o `Date`, o que joga a
      # conta do dia 1 no mes ANTERIOR em todo fuso negativo: a suite roda com
      # TZ=America/Sao_Paulo justamente porque em UTC o CI nao ve isso.
      #
      # Pelo mesmo motor de bloco: UMA compilacao, mutacao na sombra.
      # Medido num Postgres 17 local (2026-10-07): 14 mutantes, 14 mortos, 27s.
      - name: O periodo do grupo sabe falhar (14 mutantes)
        run: node scripts/mutantes-periodo-do-grupo.mjs

      # A metade de TELA da HMO-248. O recorte acima pode estar perfeito e a aba
      # continuar somando a lista inteira: `scheduled.reduce(...)` compila, e o
      # total errado de R$ 5.400 e plausivel o bastante para ninguem desconfiar.
      #
      # O que esta suite tranca e o par de fatos que separa a tela consertada da
      # tela com o defeito: a soma crua nao existe mais, e o seletor do cartao
      # de fechamento e o MESMO estado que recorta as duas listas -- sem isso o
      # pior resultado possivel e um fechamento de novembro em cima de uma lista
      # de outubro, cada metade certa em separado e a tela inteira mentindo.
      #
      # As assercoes negativas foram medidas contra a versao ANTERIOR do
      # arquivo (git HEAD): as 11 reprovam, ou seja nenhuma delas e vacua.
      - name: A aba de Despesas do grupo nao soma mais a lista inteira
        run: npm run test:contrato-do-periodo-do-grupo

      # E a metade de ARVORE. `lib/categorias.ts` passaria verde com o JSX
      # inteiro errado; o que esta suite pega e o seletor de subcategoria
      # desenhado antes de haver categoria, e o botao "Criar" sem
      # `type="button"` dentro do <form> do lancamento -- que SUBMETE a despesa
      # em vez de criar a categoria, sem erro nenhum.
      - name: Os dois seletores na arvore, e o botao Criar que nao submete o lancamento
        run: npm run test:seletor-de-categoria

      # HMO-190. As opcoes de divisao da despesa de grupo. O banco sempre soube
      # fazer divisao combinada -- a 007 tirou o achatamento para partes iguais
      # do `calculate_equal_split` --, e a camada do app a descartava em
      # silencio: toda despesa saia 50/50, com 200 e "sucesso" na tela.
      #
      # Entra NESTE job, e nao num de front, porque as duas coisas que o provam
      # so o Postgres mostra:
      #
      #   - a ORDEM de escrita, que a RLS obriga. A policy
      #     `group_expense_splits_delete` exige is_group_admin, e DELETE barrado
      #     por RLS nao da erro: apaga zero linhas. A sequencia antiga (deixa o
      #     trigger ratear igual, apaga, insere o combinado) ACRESCENTAVA as
      #     partes -- medido: despesa de R$ 200 cobrando R$ 400 do grupo, para
      #     qualquer membro que nao seja admin. A secao 6 mede o dobro E prova a
      #     ordem nova (`group_id` por ultimo), que nunca apaga nada;
      #   - o CHECK da coluna. `split-suggestions` fala `proportional` e
      #     `historical`, e `group_transactions.split_type` aceita so
      #     equal/percentage/custom: o UPDATE levava 23514, que a rota nao
      #     conferia, e a despesa ficava com o rateio igual do trigger.
      #
      # O CONTROLE POSITIVO (secao 4) e o que separa "a divisao combinada e
      # impossivel" de "a rota gravava na ordem errada": na ordem certa, o 70/30
      # sobrevive.
      - name: As opcoes de divisao do grupo gravam o que foi combinado
        run: $PSQL -f database/tests/hmo190_divisao_combinada_test.sql

      # As duas suites que guardam as views que a 026 REESCREVEU rodam la atras na
      # cadeia (steps do 006 e do 007), ou seja: contra a definicao ANTIGA de
      # `group_member_balances` e `budget_consumption`. Elas nunca viram a versao
      # nova -- e sao elas que travam o sinal do acerto, o ABS() da despesa
      # negativa, o `rejected/expired` fora da conta e a janela de mes do teto.
      #
      # Rodar de novo, aqui, e o que prova que a 026 preservou esse contrato em
      # vez de apenas nao ter quebrado nada que a 026 mesma testa. As duas sao
      # re-executaveis (conferido); custa segundos.
      #
      # E ESTA POSICAO PASSOU A SER O SEGUNDO MUNDO DE UM CONDICIONAL (HMO-347).
      # A 048 troca o criterio do teto PESSOAL de `budget_consumption`, de
      # proposito (decisao de produto de 08/10/2026): o mesmo mes consome 800,00
      # pelo 006/026 e 1.800,00 pela 048, e nenhum numero unico e verdade nas
      # duas posicoes em que este arquivo roda.
      #
      # `budget_invoice_test.sql` entao pergunta ao CATALOGO qual criterio esta
      # no banco (`pg_get_viewdef` da view le `group_share_entries`?) e assere
      # numero cravado em cada ramo -- ver o cabecalho de
      # `pg_temp.conta_a_parte_de_grupo` no proprio arquivo. O step do 006 roda
      # o ramo antigo; ESTE roda o novo. Tirar um dos dois deixaria metade do
      # condicional sem ninguem exercitando, que e o mesmo desenho do
      # `hmo197_convite_sem_conta_test.sql` e do step dele logo depois da 044.
      - name: O contrato do 006 e do 007 sobrevive as views reescritas
        run: |
          $PSQL -f database/tests/group_settlement_test.sql
          $PSQL -f database/tests/budget_invoice_test.sql

      # O que a rota de aprovar/recusar parte de grupo (HMO-178) ASSUME do banco.
      # Roda AQUI, depois da 027, e nao junto da 002 que escreveu a policy: as
      # tres coisas que ela precisa que sejam verdade ao mesmo tempo vem de
      # migrations diferentes -- a policy de UPDATE e do 002, o
      # `NOT IN ('rejected','expired')` de `total_owed` foi reescrito pela 026, e
      # a trava PDG01 e da 024. Provar cada uma na posicao dela provaria tres
      # definicoes que ninguem usa juntas.
      #
      # O buraco que ela fecha: ate a HMO-178 nenhum caminho do app escrevia
      # `approved` nem `rejected` em `group_expense_splits`. O cracha na tela do
      # grupo era um rotulo morto, e a trava da 024 protegia um estado que so o
      # PostgREST na mao alcancava.
      #
      # A assercao que vale dinheiro e a secao 2 -- um membro NAO mexe na parte
      # do outro. A RLS nao levanta erro ali: ela some com a linha e o UPDATE
      # "funciona" escrevendo zero, entao a rota confere o numero de linhas antes
      # de responder 200. Mutante conferido: trocar a policy por `USING (true)`
      # reprova exatamente essa secao.
      #
      # A secao 5 e um controle honesto, nao um bug: pela RLS o ADMIN tambem
      # alcanca a parte alheia. A rota se restringe ao dono no TypeScript, e
      # deixar isso escrito evita que o proximo leitor conclua do silencio que o
      # banco ja barra.
      - name: Aprovar e recusar a propria parte, e o saldo que isso move
        run: $PSQL -f database/tests/aprovacao_de_parte_test.sql

      # O livro-razao das execucoes de cron. O que so o Postgres pega:
      #
      #   - o CHECK de `job` tem que bater com os quatro `crons[].path` do
      #     vercel.json. Um job renomeado no vercel.json e esquecido aqui grava
      #     sob nome que a consulta de auditoria nunca procura -- e a ausencia
      #     seria lida como "nao rodou";
      #   - `finished_at >= started_at` recusa a linha que o relogio para tras
      #     produziria, e como a gravacao nao derruba a rota de proposito, essa
      #     recusa sumiria em silencio;
      #   - NAO pode haver indice unico: duas execucoes do mesmo job no mesmo
      #     dia sao evento real no plano Hobby (+-59min de folga), e um unique
      #     apagaria justamente a evidencia da execucao dupla.
      - name: Livro-razao de cron aceita a execucao ociosa e recusa o resto
        run: $PSQL -f database/tests/cron_runs_test.sql

      # O alvo mensal da meta e a quinta parcela do "quanto posso gastar". O que
      # so o Postgres pega aqui:
      #
      #   - `goal_progress` foi recriada copiando o corpo inteiro do 008 para
      #     acrescentar uma coluna. CREATE OR REPLACE VIEW impede remover e
      #     reordenar coluna, mas NAO impede trocar a EXPRESSAO de uma delas --
      #     uma copia errada de `saved` ou de `monthly_required` passa pelo tsc,
      #     pelo lint e pelos 49 testes de TypeScript, porque nenhum deles le a
      #     view;
      #   - se a coluna nova nao chegar na view, a rota le `undefined`, o alvo
      #     explicito vira NULL e a derivacao pelo prazo assume o lugar dele --
      #     o desconto sai com outro valor e sem erro em lugar nenhum.
      - name: O alvo mensal chega na view e o CHECK recusa zero e negativo
        run: $PSQL -f database/tests/goal_monthly_contribution_test.sql

      # Duas metades que falham por motivos diferentes: a estrutural varre o
      # schema INTEIRO atras de view sem security_invoker (uma view criada
      # amanha reprova sem ninguem lembrar de atualizar o teste -- que e o
      # esquecimento que deixou esta passar), e a de comportamento cria dois
      # usuarios privados e conta as linhas que um enxerga pela view.
      #
      # A segunda metade nao e redundante: a primeira confere uma OPCAO, e o
      # que importa e a LINHA que volta. Sem o 013 ela sozinha ja reprova,
      # devolvendo 2 linhas onde deveria devolver 1.
      - name: Nenhuma view escapa da RLS
        run: $PSQL -f database/tests/view_security_invoker_test.sql

      # O AJUSTE DE SALDO DA FATURA (HMO-253). A feature NAO tem migration -- o
      # ajuste e um lancamento comum e a categoria reservada e criada pela rota
      # com o `user_id` da 036 -- e e exatamente por isso que ela precisa de
      # teste aqui: tudo o que a sustenta e comportamento de coisas que ja estao
      # no banco, e nada disso esta escrito no codigo da feature.
      #
      #   - `card_invoice_month()` mapeando o DIA 1 para a fatura do proprio mes,
      #     para closing_day NULL, 1, 15, 28 e 31. A feature escolhe o dia 1
      #     apoiada nesse mapeamento e nao o reimplementa (fonte unica da regra);
      #     se ele mudar, o ajuste de outubro passa a somar em novembro, com as
      #     duas faturas plausiveis e nada vermelho em TypeScript;
      #   - `(-t.amount) AS invoice_amount`, que e a unica coisa que faz um
      #     `amount` negativo AUMENTAR a fatura. `ABS` ali faria o abatimento
      #     aumentar o que se deve;
      #   - as policies da 036, sem as quais o INSERT da categoria reservada
      #     volta 42501 e NENHUM ajuste e gravado. Foi isso que aconteceu com a
      #     transferencia (HMO-162): 500 em producao por semanas, CI verde,
      #     porque os testes de la eram sobre funcao pura;
      #   - `update_account_balance` no UPDATE: a rota TROCA o ajuste, e sem o
      #     estorno de OLD.amount cada alteracao cobraria o valor de novo no
      #     saldo do cartao -- a fatura certa e o patrimonio errado.
      #
      # Tem controle positivo embutido: a compra DEPOIS do fechamento cai no mes
      # seguinte. Sem ele, a afirmacao sobre o dia 1 passaria verde com
      # `card_invoice_month` reduzida a `date_trunc('month', $1)` -- uma funcao
      # que ignora o fechamento acerta todo dia 1 e erra todo o resto.
      - name: O ajuste de saldo cai na fatura certa e com o sinal certo
        run: $PSQL -f database/tests/ajuste_de_fatura_test.sql

      # O acerto de grupo passou a gravar lancamento (HMO-245, fase 11). Esta
      # suite faz O QUE A ROTA FAZ, na sessao `authenticated` de cada pessoa, e
      # mede `current_balance` antes e depois -- componente renderizado nao
      # serve: o botao antigo continuaria "funcionando" sem conta nenhuma e
      # passaria verde sem lancar nada.
      #
      # Precisa rodar depois da 033: duas assercoes leem
      # `personal_monthly_cash_flow`, e e nela que esta a medicao que decidiu o
      # TIPO da perna.
      #
      # As quatro coisas que so aparecem com banco de verdade:
      #
      #   - o SINAL move `current_balance` nos dois sentidos. `transfer` nao
      #     entra em Receitas nem Despesas, mas CONTA no saldo -- o trigger soma
      #     NEW.amount sem olhar o tipo;
      #   - `group_id` NULO na perna. Com ele preenchido,
      #     `auto_create_group_transaction` rateia o proprio Pix: as 2 partes do
      #     hotel (R$ 400) viram 4 somando R$ 600, e pagar a divida cria divida
      #     nova para todo mundo. Nada em TypeScript ve isso;
      #   - a RLS de `financial_transactions` recusa a perna da CONTRAPARTE
      #     (42501). E o que limita esta fase a uma perna, e esta afirmado como
      #     teste para que a F12 nao "conserte" relaxando a policy;
      #   - o painel pessoal de quem recebe continua mostrando A PARTE DELA. Tem
      #     controle embutido: trocando SO o tipo para `income`, a assercao
      #     mostra o mes dela fechando melhor do que foi.
      - name: O acerto de grupo vira lancamento, com sinal e conta certos
        run: $PSQL -f database/tests/hmo245_acerto_vira_lancamento_test.sql

      # HMO-269 (F3 da HMO-245): a rota /split-config faz a PRIMEIRA escrita que
      # este app tem em `group_members.percentage` -- a coluna que a fase 4 passa
      # a usar como peso do rateio do mes. A fase nao tem migration, entao este
      # step nao prova uma migration: ele prova as quatro premissas que a rota
      # tem sobre o banco e que nao aparecem em TypeScript nenhum.
      #
      # Em particular a ATOMICIDADE do lote. A rota manda um `upsert` unico em
      # vez de um UPDATE por membro justamente porque uma falha no meio deixaria
      # a configuracao somando 70% -- e nao ha CHECK que pegue isso depois
      # (`group_members_percentage_check` confere LINHA, nao conjunto). Sem este
      # teste, trocar o upsert por um laco passa em type-check, em lint e em
      # qualquer sonda que so olhe o status 200.
      #
      # Controle negativo medido: removido o `SET LOCAL ROLE authenticated` do
      # caso 2, o arquivo sai 3 com "membro comum conseguiu reescrever a linha do
      # admin". Sem o SET ROLE tudo rodaria como superusuario, que ignora RLS, e
      # os casos de recusa passariam sem recusar nada.
      - name: A configuracao de divisao so o admin grava, e o lote e atomico
        run: $PSQL -f database/tests/hmo269_split_config_test.sql

      # O MESMO TESTE DA 043, DE NOVO, NO FIM DA CADEIA (HMO-256).
      #
      # NAO E REDUNDANTE, e o step de cima nao substitui este. O de cima roda na
      # posicao da 043 e prova que ELA consertou a view. Este roda depois de
      # TODAS as migrations, e existe por um motivo concreto e ja observado:
      # `planned_vs_actual` nao se corrige em pedaco. `CREATE OR REPLACE VIEW`
      # exige a definicao INTEIRA, entao qualquer migration futura que mexa em
      # qualquer parte desta view precisa recolar o FILTER do previsto junto --
      # e recolar a versao ANTIGA reverte a HMO-256 sem conflito de git, sem
      # erro e sem sintoma, porque os dois numeros continuam plausiveis.
      #
      # ISSO NAO E HIPOTETICO. Enquanto esta issue estava aberta, a branch da
      # HMO-258 (`043_realizado_de_grupo_no_previsto_x_realizado.sql`, ainda nao
      # mergeada) ja carregava um `CREATE OR REPLACE VIEW public.planned_vs_actual`
      # com a definicao completa e com o
      # `COALESCE(r.transaction_type, 'expense')` velho nos dois FILTER. Mergeada
      # depois desta, ela reporia o defeito inteiro. Quem rebasear aquela branch
      # tem de trocar os dois FILTER por `s.direction` e o `FROM` por
      # `public.scheduled_transactions_effective` -- e e ESTE step que avisa,
      # em vez de a regressao chegar em producao de novo.
      #
      # O arquivo e re-executavel por construcao: ele e um BEGIN/ROLLBACK e nao
      # deixa nada atras. Medido rodando duas vezes no mesmo banco.
      - name: A receita prevista AVULSA continua fora de planned_expense no fim da cadeia
        run: $PSQL -f database/tests/043_direcao_do_previsto_avulso_test.sql

      - name: Aritmetica de recorrencia
        run: npm run test:recurrence

      # Estes dois existiam desde a HMO-145 e NAO rodavam em lugar nenhum: o
      # script estava no package.json e nenhum workflow o chamava. Uma suite que
      # ninguem executa e pior que suite nenhuma -- ela da a sensacao de
      # cobertura enquanto a regressao passa verde.
      #
      # O detector e 100% TypeScript e o SQL nao alcanca nada dele: normalizar
      # "NETFLIX.COM*123" e "NETFLIX COM" para a mesma chave, e recusar 3
      # compras de supermercado com 10, 40 e 70 dias de intervalo como se
      # fossem assinatura mensal.
      - name: Normalizacao e deteccao de assinaturas
        run: npm run test:recurrence-detector

      # A varredura e a fronteira com o banco, compartilhada pelos tres
      # gatilhos (botao, importacao de extrato, cron diario). O que se prova
      # aqui erra em silencio: `status` no payload do upsert faz a assinatura
      # que o usuario mandou ignorar voltar para a tela na manha seguinte, e
      # perder o filtro `amount < 0` poe o salario como a primeira "assinatura"
      # da lista.
      - name: Fronteira da varredura de assinaturas
        run: npm run test:recurrence-scan

      # O disparo dos alertas, que a HMO-148 acrescentou. O SQL logo acima prova
      # que o banco nao deixa o aviso repetir; o que so o TypeScript alcanca e a
      # TRADUCAO do alerta para a linha de notificacao, e os tres erros dela sao
      # silenciosos:
      #
      #   - `reference_date` do aviso de cancelamento tirado de last_charge_date
      #     manda a MESMA frase (mesmo valor, mesma data) todo mes -- o spam que
      #     a issue existe para impedir, chegando pelo caminho que ela abriu;
      #   - assinatura marcada como IGNORED gerando push desfaz a decisao do
      #     usuario pelo canal mais intrusivo que o app tem;
      #   - `kind` fora do dominio do CHECK do 016 derruba o upsert INTEIRO, e
      #     como o cron grava tudo num lote, NINGUEM recebe aviso naquele dia.
      - name: Disparo dos alertas de assinatura
        run: npm run test:recurrence-alerts

      # A categorizacao automatica erra de tres jeitos que nao levantam excecao
      # nenhuma: a categoria de despesa pegando um estorno (e o relatorio passa
      # a contar dinheiro que VOLTOU como gasto), o desempate sumindo (e
      # "uber eats" vira Transporte de forma nao reproduzivel), e uma chave do
      # catalogo que a propria normalizacao reescreve (e a chave fica morta, o
      # app so deixa de sugerir). Os tres passam verde sem este teste.
      - name: Regras de categorizacao e o sinal do valor
        run: npm run test:categorization

      # O acerto e metade SQL, metade aritmetica: a view diz QUANTO cada um
      # deve, o TypeScript decide QUEM paga quem. Em ponto flutuante o guloso
      # fecha deixando residuo de fracao de centavo, que vira transferencia de
      # R$ 0,00 na tela. lib/settlement.ts trabalha em centavos inteiros e isto
      # prova que a conta fecha.
      # As calculadoras nao tocam no banco -- sao quatro funcoes puras rodando
      # no navegador. Estao aqui porque e onde vive todo `test:*`, e porque o
      # check-tests-in-ci exige que a suite rode em algum workflow cujo
      # `paths:` cubra lib/calculadoras.ts.
      #
      # Nada aqui levanta excecao quando erra: devolve um numero plausivel, com
      # duas casas, que o usuario leva para uma conversa com o RH. Os quatro
      # erros de maior valor em dinheiro, todos travados por teste proprio:
      #   - INSS com aliquota cheia em vez de progressiva (R$ 198,49/mes);
      #   - INSS sem o teto (R$ 1.613/mes num salario de R$ 20.000);
      #   - IRRF sem o redutor da Lei 15.270/2025, que cobra R$ 312,89 de quem
      #     e isento desde 01/01/2026 -- e a tabela progressiva sozinha esta
      #     certa, entao o numero errado parece conferido;
      #   - taxa anual convertida por divisao por 12, que transforma 12% a.a.
      #     em 12,68% e infla 30 anos de aporte em mais de 20%.
      - name: Tabelas de INSS/IRRF e aritmetica das calculadoras
        run: npm run test:calculadoras

      - name: Acerto de contas simplificado
        run: npm run test:settlement

      # A outra ponta do mesmo dinheiro (HMO-175): a view group_member_balances
      # responde na convencao do CREDOR (positivo = a receber) e a tela de
      # Financas Pessoais pergunta na do DEVEDOR ("quanto eu tenho que pagar").
      # Trocar o sinal na traducao exibe "voce tem R$ 345 a receber" para quem
      # deve R$ 345 -- numero, simbolo e formatacao todos certos. E a tolerancia
      # de um centavo tem que ser a MESMA do test:settlement acima: se as duas
      # discordarem, a tela cobra uma divida de R$ 0,01 que o acerto do grupo se
      # recusa a gerar, e nao ha pagamento capaz de zera-la.
      - name: Acerto dos grupos nas despesas pessoais
        run: npm run test:grupos

      # HMO-201. A chave Pix que o colega copia tem que ser aceita pelo banco
      # DELE, e o formato em que a pessoa digita quase nunca e o formato
      # canonico do arranjo: CPF/CNPJ so digitos, telefone em E.164, email em
      # minusculas, EVP como UUID.
      #
      # A assercao que vale o job: a chave FORMATADA (`529.982.247-25`) nunca
      # pode ser a chave COPIADA (`52998224725`). Trocar uma pela outra e o
      # defeito natural desta tela, ele compila, a tela fica bonita, o botao
      # copia -- e o unico lugar onde o erro aparece e o aplicativo bancario de
      # outra pessoa.
      #
      # Cobre tambem o digito verificador de CPF/CNPJ (um numero trocado pode
      # ser o CPF valido de um estranho) e `11111111111`, que FECHA o modulo 11
      # e so e recusado pela guarda explicita de digitos repetidos.
      - name: A chave Pix copiada e a que o banco aceita
        run: npm run test:chave-pix

      # HMO-201. Puxar para atualizar. O gesto tem dois jeitos de estar errado,
      # e eles puxam para lados opostos: recarregar quando a pessoa so queria
      # rolar (ela perde o lugar, e isso aconteceria o tempo todo) e nao
      # recarregar quando ela puxou de verdade (a feature nao existe).
      #
      # A assercao que vale o job e a do gesto que COMECOU com a pagina rolada:
      # rolar uma lista longa para cima com um movimento amplo leva a pagina ao
      # topo no meio do caminho, com o dedo ainda subindo. Avaliado pelo
      # scrollTop de AGORA em vez do scrollTop do INICIO, isso recarrega a
      # pagina sozinho -- num aparelho e dificil de reproduzir de proposito e
      # impossivel de nao encontrar usando o app.
      - name: Puxar para atualizar nao dispara em rolagem comum
        run: npm run test:puxar-para-atualizar

      # HMO-206. A suite acima prova a REGRA do gesto; esta prova a LEITURA,
      # que era onde o bug morava: `window.scrollY` so descreve a pagina, e a
      # pagina atras do menu mobile esta sempre em 0 -- entao rolar a lista do
      # menu era lido como puxao no topo e RECARREGAVA o app no meio da
      # navegacao.
      #
      # Roda Chromium de verdade (o do Playwright, ou o Chrome do runner)
      # porque a leitura depende de layout: `overflow-y` computado,
      # `scrollHeight` contra `clientHeight` e a subida pelos ancestrais. Em
      # teste puro nada disso existe, e foi por isso que a regressao passou.
      #
      # Sem navegador a suite FALHA, e nao pula: suite que se desliga sozinha
      # e indistinguivel de suite que passou.
      - name: Puxar para atualizar nao vale dentro do menu (em navegador)
        run: npm run test:puxar-no-menu-dom

      # HMO-271 (HMO-245 fase 5). A tela onde o Helio configura a divisao:
      # seletor de modo, um slider por membro, e a direita o % e o R$ de cada
      # um. A ARITMETICA dela ja e coberta pelas suites de divisao e de
      # fechamento; o que so esta prova e a FIACAO -- mexer no numero de um
      # membro muda o do outro, e o R$ ao lado acompanha.
      #
      # Precisa de navegador porque `react-dom/server`, que e como as outras
      # suites de componente deste repo rodam, NAO ve handler: `onChange` nao
      # sai no HTML e nunca e chamado pelo render. A tela renderizaria
      # identica com o handler vazio, e foi isso que deixou esta classe de
      # defeito sem rede ate aqui.
      #
      # Dois defeitos reais sairam desta sonda, nenhum deles de mutante:
      #
      #   - o campo era `input type="number"`, e nele texto com virgula e
      #     INVALIDO: o navegador devolve `value === ""`. Digitar "70,5" num
      #     teclado pt-BR punha o membro em 0,00% e o OUTRO em 100% -- a conta
      #     da casa inteira no nome de uma pessoa, por causa de uma tecla;
      #   - a previa em reais rateava pelos PERCENTUAIS tambem em modo `equal`,
      #     onde o fechamento usa peso 1. Num grupo de tres eram treze centavos
      #     de diferenca entre esta tela e o extrato, todo mes.
      #
      # Sem navegador a suite FALHA, e nao pula -- mesma razao da de cima.
      - name: A divisao do grupo rebalanceia na tela, com o R$ do fechamento
        run: npm run test:divisao-ui-dom

      # HMO-272 (HMO-245 fase 6). O botao que leva os sliders da divisao para a
      # proporcao da receita de cada membro no mes -- recebida E prevista, a
      # mesma regua da despesa --, e a decisao de privacidade que vem com ele:
      # "percentual para todos; o R$ da renda so para o proprio dono".
      #
      # O QUE ESTA SUITE PROVA E QUE AS OUTRAS NAO PODEM
      # ------------------------------------------------
      # Ela CHAMA os route handlers, com um duble de client que filtra de
      # verdade (scripts/duble-de-supabase.mjs). E a unica forma de medir um
      # recorte de RESPOSTA: a rota antiga /api/expense-groups/proportions ja
      # "escondia" o salario -- no JSX --, e mandava `total_income` de todo
      # mundo no JSON para qualquer membro. Uma assercao de tela passa verde
      # com o salario na resposta, que e exatamente o defeito.
      #
      # Por isso os mutantes que sao o controle negativo da entrega
      # (`RECORTE DA PRIVACIDADE SOLTO`, `RECORTE POR member_id`) so morrem
      # aqui. Ver scripts/mutantes-semeadura.mjs.
      #
      # A HMO-273 (fase 7) REMOVEU a /api/expense-groups/proportions, e com ela
      # os casos e os mutantes que mediam o recorte daquela rota: rota que nao
      # existe nao vaza. O que ficou no lugar e o guard de aposentadoria do step
      # seguinte, que e mais forte -- ele cobre tambem um `fetch` ou um `.from`
      # reintroduzido em QUALQUER arquivo, e nao so naquele route.ts.
      #
      # Roda nos DOIS fusos: o recorte do mes e por prefixo de string, e um
      # `new Date("2026-10-01")` em qualquer ponto da cadeia poria o salario do
      # dia 1 no mes anterior -- so em maquina com fuso negativo. A sandbox e
      # America/Sao_Paulo e este runner e UTC.
      - name: A semeadura da divisao pela renda, e o R$ que so o dono ve
        run: npm run test:semeadura

      # HMO-273 (HMO-245 fase 7). A sugestao "Divisao Proporcional" de
      # `GET /split-suggestions` era CODIGO MORTO que parecia feature: ela so
      # montava com `default_split_type === 'proportional'` E algum membro com
      # `percentage > 0`, e as duas condicoes nunca se encontravam -- ninguem
      # escrevia a coluna, e o PUT /split-config grava `percentage`, nunca
      # `proportional`.
      #
      # A suite CHAMA o route handler (dubles da HMO-272), e e por isso que ela
      # mede a promessa da fase: "com 70/30 gravado, a sugestao de uma despesa
      # nova vem 70/30, e o total fecha ao centavo". Um teste so da funcao
      # provaria que a FUNCAO divide 70/30 -- nao que a rota le a coluna certa,
      # nem que a sugestao chega no corpo da resposta. Cada um desses defeitos
      # sai da rota como um 200 com o numero errado.
      #
      # Ela carrega tambem o guard da ENTREGA 2: zero leitor, zero escritor e
      # zero `fetch` do caminho `group_member_proportions` em `app/`, `lib/`,
      # `components/` e `utils/`. Dois armazens de porcentagem vivos e como se
      # chega a duas telas discordando sobre dinheiro, com cada uma fechando
      # sozinha. 15 de 15 em scripts/mutantes-sugestao-de-divisao.mjs.
      - name: A sugestao de divisao viva, e o segundo armazem de % aposentado
        run: npm run test:sugestao-de-divisao

      # HMO-218. A subcategoria escolhida na tela tem de chegar as M linhas da
      # compra parcelada.
      #
      # A divida da HMO-216 foi escrita como "falta a coluna em
      # `transaction_installments`" e MUDOU DE LUGAR: a HMO-211 reescreveu a
      # rota, a RPC `create_installments` ficou sem nenhum chamador no app, e a
      # serie nova vira N linhas de `financial_transactions` -- tabela que ja tem
      # `subcategory_id` e a FK composta `(category_id, subcategory_id)` da 036.
      # Nao faltava migration nenhuma: faltava a rota copiar o campo.
      #
      # A SUITE CHAMA O HANDLER (dubles da HMO-272, estendidos aqui para guardar
      # as ESCRITAS). Ela nao mede a resposta, que e `{ success: true }` com o
      # campo e sem ele -- mede o PAYLOAD que foi gravar. E o `insert` do duble
      # emula o lote do PostgREST, que monta as colunas a partir da primeira
      # linha do array: uma chave ausente na parcela 1 e descartada de todas as
      # outras em silencio, e e um defeito que so aparece olhando o comando.
      #
      # 8 de 8 em scripts/mutantes-subcategoria-nas-parcelas.mjs (step proprio
      # no verificacao.yml, 10s).
      - name: A subcategoria nas M parcelas da serie
        run: npm run test:subcategoria-nas-parcelas

      # HMO-201. O painel do grupo precisa perguntar por um periodo de datas
      # qualquer, e `category_monthly_totals` so responde por MES. Quando o
      # periodo corta meses pela metade a soma passa a ser feita no
      # JavaScript -- e e ai que as regras que a view aplicava calado precisam
      # ser repetidas na mao:
      #
      #   - `transfer` fica fora da conta E da contagem. As duas pernas de uma
      #     transferencia se anulam, entao o SALDO continua certo mesmo se
      #     entrarem; o que estraga e "quanto entrou" e "quanto saiu", que
      #     inflam juntos, e a categoria de transferencia vira a maior fatia
      #     da pizza;
      #   - ABS() sobre a despesa, que neste banco e gravada NEGATIVA;
      #   - a moeda entra na CHAVE. Sem isso 1000 reais + 180 dolares viram
      #     1180 -- o defeito que a migration 022 foi a producao corrigir nas
      #     views, voltando por uma porta que a 022 nao cobre.
      #
      # Conferido contra a propria view num Postgres local: as mesmas 6
      # transacoes (duas delas as pernas de uma transferencia, uma em dolar)
      # produzem linha por linha o mesmo resultado nos dois caminhos.
      - name: Gasto por categoria num periodo qualquer bate com a view
        run: npm run test:categorias-do-periodo

      # HMO-201. O tile "Lancamentos" do painel do grupo mostrava ZERO em cima
      # de um mes com gasto -- medido em producao: grupo com 180 USD de despesa
      # e `months[0].transaction_count = 1`, tile exibindo 0.
      #
      # Os dois lados estavam certos sozinhos, e e por isso que nada reclamou.
      # O painel declara `transaction_count` e a rota SABIA a contagem (ela ja
      # alimentava `months_with_activity`); faltava a rota POR o campo no
      # `summary` do grao `mes`. Como `await res.json()` e `any`, atribuir a
      # resposta a interface do painel nao e checado pelo tsc: o campo chegava
      # `undefined` e o `?? 0` do tile o servia como um zero crivel.
      #
      # O grao `intervalo` devolvia o campo e o `mes` nao, entao o quebrado era
      # o caso COMUM: o periodo default do painel e o mes corrente, um mes
      # fechado. Quem abrisse o painel pela primeira vez lia 0.
      - name: O painel do grupo le campos que a rota devolve
        run: npm run test:painel-do-grupo

      # HMO-202, a metade em JavaScript. No modo MES a parte de grupo entra pelas
      # views da 033 e nada deste teste e exercitado; no modo INTERVALO ("de
      # 15/09 a 20/10") nenhum rollup mensal responde e a soma e feita aqui.
      #
      # O defeito que ele prende nao e um numero errado -- e um numero AUSENTE.
      # `agregarTransacoes` e `linhasDeCategoria` descartam em silencio tudo que
      # nao e 'income'/'expense' (o ramo de `transfer`, que fica fora da conta E
      # da contagem). Entao perder `transaction_type` na conversao faz a parte de
      # grupo valer zero de novo, SO no modo intervalo, com o modo mes
      # continuando certo: dois caminhos da mesma rota discordando, sem erro.
      #
      # O teste tambem fixa que as duas rotas pedem o MESMO select da view --
      # cash-flow nao usa `category_id` e categories usa, e a tentacao e cada uma
      # pedir o seu.
      - name: A parte de grupo atravessa os agregadores como despesa (modo intervalo)
        run: npm run test:parte-realizada

      # Orcamento de grupo (HMO-138). O budget_invoice_test logo acima ja prova
      # em SQL que budget_consumption soma o gasto do grupo TODO no teto de
      # grupo; este passo prova o outro lado, no TypeScript: que a tela nao
      # junta esse numero com o teto pessoal. Juntar produz um "ja gasto" que
      # nao e nem o meu -- inclui o gasto dos outros membros da viagem -- nem o
      # da viagem -- inclui o meu mercado de casa -- e que SOBE a cada membro
      # novo do grupo, sem erro e sem cor diferente na tela.
      #
      # Cobre tambem a chave do carry-forward: os dois indices unicos do 006
      # sao parciais e separados de proposito (um por grupo, um pessoal), e
      # repetir o mes com a categoria sozinha como chave deixa de criar um dos
      # dois tetos -- calado, e so no mes seguinte.
      #
      # 18 de 18 mutantes mortos em scripts/mutantes-orcamento-de-grupo.mjs.
      - name: Orcamento de grupo
        run: npm run test:orcamento-de-grupo

      # A MINHA parte da despesa de grupo (HMO-177). As policies do 005 liberam
      # `user_id = auth.uid() OR is_group_member(group_id)`, e a rota do resumo
      # nao filtra por user_id -- de proposito, porque a RLS filtra. O efeito
      # colateral e que um aluguel de R$ 3.000 do grupo Casa aparecia inteiro
      # como custo fixo para as DUAS pessoas: para quem cadastrou a regra e para
      # quem nunca cadastrou nada. Numero inflado que ainda alimenta
      # safe-to-spend e cash-flow, e cujo unico sintoma e parecer alto.
      #
      # O teste cobra os dois lados: dividir a linha de grupo E nao dividir a
      # pessoal. So o primeiro deixaria passar o mutante que divide tudo, que
      # erra para BAIXO e faz o app prometer dinheiro que nao sobra.
      #
      # 14 de 14 mutantes mortos em scripts/mutantes-parte-do-grupo.mjs (eram 12
      # antes da HMO-257, que acrescentou os dois da peneira do custo fixo: a
      # transferencia recorrente voltando a contar como despesa fixa, e o
      # allow-list no campo cru que apagaria a despesa sem transaction_type).
      - name: A minha parte da despesa fixa de grupo
        run: npm run test:parte-do-grupo

      # A aritmetica das opcoes de divisao (HMO-190), o par em TypeScript do
      # teste SQL mais acima. Ela mora no mesmo job porque divide o MESMO
      # dinheiro: as partes tem que fechar o total nos mesmos centavos inteiros
      # que `calculate_equal_split` (007) e `lib/settlement.ts` usam, senao o
      # acerto de contas do grupo nao chega a zero e a tela cobra um residuo
      # que pagamento nenhum zera.
      #
      # O que ela cobra e invisivel na tela: `proportional` e `historical`
      # traduzidos para `percentage` (a palavra crua e 23514), tipo
      # desconhecido virando ERRO em vez de divisao igual -- que era o defeito
      # --, e a divisao igual NAO sendo reescrita com os valores da tela, que
      # perdem centavo onde o maior resto do banco nao perde.
      #
      # 28 de 28 mutantes mortos em scripts/mutantes-divisao-do-grupo.mjs.
      - name: As opcoes de divisao da despesa de grupo
        run: npm run test:divisao-do-grupo

      # Quem pode aprovar ou recusar a propria parte de uma despesa de grupo
      # (HMO-178). Entra NESTE job, e nao num de front, porque o que ele
      # protege e dinheiro no SQL logo acima: `group_member_balances` soma em
      # `total_owed` as partes com `status NOT IN ('rejected','expired')`, e a
      # 024 levanta PDG01 quando alguma parte esta `approved`. Ate a HMO-178
      # nenhum caminho do app escrevia esses dois valores -- o cracha na tela
      # do grupo era um rotulo morto e a trava da 024 protegia um estado
      # inalcancavel.
      #
      # A regra tem DUAS metades (a parte e minha, e o status aceita a
      # transicao) e a suite exige as duas separadas: uma assercao que so cobre
      # o status passaria com uma funcao que ignora de quem e a parte -- e
      # recusar a parte de outra pessoa tira o valor do saldo DELA.
      #
      # 3 de 3 mutantes mortos: acoesDaParte sem a checagem de dono, ehParteDe
      # sem a guarda de id ausente (`undefined === undefined` e `true`), e
      # `approved` voltando a oferecer `approve`.
      - name: Aprovar e recusar a propria parte de despesa de grupo
        run: npm run test:aprovacao-de-parte

      # Os numeros dos relatorios sao provados em SQL logo acima. O que resta
      # para o TypeScript sao duas coisas que erram em silencio: a janela de
      # meses (um off-by-one mostra 11 barras onde o usuario pediu 12, e
      # ninguem conta as barras) e o escape do CSV (um ponto e virgula na
      # descricao quebra a linha em duas colunas e desloca TODA a planilha --
      # o usuario le valores na coluna errada sem nenhum sinal de erro).
      - name: Janela de meses e CSV dos relatorios
        run: npm run test:reports

      # A consolidacao do patrimonio nao levanta excecao quando erra: ela
      # desenha uma composicao errada. Neste banco o dinheiro e a divida moram
      # na MESMA coluna (`current_balance`), e e dai que saem os erros:
      #   - classificar pelo SINAL do saldo faz um cartao com estorno virar
      #     ativo e uma conta no cheque especial virar divida, e a carteira
      #     muda de forma sozinha quando um saldo cruza o zero;
      #   - dividir a participacao pelo patrimonio LIQUIDO em vez do total de
      #     ativos: quem tem R$ 10.000 aplicados e R$ 9.500 de fatura aparece
      #     com "investimentos = 2000% da carteira", e com patrimonio negativo
      #     a barra inteira sai invertida;
      #   - usuario novo tem as quatro contas padrao zeradas, e sem guarda de
      #     divisao por zero a tela imprime NaN% em quatro tiles.
      - name: Consolidacao do patrimonio liquido
        run: npm run test:net-worth

      # A outra metade do conserto do pagamento de fatura (a de SQL esta logo
      # depois do 015). Aqui ficam as decisoes que o banco nao alcanca:
      #   - detectar a fatura pela chave canonica em `notes` e nao pelo tipo da
      #     conta, senao toda assinatura de cartao vira transferencia e
      #     desaparece do fluxo de caixa;
      #   - recusar o proprio cartao como conta pagadora: as duas pernas
      #     cairiam na mesma conta, se anulariam, e a fatura ficaria paga sem
      #     dinheiro nenhum ter saido -- o mesmo bug com outra roupa;
      #   - o sinal das pernas, que invertido continua somando zero (o
      #     patrimonio "fecha") mas dobra a divida do cartao.
      - name: Fatura de cartao e transferencia, nao despesa
        run: npm run test:card-invoice

      # "Quanto ainda posso gastar" mistura tres fontes que o SQL nao reconcilia
      # sozinho, e as duas maneiras de errar sao simetricas:
      #   - descontar a fatura DUAS vezes (ela mora no saldo negativo do cartao
      #     E na conta prevista criada pelo fechamento), o que corta o numero
      #     quase pela metade sem nada parecer errado na tela;
      #   - nao descontar a divida do cartao, o que faz gastar no cartao nao
      #     mexer no numero -- e transforma o indicador em incentivo a usar o
      #     cartao.
      # Alem disso: investimento nao e dinheiro disponivel, conta vencida
      # continua sendo dinheiro que vai sair, e no dia 31 o divisor da verba
      # diaria e 1 e nao 0.
      - name: Quanto ainda posso gastar
        run: npm run test:safe-to-spend

      # A anomalia de gasto e o resumo do mes erram de formas que a tela nao
      # denuncia, e as quatro sao plausiveis:
      #   - SINAL: despesa e gravada NEGATIVA; um SUM cru troca o mes caro pelo
      #     mes barato e o alerta vai para a pessoa errada -- e um fixture de
      #     teste com valor positivo passa verde sem provar nada;
      #   - JANELA: comparar o dia 12 do mes corrente com meses CHEIOS acusa
      #     "queda de 90%" todo comeco de mes e esconde o estouro de verdade;
      #   - MEDIA vs MEDIANA: um unico mes de ferias na base levanta a media o
      #     bastante para engolir o estouro do mes seguinte;
      #   - USUARIO NOVO: sem historico nao pode haver alerta, divisao por zero
      #     nem "+Infinity%" na tela.
      # Os 27 testes foram submetidos a sete mutacoes (media no lugar da
      # mediana, sem o corte por dia, amount cru, cada uma das duas reguas
      # isolada, transfer contando como gasto, mes futuro no historico) e cada
      # uma ficou vermelha.
      - name: Anomalia de gasto e resumo do mes fechado
        run: npm run test:anomalies

      # A previsao de fluxo de caixa entrega uma DATA ("voce fica negativo em
      # 12/10"), e data errada e pior que numero errado: ninguem desconfia de
      # uma data. Tres erros cabem aqui sem quebrar nada:
      #   - DUPLICATA: quem cadastrou a Netflix como conta prevista E deixou o
      #     detector rodar tem a cobranca nas duas fontes; somar as duas
      #     antecipa (ou inventa) o dia negativo;
      #   - FATURA: aqui ela entra pelo evento datado e o saldo do cartao NAO e
      #     descontado -- regra OPOSTA a do "posso gastar", onde a pergunta nao
      #     tem data. Alinhar os dois arquivos reintroduz a contagem dupla;
      #   - DIA NEGATIVO: quem ja esta no vermelho nao pode receber uma data de
      #     mergulho, e a data tem que ser o PRIMEIRO cruzamento.
      # Os 42 testes foram submetidos a 17 mutacoes (tolerancia da duplicata,
      # a borda dela, o consumo por ocorrencia, o cartao no saldo inicial, o
      # vencido, o corte de horizonte, o empate do menor saldo, o status
      # IGNORED, entre outras) e cada uma ficou vermelha.
      - name: Previsao de fluxo de caixa
        run: npm run test:cash-flow

      # A PROJECAO DE SALDO (HMO-293a) -- o TERCEIRO leitor do mesmo predicado
      # `ehFatura`, e o unico que estava errado. Fechar uma fatura de R$ 300
      # derrubava o `projected_total` em R$ 300 sem nenhum fato novo: a conta
      # prevista da fatura entrava no `scheduled_out` enquanto a mesma divida
      # ja estava no `current_balance` do cartao. Medido em producao, nao lido
      # no codigo.
      #
      # Ela esta DUPLICADA aqui e no verificacao.yml de proposito, e nao e
      # redundancia barata:
      #   - o verificacao.yml nao tem `paths:`, entao ele e quem garante que a
      #     suite roda em TODO PR, inclusive um que so mexa na tela;
      #   - este job e o que roda quando `lib/projecao.ts` muda (o arquivo esta
      #     no `paths:` dos dois gatilhos, acima) -- e e aqui que ela fica ao
      #     lado do `test:safe-to-spend` e do `test:cash-flow`, os outros dois
      #     leitores do mesmo predicado. Quem "alinhar" os tres arquivos vai
      #     quebrar esta suite ou aquela, nunca passar calado.
      #
      # O que ela guarda e o CRITERIO: a chave canonica em `notes`, nunca
      # `account_type`. Assinatura cobrada no cartao nao e fatura e TEM de
      # continuar descontando -- trocar o criterio por tipo de conta apaga essa
      # distincao e continua compilando. Os 33 testes foram submetidos a 23
      # mutacoes (a exclusao inteira, o criterio por `account_type`, a exclusao
      # so quando a conta esta na lista, as opcoes B e D do cabecalho do lib, os
      # dois sinais do saldo projetado, os dois do total, a igualdade do
      # `goes_negative`, o corte do horizonte, o vencido, a direcao da regra, as
      # duas formas do embed) e cada uma ficou vermelha.
      - name: A fatura fechada fica fora do que a projecao desconta
        run: npm run test:projecao

      # A media de gasto do dia a dia e o que tira a previsao do otimismo, e ela
      # erra de dois jeitos opostos -- os dois silenciosos, os dois plausiveis:
      #   - CONTAR DUAS VEZES: a Netflix ja e evento datado na previsao; se ela
      #     tambem estiver dentro da media, a linha mergulha num dia que nao vai
      #     acontecer;
      #   - EXCLUIR DE MAIS, que e pior: uma chave tirada da media SEM virar
      #     evento some das duas metades, e a linha "provavel" fica mais
      #     otimista que a "otimista" -- o oposto exato do que ela promete. E
      #     como a assinatura marcada como IGNORED evaporaria.
      # Somam-se a isso o mes corrente (esta pela metade e puxa a mediana para
      # baixo), o mes sem extrato importado (zero nao e um mes barato) e o
      # sinal, que neste banco e NEGATIVO para despesa.
      # Os 18 testes foram submetidos a 12 mutacoes (a exclusao por chave, a
      # chave vazia, o mes corrente, media no lugar de mediana, o piso de tres
      # meses, o teto da janela, o filtro por transaction_type, a comparacao de
      # texto cru, entre outras) e cada uma ficou vermelha. Uma delas so ficou
      # depois de o proprio teste ser corrigido: com o ruido em um mes so, a
      # mediana o engolia e o teste passava verde sem provar nada.
      - name: Gasto variavel do dia a dia
        run: npm run test:variable-spend

      # O livro-razao das execucoes de cron (019). O que esta suite protege e
      # uma linha so: a execucao OCIOSA tem que ser registrada. Se ela parar de
      # gravar, um cron morto e um cron sem trabalho voltam a ser
      # indistinguiveis no banco -- que e como a HMO-152 escondeu tres crons em
      # 503 por semanas. 25 mutantes morreram quando a suite foi escrita; dois
      # deles so depois de o teste ganhar assercao nova (o http_status exato e o
      # createClient que estoura antes do fetch), e um terceiro foi trocado por
      # ser equivalente -- o `throw` caia dentro do proprio try e o catch
      # devolvia um objeto identico.
      #
      # O runner que produziu esses 25 (`scripts/mutantes-cron-ledger.mjs`) foi
      # APAGADO na triagem da HMO-331: ele nunca teve step, e o que ele guarda e
      # a tabela de observabilidade do cron -- nenhum dinheiro do usuario passa
      # por ela. O numero acima e historico, de uma medicao de 2026, e nao uma
      # promessa de que algo o reconfere hoje.
      - name: Livro-razao das execucoes de cron
        run: npm run test:cron-ledger

      # O retorno do link de email (HMO-157). Entra no db-verify, e nao num job
      # so de front, porque o que a suite protege e uma regra de RLS: o perfil
      # nasce no /auth/callback porque `profiles_insert_own` e `TO
      # authenticated`, e antes da troca do code nao existe sessao. Se o destino
      # do callback voltar a aceitar URL absoluta, o link que chega por email
      # passa a poder despachar o usuario para fora do dominio logo depois de
      # confirmar a conta -- quatro mutantes conferidos, todos vermelhos.
      - name: Retorno do link de confirmacao de email
        run: npm run test:auth-callback

      # O fim do cadastro depende de `mailer_autoconfirm`, um botao do DASHBOARD
      # do Supabase que este repositorio nao le nem versiona. Com ele desligado o
      # `signUp` ja devolve sessao e ninguem passa pelo /auth/callback -- se o
      # perfil nascesse so la, a conta terminaria sem perfil e, porque
      # `create_user_subscription_trigger` dispara AFTER INSERT ON profiles, sem
      # assinatura nenhuma. Nao ha erro em tela em nenhum dos dois casos, so uma
      # conta pela metade. A suite prende a decisao na sessao devolvida, e nao
      # numa suposicao sobre como o dashboard esta configurado hoje -- quatro
      # mutantes conferidos, todos vermelhos.
      - name: Fim do cadastro com e sem confirmacao de email
        run: npm run test:signup-outcome

      # A leitura do extrato e 100% TypeScript e o SQL nao alcanca nada dela.
      # Tres coisas erram em silencio aqui: parseFloat("1.234,56") = 1.234 (um
      # extrato de mil reais entra como um e vinte), new Date() numa data OFX
      # com fuso joga 1o de janeiro para 31 de dezembro, e a conciliacao sem a
      # regra de um-para-um faz dois saques iguais casarem com o mesmo
      # lancamento -- um deles some do app para sempre.
      - name: Leitura de extrato OFX/CSV e conciliacao
        run: npm run test:statement

      # Ficar sem sinal DESLOGAVA a pessoa: `getUser()` sempre vai na rede, a
      # falha virava `user = null` e o layout empurrava para /login -- uma tela
      # que, offline, nao tem como funcionar. A suite prende a distincao que o
      # codigo antigo nao fazia: a rede falhando e uma coisa, o servidor dizendo
      # "essa sessao nao vale" e outra. Inclui o caso do auth do Supabase em
      # 5xx, que nao pode deslogar a base inteira numa instabilidade de minutos.
      - name: Sessao sem rede (o offline nao desloga, a recusa desloga)
        run: npm run test:offline-session

      # A fila de lancamentos feitos sem rede, onde os dois erros possiveis sao
      # os dois caros: reenviar uma linha ja gravada cobra o almoco duas vezes,
      # e tratar o reenvio bem-sucedido como falha (ele volta SEM erro e com
      # ZERO linhas, por causa do ON CONFLICT DO NOTHING) prende a fila para
      # sempre. Cobre tambem o sinal -- despesa e gravada negativa aqui -- e o
      # catalogo local, sem o qual o formulario offline abre sem categoria
      # nenhuma e nao da para lancar nada. 16 de 18 mutantes mortos; os dois
      # sobreviventes sao no-op, explicados no cabecalho da suite de sessao.
      - name: Fila de lancamentos offline e catalogo local
        run: npm run test:offline-queue

      # Receita, despesa e transferencia entram na conta de formas diferentes.
      # O caso caro e a transferencia: ela e gravada em DUAS pernas (015), e
      # somar por sinal do valor conta a mesma fatura como receita E como
      # despesa. O saldo fica certo nesse bug -- as pernas se anulam -- entao
      # so uma asercao que olhe Receitas e Despesas SEPARADAMENTE o pega.
      # Os dois mutantes (classificar por sinal; contar as duas pernas) morrem.
      - name: Separacao contabil das tres movimentacoes
        run: npm run test:movimentacoes

      # HMO-181. A mesma suite ganhou a decisao de ESCRITA (que tipo e que
      # sinal gravar) e quatro casos que leem o codigo do POST de
      # /api/personal-finance/transactions. O defeito original foi achado em
      # producao com tudo verde: `-12.34` virava `+12.34` e a coluna
      # `transaction_type` nunca era gravada, o que tira a linha das tres views
      # da 008 sem tirar ela da lista de lancamentos. Nada disso da erro, entao
      # os 10 mutantes rodam no CI em vez de ficarem anotados aqui -- os dois
      # que a issue nomeia sao `sinal_recebido_invertido` e `insert_sem_tipo`.
      - name: Mutantes de tipo e sinal no lancamento
        run: npm run mutantes:tipo-e-sinal

      # A lista de lancamentos trazia 50 linhas com `.limit(50)`, sem recorte de
      # data e sem paginacao: o lancamento 51 nao existia para o usuario, e os
      # cartoes do topo somavam essas 50 debaixo do rotulo "Este mes". Nenhum
      # dos dois defeitos da erro, deixa a tela vazia ou quebra assercao
      # numerica -- sao numeros certos com o rotulo errado. Por isso a FRASE da
      # lista e codigo testado, e cada assercao do texto enganoso tem o controle
      # negativo do lado: sem ele, uma funcao que escrevesse "parcial" ou "ha
      # mais" em toda resposta passaria verde.
      - name: Periodo, paginacao e rotulo da lista de lancamentos
        run: npm run test:lista-lancamentos

      # A transferencia em si (HMO-164), que ate aqui era uma opcao dentro do
      # formulario de lancamento e gravava UMA linha: o dinheiro saia de uma
      # conta e nao entrava em nenhuma. Nao havia excecao nem 500 -- havia um
      # patrimonio menor pelo valor transferido, plausivel, com duas casas.
      # As quatro maneiras de errar que a suite prende: as duas pernas com o
      # mesmo sinal (o saldo erra pelo DOBRO); `Math.abs` ausente, que faz
      # "-500" andar ao contrario; origem igual ao destino, em que as pernas se
      # anulam na mesma conta e a tela diz "transferido" sem nada ter se movido;
      # e cartao de credito como origem, que criaria divida sem compra por tras.
      # Cobre tambem o pagamento de fatura, que passou a sair daqui: a traducao
      # cartao/pagadora -> destino/origem e invertivel sem o compilador notar, e
      # inverte-la ressuscitaria o HMO-149. 12 de 12 mutantes mortos.
      # A HMO-172 acrescentou 24 casos a esta suite: a regra mensal de
      # transferencia, os campos da tela, a validacao da repeticao e a guarda da
      # baixa. Os quatro que importam sao os de SALDO POR CONTA -- um par que se
      # anula deixa todo agregado certo, entao as duas assercoes de controle
      # provam que `net_worth_history` (soma tudo, da zero) e `monthly_cash_flow`
      # (filtra income/expense, nem ve as pernas) dao o MESMO numero com a
      # transferencia completa, com UMA perna so e com nenhuma. Um teste no total
      # passaria verde com a materializacao nao materializando nada.
      # 22 de 22 mutantes mortos, somados aos 12 da HMO-164. Quem os mede agora e
      # um step deste job ("A transferencia recorrente sabe falhar"), e nao mais
      # uma afirmacao solta aqui: este numero dizia 19 enquanto o runner tinha 22,
      # porque nada o conferia (HMO-332).
      - name: Transferencia entre contas, as duas pernas
        run: npm run test:transferencia

      # OS 12 MUTANTES DA TRANSFERENCIA, QUE ATE AQUI NINGUEM RODAVA (HMO-331).
      # -----------------------------------------------------------------------
      # Os numeros do comentario acima ("12 de 12 mutantes mortos") eram uma
      # ANOTACAO: `scripts/mutantes-transferencia.mjs` nao era invocado por step
      # nenhum, entao o repositorio prometia controle negativo e nao tinha. E o
      # tipo de buraco que a HMO-322 abriu para fechar -- e no caso dele vale
      # fechar ligando, nao apagando: o alvo e `lib/transferencia.ts`, que GRAVA
      # as duas pernas. "As duas pernas com o MESMO sinal" nao erra a tela, erra
      # o saldo pelo DOBRO do valor, e fica gravado.
      #
      # POR QUE AQUI E NAO NO verificacao.yml
      # -------------------------------------
      # Porque `test:transferencia` ja mora aqui (o step acima), e este workflow
      # tem filtro de path: ele roda em push para main e em mudanca de
      # database/ -- nao em todo push de PR. O mesmo step no verificacao.yml
      # custaria ~1 min em CADA push, e a franquia e de 2.000 min/mes (HMO-261).
      #
      # O CUSTO MEDIDO (2026-10-07): 12 mutantes + controle positivo = 13
      # rodadas da suite. 30s com loadavg 2,1 em 2 nucleos -- e este e o numero.
      #
      # A MESMA MEDICAO, NA MESMA MAQUINA, DEU 46s COM LOADAVG 4,4 E 7m16 COM
      # LOADAVG 7,5. Fica registrado porque a dispersao e o aviso: 14x entre o
      # pior e o melhor, pelo MESMO trabalho, e fome de CPU de outros processos
      # do host -- nao custo deste step. Quem anotar tempo de runner aqui, leia
      # `/proc/loadavg` primeiro; sem isso o numero mede a maquina, nao o
      # runner. (Um lote anterior bateu "120s exatos" em quatro runners
      # seguidos, que era carga 40 em 2 nucleos.)
      #
      # Uma compilacao inteira por mutante, porque este runner ainda NAO usa o
      # motor de bloco da HMO-319/HMO-320 -- quando usar, cai de uma vez.
      #
      # NAO E O MESMO QUE O RUNNER DO APP, MAIS ABAIXO -- E FOI CONFERIDO.
      # ------------------------------------------------------------------
      # `mutantes-transferencia-recorrente-app.mjs` -- o step "A transferencia
      # recorrente sabe falhar (22 mutantes)", que a HMO-332 ligou logo abaixo
      # -- muta O MESMO ARQUIVO, e por isso a pergunta "um ja cobre o outro?"
      # tinha de ser respondida com medida e nao com leitura. Respondida: das
      # ancoras de um, ZERO aparecem nas do outro.
      # Os 22 do app ficam na criacao da REGRA, na baixa e na materializacao; os
      # 12 daqui ficam em `criarTransferencia` e `contasDeOrigem` -- a
      # transferencia AVULSA, a que o usuario faz na mao. Funcoes disjuntas no
      # mesmo arquivo, entao nenhum dos dois e `coberto-por-outro`.
      #
      # ESTE ESCREVE NA ARVORE, ao contrario dos runners de banco: ele muta
      # `lib/transferencia.ts` no lugar e restaura no fim. Nao ha `finally` nem
      # tratador de sinal (HMO-326/HMO-327), entao um SIGTERM no meio deixa o
      # mutante gravado. Em CI o checkout e descartavel; o que NAO e tolerado e
      # ele sair 0 e deixar a arvore suja, porque os steps seguintes deste mesmo
      # job -- inclusive a comparacao de schema-columns.json -- passariam a medir
      # o arquivo errado. O step companheiro abaixo e quem prende isso.
      - name: As duas pernas da transferencia sabem falhar (12 mutantes)
        run: node scripts/mutantes-transferencia.mjs

      - name: 'A arvore voltou ao lugar depois de "As duas pernas da transferencia sabem falhar (12 mutantes)"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo DEPOIS de o .ts voltar, e
          # ele e ignorado pelo git -- entao o `git diff` abaixo nao o veria.
          rm -rf .tmp-*
          git diff --exit-code -- lib/transferencia.ts

      # A materializacao da agenda (HMO-172). Suite separada porque precisa de
      # `rootDir` na raiz: lib/services/scheduled.ts importa `@/types/financial`,
      # e com `rootDir: lib` o tsc reprova com TS6059.
      #
      # O que ela prende: `transaction_type = 'transfer'` e
      # `destination_account_id` atravessam a materializacao JUNTOS. Perder o
      # destino faz a baixa gravar a perna de saida e descobrir depois que nao tem
      # para onde mandar o dinheiro; perder o tipo faz a ocorrencia cair no ramo
      # do CHECK da 038 que PROIBE destino, e o INSERT leva 23514 -- a agenda fica
      # vazia sem erro na tela. E a assimetria tem controle proprio: em
      # income/expense `transaction_type` continua NULL ("pergunte a regra", 027),
      # porque editar a regra tem de reapontar as ocorrencias futuras.
      - name: A ocorrencia de transferencia nasce com destino e com tipo
        run: npm run test:materializacao

      # O APARELHO que prova que as DUAS suites acima medem o que dizem medir.
      #
      # POR QUE ESTE RUNNER GANHOU STEP E OS OUTROS SEIS DO LOTE FORAM APAGADOS
      # ----------------------------------------------------------------------
      # Na triagem da HMO-332 o default era `git rm`, e seis dos sete orfaos
      # deste lote foram apagados: carteira, renda fixa, fundamento da CVM,
      # crivos e as duas sondas de puxar-para-atualizar. Em nenhum deles errar
      # tira dinheiro de uma conta -- erram um numero MOSTRADO, ou uma sugestao
      # de investimento, ou recarregam a pagina na rolagem.
      #
      # Este erra o SALDO. A ocorrencia de transferencia que nasce sem
      # `destination_account_id` faz a baixa gravar UMA perna: o dinheiro sai da
      # origem e nao entra em lugar nenhum. Nao ha excecao, nao ha 500, nao ha
      # linha vazia -- ha um patrimonio menor pelo valor transferido, plausivel,
      # com duas casas decimais. E por ser RECORRENTE, repete todo mes sem que
      # nada acuse. E a familia da HMO-149/HMO-164/HMO-172, e o mutante
      # `materializacao_sem_destino` e literalmente o titulo da HMO-172.
      #
      # A PROVA DE QUE RUNNER NAO RODADO APODRECE, NESTE MESMO ARQUIVO
      # -------------------------------------------------------------
      # O comentario do step `test:transferencia`, logo acima, afirmava "19 de 19
      # mutantes mortos" -- e o runner tem 22. O numero envelheceu justamente
      # porque nenhum job o conferia: a afirmacao estava escrita no workflow e
      # nada a media. E a tese da HMO-322 demonstrada no proprio lugar que ela
      # descreve.
      #
      # O CUSTO MEDIDO (2026-10-07): 22 mutantes, 22 mortos, 146s -- e um TETO,
      # nao o custo em CI: a medicao saiu numa maquina com loadavg 8,56 em 2
      # nucleos (~4x sobrescrita). Sao 18 voltas de `npm run test:transferencia`
      # mais 4 de `npm run test:materializacao`, uma compilacao inteira por
      # mutante, porque este runner ainda NAO usa o motor de bloco da
      # HMO-319/HMO-320 -- quando usar, cai de uma vez. Nenhum job novo, e o
      # `paths:` deste workflow so o acorda quando lib/transferencia.ts,
      # lib/services/scheduled.ts, as suites ou o proprio runner mudam.
      #
      # ELE ESCREVE NA ARVORE -- ao contrario dos quatro de banco mais abaixo.
      # Muta `lib/transferencia.ts` e `lib/services/scheduled.ts` no lugar e
      # restaura no fim, e NAO trata SIGTERM (HMO-327). Em CI isso e tolerado
      # porque o checkout e descartavel: o pior caso de uma interrupcao e um
      # arquivo mutado num workspace que ninguem reaproveita. O que NAO e
      # tolerado e ele sair 0 e deixar a arvore suja, porque os steps seguintes
      # deste mesmo job -- inclusive a comparacao de schema-columns.json --
      # passariam a medir o arquivo errado. O step companheiro abaixo e quem
      # prende isso.
      - name: A transferencia recorrente sabe falhar (22 mutantes)
        run: node scripts/mutantes-transferencia-recorrente-app.mjs

      - name: 'A arvore voltou ao lugar depois de "A transferencia recorrente sabe falhar (22 mutantes)"'
        run: git diff --exit-code -- lib/transferencia.ts lib/services/scheduled.ts

      # O cambio do dia da compra (HMO-182). A 026 pos um CHECK que CRUZA duas
      # colunas -- `(currency = 'BRL') = (exchange_rate = 1)` -- e a coluna nova
      # nasceu com DEFAULT 1. Como o app ja mandava `currency` desde a HMO-171,
      # todo lancamento em moeda estrangeira passou a montar a linha (USD, 1), que
      # e exatamente o par proibido: 23514 em 100% deles, nao num caso de borda.
      # Medido no Postgres com as migrations 001..026 aplicadas.
      # O que a suite prende: `cotacaoCoerente` e a MESMA regra do CHECK (se as
      # duas divergirem, quem ganha e o banco, e o sintoma e "Erro ao gravar o
      # lancamento" sem mais nada); `taxaParaGravar` devolve null e nao 1 quando
      # falta cotacao -- 1 e o unico numero que o CHECK proibe, e num mundo sem o
      # CHECK poria a despesa de US$ 180 no acerto da viagem valendo R$ 180;
      # `escolherBoletim` pega o Fechamento e nao o ultimo item da lista, que no
      # meio da tarde e um Intermediario; e `datasParaTentar` anda para TRAS,
      # porque cotacao posterior a compra faz o valor do passado mudar sozinho --
      # a razao de existir do item 3 da HMO-138.
      # 35 asercoes, 11 mutantes: 10 mortos. O 11o (`setDate` no lugar de
      # `setUTCDate`) sobrevive porque E no-op em fuso sem horario de verao; o
      # mutante de verdade, formatar com componentes locais, morre em 7.
      - name: Cambio do dia da compra, e o CHECK cruzado da 026
        run: npm run test:cambio

      # A moeda da VIAGEM na tela do grupo (HMO-182, itens 3/4/5). A 026 separou
      # duas coisas que esta tela mistura com facilidade: `amount_currency` (BRL,
      # a moeda dos numeros, porque cada despesa entrou pela cotacao congelada do
      # dia dela) e `group_currency` (a moeda em que a tela FALA). As duas
      # conversoes usam cotacoes diferentes -- a da compra, que nunca muda, e a de
      # hoje, que muda todo dia -- e usar a de hoje para o valor do passado e
      # literalmente o que a issue proibe.
      # O que a suite prende: a conversao de apresentacao DIVIDE pela cotacao
      # (multiplicar da um numero 28x maior num grupo em dolar, e erra para cima --
      # o lado que faz alguem pagar a mais); o rotulo DIZ que a cotacao e de hoje
      # e NAO diz que e a da compra (sem eixo de tempo, "US$ 50,00" ao lado de uma
      # viagem de marco se le como o valor gasto em marco); `null` e nunca 1
      # quando falta cotacao, porque 1 e o valor que o CHECK proibe e o unico que
      # faz a conversao sair identica ao BRL sem sintoma; a sobra de centavo do
      # acerto em moeda estrangeira e DEVOLVIDA e nao escondida numa cotacao
      # calculada de tras para frente (que fecharia exato mentindo sobre o mundo);
      # e a tolerancia de um centavo daqui e a MESMA de `simplifySettlements` --
      # se divergirem, a tela avisa de uma sobra que a lista de sugestoes nao tem.
      # 28 asercoes, 6 mutantes, 6 mortos.
      - name: A moeda da viagem, e as duas cotacoes que nao se misturam
        run: npm run test:moeda-do-grupo

      # A carteira de investimentos erra dinheiro sem levantar excecao: ela mostra
      # um preco medio de R$ 31,14 onde o certo e R$ 30,00, e ninguem estranha
      # 31,14. Os casos que valem:
      #   - somar a VENDA na ponderacao do preco medio. E o erro central do custo
      #     medio e o mais plausivel de escrever -- `soma(qtd*preco)/soma(qtd)`
      #     parece obviamente certo -- e ele contamina o lucro, a rentabilidade e
      #     o "Valor Atual" da tela de uma vez;
      #   - a taxa fora do custo, que infla o lucro em exatamente o valor das
      #     corretagens e deixa o "investido" abaixo do que saiu da conta;
      #   - preco ausente tratado como ZERO: como nao ha fonte de cotacao
      #     contratada, `current_price` nasce NULL, e o caminho ingenuo faz a tela
      #     anunciar carteira de R$ 0,00 com -100% no dia em que o usuario
      #     cadastra o primeiro ativo;
      #   - dividir a rentabilidade pelo valor atual em vez do custo, e a alocacao
      #     pelo patrimonio em vez do total da carteira (o defeito da HMO-146).
      # 26 de 28 mutantes mortos. O runner que mediu isso
      # (`scripts/mutantes-investments.mjs`) foi apagado na HMO-332 -- a carteira
      # nao e onde errar custa dinheiro imediato, e esta suite e a afirmacao --,
      # mas os DOIS sobreviventes ficam escritos aqui, porque senao alguem
      # "conserta" a suite para matar um mutante que nao existe:
      #   - "investido conta a posicao encerrada" e "alocacao inclui posicao
      #     zerada" trocam `abertas` por `posicoes` numa soma, e sao NO-OP
      #     algebrico: posicao encerrada tem quantidade 0, dai saem
      #     `custo = custo - (custo/qtd)*qtd = 0` e `current_value = 0 * preco = 0`
      #     -- ela contribui ZERO nas duas somas, com ou sem o filtro.
      # O filtro `abertas` fica por duas razoes: a intencao ("o resumo olha a
      # carteira de hoje") tem de estar legivel no codigo, e uma posicao
      # encerrada com custo residual -- linha editada a mao no banco -- passaria
      # a somar. Trocar `abertas` pelo conjunto todo em `totalDividends` e
      # `realizedProfitLoss` NAO e no-op, e esses dois mutantes morriam: e
      # justamente o dinheiro que a posicao encerrada deixou.
      - name: Custo medio, alocacao e evolucao da carteira
        run: npm run test:investments

      # Renda fixa que rende sozinha (HMO-192, entrega 2 da HMO-141). A migration
      # 031 deu onde guardar "110% do CDI"; lib/renda-fixa.ts e a conta que
      # transforma aquilo em dois numeros na tela e lib/cdi.ts a unica conversa
      # com o SGS do Banco Central. Como em investments, nenhum erro aqui levanta
      # excecao -- todos desenham um rendimento errado com cara de certo. Os
      # casos que valem:
      #
      #   - o FIM DE SEMANA. MEDIDO em api.bcb.gov.br: pedir a serie 12 para
      #     sabado 26/09/2026 devolve HTTP 404 com corpo de erro, e NAO lista
      #     vazia com 200 como o Olinda da PTAX. Um cliente copiado de
      #     lib/ptax.ts leria todo fim de semana como falha de rede; por isso
      #     toda consulta aqui e por FAIXA, nunca por um dia. E a ausencia do
      #     sabado nao e "rendeu zero": preencher com zero multiplica por 1 (o
      #     bruto do CDI sobrevive, e e por isso que o defeito passa) mas INVENTA
      #     dia util -- e num prefixado de 13% a.a. os 8 dias de fim de semana da
      #     janela de setembro viram R$ 39 de rendimento falso em R$ 10.000;
      #
      #   - LCI, LCA e poupanca ISENTAS. Liquido igual ao bruto, aliquota zero. E
      #     o caso que o codigo generico erra, e erra CONTRA o usuario. A isencao
      #     nao se deriva do indexador: uma LCI e um CDB de 95% do CDI so diferem
      #     em `fixed_income_product`, e a suite tem o par lado a lado;
      #
      #   - a aliquota de IR pelos dias CORRIDOS, nunca pelos uteis. 190 corridos
      #     sao 20%; os 131 uteis do mesmo periodo seriam 22,5% -- 2,5 pontos
      #     sempre contra o usuario, sem nada na tela denunciando. As tres bordas
      #     (180/181, 360/361, 720/721) estao na suite;
      #
      #   - a ORDEM da resposta do SGS. MEDIDO: `/bcdata.sgs.12/dados/ultimos/4`
      #     volta crescente e `/bcdata.sgs.4389/dados/ultimos/3` volta
      #     DECRESCENTE. Quem le posicao em vez de data acerta numa serie e erra
      #     na outra, com um numero plausivel de outro dia;
      #
      #   - o percentual multiplica a TAXA do dia e nao o fator, e o vencimento
      #     PARA a conta (sem isso um CDB vencido em 2024 acumula CDI para
      #     sempre).
      #
      # Os numeros sao os da issue, conferidos contra o endpoint de verdade:
      # R$ 10.000 a 100% do CDI em 21 dias uteis -> R$ 107,20 brutos, R$ 83,08
      # liquidos; por dia R$ 5,08 a 100% e R$ 5,59 a 110%; e a conferencia
      # cruzada 1,00050788 ^ 252 = 1,13650 entre as series 12 e 4389.
      #
      # 41 de 41 mutantes mortos, com CONTROLE POSITIVO (a arvore intacta passa
      # antes de qualquer mutacao -- sem ele um erro no proprio runner sai como
      # "todos mortos") e ancora unica exigida por mutante. Dois mutantes vivos
      # na primeira rodada apontaram defeito na SUITE e nao no codigo, e as duas
      # assercoes que faltavam estao marcadas com MEDIDO em
      # scripts/test-renda-fixa.mjs: `(1+taxa)^1,10` e `1+taxa*1,10` dao o MESMO
      # centavo em 21 dias (a assercao passou a ser sobre o fator, com 12 casas),
      # e as series 11 e 12 tem hoje o mesmo valor, entao trocar Selic por CDI
      # nao muda numero nenhum ate o dia em que as duas se separarem.
      # Um terceiro mutante vivo era no-op -- mutante mal escrito, nao teste
      # fraco: a primeira versao dele acrescentava um `void 0;` DEPOIS do return,
      # entao nao mutava nada e sobrevivia por construcao. Mutante vivo nem
      # sempre e teste fraco; as vezes e mutante mal escrito.
      # O runner que mediu os 41 (`scripts/mutantes-renda-fixa.mjs`) foi apagado
      # na HMO-332 pelo mesmo motivo que o de investments, e as duas assercoes
      # que ele fez nascer ficam marcadas com MEDIDO na suite -- o achado dele
      # sobreviveu a ele.
      - name: Renda fixa rende sozinha, e LCI nao paga IR
        run: npm run test:renda-fixa

      # A busca de pessoas da aba Conexoes. O termo digitado ia colado na arvore
      # logica do PostgREST, e a virgula e separador ali: quem se chama
      # "Silva, Joao" derrubava a consulta inteira com PGRST100 e a tela dizia
      # "Erro ao buscar usuários" (HMO-142, medido em producao). O teste afirma
      # sobre a ARVORE -- dois ramos, termo inteiro dentro do operando citado --
      # e sobre o termo vazio nao virar `ilike.%%`, que listaria todo perfil
      # publico da base. `lib/busca-de-perfil.ts` esta no filtro de `paths`
      # acima de proposito: sem isso o passo so rodaria quando o proprio arquivo
      # de teste mudasse, e mexer na implementacao sairia verde por ausencia.
      - name: Busca de perfil escapa o termo e nao lista a base inteira
        run: npm run test:busca-de-perfil

      # ===================================================================
      # OS CONTROLES NEGATIVOS QUE PRECISAM DE POSTGRES (HMO-322)
      # ===================================================================
      # Estes quatro runners existiam na arvore e NENHUM job os executava.
      # Eram 4 dos 43 que a HMO-322 contou -- e "nao roda em lugar nenhum" nao
      # da sintoma: o arquivo esta no repositorio, tem o nome certo, aparece no
      # `ls`, e ler a arvore da a impressao de que aquela migration esta
      # protegida por controle negativo.
      #
      # POR QUE AQUI E NAO NO verificacao.yml
      # -------------------------------------
      # Eles nao sao TypeScript: cada um muta a FUNCAO no Postgres (ou a
      # migration, num arquivo temporario) e roda o teste SQL contra ela. Sem
      # banco de verdade nao rodam. O verificacao.yml nao tem service de
      # Postgres, e dar um a ele seria pagar a partida de uma maquina nova --
      # a parte cara do Actions (HMO-261, franquia de 2.000 min/mes). Aqui o
      # banco JA esta de pe e a cadeia JA subiu, entao o custo marginal e
      # tempo de step, nao partida de maquina.
      #
      # O CUSTO MEDIDO, num Postgres 17 local (2026-10-07):
      #
      #   categorias                8 mutantes,  8 mortos,   9s
      #   convite-sem-conta        12 mutantes, 12 mortos,   9s
      #   minha-parte-no-realizado 24 mutantes, 24 mortos,  33s
      #   trava-de-membro          13 mutantes, 13 mortos,  11s
      #                            ---------------------------
      #                            57 mutantes, 57 mortos,  62s
      #
      # A HMO-330 acrescentou outros dois, pela mesma triagem e no mesmo job:
      #
      #   chave-pix                 6 mutantes,  6 mortos,   7s
      #   edicao-de-grupo          17 mutantes, 17 mortos,  96s
      #                            ---------------------------
      #                            23 mutantes, 23 mortos, 103s
      #
      # O `edicao-de-grupo` e o mais caro de todos porque NAO sai de template:
      # cada um dos 17 mutantes sobe um banco proprio do zero (shim + 001 ->
      # 024 mutada) e o derruba no fim, ~5,6s por mutante. Ele entrou mesmo
      # assim porque as assercoes dele nao sao so de dinheiro: tres mutantes
      # miram SECURITY DEFINER, o EXECUTE de `authenticated` e a checagem de
      # dono da funcao -- afrouxar qualquer um deles e deixar uma pessoa
      # refazer o rateio da despesa de outra.
      #
      # 57 controles negativos por ~1 min de step, sem job novo. O
      # minha-parte-no-realizado e o mais caro porque monta o proprio template
      # (a cadeia SEM a 033); os outros tres saem de `CREATE DATABASE ...
      # TEMPLATE`, que e copia de arquivo.
      #
      # NENHUM DELES ESCREVE NA ARVORE
      # ------------------------------
      # Isso importa num runner de mutante: quem muta a fonte no lugar e morre
      # por timeout deixa a arvore MUTADA, e dali em diante tudo mede o arquivo
      # errado. Os dois `.sh` nunca tocam arquivo nenhum (o mutante e um
      # `CREATE OR REPLACE` num clone descartavel) e os dois `.mjs` escrevem a
      # migration mutada num diretorio temporario. O pior caso de uma
      # interrupcao aqui e um banco orfao, que morre com a maquina.
      - name: A categoria do usuario sabe falhar (8 mutantes)
        run: BANCO_BASE=$PGDATABASE bash scripts/mutantes-categorias.sh

      - name: O convite sem conta sabe falhar (12 mutantes)
        run: BANCO_BASE=$PGDATABASE bash scripts/mutantes-convite-sem-conta.sh

      # Monta o proprio template (a cadeia inteira MENOS a 033) e confere que
      # as views da 033 nao estao nele -- senao cada mutante seria aplicado por
      # cima da versao boa. Alem dos 24 mutantes, prova o PREFLIGHT: num banco
      # parado na 021 a 033 tem de falhar com a NOSSA mensagem, e nao com
      # `column t.currency does not exist`.
      - name: A minha parte no realizado sabe falhar (24 mutantes)
        run: PGURL=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-minha-parte-no-realizado.mjs

      # A 046 troca o CRITERIO das duas views que o runner de cima mede, entao
      # ele nao serve para ela: o teste da 033 roda na posicao da 033 e continua
      # (corretamente) exigindo 950, e o mutante 2 dele descreve METADE da 046
      # como defeito -- certo no lugar dele, porque na 033 sozinha aquela metade
      # produz dupla contagem. Nenhum mutante da 033 mede o PAR de mudancas.
      #
      # Os dois mutantes de `security_invoker` daqui morrem na assercao sobre
      # `reloptions`, e NAO no controle negativo da Dora -- medido. Nenhuma das
      # duas views da 046 toca tabela com RLS (as duas leem views do 008 e da
      # 033, que sao INVOKER e e onde a politica e avaliada), entao com so elas
      # como DEFINER nao ha vazamento. Esta e a diferenca em relacao ao que a
      # 033 e a 045 afirmam, com razao, nos casos delas.
      - name: O criterio de custo pessoal sabe falhar (7 mutantes)
        run: PGURL=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-um-criterio-de-custo-pessoal.mjs

      # Usa o retrato tirado la atras, no ponto da cadeia em que a 039 tinha
      # acabado de entrar e a 040 ainda nao. O runner confere as duas pontas: o
      # controle NEGATIVO exige que o teste da 040 REPROVE no template cru (se
      # passar, o template tem a 040 e o placar e ficcao) e o POSITIVO exige
      # que a 040 intacta passe.
      - name: A trava de membro sabe falhar (13 mutantes)
        run: PG_TEMPLATE=hmo322_pre040 PG_URL_BASE=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-trava-de-membro.mjs

      # Usa o retrato tirado no ponto em que a 047 tinha acabado de entrar e a
      # 048 ainda nao. Aqui o controle NEGATIVO nao e formalidade: `SET NOT NULL`
      # sobre coluna ja travada e no-op silencioso, entao um template com a 048
      # dentro faria os 4 mutantes "morrerem" sem nada ter sido medido -- e e o
      # unico dos runners deste job em que o template contaminado nao se
      # denuncia por um erro de SQL.
      #
      # Medido num Postgres 17 local (2026-10-08): 4 mutantes, 4 mortos, 4,5s.
      - name: A trava de tipo do lancamento sabe falhar (4 mutantes)
        run: PG_TEMPLATE=hmo232_pre048 PG_URL_BASE=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-trava-de-tipo.mjs

      # O LOTE 3/4 DA TRIAGEM (HMO-331): AS TRES MIGRATIONS QUE FICARAM.
      # ----------------------------------------------------------------
      # Os nove runners do lote foram separados por UMA pergunta: o runner
      # guarda o que o banco GRAVA, ou o que a tela MOSTRA? Cinco guardavam
      # leitura de painel (cash-flow, previsto-bloco, realizado-e-previsao,
      # periodo-painel, cron-ledger) e foram apagados -- a suite `test:*` de
      # cada um continua no CI, e o Helio decidiu em 2026-10-07 que a prova de
      # que ela MEDE so se paga onde errar move dinheiro.
      #
      # Estes tres ficaram porque cada um guarda uma linha gravada, e o mutante
      # que mais importa em cada um e um defeito plausivel, nao teorico:
      #
      #   034  `trava_larga_demais` -- CHECK (false) recusa USD e recusa BRL
      #        junto: o app para de criar conta prevista nenhuma. So morre
      #        porque o teste tem assercao de recusa E de aceitacao.
      #   035  `sem_reafirmar_invoker` -- foi MEDIDO que `CREATE OR REPLACE
      #        VIEW` apaga as reloptions no Postgres 17.11. Sem o `ALTER VIEW
      #        ... SET (security_invoker = true)`, a 035 -- que nao fala de
      #        permissao em lugar nenhum -- faz a fatura de qualquer usuario
      #        vazar para qualquer usuario logado.
      #   038  `check_permissivo` -- `destino IS NULL OR tipo = 'transfer'` tem
      #        a cara certa e deixa passar `transfer` SEM destino: a regra que
      #        materializa UMA perna, e o total do mes fica errado.
      #
      # Os tres saem dos retratos tirados la atras (`hmo331_pre034/035/038`), e
      # os tres tem as duas pontas: o controle NEGATIVO exige que o teste
      # REPROVE no template cru -- sem ele, um template montado com a migration
      # dentro faz todo mutante sobreviver como no-op e o placar e ficcao -- e o
      # POSITIVO exige que a migration intacta passe.
      #
      # O CUSTO MEDIDO, num Postgres 17 local (2026-10-07, loadavg 2,0 em 2
      # nucleos), contra os templates que ESTE workflow monta:
      #
      #   moeda-da-conta-prevista (034)   6 mutantes,  6 mortos,   4s
      #   parcela-n-de-m          (035)  11 mutantes, 11 mortos,   5s
      #   transferencia-recorrente(038)  10 mutantes, 10 mortos,   7s
      #                                  ---------------------------
      #                                  27 mutantes, 27 mortos,  16s
      #
      # (A mesma medicao deu 58s com loadavg 10 na mesma maquina. O numero acima
      # e o de maquina quieta -- ver a nota de carga no step da transferencia.)
      #
      # Nenhum deles escreve na arvore: a migration mutada vai para um
      # diretorio temporario. O pior caso de uma interrupcao e um banco orfao.
      #
      # O NOME DOS STEPS LEVA O NUMERO DA MIGRATION DE PROPOSITO. "A
      # transferencia recorrente sabe falhar" ja existe neste arquivo, criado
      # pela HMO-332 para `mutantes-transferencia-recorrente-app.mjs` -- outro
      # runner, outro alvo, 22 mutantes. Dois steps com o mesmo nome e so o
      # numero de mutantes para distingui-los seria um nome que envelhece: basta
      # um mutante novo em qualquer dos dois para os dois ficarem identicos.
      - name: A migration 034 (moeda da conta prevista) sabe falhar (6 mutantes)
        run: PG_TEMPLATE=hmo331_pre034 PG_URL_BASE=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-moeda-da-conta-prevista.mjs

      - name: A migration 035 (parcela N de M) sabe falhar (11 mutantes)
        run: PG_TEMPLATE=hmo331_pre035 PG_URL_BASE=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-parcela-n-de-m.mjs

      - name: A migration 038 (transferencia recorrente) sabe falhar (10 mutantes)
        run: PG_TEMPLATE=hmo331_pre038 PG_URL_BASE=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-transferencia-recorrente.mjs

      # HMO-330. Usa o retrato pre-032 tirado la atras -- ver o comentario
      # daquele step para o motivo de ele nao poder ser tirado aqui.
      #
      # O mutante que paga o step e o primeiro: `policy_larga` troca
      # `USING (user_id = auth.uid() OR compartilha_grupo_ativo(user_id))` por
      # `USING (TRUE)`. Se ele sobrevivesse, a 032 estaria entregando a chave
      # Pix -- que no Brasil e muitas vezes o CPF -- de cada pessoa para a base
      # autenticada inteira, e o teste SQL logo acima estaria assinando embaixo.
      # A 032 existe inteira por causa disso: RLS nao tranca COLUNA, entao a
      # chave nao podia morar em `profiles`.
      #
      # Medido: 6 mutantes, 6 mortos, 7s. O barato vem de `CREATE DATABASE ...
      # TEMPLATE`, e a migration mutada e escrita num diretorio temporario --
      # `database/migrations/032_*.sql` nao e tocado em momento nenhum.
      - name: A chave Pix do grupo sabe falhar (6 mutantes)
        run: PG_TEMPLATE=hmo330_pre032 PG_URL_BASE=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-chave-pix.mjs

      # HMO-330. Nao usa template: cada mutante sobe a cadeia shim + 001 -> 024
      # num banco proprio, porque a 024 e um `CREATE OR REPLACE FUNCTION` e
      # aplicar o mutante sobre um banco que ja tem a versao boa reescreveria a
      # funcao boa.
      #
      # Os 17 mutantes cobrem as duas metades do bug da HMO-176 (editar a
      # despesa nao refazia o rateio; trocar de grupo deixava a divisao antiga
      # viva) MAIS a trava da parte ja aprovada -- mudar o valor por baixo de
      # quem aprovou muda o que essa pessoa aprovou. E tres deles nao sao de
      # dinheiro: SECURITY DEFINER nas duas funcoes novas, o EXECUTE que
      # `authenticated` NAO pode ter, e a checagem de dono que impede refazer o
      # rateio da despesa de outra pessoa.
      #
      # Medido: 17 mutantes, 17 mortos, 96s -- o step mais caro desta secao.
      - name: A edicao de despesa de grupo sabe falhar (17 mutantes)
        run: PGURL=postgresql://postgres:postgres@localhost:5432 node scripts/mutantes-edicao-de-grupo.mjs

      # O guard de deriva de COLUNA (scripts/check-column-drift.mjs) roda no job
      # code-schema-drift, que nao tem Postgres, entao ele le o schema de
      # database/schema-columns.json. Este passo e o que impede aquele arquivo de
      # envelhecer: aqui ele e comparado com a FONTE -- este banco, construido
      # pela cadeia inteira de migrations logo acima -- e nao com outra copia
      # gerada pelo mesmo script (foi assim que o bundle de validacao ficou sete
      # migrations atras e saiu verde, HMO-154).
      #
      # Quem acrescentar coluna numa migration e nao rodar
      # `node scripts/gen-schema-columns.mjs` recebe este passo vermelho.
      - name: schema-columns.json em dia com as migrations
        run: node scripts/gen-schema-columns.mjs --check

      - name: Nenhuma tabela pode ficar sem RLS
        run: |
          semrls=$($PSQL -tAc "
            SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relkind = 'r'
               AND NOT c.relrowsecurity;")
          if [ -n "$semrls" ]; then
            echo "::error::Tabelas em public sem RLS: $semrls"
            exit 1
          fi
          echo "Todas as tabelas de public estao com RLS ligada."

      # A chave anon vai embutida no bundle JS publico: qualquer privilegio que
      # ela tenha alem das duas tabelas de referencia e dado aberto na internet.
      - name: anon so pode ler as tabelas de referencia
        run: |
          extra=$($PSQL -tAc "
            SELECT string_agg(DISTINCT table_name, ', ')
              FROM information_schema.role_table_grants
             WHERE grantee = 'anon' AND table_schema = 'public'
               AND table_name NOT IN ('financial_services', 'transaction_categories');")
          if [ -n "$extra" ]; then
            echo "::error::A role anon tem privilegio em tabelas que nao sao de referencia: $extra"
            exit 1
          fi
          echo "anon limitada a financial_services e transaction_categories."

      - name: Seed carregado
        run: |
          $PSQL -tAc "SELECT 'financial_services=' || count(*) FROM financial_services"
          $PSQL -tAc "SELECT 'transaction_categories=' || count(*) FROM transaction_categories"

      # Os passos acima rodam num banco limpo, onde as unicas policies sao as
      # que o 002 cria. Producao nao e assim: pode ter policy feita pelo painel
      # do Supabase, com nome que o DROP POLICY IF EXISTS nominal do 002 nunca
      # alcancaria. Uma sobrevivente com USING (true) vaza os dados de um
      # usuario logado para outro - e a auditoria anonima passa verde, porque
      # ela testa sem login. Este job planta essa policy e exige que o 002 a
      # remova. Vai em banco proprio: o estado sujo nao pode contaminar o
      # drill de backup abaixo.
      - name: Deriva de policies legadas
        env:
          PGDATABASE: pulodogato_drift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_drift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/legacy_policy_drift_test.sql

      # A outra deriva de producao, descoberta em 2026-09-21 ao aplicar o 002:
      # uma is_group_member de outra safra, com assinatura diferente. O
      # CREATE OR REPLACE nao a substitui, ela sobrevive ao lado da nova e as
      # policies param com 42725 "function is not unique". Banco proprio pelo
      # mesmo motivo do job anterior.
      - name: Deriva de funcoes legadas
        env:
          PGDATABASE: pulodogato_fndrift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_fndrift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/legacy_function_drift_test.sql

      # Terceira classe de deriva: o schema de producao nao bater com o que o
      # 002 assume. Sem a SECAO 0.0 o Postgres reporta um item por vez, e como
      # so o dono do projeto tem credencial, cada item custa um dia. Aqui
      # plantamos tres derivas de tipos diferentes de uma vez e exigimos que as
      # DUAS verificacoes (a Q6 do 000, somente leitura, e a SECAO 0.0 do 002)
      # apontem as tres - e que o 002 aborte sem alterar nada. As assercoes
      # estao aqui, e nao no .sql, porque dependem do codigo de saida do psql.
      - name: Deriva de schema
        env:
          PGDATABASE: pulodogato_schemadrift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_schemadrift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/schema_prereq_test.sql

          esperado=(
            'coluna public.group_members.status nao existe'
            'tabela public.user_usage_limits nao existe'
            'ON CONFLICT de join_group_by_code exige'
          )

          # 1) O preflight (somente leitura) tem que listar as tres na Q6.
          preflight=$($PSQL -f database/migrations/000_preflight_inventory.sql 2>&1)
          for item in "${esperado[@]}"; do
            if ! grep -qF "$item" <<< "$preflight"; then
              echo "::error::A Q6 do 000_preflight_inventory nao apontou: $item"
              exit 1
            fi
          done
          echo "Q6 do preflight apontou as tres derivas."

          # 2) O 002 tem que abortar, nomeando as tres no mesmo erro.
          if saida=$($PSQL -f database/migrations/002_rls_lockdown.sql 2>&1); then
            echo "::error::O 002 aplicou num banco cujo schema nao comporta as policies."
            exit 1
          fi
          for item in "${esperado[@]}"; do
            if ! grep -qF "$item" <<< "$saida"; then
              echo "::error::A SECAO 0.0 do 002 abortou sem nomear: $item"
              echo "$saida"
              exit 1
            fi
          done
          echo "SECAO 0.0 abortou nomeando as tres de uma vez."

          # 3) E nao pode ter deixado rastro: tudo roda dentro de BEGIN/COMMIT.
          rastro=$($PSQL -tAc "
            SELECT (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                     WHERE n.nspname = 'public'
                       AND p.proname IN ('is_group_member', 'is_group_admin', 'owns_group_member',
                                         'has_pending_invitation', 'join_group_by_code'))
                 + (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity)
                 + (SELECT count(*) FROM pg_policies WHERE schemaname = 'public');")
          if [ "$rastro" != '0' ]; then
            echo "::error::O 002 abortou mas deixou rastro no banco ($rastro objeto(s))."
            exit 1
          fi
          echo "Transacao voltou atras por inteiro: nada mudou no banco."

      # Backup que nunca foi restaurado nao e backup. O ciclo inteiro
      # (dump -> banco vazio -> conferencia) roda aqui a cada mudanca, para o
      # drill de verdade contra producao nunca ser a primeira execucao.
      - name: Drill de backup e restauracao
        env:
          PGDATABASE: pulodogato_ci
        run: |
          set -euo pipefail
          URL_ORIGEM="postgresql://postgres:postgres@localhost:5432/pulodogato_ci"
          URL_DESTINO="postgresql://postgres:postgres@localhost:5432/pulodogato_drill"

          $PSQL -d postgres -c "CREATE DATABASE pulodogato_drill"

          # Uma linha reconhecivel, para provar que o dado atravessou o ciclo.
          $PSQL <<'SQL'
          INSERT INTO auth.users (id, email)
            VALUES ('11111111-1111-1111-1111-111111111111', 'drill@ci.local');
          INSERT INTO public.profiles (id, full_name)
            VALUES ('11111111-1111-1111-1111-111111111111', 'Drill CI');
          INSERT INTO public.financial_accounts (id, user_id, name, account_type)
            VALUES ('22222222-2222-2222-2222-222222222222',
                    '11111111-1111-1111-1111-111111111111', 'Conta Drill', 'checking');
          -- service_id e category_id sao NOT NULL em producao; os UUIDs sao os
          -- do seed de referencia que o 001_baseline.sql carrega.
          INSERT INTO public.financial_transactions
                 (user_id, account_id, service_id, category_id,
                  amount, transaction_date, description)
            VALUES ('11111111-1111-1111-1111-111111111111',
                    '22222222-2222-2222-2222-222222222222',
                    '8730cd96-d656-4c48-863e-673e1016a832',
                    'b9db286c-ce4f-4fbe-b0bf-f3133185f90f',
                    1234.56, '2026-01-01', 'Transacao do drill');
          SQL

          chmod +x scripts/db-backup.sh scripts/db-restore.sh
          SUPABASE_DB_URL="$URL_ORIGEM" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-backup.sh "$RUNNER_TEMP/drill"

          # Prova que o backup sai criptografado e que o restore abre o .gpg.
          ls "$RUNNER_TEMP/drill"/*-data.sql.gz.gpg > /dev/null

          RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-restore.sh "$RUNNER_TEMP/drill"

          valor=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT amount FROM public.financial_transactions WHERE description = 'Transacao do drill'")
          if [ "$valor" != '1234.56' ]; then
            echo "::error::O ciclo de backup/restauracao perdeu dados (esperado 1234.56, obtido '$valor')"
            exit 1
          fi

          # O dado bruto sobreviver nao basta: o que quebra em silencio e o
          # DERIVADO. Se a restauracao carregar os dados com os triggers
          # ligados, update_account_balance roda de novo por cima do saldo que
          # ja veio no dump e o valor DOBRA (medido: 2469.12). Nada falha, e o
          # banco restaurado passa a mentir sobre dinheiro. Por isso o
          # db-restore.sh usa session_replication_role = replica -- e por isso
          # esta assercao existe.
          saldo=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT current_balance FROM public.financial_accounts
              WHERE id = '22222222-2222-2222-2222-222222222222'")
          if [ "$saldo" != '1234.56' ]; then
            echo "::error::Saldo derivado errado apos restaurar (esperado 1234.56, obtido '$saldo')."
            echo "::error::Sinal classico de trigger reaplicado durante a carga."
            exit 1
          fi
          echo "Ciclo completo: dado bruto e saldo derivado atravessaram o ciclo intactos."

          # ------------------------------------------------------------------
          # Restaurar por cima de um destino que JA tem contas
          # ------------------------------------------------------------------
          # O bloco acima restaura num banco recem-criado, com auth.users vazio.
          # O caso real e o oposto: restaurar por cima de um projeto que ainda
          # tem os usuarios. Ate 2026-09-21 isso apagava o schema public e so
          # ENTAO estourava em "duplicate key ... users_pkey" -- o banco ficava
          # sem dados e sem contas, pior do que antes de restaurar. Achado
          # restaurando num Supabase de verdade; aqui vira regressao.
          echo "== restaurar por cima de destino com contas: tem que recusar"
          if RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
               ./scripts/db-restore.sh "$RUNNER_TEMP/drill" > "$RUNNER_TEMP/recusa.log" 2>&1; then
            echo "::error::A restauracao aceitou um destino que ja tinha contas."
            exit 1
          fi
          # A QUANTIDADE NAO ENTRA NA ASSERCAO, E ISSO NAO E RELAXAMENTO
          # ---------------------------------------------------------------
          # O que esta linha protege e a MENSAGEM: recusar sem dizer por que
          # deixa quem esta restaurando sem saber o que fazer. Quantas contas o
          # destino tem e circunstancia do banco de CI, nao do comportamento
          # testado -- e desde que `database/tests/027_historico_antes_da_027.sql`
          # entrou (ele faz COMMIT de proposito, para a 027 do passo seguinte
          # enxergar o historico) o `pulodogato_ci` carrega uma conta fixa, mais
          # a do proprio drill: duas, e o `1` cravado aqui deixou de casar.
          # Ninguem viu porque este step e dos ultimos do job, e o job vinha
          # morrendo antes desde o merge da #120.
          grep -qE 'ja tem [0-9]+ conta' "$RUNNER_TEMP/recusa.log" || {
            echo "::error::Recusou, mas sem explicar que o destino ja tem contas."
            cat "$RUNNER_TEMP/recusa.log"; exit 1; }

          # E, o mais importante: tem que ter recusado ANTES de apagar nada.
          sobrou=$(psql "$URL_DESTINO" --no-psqlrc -tAc "
            SELECT count(*) FROM public.financial_transactions
             WHERE description = 'Transacao do drill'")
          if [ "$sobrou" != '1' ]; then
            echo "::error::A recusa veio DEPOIS de destruir o public (transacoes: $sobrou)."
            exit 1
          fi
          echo "Recusou sem tocar no destino."

          echo "== o mesmo com RESTORE_AUTH_MODE=merge: tem que passar"
          RESTORE_AUTH_MODE=merge RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-restore.sh "$RUNNER_TEMP/drill"

          saldo=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT current_balance FROM public.financial_accounts
              WHERE id = '22222222-2222-2222-2222-222222222222'")
          # "sem duplicar nada" se mede contra a ORIGEM, e nao contra um numero
          # cravado: o que o merge promete e que restaurar por cima de contas que
          # ja existem deixa cada conta UMA vez. Comparar com a origem e o que
          # continua pegando a duplicacao (duplicar daria o dobro da origem) sem
          # quebrar no dia em que o banco de CI passa a ter mais uma conta -- que
          # e o que aconteceu aqui: o `1` cravado vinha da epoca em que a unica
          # conta era a do proprio drill, e hoje tem tambem a que o
          # 027_historico_antes_da_027.sql commita de proposito.
          contas_origem=$(psql "$URL_ORIGEM" --no-psqlrc -tAc "SELECT count(*) FROM auth.users")
          contas=$(psql "$URL_DESTINO" --no-psqlrc -tAc "SELECT count(*) FROM auth.users")
          if [ "$saldo" != '1234.56' ] || [ "$contas" != "$contas_origem" ]; then
            echo "::error::merge terminou errado (saldo '$saldo', contas '$contas', origem '$contas_origem')."
            exit 1
          fi
          echo "merge restaurou por cima das contas existentes sem duplicar nada ($contas conta(s))."
