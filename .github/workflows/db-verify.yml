name: db-verify

# Prova, a cada mudanca em database/, que o schema versionado ainda sobe do zero
# e que a RLS continua isolando um usuario do outro. Se este job ficar vermelho,
# o repositorio perdeu a capacidade de reconstruir o banco -- que e exatamente o
# problema que a HMO-117 existiu para resolver.

# lib/recurrence.ts e scripts/test-recurrence.mjs entram nos paths porque a
# agenda de contas previstas e metade SQL, metade aritmetica de data: o indice
# unico do 005 so garante que a MESMA data nao duplica -- quem decide QUAL data
# e o TypeScript. Testar os dois lados no mesmo job e o que fecha o buraco.
on:
  push:
    branches: [main]
    paths: ['database/**', 'scripts/db-*.sh', 'scripts/gen-*.mjs', 'scripts/test-*.mjs', 'scripts/tsconfig.*-test.json', 'scripts/resolve-aliases.mjs', 'lib/recurrence.ts', 'lib/recurrence-detector.ts', 'lib/settlement.ts', 'lib/grupos.ts', 'lib/orcamento-de-grupo.ts', 'lib/parte-do-grupo.ts', 'lib/statement.ts', 'lib/categorization.ts', 'lib/calculadoras.ts', 'lib/net-worth.ts', 'lib/card-invoice.ts', 'lib/transferencia.ts', 'lib/movimentacoes.ts', 'lib/cambio.ts', 'lib/lancamento.ts', 'lib/lista-de-lancamentos.ts', 'lib/safe-to-spend.ts', 'lib/anomalies.ts', 'lib/cash-flow-forecast.ts', 'lib/variable-spend.ts', 'lib/investments.ts', 'lib/auth-callback.ts', 'lib/signup-outcome.ts', 'lib/offline-session.ts', 'lib/offline-queue.ts', 'lib/offline-cache.ts', 'lib/ensure-profile.ts', 'lib/busca-de-perfil.ts', 'lib/services/budget.ts', 'lib/services/reports.ts', 'lib/services/recurrence-scan.ts', 'lib/services/recurrence-alerts.ts', 'lib/services/categorization.ts', 'lib/services/cron-ledger.ts', 'types/financial.ts', '.github/workflows/db-verify.yml']
  pull_request:
    paths: ['database/**', 'scripts/db-*.sh', 'scripts/gen-*.mjs', 'scripts/test-*.mjs', 'scripts/tsconfig.*-test.json', 'scripts/resolve-aliases.mjs', 'lib/recurrence.ts', 'lib/recurrence-detector.ts', 'lib/settlement.ts', 'lib/grupos.ts', 'lib/orcamento-de-grupo.ts', 'lib/parte-do-grupo.ts', 'lib/statement.ts', 'lib/categorization.ts', 'lib/calculadoras.ts', 'lib/net-worth.ts', 'lib/card-invoice.ts', 'lib/transferencia.ts', 'lib/movimentacoes.ts', 'lib/cambio.ts', 'lib/lancamento.ts', 'lib/lista-de-lancamentos.ts', 'lib/safe-to-spend.ts', 'lib/anomalies.ts', 'lib/cash-flow-forecast.ts', 'lib/variable-spend.ts', 'lib/investments.ts', 'lib/auth-callback.ts', 'lib/signup-outcome.ts', 'lib/offline-session.ts', 'lib/offline-queue.ts', 'lib/offline-cache.ts', 'lib/ensure-profile.ts', 'lib/busca-de-perfil.ts', 'lib/services/budget.ts', 'lib/services/reports.ts', 'lib/services/recurrence-scan.ts', 'lib/services/recurrence-alerts.ts', 'lib/services/categorization.ts', 'lib/services/cron-ledger.ts', 'types/financial.ts', '.github/workflows/db-verify.yml']
  workflow_dispatch:

jobs:
  migrations:
    name: schema do zero + isolamento de RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulodogato_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pulodogato_ci
      PSQL: psql -v ON_ERROR_STOP=1 --no-psqlrc

    steps:
      - uses: actions/checkout@v4

      # O `npm ci` e so pelo tsc: o teste de recorrencia compila
      # lib/recurrence.ts com o TypeScript que ja e devDependency, em vez de
      # trazer um runner de teste novo so para conferir aritmetica de data.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Tem que ser o 17: o ubuntu-latest traz o cliente 16, e o pg_dump se
      # recusa a falar com um servidor mais novo que ele.
      - name: Instalar o cliente Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      # O Supabase de verdade ja tem schema auth e roles anon/authenticated;
      # num Postgres cru e preciso recria-los antes.
      # O bundle de database/validation/ e uma copia gerada das migrations, para
      # o dono do projeto colar no SQL Editor do Supabase. Copia que sai de
      # sincronia e pior do que nao ter copia: ele validaria um schema que nao e
      # mais o nosso e o relatorio sairia verde. O --check nao toca no banco.
      - name: Bundle de validacao em dia com as migrations
        run: node scripts/gen-validation-bundle.mjs --check

      - name: Shim do Supabase
        run: $PSQL -f database/tests/00_supabase_shim.sql

      - name: 001_baseline
        run: $PSQL -f database/migrations/001_baseline.sql

      - name: 002_rls_lockdown
        run: $PSQL -f database/migrations/002_rls_lockdown.sql

      # O 002 ligou RLS nas tabelas derivadas, que sao mantidas por trigger --
      # e trigger roda com o privilegio de quem disparou o comando. Sem o 003
      # (SECURITY DEFINER) o cadastro de usuario e a aprovacao de divisao
      # batem na propria RLS e derrubam a transacao. Ver HMO-123 / HMO-125.
      - name: 003_fix_trigger_privileges
        run: $PSQL -f database/migrations/003_fix_trigger_privileges.sql

      # O 004 fecha os triggers que sobraram do 003 (HMO-125). Ficou de fora
      # deste job ate 2026-09-22, entao o CI validava uma cadeia que nao era a
      # de producao.
      - name: 004_fix_remaining_trigger_privileges
        run: $PSQL -f database/migrations/004_fix_remaining_trigger_privileges.sql

      - name: 005_recurring_and_scheduled
        run: $PSQL -f database/migrations/005_recurring_and_scheduled.sql

      # Aplicar duas vezes tem que ser inofensivo: o 005 e re-executavel de
      # proposito, porque depois que ele entrar em producao o 001 regerado ja
      # vai trazer as tabelas dele.
      - name: 005 e idempotente
        run: $PSQL -f database/migrations/005_recurring_and_scheduled.sql

      # O teste prova ausencia de vazamento. Uma tabela sem RLS e vazia passaria
      # nele, entao a cobertura e checada separadamente logo abaixo.
      - name: Teste de isolamento de RLS
        run: $PSQL -f database/tests/rls_isolation_test.sql

      - name: 006_budgets_and_card_invoices
        run: $PSQL -f database/migrations/006_budgets_and_card_invoices.sql

      # Mesmo motivo do 005: depois que o 006 entrar em producao, o 001
      # regerado ja vai trazer budgets e as duas views.
      - name: 006 e idempotente
        run: $PSQL -f database/migrations/006_budgets_and_card_invoices.sql

      # Contas previstas: isolamento, a view security_invoker e as invariantes
      # de dinheiro (paga sem transacao, ocorrencia duplicada).
      - name: Teste das contas previstas
        run: $PSQL -f database/tests/scheduled_rls_test.sql

      # Orcamento e fatura: o consumo soma as transacoes certas, o teto pessoal
      # nao se confunde com o do grupo, as duas views respeitam a RLS e a
      # aritmetica da fatura acerta os meses curtos.
      #
      # A assercao que mais importa e a do SINAL: despesa e gravada NEGATIVA
      # neste banco, entao um SUM(amount) cru na view de consumo devolveria -800
      # para quem gastou 800 -- ratio negativo, status 'ok' para sempre, alerta
      # de estouro que nunca dispara, e nenhum erro em lugar nenhum.
      - name: Teste do orcamento e da fatura
        run: $PSQL -f database/tests/budget_invoice_test.sql

      - name: 007_group_settlements
        run: $PSQL -f database/migrations/007_group_settlements.sql

      # Mesmo motivo do 005 e do 006. O 007 tem um agravante proprio: ele faz
      # um UPDATE de manutencao em financial_transactions (backfill de
      # group_id), e rodar duas vezes nao pode mexer no saldo das contas na
      # segunda passada. A propria migration aborta se mexer.
      - name: 007 e idempotente
        run: $PSQL -f database/migrations/007_group_settlements.sql

      # Acerto de contas do grupo. A assercao que mais importa e o SINAL:
      # registrar um pagamento tem que APROXIMAR o saldo de zero. O erro
      # simetrico dobra a divida a cada Pix registrado e a tela mostraria a
      # sugestao de transferencia CRESCENDO depois de cada pagamento -- sem
      # erro nenhum em lugar nenhum.
      #
      # Cobre tambem os tres defeitos que o 007 conserta no schema herdado:
      # o rateio que perdia centavo (grupo nunca fechava), o trigger que
      # reescrevia divisao personalizada como igualitaria, e o trigger de saldo
      # que cobrava o valor de novo a cada edicao de lancamento.
      - name: Teste do acerto de contas do grupo
        run: $PSQL -f database/tests/group_settlement_test.sql

      - name: 008_goals_and_reports
        run: $PSQL -f database/migrations/008_goals_and_reports.sql

      # Mesmo motivo do 005, 006 e 007: depois que o 008 entrar em producao, o
      # 001 regerado ja vai trazer as metas e as cinco views.
      - name: 008 e idempotente
        run: $PSQL -f database/migrations/008_goals_and_reports.sql

      # Metas e relatorios. A assercao que mais importa e de novo o SINAL:
      # despesa e gravada NEGATIVA, e um SUM cru nas views devolveria gasto
      # negativo -- barra para baixo e um "voce economizou" onde houve gasto,
      # sem erro em lugar nenhum. Mesma familia do erro que quase passou no 006.
      #
      # Cobre tambem as tres armadilhas proprias desta fase:
      #   - 'transfer' nao e receita nem despesa no fluxo de caixa, mas CONTA
      #     no patrimonio (o trigger de saldo mexe em qualquer tipo);
      #   - previsto x realizado casa o mes pessoal, onde group_id e NULL dos
      #     dois lados -- com `=` em vez de IS NOT DISTINCT FROM a tela diria
      #     que o usuario nao realizou nada do que planejou;
      #   - o progresso da meta sai dos APORTES, nunca do saldo da conta.
      - name: Teste das metas e dos relatorios
        run: $PSQL -f database/tests/goals_reports_test.sql

      - name: 009_statements_alerts_receipts
        run: $PSQL -f database/migrations/009_statements_alerts_receipts.sql

      # Mesmo motivo do 005 ao 008. A SECAO 11 do 009 (bucket de comprovantes)
      # se pula sozinha aqui: o schema `storage` so existe num Supabase de
      # verdade. As outras dez secoes sao provadas normalmente.
      - name: 009 e idempotente
        run: $PSQL -f database/migrations/009_statements_alerts_receipts.sql

      # Extrato, avisos e comprovantes. A assercao central e a DEDUPLICACAO,
      # nas duas metades: reimportar o mesmo arquivo nao pode duplicar nada, e
      # a mesma linha em OUTRA conta tem que entrar. Sem a primeira, cada
      # reimportacao dobra o mes; sem a segunda, o extrato da poupanca perde
      # lancamentos que existiram de verdade.
      #
      # Cobre tambem:
      #   - o SINAL do extrato (debito importado continua NEGATIVO, e portanto
      #     continua sendo despesa nas views do 008);
      #   - a paridade status <-> transaction_id, que impede uma linha ficar
      #     'imported' sem lancamento -- invisivel para sempre sem nunca ter
      #     virado dinheiro;
      #   - o COALESCE(3) da janela de aviso: um INNER JOIN em
      #     notification_preferences daria view vazia e o cron sairia verde sem
      #     avisar ninguem, que e a pior falha possivel por ser silenciosa;
      #   - a UNIQUE que impede o mesmo aviso sair todo dia -- e o adiamento,
      #     que merece aviso novo.
      #
      # Tem dois controles negativos: sem security_invoker o vazamento aparece,
      # e sem o indice unico o duplicado entra.
      - name: Teste do extrato, dos avisos e dos comprovantes
        run: $PSQL -f database/tests/statements_alerts_test.sql

      - name: 010_user_connections
        run: $PSQL -f database/migrations/010_user_connections.sql

      # Mesmo motivo do 005 ao 009.
      - name: 010 e idempotente
        run: $PSQL -f database/migrations/010_user_connections.sql

      # Conexoes entre usuarios. A assercao central e o CONSENTIMENTO: quem
      # pede a conexao nao pode aceita-la sozinho. Sem o `status = 'pending'`
      # no WITH CHECK da policy de INSERT, qualquer usuario logado gravaria
      # (eu, a vitima, 'accepted') e passaria a constar como conexao aceita
      # dela -- e conexao aceita e o que habilita puxar alguem para o rateio
      # de uma despesa. Nada falharia, e a vitima so descobriria vendo um
      # estranho na propria lista de divisao.
      #
      # Cobre tambem: o par unico nos DOIS sentidos (A->B e B->A viram dois
      # pendentes, e aceitar um deixa o outro pendente para sempre), o
      # bloqueio que dura (com DELETE simetrico, quem foi recusado apaga a
      # linha e pede de novo indefinidamente), e os NOMES das duas foreign
      # keys -- a PostgREST resolve o embed do perfil pelo nome da constraint,
      # entao com nome gerado a tabela existe e a tela continua quebrada.
      #
      # Tem dois controles negativos: as duas regras sao reintroduzidas
      # quebradas no fim do arquivo e o defeito tem que voltar a acontecer.
      - name: Teste das conexoes entre usuarios
        run: $PSQL -f database/tests/user_connections_test.sql

      # O 011 entrou na main pelo PR #20 e nunca foi exercitado aqui: o CI
      # validava uma cadeia que parava no 010 enquanto producao ja tinha o 011.
      - name: 011_detected_recurrences
        run: $PSQL -f database/migrations/011_detected_recurrences.sql

      # Mesmo motivo do 005 ao 010.
      - name: 011 e idempotente
        run: $PSQL -f database/migrations/011_detected_recurrences.sql

      - name: 012_payroll
        run: $PSQL -f database/migrations/012_payroll.sql

      - name: 012 e idempotente
        run: $PSQL -f database/migrations/012_payroll.sql

      # Contracheque. A assercao central e QUAL valor vira lancamento: tem que
      # ser o LIQUIDO e POSITIVO. Gravando o bruto, o fluxo de caixa do 008
      # mostraria uma receita que nunca foi recebida; gravando o liquido com
      # sinal trocado, as views do 008 leriam salario como DESPESA. Nos dois
      # casos o saldo da conta continua fechando -- que e o que torna o erro
      # invisivel.
      #
      # Cobre tambem: o teto do desconto (um IRRF com um zero a mais produz
      # liquido negativo, que vira despesa nos relatorios), o UNIQUE que impede
      # a renda do mes dobrar, e o security_invoker da view do liquido.
      #
      # Tem dois controles negativos: sem security_invoker a view vaza o
      # salario alheio, e sem o trigger o liquido fica negativo.
      - name: Teste do contracheque
        run: $PSQL -f database/tests/payroll_test.sql

      # O 013 fecha a unica view do schema que ficou sem security_invoker: a
      # `user_subscription_details`, criada no 001_baseline antes de a 002
      # ligar RLS. As migrations que ligaram a opcao (006, 008, 012) so
      # cobriram as views que elas mesmas criaram, e essa passou por doze
      # migrations devolvendo nome, email e plano de TODOS os usuarios para
      # qualquer usuario logado (HMO-145).
      - name: 013_fix_user_subscription_details_leak
        run: $PSQL -f database/migrations/013_fix_user_subscription_details_leak.sql

      # Mesmo motivo do 005 ao 012.
      - name: 013 e idempotente
        run: $PSQL -f database/migrations/013_fix_user_subscription_details_leak.sql

      - name: 014_categorization_rules
        run: $PSQL -f database/migrations/014_categorization_rules.sql

      # Mesmo motivo do 005 ao 013. Aqui a re-execucao prova tambem que a
      # SECAO 7 do proprio arquivo (a prova que aborta se a RLS, as 4 policies,
      # o UNIQUE, a trigger ou o fechamento do anon nao tiverem pegado) passa
      # num banco onde a tabela JA existe -- que e o caso de producao no dia em
      # que alguem rodar a migration duas vezes.
      - name: 014 e idempotente
        run: $PSQL -f database/migrations/014_categorization_rules.sql

      - name: 015_card_invoice_payment
        run: $PSQL -f database/migrations/015_card_invoice_payment.sql

      # Mesmo motivo do 005 ao 014, com um agravante proprio: o 015 ESCREVE em
      # dado existente (desfaz baixas de fatura tortas). Rodar duas vezes prova
      # que a segunda passada nao desfaz uma baixa correta feita no meio.
      - name: 015 e idempotente
        run: $PSQL -f database/migrations/015_card_invoice_payment.sql

      # Pagar a fatura do cartao contava a mesma despesa DUAS vezes: a baixa
      # lancava a fatura como despesa no PROPRIO cartao, entao o cartao ficava
      # mais negativo e a conta de onde o dinheiro saiu nao se mexia. Nada
      # quebrava -- o patrimonio ficava 25% menor, plausivel, com duas casas.
      #
      # O teste tem controle POSITIVO: ele reproduz o bug antes de consertar
      # (patrimonio caindo de 4.000 para 3.000, fluxo de caixa acusando 3.000
      # de despesa num mes de 2.000). Sem isso, o teste do conserto passaria
      # num banco onde o bug nunca existiu.
      #
      # E tem os dois controles negativos que mais importam, porque um reparo
      # ingenuo destruiria dado bom: a assinatura cobrada NO cartao (pagar
      # aquela conta com o cartao e despesa de verdade -- um reparo por
      # account_type apagaria o lancamento e a despesa desapareceria do
      # relatorio) e a nota escrita a mao que so PARECE a chave canonica.
      #
      # lib/card-invoice.ts prova a aritmetica das duas pernas; o que so o SQL
      # alcanca e o trigger de saldo e as views do 006/008, que e exatamente a
      # junta onde o bug vivia -- o VALOR estava certo, a CONTA estava errada.
      - name: Pagamento de fatura nao conta a despesa duas vezes
        run: $PSQL -f database/tests/card_invoice_payment_test.sql

      # A auditoria e o arquivo que o Helio COLA no SQL Editor de producao
      # antes de aplicar a 015. Um nome de coluna errado ali nao aparece em
      # lugar nenhum ate o momento em que ele precisa da resposta -- e a
      # resposta que ele precisa e sobre dinheiro ja gravado.
      #
      # `BEGIN READ ONLY` faz o proprio postgres provar as duas coisas que o
      # arquivo promete: que toda referencia a tabela, coluna e funcao resolve
      # contra o schema real (001 -> 015 ja aplicados acima), e que ele NAO
      # ESCREVE -- um INSERT, UPDATE ou DELETE que entrasse aqui por descuido
      # aborta a transacao em vez de passar despercebido. O ROLLBACK no fim e
      # cinto e suspensorio: nada a desfazer, por construcao.
      #
      # Nenhum outro script de database/maintenance/ tinha cobertura de CI ate
      # aqui, incluindo o 007. Este e o primeiro.
      - name: A auditoria de faturas roda e nao escreve nada
        run: |
          printf 'BEGIN READ ONLY;\n\\i database/maintenance/015_auditoria_faturas.sql\nROLLBACK;\n' \
            | $PSQL

      - name: 016_recurrence_notifications
        run: $PSQL -f database/migrations/016_recurrence_notifications.sql

      # Mesmo motivo do 005 ao 015. O risco proprio deste e o ALTER: a segunda
      # passada nao pode quebrar na coluna que ja existe nem recriar constraint.
      - name: 016 e idempotente
        run: $PSQL -f database/migrations/016_recurrence_notifications.sql

      # A HMO-148 existe por UM motivo: nao avisar o usuario duas vezes do mesmo
      # alerta de assinatura. A varredura roda no cron diario E ao fim de cada
      # importacao de extrato, entao sem deduplicacao quem importa tres extratos
      # numa tarde recebe o mesmo push tres vezes, desliga a notificacao do app,
      # e perde junto o aviso de vencimento -- que e o que ele mais precisa.
      #
      # O assert que justifica o arquivo: o `ON CONFLICT (recurrence_id, kind,
      # reference_date)` que a rota manda -- lista de colunas NUA, que e tudo o
      # que o PostgREST sabe mandar -- tem que RESOLVER contra o indice do 016.
      # O desenho original da issue pedia um indice unico PARCIAL, e indice
      # parcial nao serve de arbitro de ON CONFLICT sem repetir o predicado na
      # clausula: com ele o cron responderia 500 em toda execucao e ninguem
      # receberia aviso nenhum. Nenhum teste de TypeScript com cliente dublado
      # pega isso -- so o Postgres.
      #
      # E tem os controles negativos que importam: uma cobranca NOVA tem que
      # gerar aviso novo (senao um indice sem a data passaria verde e o reajuste
      # do ano seguinte sairia calado), e duas contas previstas vencendo no mesmo
      # dia continuam gerando dois avisos (o que so funciona porque NULL nao
      # colide com NULL no indice novo).
      - name: O aviso de assinatura nao sai duas vezes
        run: $PSQL -f database/tests/recurrence_notifications_test.sql

      - name: 017_monthly_summary_notifications
        run: $PSQL -f database/migrations/017_monthly_summary_notifications.sql

      # Mesmo motivo do 005 ao 016. O risco proprio deste e o ALTER: a segunda
      # passada nao pode quebrar na coluna que ja existe nem recriar constraint.
      - name: 017 e idempotente
        run: $PSQL -f database/migrations/017_monthly_summary_notifications.sql

      # O resumo do mes fechado e a TERCEIRA familia de aviso, e a unica que nao
      # aponta para objeto nenhum -- e sobre um mes, nao sobre uma conta nem
      # sobre uma assinatura. Dois riscos que so o Postgres pega:
      #
      #   - o `ON CONFLICT (user_id, kind, summary_month)` que o cron manda e
      #     lista de colunas NUA (e tudo o que o PostgREST sabe mandar) e tem
      #     que resolver contra o indice. Trocar o indice por um PARCIAL -- que
      #     e a forma que parece mais limpa -- faz o cron responder 500 em toda
      #     execucao, e a mensagem nao aponta para o indice;
      #   - a familia ANTIGA tem que sobreviver: duas contas vencendo no mesmo
      #     dia continuam gerando DOIS avisos. Um indice ingenuo sobre
      #     (user_id, kind, reference_date) recusaria o segundo, trocando aviso
      #     repetido por aviso PERDIDO -- o erro caro dos dois.
      - name: O resumo do mes nao sai duas vezes, e nao engole o aviso de conta
        run: $PSQL -f database/tests/monthly_summary_notifications_test.sql

      - name: 018_goal_monthly_contribution
        run: $PSQL -f database/migrations/018_goal_monthly_contribution.sql

      # Mesmo motivo do 005 ao 017. O risco proprio deste e o CREATE OR REPLACE
      # VIEW: a segunda passada nao pode quebrar por a coluna ja estar no fim do
      # SELECT, e nao pode derrubar o security_invoker da view.
      - name: 018 e idempotente
        run: $PSQL -f database/migrations/018_goal_monthly_contribution.sql

      - name: 019_cron_runs
        run: $PSQL -f database/migrations/019_cron_runs.sql

      # Re-executavel: o IF NOT EXISTS de cada CHECK e o DO/IF da policy tem
      # que atravessar a segunda passada sem erro. A policy tem um ramo a mais
      # que os outros arquivos -- ela so nasce se o papel `paperclip_ro`
      # existir, e aqui ele NAO existe (e credencial de producao). Este step
      # exercita justamente o ramo do RAISE NOTICE.
      - name: 019 e idempotente
        run: $PSQL -f database/migrations/019_cron_runs.sql

      - name: 020_group_archive_schema
        run: $PSQL -f database/migrations/020_group_archive_schema.sql

      # Re-executavel: as colunas entram com ADD COLUMN IF NOT EXISTS, as FKs
      # passam por um DO/IF sobre pg_constraint, e os dois CHECK sao
      # DROP IF EXISTS + ADD.
      - name: 020 e idempotente
        run: $PSQL -f database/migrations/020_group_archive_schema.sql

      # O schema que a feature de grupos arquivados sempre pediu e nunca teve.
      # O que so o Postgres pega aqui:
      #
      #   - `group_members_status_check` NAO aceitava 'archived', e o codigo
      #     grava exatamente esse valor ao arquivar. So criar as colunas deixaria
      #     a tela vazia para sempre, porque as duas consultas da rota filtram
      #     por esse status -- com cara de "voce nao tem grupos arquivados";
      #   - o `ON DELETE SET NULL` de `archived_by` ESCREVE a linha, e o CHECK e
      #     avaliado nessa escrita. A primeira versao da 020 usava o par
      #     simetrico e tornava impossivel apagar um perfil que ja arquivou um
      #     grupo -- este teste foi quem reprovou;
      #   - o caso 5 e controle POSITIVO: sem ele, os casos de recusa ficariam
      #     satisfeitos por um CHECK que recusa tudo.
      - name: A 020 recusa a linha errada e aceita a certa
        run: $PSQL -f database/tests/020_group_archive_test.sql

      - name: 021_investments
        run: $PSQL -f database/migrations/021_investments.sql

      # Re-executavel, e aqui houve um detalhe: o UNIQUE (id, user_id) da tabela
      # de ativos NAO pode usar o padrao DROP IF EXISTS + ADD do resto do
      # arquivo. A FK composta da tabela de lancamentos depende do indice dele, e
      # o DROP falha com "other objects depend on it" na segunda passada -- este
      # passo foi quem pegou. Ele entra por um DO/IF sobre pg_constraint.
      - name: 021 e idempotente
        run: $PSQL -f database/migrations/021_investments.sql

      # A carteira de investimentos. O que so o Postgres pega:
      #
      #   - a politica de INSERT (`user_id = auth.uid()`) olha a coluna user_id da
      #     LINHA NOVA, que o atacante preenche corretamente com a propria
      #     identidade -- nada nela olha de QUEM e o asset_id. Sem a FK COMPOSTA
      #     para (id, user_id), o usuario A grava lancamento dentro da carteira do
      #     usuario B e a soma de proventos de B muda sem B fazer nada. A RLS de
      #     SELECT esconde o ativo de B, mas esconder na leitura nao impede a
      #     escrita. O caso 1 do teste e exatamente esse, e o mutante (FK simples
      #     para `id`) morre nele;
      #   - o par `current_price` / `current_price_at`: preco sem data e um numero
      #     que o usuario nao sabe de quando e, e e nele que ele decide se vende;
      #   - `symbol = upper(symbol)` com o UNIQUE por usuario. Sem isso "petr4" e
      #     "PETR4" viram duas linhas e a carteira mostra o mesmo ativo duas
      #     vezes, cada uma com METADE da posicao -- os dois numeros parecem
      #     plausiveis e nenhum esta certo;
      #   - os CHECK de valor positivo, que e onde a convencao desta tabela se
      #     separa de `financial_transactions`: aqui o sinal NAO carrega
      #     significado, quem carrega e `kind`. Quem tentar representar venda como
      #     quantidade negativa bate no CHECK em vez de produzir preco medio
      #     errado em silencio;
      #   - o caso 8 e controle POSITIVO da RLS: ele grava um ativo do usuario A
      #     de volta antes de checar o isolamento, porque o caso 7 apagou o unico
      #     que existia -- sem isso "B nao ve ativo do A" passaria por AUSENCIA de
      #     dado, que e a assercao mais convincente que existe e nao prova nada.
      - name: A 021 recusa a linha errada e aceita a certa
        run: $PSQL -f database/tests/021_investments_test.sql

      - name: 022_currency
        run: $PSQL -f database/migrations/022_currency.sql

      - name: 022 e idempotente
        run: $PSQL -f database/migrations/022_currency.sql

      # A moeda por conta e por lancamento. O que so o Postgres pega:
      #
      #   - a 022 nao acrescenta coluna, ela muda o GRAO das tres views de
      #     relatorio do 008. Guardar a moeda sem isso e o pior resultado
      #     possivel: o app ganharia o seletor e `SUM(ABS(amount))` passaria a
      #     somar 1000 reais com 180 dolares e devolver 1180 -- um numero que nao
      #     esta em moeda nenhuma, com cara de total, e para MAIS, que e o lado do
      #     qual ninguem reclama. Nenhum teste de TypeScript le view;
      #   - `planned_vs_actual` nao pediu nada nesta issue e quebra do mesmo jeito:
      #     ela le `monthly_cash_flow` por LEFT JOIN LATERAL sem agregado e sem
      #     LIMIT. Uma linha por mes virou uma por MOEDA, e o LATERAL multiplica a
      #     chave -- o mes sai duplicado com o previsto repetido inteiro em cada
      #     copia. O caso 5 do teste e o controle negativo disso: ele reproduz o
      #     LATERAL antigo sobre a view nova e EXIGE que 900 previstos virem 1800.
      #     Sem ele, o caso 4 nao distingue "a correcao funciona" de "o cenario
      #     nunca exercitou o bug";
      #   - a moeda que vale e a do LANCAMENTO, nao a da conta ("os-dois" na
      #     interaction). Um mutante que le a moeda da conta por JOIN aplica
      #     limpo e devolve 1080 no lugar de 1000 -- o gasto em dolar no cartao
      #     em reais contado como real;
      #   - o default 'BRL' e a decisao "ficam-brl": o INSERT sem moeda -- que e
      #     o INSERT de todo codigo anterior a esta issue -- tem de dar BRL;
      #   - as tres views sao recriadas, e `CREATE OR REPLACE` preserva
      #     reloptions apenas em teoria. Sem `security_invoker`, `monthly_cash_flow`
      #     devolve a renda mensal de TODOS os usuarios para qualquer um logado.
      - name: A moeda entra no grao e o total para de misturar
        run: $PSQL -f database/tests/022_currency_test.sql

      - name: 023_categoria_de_transferencia
        run: $PSQL -f database/migrations/023_categoria_de_transferencia.sql

      # Re-executavel: o seed entra por `WHERE NOT EXISTS` sobre (service_id,
      # name), que e a UNIQUE da tabela. Um `ON CONFLICT (id)` sozinho passaria
      # na primeira passada e estouraria por nome duplicado na segunda.
      - name: 023 e idempotente
        run: $PSQL -f database/migrations/023_categoria_de_transferencia.sql

      # A categoria reservada da transferencia. Este passo existe por um defeito
      # que atravessou o CI inteiro e ficou 100% quebrado em producao:
      #
      #   - `transaction_categories` e tabela de REFERENCIA (sem user_id). O 002
      #     so deu `GRANT SELECT`, e a unica policy dela e FOR SELECT. A HMO-164
      #     criava a categoria reservada SOB DEMANDA, de dentro da rota -- um
      #     INSERT que volta 42501 em toda chamada, de todo usuario, para sempre;
      #   - e o SELECT anterior a ele tambem nao achava nada, porque a policy de
      #     leitura e `USING (is_active = TRUE)` e a linha reservada precisa
      #     nascer FALSE para ficar fora dos seletores. As duas metades falhavam;
      #   - nada disso aparece em teste de unidade: `pernasDaTransferencia` e
      #     funcao pura e devolvia -- e devolve -- as duas pernas certas. O
      #     defeito mora na PERMISSAO, e so um INSERT de verdade o encontra;
      #   - a policy nova tem que ser ESTREITA. "Toda categoria inativa e
      #     legivel" passa na assercao de leitura e ressuscita, na tela de todo
      #     mundo, qualquer categoria que alguem desativou -- o terceiro caso do
      #     teste e o controle negativo disso;
      #   - e `authenticated` tem que continuar SEM escrever na tabela: abrir o
      #     INSERT faria a rota funcionar e e o conserto errado, porque a tabela
      #     e global. O teste recusa esse conserto explicitamente.
      - name: A transferencia acha a categoria reservada e grava as duas pernas
        run: $PSQL -f database/tests/023_categoria_de_transferencia_test.sql

      - name: 024_edicao_de_despesa_de_grupo
        run: $PSQL -f database/migrations/024_edicao_de_despesa_de_grupo.sql

      # Re-executavel: as funcoes entram por CREATE OR REPLACE, o gemeo sai por
      # DROP IF EXISTS, o indice unico e IF NOT EXISTS e o reparo da SECAO 4 nao
      # acha nada para consertar na segunda passada -- ele so olha divergencia,
      # e a primeira passada ja a desfez.
      - name: 024 e idempotente
        run: $PSQL -f database/migrations/024_edicao_de_despesa_de_grupo.sql

      # Editar despesa de grupo. O que so o Postgres pega aqui:
      #
      #   - o recalculo tem que passar pelo `calculate_equal_split` do 007, e
      #     nao por uma divisao nova: R$ 100 entre 3 depois da edicao da
      #     33,34 / 33,33 / 33,33. Uma formula propria daria 33,33 tres vezes e
      #     deixaria um centavo de saldo residual que nenhum pagamento zera --
      #     o defeito que o 007 existiu para tirar, voltando pela edicao;
      #   - SECURITY INVOKER passa neste teste se ele rodar so como postgres. A
      #     SECAO 6 edita como `authenticated` sendo membro COMUM, que e quem a
      #     policy de DELETE de group_expense_splits (so admin) barraria -- em
      #     silencio, afetando zero linhas, e so para quem nao e admin;
      #   - e a contrapartida do DEFINER: a SECAO 6 tambem chama
      #     `refazer_rateio_do_grupo` na mao, com a despesa de OUTRO usuario, e
      #     exige 42501. Sem essa checagem a funcao seria uma porta para
      #     reescrever a divisao de qualquer grupo do banco;
      #   - rateio combinado (70/30) tem que ser reescalado pela porcentagem, e
      #     nao achatado para partes iguais -- o achatamento e exatamente a
      #     regressao que o 007 tirou, e refazer a divisao "do zero" a traria de
      #     volta pela porta dos fundos;
      #   - a trava da opcao (b) nao pode ser meia trava: depois do PDG01 o
      #     teste exige que o VALOR da transacao tenha ficado como estava. Uma
      #     trava que so impede o rateio deixaria valor novo com partes velhas,
      #     que e o bug original com outra roupa.
      - name: Editar despesa de grupo refaz a divisao, e parte aprovada trava
        run: $PSQL -f database/tests/024_edicao_de_despesa_de_grupo_test.sql

      - name: 025_travar_repontamento_de_divisao
        run: $PSQL -f database/migrations/025_travar_repontamento_de_divisao.sql

      # Re-executavel: a funcao entra por CREATE OR REPLACE e o trigger sai por
      # DROP IF EXISTS antes de ser recriado. A prova da migration nao depende
      # de estado anterior -- ela so olha o catalogo.
      - name: 025 e idempotente
        run: $PSQL -f database/migrations/025_travar_repontamento_de_divisao.sql

      # A trava de repontamento de divisao (HMO-130). O que so o Postgres pega:
      #
      #   - o vazamento nao esta em nenhuma policy nem em nenhuma rota: ele sai
      #     da COMBINACAO de `expense_splits_update` (que alcanca a linha
      #     inteira, porque policy de RLS nao compara OLD com NEW) com
      #     `calculate_split_amount` em SECURITY DEFINER (que le
      #     financial_transactions sem RLS). Ler qualquer um dos dois sozinho
      #     nao mostra nada -- so um UPDATE de verdade, como `authenticated`,
      #     junta as duas metades;
      #   - a SECAO 2 e CONTROLE POSITIVO: ela DERRUBA o trigger dentro da
      #     transacao e exige que o ataque devolva 777,77, o valor da despesa
      #     que o participante nao enxerga. Sem ela o arquivo estaria provando
      #     que um ataque impossivel continua impossivel, e passaria verde num
      #     banco onde a 025 nem tivesse sido aplicada;
      #   - a SECAO 6 e a contrapartida: o DONO tem que continuar remanejando a
      #     porcentagem. Congelar a coluna para todo mundo tranca o vazamento e
      #     o produto junto -- e passa em todas as outras assercoes;
      #   - a SECAO 5 roda o que a rota de divisoes realmente escreve (status,
      #     approved_at, rejection_reason). Uma trava larga demais aqui refaria
      #     a HMO-125, em que aprovar divisao ficou quebrado em producao sem
      #     ninguem notar;
      #   - e a SECAO 8 prova que `amount` nao precisa de trava propria: e
      #     coluna derivada, reescrita pelo recalculo em toda passada. Se um dia
      #     deixar de ser, o participante baixa a propria divida na mao.
      - name: Participante nao reaponta a divisao nem le valor de despesa alheia
        run: $PSQL -f database/tests/025_travar_repontamento_de_divisao_test.sql

      - name: 026_cambio_do_grupo
        run: $PSQL -f database/migrations/026_cambio_do_grupo.sql

      # Re-executavel: as colunas entram por ADD COLUMN IF NOT EXISTS, os CHECKs
      # so sao criados quando `pg_constraint` nao os tem, e as duas views entram
      # por CREATE OR REPLACE.
      - name: 026 e idempotente
        run: $PSQL -f database/migrations/026_cambio_do_grupo.sql

      # O cambio do grupo (HMO-138 item 3). O que so o Postgres pega aqui:
      #
      #   - as duas views que somavam dinheiro sem saber de moeda. A 022 resolveu
      #     o relatorio PESSOAL mostrando separado por moeda; grupo nao pode
      #     mostrar separado -- um acerto de contas em duas colunas nao e um
      #     acerto de contas. O teste mede o erro que a soma cega produz: no
      #     cenario dele a credora de R$ 81,50 aparece devendo R$ 310, ou seja o
      #     defeito erra o SINAL e o acerto manda o dinheiro na direcao
      #     contraria. E a conta cega FECHA (os saldos somam zero, residual
      #     zero), entao nenhuma assercao de consistencia a pega;
      #   - a SECAO 3 e CONTROLE POSITIVO: reproduz a formula do 007 sobre os
      #     mesmos dados e exige o numero errado. Sem ela o arquivo passaria
      #     verde num banco onde a 026 nem tivesse sido aplicada;
      #   - a conversao tem que ser por LINHA, dentro do SUM. Aplicada ao total
      #     (`SUM(...) * MAX(exchange_rate)`) ela da o MESMO numero enquanto cada
      #     pessoa tiver uma moeda so -- medido: esse mutante sobreviveu a 39
      #     assercoes. Por isso o cenario tem uma pessoa pagando nas duas moedas;
      #   - o CHECK `(currency = 'BRL') = (exchange_rate = 1)`, que e o que fecha
      #     o unico caminho de perda silenciosa que sobra: lancamento em dolar
      #     gravado com a cotacao DEFAULT de 1 vale um quinto do que deveria, a
      #     tela mostra "US$ 180,00" certinho e o saldo do grupo fecha. O teste
      #     exige as DUAS metades -- recusa a cotacao 1 no dolar E aceita 5,35 --,
      #     porque uma trava que recusasse toda moeda estrangeira passaria em
      #     todas as assercoes de bloqueio;
      #   - e o acerto pago em moeda estrangeira. Ele entra na mesma soma das
      #     despesas: US$ 10 lidos como R$ 10 abatem um quinto da divida, e a
      #     tela continua pedindo o resto DEPOIS de o dinheiro ter sido pago.
      - name: Cambio do grupo converte saldo e orcamento, e cotacao ausente e recusada
        run: $PSQL -f database/tests/026_cambio_do_grupo_test.sql

      # As duas suites que guardam as views que a 026 REESCREVEU rodam la atras na
      # cadeia (steps do 006 e do 007), ou seja: contra a definicao ANTIGA de
      # `group_member_balances` e `budget_consumption`. Elas nunca viram a versao
      # nova -- e sao elas que travam o sinal do acerto, o ABS() da despesa
      # negativa, o `rejected/expired` fora da conta e a janela de mes do teto.
      #
      # Rodar de novo, aqui, e o que prova que a 026 preservou esse contrato em
      # vez de apenas nao ter quebrado nada que a 026 mesma testa. As duas sao
      # re-executaveis (conferido); custa segundos.
      - name: O contrato do 006 e do 007 sobrevive as views reescritas
        run: |
          $PSQL -f database/tests/group_settlement_test.sql
          $PSQL -f database/tests/budget_invoice_test.sql

      # O livro-razao das execucoes de cron. O que so o Postgres pega:
      #
      #   - o CHECK de `job` tem que bater com os quatro `crons[].path` do
      #     vercel.json. Um job renomeado no vercel.json e esquecido aqui grava
      #     sob nome que a consulta de auditoria nunca procura -- e a ausencia
      #     seria lida como "nao rodou";
      #   - `finished_at >= started_at` recusa a linha que o relogio para tras
      #     produziria, e como a gravacao nao derruba a rota de proposito, essa
      #     recusa sumiria em silencio;
      #   - NAO pode haver indice unico: duas execucoes do mesmo job no mesmo
      #     dia sao evento real no plano Hobby (+-59min de folga), e um unique
      #     apagaria justamente a evidencia da execucao dupla.
      - name: Livro-razao de cron aceita a execucao ociosa e recusa o resto
        run: $PSQL -f database/tests/cron_runs_test.sql

      # O alvo mensal da meta e a quinta parcela do "quanto posso gastar". O que
      # so o Postgres pega aqui:
      #
      #   - `goal_progress` foi recriada copiando o corpo inteiro do 008 para
      #     acrescentar uma coluna. CREATE OR REPLACE VIEW impede remover e
      #     reordenar coluna, mas NAO impede trocar a EXPRESSAO de uma delas --
      #     uma copia errada de `saved` ou de `monthly_required` passa pelo tsc,
      #     pelo lint e pelos 49 testes de TypeScript, porque nenhum deles le a
      #     view;
      #   - se a coluna nova nao chegar na view, a rota le `undefined`, o alvo
      #     explicito vira NULL e a derivacao pelo prazo assume o lugar dele --
      #     o desconto sai com outro valor e sem erro em lugar nenhum.
      - name: O alvo mensal chega na view e o CHECK recusa zero e negativo
        run: $PSQL -f database/tests/goal_monthly_contribution_test.sql

      # Duas metades que falham por motivos diferentes: a estrutural varre o
      # schema INTEIRO atras de view sem security_invoker (uma view criada
      # amanha reprova sem ninguem lembrar de atualizar o teste -- que e o
      # esquecimento que deixou esta passar), e a de comportamento cria dois
      # usuarios privados e conta as linhas que um enxerga pela view.
      #
      # A segunda metade nao e redundante: a primeira confere uma OPCAO, e o
      # que importa e a LINHA que volta. Sem o 013 ela sozinha ja reprova,
      # devolvendo 2 linhas onde deveria devolver 1.
      - name: Nenhuma view escapa da RLS
        run: $PSQL -f database/tests/view_security_invoker_test.sql

      - name: Aritmetica de recorrencia
        run: npm run test:recurrence

      # Estes dois existiam desde a HMO-145 e NAO rodavam em lugar nenhum: o
      # script estava no package.json e nenhum workflow o chamava. Uma suite que
      # ninguem executa e pior que suite nenhuma -- ela da a sensacao de
      # cobertura enquanto a regressao passa verde.
      #
      # O detector e 100% TypeScript e o SQL nao alcanca nada dele: normalizar
      # "NETFLIX.COM*123" e "NETFLIX COM" para a mesma chave, e recusar 3
      # compras de supermercado com 10, 40 e 70 dias de intervalo como se
      # fossem assinatura mensal.
      - name: Normalizacao e deteccao de assinaturas
        run: npm run test:recurrence-detector

      # A varredura e a fronteira com o banco, compartilhada pelos tres
      # gatilhos (botao, importacao de extrato, cron diario). O que se prova
      # aqui erra em silencio: `status` no payload do upsert faz a assinatura
      # que o usuario mandou ignorar voltar para a tela na manha seguinte, e
      # perder o filtro `amount < 0` poe o salario como a primeira "assinatura"
      # da lista.
      - name: Fronteira da varredura de assinaturas
        run: npm run test:recurrence-scan

      # O disparo dos alertas, que a HMO-148 acrescentou. O SQL logo acima prova
      # que o banco nao deixa o aviso repetir; o que so o TypeScript alcanca e a
      # TRADUCAO do alerta para a linha de notificacao, e os tres erros dela sao
      # silenciosos:
      #
      #   - `reference_date` do aviso de cancelamento tirado de last_charge_date
      #     manda a MESMA frase (mesmo valor, mesma data) todo mes -- o spam que
      #     a issue existe para impedir, chegando pelo caminho que ela abriu;
      #   - assinatura marcada como IGNORED gerando push desfaz a decisao do
      #     usuario pelo canal mais intrusivo que o app tem;
      #   - `kind` fora do dominio do CHECK do 016 derruba o upsert INTEIRO, e
      #     como o cron grava tudo num lote, NINGUEM recebe aviso naquele dia.
      - name: Disparo dos alertas de assinatura
        run: npm run test:recurrence-alerts

      # A categorizacao automatica erra de tres jeitos que nao levantam excecao
      # nenhuma: a categoria de despesa pegando um estorno (e o relatorio passa
      # a contar dinheiro que VOLTOU como gasto), o desempate sumindo (e
      # "uber eats" vira Transporte de forma nao reproduzivel), e uma chave do
      # catalogo que a propria normalizacao reescreve (e a chave fica morta, o
      # app so deixa de sugerir). Os tres passam verde sem este teste.
      - name: Regras de categorizacao e o sinal do valor
        run: npm run test:categorization

      # O acerto e metade SQL, metade aritmetica: a view diz QUANTO cada um
      # deve, o TypeScript decide QUEM paga quem. Em ponto flutuante o guloso
      # fecha deixando residuo de fracao de centavo, que vira transferencia de
      # R$ 0,00 na tela. lib/settlement.ts trabalha em centavos inteiros e isto
      # prova que a conta fecha.
      # As calculadoras nao tocam no banco -- sao quatro funcoes puras rodando
      # no navegador. Estao aqui porque e onde vive todo `test:*`, e porque o
      # check-tests-in-ci exige que a suite rode em algum workflow cujo
      # `paths:` cubra lib/calculadoras.ts.
      #
      # Nada aqui levanta excecao quando erra: devolve um numero plausivel, com
      # duas casas, que o usuario leva para uma conversa com o RH. Os quatro
      # erros de maior valor em dinheiro, todos travados por teste proprio:
      #   - INSS com aliquota cheia em vez de progressiva (R$ 198,49/mes);
      #   - INSS sem o teto (R$ 1.613/mes num salario de R$ 20.000);
      #   - IRRF sem o redutor da Lei 15.270/2025, que cobra R$ 312,89 de quem
      #     e isento desde 01/01/2026 -- e a tabela progressiva sozinha esta
      #     certa, entao o numero errado parece conferido;
      #   - taxa anual convertida por divisao por 12, que transforma 12% a.a.
      #     em 12,68% e infla 30 anos de aporte em mais de 20%.
      - name: Tabelas de INSS/IRRF e aritmetica das calculadoras
        run: npm run test:calculadoras

      - name: Acerto de contas simplificado
        run: npm run test:settlement

      # A outra ponta do mesmo dinheiro (HMO-175): a view group_member_balances
      # responde na convencao do CREDOR (positivo = a receber) e a tela de
      # Financas Pessoais pergunta na do DEVEDOR ("quanto eu tenho que pagar").
      # Trocar o sinal na traducao exibe "voce tem R$ 345 a receber" para quem
      # deve R$ 345 -- numero, simbolo e formatacao todos certos. E a tolerancia
      # de um centavo tem que ser a MESMA do test:settlement acima: se as duas
      # discordarem, a tela cobra uma divida de R$ 0,01 que o acerto do grupo se
      # recusa a gerar, e nao ha pagamento capaz de zera-la.
      - name: Acerto dos grupos nas despesas pessoais
        run: npm run test:grupos

      # Orcamento de grupo (HMO-138). O budget_invoice_test logo acima ja prova
      # em SQL que budget_consumption soma o gasto do grupo TODO no teto de
      # grupo; este passo prova o outro lado, no TypeScript: que a tela nao
      # junta esse numero com o teto pessoal. Juntar produz um "ja gasto" que
      # nao e nem o meu -- inclui o gasto dos outros membros da viagem -- nem o
      # da viagem -- inclui o meu mercado de casa -- e que SOBE a cada membro
      # novo do grupo, sem erro e sem cor diferente na tela.
      #
      # Cobre tambem a chave do carry-forward: os dois indices unicos do 006
      # sao parciais e separados de proposito (um por grupo, um pessoal), e
      # repetir o mes com a categoria sozinha como chave deixa de criar um dos
      # dois tetos -- calado, e so no mes seguinte.
      #
      # 18 de 18 mutantes mortos em scripts/mutantes-orcamento-de-grupo.mjs.
      - name: Orcamento de grupo
        run: npm run test:orcamento-de-grupo

      # A MINHA parte da despesa de grupo (HMO-177). As policies do 005 liberam
      # `user_id = auth.uid() OR is_group_member(group_id)`, e a rota do resumo
      # nao filtra por user_id -- de proposito, porque a RLS filtra. O efeito
      # colateral e que um aluguel de R$ 3.000 do grupo Casa aparecia inteiro
      # como custo fixo para as DUAS pessoas: para quem cadastrou a regra e para
      # quem nunca cadastrou nada. Numero inflado que ainda alimenta
      # safe-to-spend e cash-flow, e cujo unico sintoma e parecer alto.
      #
      # O teste cobra os dois lados: dividir a linha de grupo E nao dividir a
      # pessoal. So o primeiro deixaria passar o mutante que divide tudo, que
      # erra para BAIXO e faz o app prometer dinheiro que nao sobra.
      #
      # 12 de 12 mutantes mortos em scripts/mutantes-parte-do-grupo.mjs.
      - name: A minha parte da despesa fixa de grupo
        run: npm run test:parte-do-grupo

      # Os numeros dos relatorios sao provados em SQL logo acima. O que resta
      # para o TypeScript sao duas coisas que erram em silencio: a janela de
      # meses (um off-by-one mostra 11 barras onde o usuario pediu 12, e
      # ninguem conta as barras) e o escape do CSV (um ponto e virgula na
      # descricao quebra a linha em duas colunas e desloca TODA a planilha --
      # o usuario le valores na coluna errada sem nenhum sinal de erro).
      - name: Janela de meses e CSV dos relatorios
        run: npm run test:reports

      # A consolidacao do patrimonio nao levanta excecao quando erra: ela
      # desenha uma composicao errada. Neste banco o dinheiro e a divida moram
      # na MESMA coluna (`current_balance`), e e dai que saem os erros:
      #   - classificar pelo SINAL do saldo faz um cartao com estorno virar
      #     ativo e uma conta no cheque especial virar divida, e a carteira
      #     muda de forma sozinha quando um saldo cruza o zero;
      #   - dividir a participacao pelo patrimonio LIQUIDO em vez do total de
      #     ativos: quem tem R$ 10.000 aplicados e R$ 9.500 de fatura aparece
      #     com "investimentos = 2000% da carteira", e com patrimonio negativo
      #     a barra inteira sai invertida;
      #   - usuario novo tem as quatro contas padrao zeradas, e sem guarda de
      #     divisao por zero a tela imprime NaN% em quatro tiles.
      - name: Consolidacao do patrimonio liquido
        run: npm run test:net-worth

      # A outra metade do conserto do pagamento de fatura (a de SQL esta logo
      # depois do 015). Aqui ficam as decisoes que o banco nao alcanca:
      #   - detectar a fatura pela chave canonica em `notes` e nao pelo tipo da
      #     conta, senao toda assinatura de cartao vira transferencia e
      #     desaparece do fluxo de caixa;
      #   - recusar o proprio cartao como conta pagadora: as duas pernas
      #     cairiam na mesma conta, se anulariam, e a fatura ficaria paga sem
      #     dinheiro nenhum ter saido -- o mesmo bug com outra roupa;
      #   - o sinal das pernas, que invertido continua somando zero (o
      #     patrimonio "fecha") mas dobra a divida do cartao.
      - name: Fatura de cartao e transferencia, nao despesa
        run: npm run test:card-invoice

      # "Quanto ainda posso gastar" mistura tres fontes que o SQL nao reconcilia
      # sozinho, e as duas maneiras de errar sao simetricas:
      #   - descontar a fatura DUAS vezes (ela mora no saldo negativo do cartao
      #     E na conta prevista criada pelo fechamento), o que corta o numero
      #     quase pela metade sem nada parecer errado na tela;
      #   - nao descontar a divida do cartao, o que faz gastar no cartao nao
      #     mexer no numero -- e transforma o indicador em incentivo a usar o
      #     cartao.
      # Alem disso: investimento nao e dinheiro disponivel, conta vencida
      # continua sendo dinheiro que vai sair, e no dia 31 o divisor da verba
      # diaria e 1 e nao 0.
      - name: Quanto ainda posso gastar
        run: npm run test:safe-to-spend

      # A anomalia de gasto e o resumo do mes erram de formas que a tela nao
      # denuncia, e as quatro sao plausiveis:
      #   - SINAL: despesa e gravada NEGATIVA; um SUM cru troca o mes caro pelo
      #     mes barato e o alerta vai para a pessoa errada -- e um fixture de
      #     teste com valor positivo passa verde sem provar nada;
      #   - JANELA: comparar o dia 12 do mes corrente com meses CHEIOS acusa
      #     "queda de 90%" todo comeco de mes e esconde o estouro de verdade;
      #   - MEDIA vs MEDIANA: um unico mes de ferias na base levanta a media o
      #     bastante para engolir o estouro do mes seguinte;
      #   - USUARIO NOVO: sem historico nao pode haver alerta, divisao por zero
      #     nem "+Infinity%" na tela.
      # Os 27 testes foram submetidos a sete mutacoes (media no lugar da
      # mediana, sem o corte por dia, amount cru, cada uma das duas reguas
      # isolada, transfer contando como gasto, mes futuro no historico) e cada
      # uma ficou vermelha.
      - name: Anomalia de gasto e resumo do mes fechado
        run: npm run test:anomalies

      # A previsao de fluxo de caixa entrega uma DATA ("voce fica negativo em
      # 12/10"), e data errada e pior que numero errado: ninguem desconfia de
      # uma data. Tres erros cabem aqui sem quebrar nada:
      #   - DUPLICATA: quem cadastrou a Netflix como conta prevista E deixou o
      #     detector rodar tem a cobranca nas duas fontes; somar as duas
      #     antecipa (ou inventa) o dia negativo;
      #   - FATURA: aqui ela entra pelo evento datado e o saldo do cartao NAO e
      #     descontado -- regra OPOSTA a do "posso gastar", onde a pergunta nao
      #     tem data. Alinhar os dois arquivos reintroduz a contagem dupla;
      #   - DIA NEGATIVO: quem ja esta no vermelho nao pode receber uma data de
      #     mergulho, e a data tem que ser o PRIMEIRO cruzamento.
      # Os 42 testes foram submetidos a 17 mutacoes (tolerancia da duplicata,
      # a borda dela, o consumo por ocorrencia, o cartao no saldo inicial, o
      # vencido, o corte de horizonte, o empate do menor saldo, o status
      # IGNORED, entre outras) e cada uma ficou vermelha.
      - name: Previsao de fluxo de caixa
        run: npm run test:cash-flow

      # A media de gasto do dia a dia e o que tira a previsao do otimismo, e ela
      # erra de dois jeitos opostos -- os dois silenciosos, os dois plausiveis:
      #   - CONTAR DUAS VEZES: a Netflix ja e evento datado na previsao; se ela
      #     tambem estiver dentro da media, a linha mergulha num dia que nao vai
      #     acontecer;
      #   - EXCLUIR DE MAIS, que e pior: uma chave tirada da media SEM virar
      #     evento some das duas metades, e a linha "provavel" fica mais
      #     otimista que a "otimista" -- o oposto exato do que ela promete. E
      #     como a assinatura marcada como IGNORED evaporaria.
      # Somam-se a isso o mes corrente (esta pela metade e puxa a mediana para
      # baixo), o mes sem extrato importado (zero nao e um mes barato) e o
      # sinal, que neste banco e NEGATIVO para despesa.
      # Os 18 testes foram submetidos a 12 mutacoes (a exclusao por chave, a
      # chave vazia, o mes corrente, media no lugar de mediana, o piso de tres
      # meses, o teto da janela, o filtro por transaction_type, a comparacao de
      # texto cru, entre outras) e cada uma ficou vermelha. Uma delas so ficou
      # depois de o proprio teste ser corrigido: com o ruido em um mes so, a
      # mediana o engolia e o teste passava verde sem provar nada.
      - name: Gasto variavel do dia a dia
        run: npm run test:variable-spend

      # O livro-razao das execucoes de cron (019). O que esta suite protege e
      # uma linha so: a execucao OCIOSA tem que ser registrada. Se ela parar de
      # gravar, um cron morto e um cron sem trabalho voltam a ser
      # indistinguiveis no banco -- que e como a HMO-152 escondeu tres crons em
      # 503 por semanas. Os 25 mutantes de scripts/mutantes-cron-ledger.mjs
      # morreram; dois deles so depois de o teste ganhar assercao nova (o
      # http_status exato e o createClient que estoura antes do fetch), e um
      # terceiro foi trocado por ser equivalente -- o `throw` caia dentro do
      # proprio try e o catch devolvia um objeto identico.
      - name: Livro-razao das execucoes de cron
        run: npm run test:cron-ledger

      # O retorno do link de email (HMO-157). Entra no db-verify, e nao num job
      # so de front, porque o que a suite protege e uma regra de RLS: o perfil
      # nasce no /auth/callback porque `profiles_insert_own` e `TO
      # authenticated`, e antes da troca do code nao existe sessao. Se o destino
      # do callback voltar a aceitar URL absoluta, o link que chega por email
      # passa a poder despachar o usuario para fora do dominio logo depois de
      # confirmar a conta -- quatro mutantes conferidos, todos vermelhos.
      - name: Retorno do link de confirmacao de email
        run: npm run test:auth-callback

      # O fim do cadastro depende de `mailer_autoconfirm`, um botao do DASHBOARD
      # do Supabase que este repositorio nao le nem versiona. Com ele desligado o
      # `signUp` ja devolve sessao e ninguem passa pelo /auth/callback -- se o
      # perfil nascesse so la, a conta terminaria sem perfil e, porque
      # `create_user_subscription_trigger` dispara AFTER INSERT ON profiles, sem
      # assinatura nenhuma. Nao ha erro em tela em nenhum dos dois casos, so uma
      # conta pela metade. A suite prende a decisao na sessao devolvida, e nao
      # numa suposicao sobre como o dashboard esta configurado hoje -- quatro
      # mutantes conferidos, todos vermelhos.
      - name: Fim do cadastro com e sem confirmacao de email
        run: npm run test:signup-outcome

      # A leitura do extrato e 100% TypeScript e o SQL nao alcanca nada dela.
      # Tres coisas erram em silencio aqui: parseFloat("1.234,56") = 1.234 (um
      # extrato de mil reais entra como um e vinte), new Date() numa data OFX
      # com fuso joga 1o de janeiro para 31 de dezembro, e a conciliacao sem a
      # regra de um-para-um faz dois saques iguais casarem com o mesmo
      # lancamento -- um deles some do app para sempre.
      - name: Leitura de extrato OFX/CSV e conciliacao
        run: npm run test:statement

      # Ficar sem sinal DESLOGAVA a pessoa: `getUser()` sempre vai na rede, a
      # falha virava `user = null` e o layout empurrava para /login -- uma tela
      # que, offline, nao tem como funcionar. A suite prende a distincao que o
      # codigo antigo nao fazia: a rede falhando e uma coisa, o servidor dizendo
      # "essa sessao nao vale" e outra. Inclui o caso do auth do Supabase em
      # 5xx, que nao pode deslogar a base inteira numa instabilidade de minutos.
      - name: Sessao sem rede (o offline nao desloga, a recusa desloga)
        run: npm run test:offline-session

      # A fila de lancamentos feitos sem rede, onde os dois erros possiveis sao
      # os dois caros: reenviar uma linha ja gravada cobra o almoco duas vezes,
      # e tratar o reenvio bem-sucedido como falha (ele volta SEM erro e com
      # ZERO linhas, por causa do ON CONFLICT DO NOTHING) prende a fila para
      # sempre. Cobre tambem o sinal -- despesa e gravada negativa aqui -- e o
      # catalogo local, sem o qual o formulario offline abre sem categoria
      # nenhuma e nao da para lancar nada. 16 de 18 mutantes mortos; os dois
      # sobreviventes sao no-op, explicados no cabecalho da suite de sessao.
      - name: Fila de lancamentos offline e catalogo local
        run: npm run test:offline-queue

      # Receita, despesa e transferencia entram na conta de formas diferentes.
      # O caso caro e a transferencia: ela e gravada em DUAS pernas (015), e
      # somar por sinal do valor conta a mesma fatura como receita E como
      # despesa. O saldo fica certo nesse bug -- as pernas se anulam -- entao
      # so uma asercao que olhe Receitas e Despesas SEPARADAMENTE o pega.
      # Os dois mutantes (classificar por sinal; contar as duas pernas) morrem.
      - name: Separacao contabil das tres movimentacoes
        run: npm run test:movimentacoes

      # A lista de lancamentos trazia 50 linhas com `.limit(50)`, sem recorte de
      # data e sem paginacao: o lancamento 51 nao existia para o usuario, e os
      # cartoes do topo somavam essas 50 debaixo do rotulo "Este mes". Nenhum
      # dos dois defeitos da erro, deixa a tela vazia ou quebra assercao
      # numerica -- sao numeros certos com o rotulo errado. Por isso a FRASE da
      # lista e codigo testado, e cada assercao do texto enganoso tem o controle
      # negativo do lado: sem ele, uma funcao que escrevesse "parcial" ou "ha
      # mais" em toda resposta passaria verde.
      - name: Periodo, paginacao e rotulo da lista de lancamentos
        run: npm run test:lista-lancamentos

      # A transferencia em si (HMO-164), que ate aqui era uma opcao dentro do
      # formulario de lancamento e gravava UMA linha: o dinheiro saia de uma
      # conta e nao entrava em nenhuma. Nao havia excecao nem 500 -- havia um
      # patrimonio menor pelo valor transferido, plausivel, com duas casas.
      # As quatro maneiras de errar que a suite prende: as duas pernas com o
      # mesmo sinal (o saldo erra pelo DOBRO); `Math.abs` ausente, que faz
      # "-500" andar ao contrario; origem igual ao destino, em que as pernas se
      # anulam na mesma conta e a tela diz "transferido" sem nada ter se movido;
      # e cartao de credito como origem, que criaria divida sem compra por tras.
      # Cobre tambem o pagamento de fatura, que passou a sair daqui: a traducao
      # cartao/pagadora -> destino/origem e invertivel sem o compilador notar, e
      # inverte-la ressuscitaria o HMO-149. 12 de 12 mutantes mortos.
      - name: Transferencia entre contas, as duas pernas
        run: npm run test:transferencia

      # O cambio do dia da compra (HMO-182). A 026 pos um CHECK que CRUZA duas
      # colunas -- `(currency = 'BRL') = (exchange_rate = 1)` -- e a coluna nova
      # nasceu com DEFAULT 1. Como o app ja mandava `currency` desde a HMO-171,
      # todo lancamento em moeda estrangeira passou a montar a linha (USD, 1), que
      # e exatamente o par proibido: 23514 em 100% deles, nao num caso de borda.
      # Medido no Postgres com as migrations 001..026 aplicadas.
      # O que a suite prende: `cotacaoCoerente` e a MESMA regra do CHECK (se as
      # duas divergirem, quem ganha e o banco, e o sintoma e "Erro ao gravar o
      # lancamento" sem mais nada); `taxaParaGravar` devolve null e nao 1 quando
      # falta cotacao -- 1 e o unico numero que o CHECK proibe, e num mundo sem o
      # CHECK poria a despesa de US$ 180 no acerto da viagem valendo R$ 180;
      # `escolherBoletim` pega o Fechamento e nao o ultimo item da lista, que no
      # meio da tarde e um Intermediario; e `datasParaTentar` anda para TRAS,
      # porque cotacao posterior a compra faz o valor do passado mudar sozinho --
      # a razao de existir do item 3 da HMO-138.
      # 35 asercoes, 11 mutantes: 10 mortos. O 11o (`setDate` no lugar de
      # `setUTCDate`) sobrevive porque E no-op em fuso sem horario de verao; o
      # mutante de verdade, formatar com componentes locais, morre em 7.
      - name: Cambio do dia da compra, e o CHECK cruzado da 026
        run: npm run test:cambio

      # A carteira de investimentos erra dinheiro sem levantar excecao: ela mostra
      # um preco medio de R$ 31,14 onde o certo e R$ 30,00, e ninguem estranha
      # 31,14. Os casos que valem:
      #   - somar a VENDA na ponderacao do preco medio. E o erro central do custo
      #     medio e o mais plausivel de escrever -- `soma(qtd*preco)/soma(qtd)`
      #     parece obviamente certo -- e ele contamina o lucro, a rentabilidade e
      #     o "Valor Atual" da tela de uma vez;
      #   - a taxa fora do custo, que infla o lucro em exatamente o valor das
      #     corretagens e deixa o "investido" abaixo do que saiu da conta;
      #   - preco ausente tratado como ZERO: como nao ha fonte de cotacao
      #     contratada, `current_price` nasce NULL, e o caminho ingenuo faz a tela
      #     anunciar carteira de R$ 0,00 com -100% no dia em que o usuario
      #     cadastra o primeiro ativo;
      #   - dividir a rentabilidade pelo valor atual em vez do custo, e a alocacao
      #     pelo patrimonio em vez do total da carteira (o defeito da HMO-146).
      # 26 de 28 mutantes mortos; os dois sobreviventes sao no-op algebrico,
      # explicados no cabecalho de scripts/mutantes-investments.mjs.
      - name: Custo medio, alocacao e evolucao da carteira
        run: npm run test:investments

      # A busca de pessoas da aba Conexoes. O termo digitado ia colado na arvore
      # logica do PostgREST, e a virgula e separador ali: quem se chama
      # "Silva, Joao" derrubava a consulta inteira com PGRST100 e a tela dizia
      # "Erro ao buscar usuários" (HMO-142, medido em producao). O teste afirma
      # sobre a ARVORE -- dois ramos, termo inteiro dentro do operando citado --
      # e sobre o termo vazio nao virar `ilike.%%`, que listaria todo perfil
      # publico da base. `lib/busca-de-perfil.ts` esta no filtro de `paths`
      # acima de proposito: sem isso o passo so rodaria quando o proprio arquivo
      # de teste mudasse, e mexer na implementacao sairia verde por ausencia.
      - name: Busca de perfil escapa o termo e nao lista a base inteira
        run: npm run test:busca-de-perfil

      # O guard de deriva de COLUNA (scripts/check-column-drift.mjs) roda no job
      # code-schema-drift, que nao tem Postgres, entao ele le o schema de
      # database/schema-columns.json. Este passo e o que impede aquele arquivo de
      # envelhecer: aqui ele e comparado com a FONTE -- este banco, construido
      # pela cadeia inteira de migrations logo acima -- e nao com outra copia
      # gerada pelo mesmo script (foi assim que o bundle de validacao ficou sete
      # migrations atras e saiu verde, HMO-154).
      #
      # Quem acrescentar coluna numa migration e nao rodar
      # `node scripts/gen-schema-columns.mjs` recebe este passo vermelho.
      - name: schema-columns.json em dia com as migrations
        run: node scripts/gen-schema-columns.mjs --check

      - name: Nenhuma tabela pode ficar sem RLS
        run: |
          semrls=$($PSQL -tAc "
            SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
              FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
             WHERE n.nspname = 'public' AND c.relkind = 'r'
               AND NOT c.relrowsecurity;")
          if [ -n "$semrls" ]; then
            echo "::error::Tabelas em public sem RLS: $semrls"
            exit 1
          fi
          echo "Todas as tabelas de public estao com RLS ligada."

      # A chave anon vai embutida no bundle JS publico: qualquer privilegio que
      # ela tenha alem das duas tabelas de referencia e dado aberto na internet.
      - name: anon so pode ler as tabelas de referencia
        run: |
          extra=$($PSQL -tAc "
            SELECT string_agg(DISTINCT table_name, ', ')
              FROM information_schema.role_table_grants
             WHERE grantee = 'anon' AND table_schema = 'public'
               AND table_name NOT IN ('financial_services', 'transaction_categories');")
          if [ -n "$extra" ]; then
            echo "::error::A role anon tem privilegio em tabelas que nao sao de referencia: $extra"
            exit 1
          fi
          echo "anon limitada a financial_services e transaction_categories."

      - name: Seed carregado
        run: |
          $PSQL -tAc "SELECT 'financial_services=' || count(*) FROM financial_services"
          $PSQL -tAc "SELECT 'transaction_categories=' || count(*) FROM transaction_categories"

      # Os passos acima rodam num banco limpo, onde as unicas policies sao as
      # que o 002 cria. Producao nao e assim: pode ter policy feita pelo painel
      # do Supabase, com nome que o DROP POLICY IF EXISTS nominal do 002 nunca
      # alcancaria. Uma sobrevivente com USING (true) vaza os dados de um
      # usuario logado para outro - e a auditoria anonima passa verde, porque
      # ela testa sem login. Este job planta essa policy e exige que o 002 a
      # remova. Vai em banco proprio: o estado sujo nao pode contaminar o
      # drill de backup abaixo.
      - name: Deriva de policies legadas
        env:
          PGDATABASE: pulodogato_drift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_drift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/legacy_policy_drift_test.sql

      # A outra deriva de producao, descoberta em 2026-09-21 ao aplicar o 002:
      # uma is_group_member de outra safra, com assinatura diferente. O
      # CREATE OR REPLACE nao a substitui, ela sobrevive ao lado da nova e as
      # policies param com 42725 "function is not unique". Banco proprio pelo
      # mesmo motivo do job anterior.
      - name: Deriva de funcoes legadas
        env:
          PGDATABASE: pulodogato_fndrift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_fndrift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/legacy_function_drift_test.sql

      # Terceira classe de deriva: o schema de producao nao bater com o que o
      # 002 assume. Sem a SECAO 0.0 o Postgres reporta um item por vez, e como
      # so o dono do projeto tem credencial, cada item custa um dia. Aqui
      # plantamos tres derivas de tipos diferentes de uma vez e exigimos que as
      # DUAS verificacoes (a Q6 do 000, somente leitura, e a SECAO 0.0 do 002)
      # apontem as tres - e que o 002 aborte sem alterar nada. As assercoes
      # estao aqui, e nao no .sql, porque dependem do codigo de saida do psql.
      - name: Deriva de schema
        env:
          PGDATABASE: pulodogato_schemadrift
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 --no-psqlrc -d postgres -c "CREATE DATABASE pulodogato_schemadrift"
          $PSQL -f database/tests/00_supabase_shim.sql
          $PSQL -f database/migrations/001_baseline.sql
          $PSQL -f database/tests/schema_prereq_test.sql

          esperado=(
            'coluna public.group_members.status nao existe'
            'tabela public.user_usage_limits nao existe'
            'ON CONFLICT de join_group_by_code exige'
          )

          # 1) O preflight (somente leitura) tem que listar as tres na Q6.
          preflight=$($PSQL -f database/migrations/000_preflight_inventory.sql 2>&1)
          for item in "${esperado[@]}"; do
            if ! grep -qF "$item" <<< "$preflight"; then
              echo "::error::A Q6 do 000_preflight_inventory nao apontou: $item"
              exit 1
            fi
          done
          echo "Q6 do preflight apontou as tres derivas."

          # 2) O 002 tem que abortar, nomeando as tres no mesmo erro.
          if saida=$($PSQL -f database/migrations/002_rls_lockdown.sql 2>&1); then
            echo "::error::O 002 aplicou num banco cujo schema nao comporta as policies."
            exit 1
          fi
          for item in "${esperado[@]}"; do
            if ! grep -qF "$item" <<< "$saida"; then
              echo "::error::A SECAO 0.0 do 002 abortou sem nomear: $item"
              echo "$saida"
              exit 1
            fi
          done
          echo "SECAO 0.0 abortou nomeando as tres de uma vez."

          # 3) E nao pode ter deixado rastro: tudo roda dentro de BEGIN/COMMIT.
          rastro=$($PSQL -tAc "
            SELECT (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                     WHERE n.nspname = 'public'
                       AND p.proname IN ('is_group_member', 'is_group_admin', 'owns_group_member',
                                         'has_pending_invitation', 'join_group_by_code'))
                 + (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                     WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relrowsecurity)
                 + (SELECT count(*) FROM pg_policies WHERE schemaname = 'public');")
          if [ "$rastro" != '0' ]; then
            echo "::error::O 002 abortou mas deixou rastro no banco ($rastro objeto(s))."
            exit 1
          fi
          echo "Transacao voltou atras por inteiro: nada mudou no banco."

      # Backup que nunca foi restaurado nao e backup. O ciclo inteiro
      # (dump -> banco vazio -> conferencia) roda aqui a cada mudanca, para o
      # drill de verdade contra producao nunca ser a primeira execucao.
      - name: Drill de backup e restauracao
        env:
          PGDATABASE: pulodogato_ci
        run: |
          set -euo pipefail
          URL_ORIGEM="postgresql://postgres:postgres@localhost:5432/pulodogato_ci"
          URL_DESTINO="postgresql://postgres:postgres@localhost:5432/pulodogato_drill"

          $PSQL -d postgres -c "CREATE DATABASE pulodogato_drill"

          # Uma linha reconhecivel, para provar que o dado atravessou o ciclo.
          $PSQL <<'SQL'
          INSERT INTO auth.users (id, email)
            VALUES ('11111111-1111-1111-1111-111111111111', 'drill@ci.local');
          INSERT INTO public.profiles (id, full_name)
            VALUES ('11111111-1111-1111-1111-111111111111', 'Drill CI');
          INSERT INTO public.financial_accounts (id, user_id, name, account_type)
            VALUES ('22222222-2222-2222-2222-222222222222',
                    '11111111-1111-1111-1111-111111111111', 'Conta Drill', 'checking');
          -- service_id e category_id sao NOT NULL em producao; os UUIDs sao os
          -- do seed de referencia que o 001_baseline.sql carrega.
          INSERT INTO public.financial_transactions
                 (user_id, account_id, service_id, category_id,
                  amount, transaction_date, description)
            VALUES ('11111111-1111-1111-1111-111111111111',
                    '22222222-2222-2222-2222-222222222222',
                    '8730cd96-d656-4c48-863e-673e1016a832',
                    'b9db286c-ce4f-4fbe-b0bf-f3133185f90f',
                    1234.56, '2026-01-01', 'Transacao do drill');
          SQL

          chmod +x scripts/db-backup.sh scripts/db-restore.sh
          SUPABASE_DB_URL="$URL_ORIGEM" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-backup.sh "$RUNNER_TEMP/drill"

          # Prova que o backup sai criptografado e que o restore abre o .gpg.
          ls "$RUNNER_TEMP/drill"/*-data.sql.gz.gpg > /dev/null

          RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-restore.sh "$RUNNER_TEMP/drill"

          valor=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT amount FROM public.financial_transactions WHERE description = 'Transacao do drill'")
          if [ "$valor" != '1234.56' ]; then
            echo "::error::O ciclo de backup/restauracao perdeu dados (esperado 1234.56, obtido '$valor')"
            exit 1
          fi

          # O dado bruto sobreviver nao basta: o que quebra em silencio e o
          # DERIVADO. Se a restauracao carregar os dados com os triggers
          # ligados, update_account_balance roda de novo por cima do saldo que
          # ja veio no dump e o valor DOBRA (medido: 2469.12). Nada falha, e o
          # banco restaurado passa a mentir sobre dinheiro. Por isso o
          # db-restore.sh usa session_replication_role = replica -- e por isso
          # esta assercao existe.
          saldo=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT current_balance FROM public.financial_accounts
              WHERE id = '22222222-2222-2222-2222-222222222222'")
          if [ "$saldo" != '1234.56' ]; then
            echo "::error::Saldo derivado errado apos restaurar (esperado 1234.56, obtido '$saldo')."
            echo "::error::Sinal classico de trigger reaplicado durante a carga."
            exit 1
          fi
          echo "Ciclo completo: dado bruto e saldo derivado atravessaram o ciclo intactos."

          # ------------------------------------------------------------------
          # Restaurar por cima de um destino que JA tem contas
          # ------------------------------------------------------------------
          # O bloco acima restaura num banco recem-criado, com auth.users vazio.
          # O caso real e o oposto: restaurar por cima de um projeto que ainda
          # tem os usuarios. Ate 2026-09-21 isso apagava o schema public e so
          # ENTAO estourava em "duplicate key ... users_pkey" -- o banco ficava
          # sem dados e sem contas, pior do que antes de restaurar. Achado
          # restaurando num Supabase de verdade; aqui vira regressao.
          echo "== restaurar por cima de destino com contas: tem que recusar"
          if RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
               ./scripts/db-restore.sh "$RUNNER_TEMP/drill" > "$RUNNER_TEMP/recusa.log" 2>&1; then
            echo "::error::A restauracao aceitou um destino que ja tinha contas."
            exit 1
          fi
          grep -q 'ja tem 1 conta' "$RUNNER_TEMP/recusa.log" || {
            echo "::error::Recusou, mas sem explicar que o destino ja tem contas."
            cat "$RUNNER_TEMP/recusa.log"; exit 1; }

          # E, o mais importante: tem que ter recusado ANTES de apagar nada.
          sobrou=$(psql "$URL_DESTINO" --no-psqlrc -tAc "
            SELECT count(*) FROM public.financial_transactions
             WHERE description = 'Transacao do drill'")
          if [ "$sobrou" != '1' ]; then
            echo "::error::A recusa veio DEPOIS de destruir o public (transacoes: $sobrou)."
            exit 1
          fi
          echo "Recusou sem tocar no destino."

          echo "== o mesmo com RESTORE_AUTH_MODE=merge: tem que passar"
          RESTORE_AUTH_MODE=merge RESTORE_DB_URL="$URL_DESTINO" BACKUP_PASSPHRASE='ci-drill' \
            ./scripts/db-restore.sh "$RUNNER_TEMP/drill"

          saldo=$(psql "$URL_DESTINO" --no-psqlrc -tAc \
            "SELECT current_balance FROM public.financial_accounts
              WHERE id = '22222222-2222-2222-2222-222222222222'")
          contas=$(psql "$URL_DESTINO" --no-psqlrc -tAc "SELECT count(*) FROM auth.users")
          if [ "$saldo" != '1234.56' ] || [ "$contas" != '1' ]; then
            echo "::error::merge terminou errado (saldo '$saldo', contas '$contas')."
            exit 1
          fi
          echo "merge restaurou por cima das contas existentes sem duplicar nada."
