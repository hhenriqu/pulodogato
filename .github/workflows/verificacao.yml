          probe='components/_color_probe.tsx'
          trap 'rm -f "$probe" && git checkout -- app/globals.css' EXIT

          # ------------------------------------------------------------------
          # O GUARDA DE TODO MUTANTE: ELE TEM DE TER SIDO APLICADO (HMO-231)
          # ------------------------------------------------------------------
          # `sed` que nao casa SAI 0 e deixa o arquivo INTACTO. A suite entao
          # roda sobre o codigo CORRETO, passa verde, e o `if` seguinte le esse
          # verde como "a suite nao pegou o defeito" -- acusando o codigo em vez
          # do workflow. Foi o que produziu 57 runs vermelhos seguidos na
          # HMO-199, e nove issues abertas em 24h procurando no lugar errado.
          #
          # Este bloco restaura com `git checkout --` e nao guarda `.orig`,
          # entao quem responde "o arquivo mudou?" e o proprio git.
          mutou() {
            if git diff --quiet -- "$1"; then
              echo "::error::o mutante $2 nao se aplicou a $1 -- a ancora do sed mudou de forma. Conserte o padrao NESTE workflow, nao o codigo."
              exit 1
            fi
          }

          # 1) Cor fixa: a classe existe, o Tailwind gera, o tema ignora.
          cat > "$probe" <<'TSX'
          export function Probe() {
            return <div className="bg-white text-gray-900">oi</div>;
          }
          TSX
          if node scripts/check-color-tokens.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com bg-white/text-gray-900."
            exit 1
          fi
          rm -f "$probe"

          # 2) Token legal, contraste ilegal.
          sed -i 's/--success: [0-9.]* [0-9.]*% [0-9.]*%/--success: 142.1 70.6% 45%/' app/globals.css
          mutou app/globals.css 2
          if node scripts/check-color-tokens.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com --success em 2.3:1."
            exit 1
          fi
          git checkout -- app/globals.css

          # 3) A MESMA regressao, mas na paleta do modo papel de pao (HMO-283).
          #
          # Este caso existe separado do (2) de proposito. A guarda le QUATRO
          # blocos de globals.css, e ".papel" e ".dark" sao substring de
          # ".dark.papel": um erro de leitura faria dois nomes apontarem para a
          # mesma paleta, e as duas de papel ficariam SEM cobranca nenhuma
          # enquanto o passo acima continuava verde. Os casos (2) e (3) juntos
          # sao o que distingue "a guarda sabe falhar" de "a guarda sabe falhar
          # nas quatro paletas".
          #
          # A ancora e o --muted-foreground de `.dark.papel` (creme sobre marrom
          # profundo): levado a 35% de luminosidade ele cai para ~2.9:1. Se o
          # valor mudar em globals.css e o sed parar de casar, o `grep` abaixo
          # reprova -- um sed que nao casa SAI ZERO e passaria por "a guarda
          # pegou", que e o modo de falha classico deste tipo de bloco.
          sed -i 's/--muted-foreground: 38 32% 70%/--muted-foreground: 38 32% 35%/' app/globals.css
          if ! grep -q -- '--muted-foreground: 38 32% 35%' app/globals.css; then
            echo "::error::O mutante da paleta de papel nao foi aplicado -- a ancora mudou em globals.css. Este bloco estava medindo nada."
            exit 1
          fi
          saida="$(node scripts/check-color-tokens.mjs 2>&1)" && {
            echo "::error::A verificacao passou verde com a paleta de papel escuro em 2.9:1."
            exit 1
          }
          # E tem que reprovar DIZENDO qual paleta -- uma mensagem que culpa o
          # tema escuro normal manda consertar o bloco errado.
          if ! printf '%s' "$saida" | grep -q 'papel escuro'; then
            echo "::error::A verificacao reprovou, mas sem nomear a paleta de papel escuro:"
            printf '%s\n' "$saida"
            exit 1
          fi

          echo "A verificacao fica vermelha nas tres formas de regressao, e nomeia a paleta certa."

