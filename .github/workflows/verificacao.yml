name: verificacao

# Os 95 passos de verificacao que antes moravam em 22 jobs de
# 20 workflows -- 27 deles blocos de controle negativo -- num job que
# instala node_modules UMA vez.
#
# Isto e a HMO-261, e a medida que a motivou saiu da API de billing, nao de
# intuicao. Um push gastava 34 minutos FATURADOS em 21 jobs, dos quais apenas
# 10 eram verificacao de verdade:
#
#     arredondamento de 1 min por job (21 jobs)   9,6 min   <- nao era trabalho
#     16x `npm ci --include=dev` identicos        4,9 min   <- nao era trabalho
#     21x checkout + setup-node                   3,9 min   <- nao era trabalho
#     controles negativos (mutantes)              6,0 min   <- verificacao
#     assercoes (npm run test:*)                  4,0 min   <- verificacao
#     next build + docker build                   4,5 min   <- em jobs proprios
#
# O maior item nao era a instalacao: era o ARREDONDAMENTO. O Actions cobra
# `ceil()` de CADA job, entao 21 jobs custam 21 minutos antes da primeira
# assercao. 18,4 dos 34 minutos -- 54% -- eram custo de partida de 21 maquinas
# fazendo a mesma instalacao para rodar testes de segundos. A franquia free de
# 2.000 min/mes estourava no dia 2 de cada mes por causa disso.
#
# QUATRO COISAS QUE NAO SE PODE DESFAZER AQUI:
#
# 1. NAO VOLTE A PARTIR ISTO EM UM WORKFLOW POR ASSUNTO, e NAO ABRA UM WORKFLOW
#    NOVO para a proxima feature -- o passo dela entra aqui. O custo nao estava
#    no teste, estava no job: cada job novo custa ~30s de partida mais o
#    arredondamento para o minuto cheio, antes da primeira assercao.
#
# 2. NAO ADICIONE `paths`. A ausencia de filtro e deliberada e esta explicada
#    nos comentarios de cada bloco abaixo. Uma lista de caminhos escrita hoje
#    esta errada amanha, e foi assim que tres suites deste repositorio ficaram
#    paradas em verde -- elas so rodavam no db-verify, que E filtrado por path.
#
# 3. OS BLOCOS `run: |` DE CONTROLE NEGATIVO SAO A PARTE MAIS VALIOSA DAQUI.
#    Eles aplicam um mutante e exigem vermelho. Nao aparecem numa varredura por
#    `npm run` e um deles achou uma assercao vacua na HMO-253. Cada um ganhou um
#    passo-guarda depois dele: em jobs separados, um mutante mal restaurado
#    morria com a maquina; aqui ele contaminaria os passos seguintes.
#
# 4. O NOME DE CADA PASSO e a frase que diz o que ele prova. Os homonimos
#    ("A verificacao sabe falhar" era unico dentro de cada workflow e apareceria
#    16x aqui) levam a origem entre parenteses. Nao troque por
#    numero.
#
# A ORDEM IMPORTA EM UM PONTO: `tsc --noEmit` roda antes de qualquer coisa que
# possa criar `.next/`, porque o tsconfig do Next inclui `.next/types/**` e um
# `.next` velho inventa erro de rota que nao existe. Por isso `next build`
# ficou no job `o projeto compila`, de checkout limpo, e nao aqui.
#
# COMO LER OS COMENTARIOS ABAIXO: eles vieram verbatim dos workflows que
# existiam antes, e varios dizem "este job" ou "este workflow" querendo dizer
# "este bloco de passos". O que eles afirmam continua valendo -- a razao de
# existir, o modo de falha, o motivo de nao ter filtro de `paths`. O que
# mudou e so onde o bloco roda. Cada bloco comeca com um cabecalho
# `origem:` que diz de qual arquivo ele veio, para quem for ler o git.
#
# O `db-verify.yml` NAO foi tocado: ele sobe Postgres, tem custo proprio e
# legitimo, e o `paths:` dele e o controle de custo dele.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificacao:
    name: as regras do app, e cada verificacao sabendo falhar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # O `--include=dev` e explicito porque um ambiente com NODE_ENV=production
      # poda as devDeps na instalacao e o tsc some sem mensagem que explique.
      # Esta e a UNICA instalacao do pipeline de verificacao; eram 16.
      - run: npm ci --include=dev

      # A FOTOGRAFIA DA ARVORE, para os passos-guarda dos controles negativos.
      #
      # O guarda compara com ESTA foto, e nao com `git diff --quiet`, por dois
      # motivos: um `npm ci` pode legitimamente tocar arquivo rastreado, e
      # comparar com a foto deixa a sequencia reproduzivel na maquina de quem
      # desenvolve, onde a arvore quase nunca esta limpa.
      - name: Fotografar a arvore antes dos controles negativos
        run: git status --porcelain > "$RUNNER_TEMP/arvore-base.txt"

      # =======================================================================
      # CODIGO NAO CITA TABELA FORA DO SCHEMA
      # origem: code-schema-drift.yml (job `drift`)
      # =======================================================================
      # Prova, a cada mudanca no codigo, que toda tabela consultada pela aplicacao
      # existe no schema versionado.
      #
      # Vive separado do db-verify de proposito, por duas razoes:
      #
      #   1. O db-verify e filtrado por `paths: ['database/**', ...]`. A deriva que a
      #      HMO-124 encontrou nasce do lado do CODIGO -- uma rota nova que cita uma
      #      tabela que ninguem criou nao toca em database/ nenhuma vez, e passaria
      #      por baixo daquele filtro. Este job nao tem filtro de path.
      #
      #   2. Nao precisa de Postgres. Roda em segundos, entao pode ser obrigatorio em
      #      todo PR sem virar pedagio.
      #
      # O modo de falha que ele cobre e o silencioso: o cliente do Supabase aceita
      # qualquer string em `.from()`, o `tsc` e o `next build` passam, e o erro so
      # aparece em producao como PGRST205 dentro de um catch que devolve 500 --
      # tela vazia para o usuario, CI verde para nos.
      - name: Tabelas citadas pelo codigo existem nas migrations
        run: node scripts/check-table-drift.mjs

      # A mesma deriva um nivel abaixo, e a que escapou por meses: o nome da
      # TABELA certo e o da COLUNA inventado. `GET /api/anomalies` respondia 500
      # em producao para todo usuario porque lia `transaction_categories.user_id`,
      # coluna que nunca existiu, e o passo acima nao tinha como ver -- a tabela
      # existe. Le o schema de database/schema-columns.json; o db-verify prova que
      # aquele arquivo continua igual ao banco que as migrations constroem.
      - name: Colunas pedidas pelo codigo existem nas relacoes
        run: node scripts/check-column-drift.mjs

      # Mora aqui, e nao no db-verify, pela mesma razao do passo acima: o
      # db-verify e filtrado por `paths` e este job nao. Uma migration nova
      # TOCA em database/, entao o filtro nao e o problema -- o problema e que
      # quem esquece o step do db-verify recebe o job VERDE, porque o arquivo
      # esquecido e justamente o que nao roda. A verificacao precisa vir de um
      # job que nao dependa do db-verify ter sido atualizado (HMO-145).
      - name: Toda migration e exercitada pelo db-verify
        run: node scripts/check-migrations-in-ci.mjs

      # Mesma familia do passo acima, e pela mesma razao. O
      # test:recurrence-detector entrou na main pelo PR #20 e ficou dias sem
      # rodar em workflow nenhum: o script existia, nada o chamava, e os jobs
      # continuavam verdes. Uma suite que ninguem executa da sensacao de
      # cobertura enquanto a regressao passa.
      - name: Toda suite de teste roda em algum workflow
        run: node scripts/check-tests-in-ci.mjs

      # Mora aqui pela mesma razao dos passos acima: e deriva do lado do CODIGO,
      # nao toca em database/, e o sintoma e a AUSENCIA de sintoma. Um modulo de
      # interface sem importador compila, passa no tsc, passa no next build e
      # nao cresce o bundle -- o empacotador nunca chega nele. O custo aparece
      # quando alguem abre o arquivo de nome mais obvio para "evoluir a tela" e
      # edita codigo que usuario nenhum ve (HMO-163: 2555 linhas assim, e o
      # arquivo mais convidativo era um dos mortos).
      - name: Nenhum modulo de interface fica sem importador
        run: node scripts/check-dead-components.mjs

      # Mesma familia: deriva do lado do CODIGO, invisivel para tsc e para o
      # next build, e o sintoma so existe em producao. Numa rota sob `[id]`, o
      # Next usa a query string para carregar o segmento e consome a chave de
      # mesmo nome ao montar `params` -- entao `searchParams.get("id")` volta
      # null com o parametro chegando inteiro na URL. Desfazer aporte
      # (DELETE /api/goals/[id]/contributions) ficou 100% quebrado assim, com a
      # tela acusando o usuario de nao informar o que ele informou (HMO-142).
      - name: Rota nao le query com nome de segmento dinamico
        run: node scripts/check-rota-query-colidente.mjs

      # Mora aqui porque e deriva de CODIGO contra SCHEMA, e porque o gatilho
      # dela nao e uma mudanca no codigo -- e uma migration que altera o
      # significado de codigo que ninguem tocou. Quando a 038 ganhou a segunda
      # FK de `recurring_rules` para `financial_accounts`, o embed curto
      # `account:financial_accounts(...)` deixou de ter resposta unica e TRES
      # rotas intactas passaram a responder 500 com PGRST201 em producao -- a
      # tela de gastos fixos nao listava nada, e o POST da conta prevista e o
      # PATCH da baixa gravavam a linha antes de falhar no select do retorno.
      # tsc, next build e teste puro passam todos verdes nesse estado (HMO-236).
      - name: Embed do PostgREST qualifica a FK quando ha mais de uma
        run: node scripts/check-embed-ambiguo.mjs

      # Mora aqui, e nao num workflow proprio, porque e guard textual sem filtro
      # de `paths` -- o campo que ele pega nasce numa TELA NOVA, que por
      # definicao nao esta em nenhuma lista de caminhos escrita hoje.
      #
      # O que ele guarda: o controle de data nativo le os tres segmentos na
      # ordem do APARELHO, e essa ordem nao se forca pelo codigo. Quem digitou
      # 10 de marco grava 3 de outubro -- data valida, plausivel, sem erro
      # nenhum no caminho (medido em Chromium na HMO-238). Num app de dinheiro
      # esse e o pior dos tres modos de errar do controle nativo, porque e o
      # unico que nada denuncia.
      - name: Nenhuma tela usa o campo de data nativo
        run: node scripts/check-campo-de-data.mjs

      # Controle negativo. As duas peneiras do guard acima sao busca textual, e
      # busca textual sai VERDE quando para de achar o que deveria conferir.
      #
      # A segunda peneira (o piso de chamadas) existe exatamente por isso: a
      # primeira, sozinha, aprova a tela em que o campo foi APAGADO. Os dois
      # defeitos sao plantados, e os dois tem que ficar vermelhos.
      - name: A verificacao do campo de data sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          alvo='app/(dashboard)/dashboard/goals/page.tsx'
          cp "$alvo" /tmp/campo-de-data-alvo.orig
          trap 'cp /tmp/campo-de-data-alvo.orig "$alvo"' EXIT

          # 1) O campo nativo de volta numa tela. E o defeito da issue.
          perl -0pi -e 's{<CampoDeData\n                    id="prazo"}{<Input\n                    type="date"\n                    id="prazo"}' "$alvo"
          if node scripts/check-campo-de-data.mjs > /dev/null 2>&1; then
            echo "::error::O guard passou verde com um campo de data nativo na tela de metas."
            exit 1
          fi
          cp /tmp/campo-de-data-alvo.orig "$alvo"

          # 2) O campo simplesmente APAGADO. A primeira peneira nao ve: nao ha
          #    campo nativo nenhum. Quem pega e o piso.
          perl -0pi -e 's{<CampoDeData\n                    id="prazo"}{<span data-sem-campo="1"\n                    id="prazo"}' "$alvo"
          if node scripts/check-campo-de-data.mjs > /dev/null 2>&1; then
            echo "::error::O guard passou verde com um campo de data apagado da tela."
            exit 1
          fi
          cp /tmp/campo-de-data-alvo.orig "$alvo"

          # 3) E SABE NAO FALHAR. Os seis arquivos corrigidos citam o controle
          #    nativo em PROSA, e um guard que lesse comentario reprovaria
          #    justamente eles -- o avesso do que ele mede.
          if ! node scripts/check-campo-de-data.mjs > /dev/null 2>&1; then
            echo "::error::O guard reprova a arvore correta."
            exit 1
          fi

          echo "O guard fica vermelho nos dois defeitos e verde na arvore correta."

      # Controles negativos. Uma verificacao que nunca viu vermelho nao e
      # verificacao: se a regex quebrar numa refatoracao, o passo acima passa a
      # sair verde por nao achar NADA, que e indistinguivel de estar tudo certo.
      # Aqui plantamos as duas formas de deriva e exigimos vermelho nas duas.

      - name: 'A arvore voltou ao lugar depois de "A verificacao do campo de data sabe falhar, e sabe nao falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: 'A verificacao sabe falhar (code-schema-drift)'
        run: |
          set -uo pipefail
          probe='app/api/_drift_probe/route.ts'
          mkdir -p "$(dirname "$probe")"
          trap 'rm -rf "$(dirname "$probe")"' EXIT

          # 1) A forma obvia: .from("nome").
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase.from("tabela_que_nao_existe").select("*");
          }
          TS
          if node scripts/check-table-drift.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com um .from() inventado."
            exit 1
          fi

          # 2) A forma que escapa da leitura humana, e que foi exatamente o caso
          #    de app/api/groups/route.ts: o .from() aponta para tabela que
          #    existe, e o nome inventado esta no embed do .select().
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase.from("profiles").select(`
              id,
              tabela_que_nao_existe ( nome )
            `);
          }
          TS
          if node scripts/check-table-drift.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com um embed inventado."
            exit 1
          fi

          echo "A verificacao fica vermelha nas duas formas de deriva."

      # Mesmo tratamento para a deriva de COLUNA, e aqui o controle POSITIVO
      # importa tanto quanto o negativo: um guard de coluna que reprova coluna
      # valida seria desligado na primeira semana, e a primeira versao deste
      # mesmo script fazia isso -- a cadeia de `.from()` vazava pela virgula de
      # um `Promise.all([...])` e ele acusou nove colunas que o codigo nunca
      # pediu daquelas relacoes.

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (code-schema-drift)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao de coluna sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          probe='app/api/_column_probe/route.ts'
          mkdir -p "$(dirname "$probe")"
          trap 'rm -rf "$(dirname "$probe")"' EXIT

          # 1) .select() com coluna inventada numa tabela que existe.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase.from("transaction_categories").select("id, name, coluna_inventada");
          }
          TS
          if node scripts/check-column-drift.mjs > /dev/null 2>&1; then
            echo "::error::Passou verde com uma coluna inventada no .select()."
            exit 1
          fi

          # 2) A forma que produziu o 500 da HMO-145: o nome esta no FILTRO, e a
          #    lista de colunas do .select() esta impecavel.
          #
          #    A COLUNA PLANTADA AQUI ERA `user_id`, E A 036 A CRIOU (HMO-216).
          #    O controle nao reprovou por bug: ele parou de controlar. Com
          #    `transaction_categories.user_id` existindo, o guard passa a ter
          #    RAZAO em ficar verde, e este bloco leu isso como "o guard nao
          #    pega filtro". Foi o unico aviso de que a sonda tinha envelhecido
          #    -- um controle negativo que aponta para coluna REAL e
          #    indistinguivel de um guard quebrado.
          #
          #    Trocada por um nome que nao pode passar a existir por acidente:
          #    nenhuma migration vai chamar uma coluna de
          #    `coluna_que_nao_existe_no_filtro`. Plantar outro nome plausivel
          #    (`owner_id`, `created_by`) so adiaria o mesmo envelhecimento
          #    para a proxima migration.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase
              .from("transaction_categories")
              .select("id, name")
              .or("coluna_que_nao_existe_no_filtro.eq.1,coluna_que_nao_existe_no_filtro.is.null");
          }
          TS
          if node scripts/check-column-drift.mjs > /dev/null 2>&1; then
            echo "::error::Passou verde com coluna inventada dentro de .or()."
            exit 1
          fi

          # 3) CONTROLE POSITIVO: cadeias irmas num Promise.all, cada uma com
          #    coluna que so existe na SUA relacao. Tem que ficar verde.
          cat > "$probe" <<'TS'
          export async function GET() {
            await Promise.all([
              supabase.from("transaction_categories").select("id, name, service_id"),
              supabase.from("financial_accounts").select("id, current_balance").eq("account_type", "checking"),
              supabase.from("financial_transactions").select("amount, transaction_type").gte("transaction_date", "2026-01-01"),
            ]);
          }
          TS
          if ! node scripts/check-column-drift.mjs > /dev/null 2>&1; then
            echo "::error::Reprovou colunas VALIDAS em cadeias irmas de um Promise.all."
            node scripts/check-column-drift.mjs || true
            exit 1
          fi

          echo "Vermelho nas duas derivas de coluna, verde no uso legitimo."

      # O mesmo tratamento para a verificacao de suite fora do CI: ela tambem
      # sai verde por nao achar nada se a leitura do package.json quebrar.

      - name: 'A arvore voltou ao lugar depois de "A verificacao de coluna sabe falhar, e sabe nao falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao de teste fora do CI sabe falhar
        run: |
          set -uo pipefail
          cp package.json package.json.orig
          trap 'mv package.json.orig package.json' EXIT

          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.scripts["test:sonda-que-nenhum-workflow-roda"] = "node -e 0";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

          if node scripts/check-tests-in-ci.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com uma suite que nenhum workflow roda."
            exit 1
          fi

          echo "A verificacao fica vermelha quando uma suite fica fora do CI."

      # E o mesmo para o codigo morto. Aqui o controle da varredura CEGA e o que
      # mais importa: se a regex do `from` quebrar, ela le quase nenhum import,
      # conclui que nada esta morto e sai VERDE -- indistinguivel de uma arvore
      # limpa. O script tem um piso de especificadores lidos justamente por
      # isso, e a sonda 4 prova que o piso morde.

      - name: 'A arvore voltou ao lugar depois de "A verificacao de teste fora do CI sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao de codigo morto sabe falhar
        run: |
          set -uo pipefail
          guard='scripts/check-dead-components.mjs'
          cp "$guard" /tmp/guard.orig
          trap 'cp /tmp/guard.orig "$guard"; rm -rf components/_sonda_morta components/_sonda.tsx.bak' EXIT

          # 1) Um componente novo que ninguem importa.
          mkdir -p components/_sonda_morta
          cat > components/_sonda_morta/SondaSemImportador.tsx <<'TS'
          export function SondaSemImportador() {
            return null;
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um componente que ninguem importa."
            exit 1
          fi
          rm -rf components/_sonda_morta

          # 2) Copia de rascunho: extensao que import nenhum alcanca.
          echo '// rascunho' > components/_sonda.tsx.bak
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um arquivo .bak na arvore."
            exit 1
          fi
          rm -f components/_sonda.tsx.bak

          # 3) O registro de ESPERANDO_TELA tem que se invalidar sozinho. Uma
          #    lista de perdao que so cresce e envelhece calada e exatamente o
          #    mecanismo que este guard existe para quebrar.
          node -e '
            const fs = require("node:fs");
            const p = "scripts/check-dead-components.mjs";
            let s = fs.readFileSync(p, "utf8");
            const antes = s;
            s = s.replace(
              "const ESPERANDO_TELA = [",
              "const ESPERANDO_TELA = [\n  { arquivo: \"components/ArquivoQueNaoExiste.tsx\", tela: \"/sonda\", issue: \"SONDA\" },"
            );
            if (s === antes) { console.error("sonda 3 nao aplicou"); process.exit(2); }
            fs.writeFileSync(p, s);
          '
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um registro apontando para arquivo inexistente."
            exit 1
          fi
          cp /tmp/guard.orig "$guard"

          # 4) Varredura cega: quebra o padrao que le quase todo import. Sem o
          #    piso, este e o caso que sai VERDE.
          node -e '
            const fs = require("node:fs");
            const p = "scripts/check-dead-components.mjs";
            let s = fs.readFileSync(p, "utf8");
            const antes = s;
            s = s.replace("/\\bfrom\\s*", "/\\bZZZZfrom\\s*");
            if (s === antes) { console.error("sonda 4 nao aplicou"); process.exit(2); }
            fs.writeFileSync(p, s);
          '
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com a varredura cega -- o piso nao mordeu."
            exit 1
          fi
          cp /tmp/guard.orig "$guard"

          # Controle POSITIVO: restaurado, a arvore de verdade passa. Sem isto,
          # os quatro testes acima estariam satisfeitos por um script que
          # simplesmente sempre falha.
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou a arvore limpa."
            node "$guard" || true
            exit 1
          fi

          echo "Vermelho nas quatro sondas, verde na arvore limpa."

      # Controle do guard de colisao query x segmento dinamico. As duas sondas
      # cobrem as duas formas reais: o acesso direto e o por apelido, que foi
      # justamente o que a primeira versao do guard deixou passar.

      - name: 'A arvore voltou ao lugar depois de "A verificacao de codigo morto sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao de colisao sabe falhar
        run: |
          set -uo pipefail
          guard='scripts/check-rota-query-colidente.mjs'
          probe='app/api/_colisao_probe/[id]/route.ts'
          mkdir -p "$(dirname "$probe")"
          trap 'rm -rf app/api/_colisao_probe' EXIT

          # 1) Acesso direto: searchParams.get("id") sob o segmento [id].
          cat > "$probe" <<'TS'
          import { NextRequest, NextResponse } from "next/server";
          export async function DELETE(request: NextRequest) {
            const alvo = new URL(request.url).searchParams.get("id");
            return NextResponse.json({ alvo });
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com a colisao direta."
            exit 1
          fi

          # 2) Por apelido. Esta e a forma que escapa de uma regex ingenua, e o
          #    guard nasceu cego para ela.
          cat > "$probe" <<'TS'
          import { NextRequest, NextResponse } from "next/server";
          export async function DELETE(request: NextRequest) {
            const sp = new URL(request.url).searchParams;
            return NextResponse.json({ alvo: sp.get("id") });
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com a colisao por apelido."
            exit 1
          fi

          # 3) Controle NEGATIVO de falso positivo: parametro de outro nome sob
          #    [id] e legitimo e chega normalmente em producao (medido com
          #    ?purge=true). Se o guard reprovasse isto, seria desligado.
          cat > "$probe" <<'TS'
          import { NextRequest, NextResponse } from "next/server";
          export async function DELETE(request: NextRequest) {
            const sp = new URL(request.url).searchParams;
            return NextResponse.json({ purge: sp.get("purge") });
          }
          TS
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou parametro que NAO colide."
            node "$guard" || true
            exit 1
          fi

          rm -rf app/api/_colisao_probe
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou a arvore limpa."
            exit 1
          fi

          echo "Vermelho nas duas colisoes, verde no parametro legitimo e na arvore limpa."

      # Controle do guard de embed ambiguo. O controle POSITIVO (sonda 2) pesa
      # tanto quanto o negativo: um guard que reprovasse o embed qualificado
      # obrigaria a desfazer a correcao para ficar verde.
      #
      # A sonda 3 e a que importa mais no longo prazo. Este guard depende de
      # LER as FKs das migrations, e se esse parser quebrar ele nao acha par
      # ambiguo nenhum, nao tem o que conferir, e sai VERDE -- indistinguivel
      # de uma arvore correta. O piso de pares lidos existe para isso, e aqui
      # exigimos que ele morda.

      - name: 'A arvore voltou ao lugar depois de "A verificacao de colisao sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao de embed ambiguo sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          guard='scripts/check-embed-ambiguo.mjs'
          probe='app/api/_embed_probe/route.ts'
          mkdir -p "$(dirname "$probe")"
          cp "$guard" /tmp/embed-guard.orig
          trap 'cp /tmp/embed-guard.orig "$guard"; rm -rf app/api/_embed_probe' EXIT

          # 1) O defeito da HMO-236: embed curto a partir de uma tabela que tem
          #    duas FKs para o alvo.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase
              .from("recurring_rules")
              .select(`
                *,
                account:financial_accounts(id, name)
              `);
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um embed ambiguo de financial_accounts."
            exit 1
          fi

          # 2) CONTROLE POSITIVO: a mesma query com a FK qualificada passa.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase
              .from("recurring_rules")
              .select(`
                *,
                account:financial_accounts!recurring_rules_account_id_fkey(id, name)
              `);
          }
          TS
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou um embed com a FK JA qualificada."
            node "$guard" || true
            exit 1
          fi
          rm -rf app/api/_embed_probe

          # 3) Parser de migration cego. Sem o piso de pares lidos, este e o
          #    caso que sai verde sem ter medido nada.
          node -e '
            const fs = require("node:fs");
            const p = "scripts/check-embed-ambiguo.mjs";
            let s = fs.readFileSync(p, "utf8");
            const antes = s;
            s = s.replace("FOREIGN\\s+KEY", "ZZZFOREIGN\\s+KEY");
            if (s === antes) { console.error("sonda 3 nao aplicou"); process.exit(2); }
            fs.writeFileSync(p, s);
          '
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com o parser de FK cego -- o piso nao mordeu."
            exit 1
          fi
          cp /tmp/embed-guard.orig "$guard"

          # Controle POSITIVO final: a arvore de verdade passa.
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou a arvore limpa."
            node "$guard" || true
            exit 1
          fi

          echo "Vermelho no embed ambiguo e no parser cego, verde no qualificado e na arvore limpa."

      - name: 'A arvore voltou ao lugar depois de "A verificacao de embed ambiguo sabe falhar, e sabe nao falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # CORES SAEM DOS TOKENS E TEM CONTRASTE
      # origem: color-tokens.yml (job `tokens`)
      # =======================================================================
      # Prova, a cada mudanca no codigo, que o modo noturno continua inteiro.
      #
      # O modo de falha aqui e silencioso do mesmo jeito que o da deriva de schema:
      # uma tela nova escrita com `bg-white text-gray-900` compila, passa no tsc,
      # passa no next build e fica perfeita para quem revisa de dia. Ela so aparece
      # como um retangulo branco na cara de quem usa o app as 23h -- e ninguem
      # associa isso ao PR que a introduziu.
      #
      # O mesmo vale para o contraste: mexer em um --success de 30% para 45% de
      # luminosidade nao quebra nada, so deixa o valor positivo lavado no fundo
      # claro. Por isso a verificacao le os tokens e calcula a razao de contraste em
      # vez de confiar no olho.
      #
      # Nao precisa de Postgres nem de dependencia: Node puro, roda em segundos.
      - name: Nenhuma cor fixa fora dos tokens, contraste AA nos dois temas
        run: node scripts/check-color-tokens.mjs

      # Controle negativo. Uma verificacao que nunca viu vermelho nao e
      # verificacao: se a regex de classes quebrar, o passo acima passa a sair
      # verde por nao achar NADA -- indistinguivel de estar tudo certo.
      - name: 'A verificacao sabe falhar (color-tokens)'
        run: |
          set -uo pipefail
          probe='components/_color_probe.tsx'
          trap 'rm -f "$probe" && git checkout -- app/globals.css' EXIT

          # 1) Cor fixa: a classe existe, o Tailwind gera, o tema ignora.
          cat > "$probe" <<'TSX'
          export function Probe() {
            return <div className="bg-white text-gray-900">oi</div>;
          }
          TSX
          if node scripts/check-color-tokens.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com bg-white/text-gray-900."
            exit 1
          fi
          rm -f "$probe"

          # 2) Token legal, contraste ilegal.
          sed -i 's/--success: [0-9.]* [0-9.]*% [0-9.]*%/--success: 142.1 70.6% 45%/' app/globals.css
          if node scripts/check-color-tokens.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com --success em 2.3:1."
            exit 1
          fi
          git checkout -- app/globals.css

          # 3) A MESMA regressao, mas na paleta do modo papel de pao (HMO-283).
          #
          # Este caso existe separado do (2) de proposito. A guarda le QUATRO
          # blocos de globals.css, e ".papel" e ".dark" sao substring de
          # ".dark.papel": um erro de leitura faria dois nomes apontarem para a
          # mesma paleta, e as duas de papel ficariam SEM cobranca nenhuma
          # enquanto o passo acima continuava verde. Os casos (2) e (3) juntos
          # sao o que distingue "a guarda sabe falhar" de "a guarda sabe falhar
          # nas quatro paletas".
          #
          # A ancora e o --muted-foreground de `.dark.papel` (creme sobre marrom
          # profundo): levado a 35% de luminosidade ele cai para ~2.9:1. Se o
          # valor mudar em globals.css e o sed parar de casar, o `grep` abaixo
          # reprova -- um sed que nao casa SAI ZERO e passaria por "a guarda
          # pegou", que e o modo de falha classico deste tipo de bloco.
          sed -i 's/--muted-foreground: 38 32% 70%/--muted-foreground: 38 32% 35%/' app/globals.css
          if ! grep -q -- '--muted-foreground: 38 32% 35%' app/globals.css; then
            echo "::error::O mutante da paleta de papel nao foi aplicado -- a ancora mudou em globals.css. Este bloco estava medindo nada."
            exit 1
          fi
          saida="$(node scripts/check-color-tokens.mjs 2>&1)" && {
            echo "::error::A verificacao passou verde com a paleta de papel escuro em 2.9:1."
            exit 1
          }
          # E tem que reprovar DIZENDO qual paleta -- uma mensagem que culpa o
          # tema escuro normal manda consertar o bloco errado.
          if ! printf '%s' "$saida" | grep -q 'papel escuro'; then
            echo "::error::A verificacao reprovou, mas sem nomear a paleta de papel escuro:"
            printf '%s\n' "$saida"
            exit 1
          fi

          echo "A verificacao fica vermelha nas tres formas de regressao, e nomeia a paleta certa."

      # Mora aqui, e nao no db-verify, de proposito. O db-verify e filtrado por
      # `paths: ['database/**', 'lib/...']` -- mexer em app/page.tsx nao casa
      # com nenhum padrao, o job e pulado, e o PR sai verde com a suite parada.
      # Este workflow nao tem filtro nenhum.
      #
      # E e a mesma familia de defeito que o resto do arquivo vigia: uma classe
      # do Tailwind que compila, passa no tsc, passa no next build, e so erra
      # no aparelho de quem usa -- ali um retangulo branco as 23h, aqui dois
      # botoes desencontrados no celular (HMO-160).

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (color-tokens)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      # =======================================================================
      # MODO "PAPEL DE PAO": A PREFERENCIA E O INTERRUPTOR
      # origem: nasceu aqui (HMO-283, do plano da HMO-279)
      # =======================================================================
      # Passos neste job, e nao num job novo: o custo de CI aqui e o NUMERO DE
      # JOBS (ver o cabecalho deste arquivo), e as duas suites juntas levam
      # ~5 segundos.
      #
      # A preferencia. O pedaco que nao teria rede de outra forma e o
      # PAPEL_INIT_SCRIPT: ele e TEXTO, nao compila, e roda no <head> dentro de
      # um try/catch que engole qualquer erro dele -- um parentese errado ali
      # apareceria apenas como o flash da pele normal voltando para quem usa o
      # modo, e ninguem abre bug para isso. A suite EXECUTA o script contra um
      # DOM de mentira e compara o resultado com o do modulo.
      - name: A preferencia do papel de pao cai no padrao, e o script do <head> funciona
        run: npm run test:modo-papel

      # O interruptor, em navegador. Clicar no papelzinho tem que trocar a
      # classe do <html> E o clique em Configuracoes tem que fazer o mesmo --
      # medir so um dos dois deixaria metade do que a issue pede sem prova.
      #
      # Precisa de navegador pela mesma razao do test:divisao-ui-dom abaixo:
      # `react-dom/server`, que e como as outras suites de componente deste
      # repo rodam, NAO ve handler. `onClick` nao sai no HTML e nunca e chamado
      # pelo render, entao a tela renderizaria identica com o handler vazio.
      #
      # Sem navegador a suite FALHA, e nao pula: suite que se desliga sozinha e
      # indistinguivel de suite que passou.
      # A mesma pagina ganhou, na HMO-294, a leitura do PAINEL: os `data-rotulo`
      # dos dois cartoes. O primeiro passou de "Salario Previsto" para
      # "Salario", e a troca e de uma `string` literal -- invisivel para o tsc,
      # para o lint, para o `next build` e para `test:papel-de-pao`, que mede a
      # aritmetica do painel e nao mudou. Campo de ROTULO atravessando suite de
      # NUMERO ja deu 40 blocos verdes com a classificacao invertida aqui.
      #
      # A assercao tem as DUAS metades -- "Salario" presente e "Salario
      # Previsto" ausente -- porque so a primeira passa verde com o texto velho
      # intacto ("Salario" e substring de "Salario Previsto"). E ela e sensivel
      # a CAIXA de proposito: `FRASE_SEM_SALARIO` ("nenhum salario previsto
      # para este mes") continua na tela e continua certa.
      #
      # A HMO-296 poe o TERCEIRO CARTAO na mesma pagina (o caso G), e o que ela
      # mede aqui e so a FIACAO: titulo, valor e as duas parcelas que chegam na
      # resposta aparecem no terceiro cartao, e a tela nao inventa nenhum dos
      # quatro. O esboco da rota entrega titulo e valor LITERAIS -- nunca
      # calculados --, justamente para que nenhuma assercao de G possa passar
      # verde por uma conta feita dentro da sonda; a aritmetica e medida no passo
      # de `test:papel-de-pao` abaixo. E as tres constantes de texto do cartao
      # sao LIDAS do `lib/papel-de-pao.js` compilado em vez de copiadas: as
      # assercoes de G leem esses textos, e um marcador faria cada caso medir a
      # mentira escrita na propria sonda.
      - name: O papelzinho e o espelho dele em Configuracoes trocam a pele do app
        run: npm run test:papel-na-tela

      # Os mutantes da metade do painel. Dezesseis, e o terceiro deles e o que
      # justifica o bloco: renomear o `data-rotulo` faz a sonda ler uma lista
      # VAZIA de rotulos, e "Salario Previsto nao aparece" e verdade numa lista
      # vazia. Quem o mata e o controle positivo da montagem (os TRES cartoes de
      # producao no DOM), e sem este runner ninguem saberia que ele existe.
      #
      # Os cinco ultimos sao do cartao da HMO-296, e o criterio para morarem
      # aqui e o de sempre: so a tela os ve. Um cartao que sai da arvore, a linha
      # de conferencia que nao renderiza, as duas parcelas trocadas entre si --
      # os tres compilam, passam no lint e deixam a aritmetica da lib intacta.
      #
      # Runner separado do `mutantes-menu-papel.mjs` porque esta suite abre
      # navegador: ~7s por volta contra menos de 1s das puras. Nao e job novo --
      # e um passo deste mesmo job, que o custo aqui e o NUMERO DE JOBS.
      - name: Os mutantes do rotulo do painel de papel
        run: node scripts/mutantes-painel-na-tela.mjs

      # O MENU REDUZIDO do modo (HMO-284, ampliado pela HMO-294). Com o modo
      # ligado o menu encolhe de 27 itens para 7, por um segundo filtro sobre o
      # MESMO array de navegacao.
      #
      # Eram 5 na HMO-284. A HMO-294 acrescentou `/dashboard/profile` e
      # `/dashboard/settings`, e a segunda conserta um defeito de navegacao: o
      # espelho do interruptor do modo vive em Configuracoes, e com o modo
      # ligado aquela tela era INALCANCAVEL pelo menu -- a unica saida do modo
      # era o papelzinho do cabecalho.
      #
      # A suite exige EXATAMENTE 7 e EXATAMENTE 27, e nao "contem": com
      # `contem`, ela ficaria verde enquanto o menu voltasse a crescer -- o
      # proximo item acrescentado ao array entraria no modo sem ninguem decidir.
      # Por isso um item novo REPROVA aqui; a mensagem do teste diz o que fazer.
      # (Foi o que aconteceu na HMO-294: as quatro contagens tiveram de ser
      # reescritas uma por uma, de proposito.)
      #
      # Ela tambem fixa o plano em todo caso. `podeVerItem` e o primeiro filtro
      # e ja existia; sem fixar, a contagem de 27 cai para 25 e a suite passaria
      # a medir o PLANO em vez do MODO.
      - name: O menu do papel de pao tem 7 itens, e o menu normal tem 27
        run: npm run test:menu-papel

      # Dois dos dez casos da suite acima afirmam sobre o TEXTO-FONTE do
      # Sidebar, e nao sobre valor calculado: que ele CHAMA o filtro (nao basta
      # importar -- `noUnusedLocals` esta desligado, entao apagar a chamada e
      # deixar o import nao e erro de tsc nem de lint) e que nenhuma pagina
      # importa o menu reduzido, porque esconder do menu nao e bloquear rota.
      #
      # Assercao sobre texto e o tipo que mais passa verde sem medir nada, e a
      # contagem sobre array e o segundo. Por isso os dois tipos levam mutante:
      # cada um estraga uma coisa e exige que a suite reprove. O runner tem
      # controle positivo (codigo intacto tem de PASSAR) e confere que cada
      # ancora casou -- um replace que nao casa com nada nao muda arquivo
      # nenhum, e isso se le como "mutante sobreviveu" quando o mutante nunca
      # existiu.
      - name: Os mutantes do menu do papel de pao
        run: node scripts/mutantes-menu-papel.mjs

      # OS DOIS NUMEROS do modo (HMO-286) -- "Salario Previsto" e "Total de
      # contas". E o unico dos tres PRs do modulo que fala de DINHEIRO, e as
      # duas frases sao rotulos NOVOS: nenhuma delas existia no app. Rotulo novo
      # em cima de numero velho ja custou caro aqui duas vezes ("Fatura atual"
      # mostrando a divida inteira do cartao, "a vencer" somando o salario com
      # as contas), e nas duas o numero exibido era plausivel -- e o modo de
      # falha que nenhuma inspecao visual pega.
      #
      # A suite mede `lib/papel-de-pao.ts` com as dependencias de verdade
      # (STATUS_FORA_DO_PREVISTO, direcaoDaAgenda, parteDoMembro,
      # periodoCorrente entram pelo tsc), e cobre os quatro casos da issue: o
      # SINAL (despesa e negativa neste banco; somada crua ela DIMINUI o total
      # de contas), o RECORTE DO MES (leitura sem recorte soma o horizonte
      # inteiro), o FILTRO DE CATEGORIA e o CASO VAZIO.
      #
      # O caso da categoria e o que sustenta a suite inteira: o fixture tem uma
      # receita prevista FORA da categoria Salario (aluguel recebido, R$ 2.500).
      # Sem aquela linha, a suite ficaria verde mesmo com o codigo lendo o
      # `expected_income` AGREGADO de /api/scheduled-transactions/summary -- que
      # e exatamente o numero que os significados aprovados descartam, porque
      # ele chama aluguel e reembolso de salario.
      #
      # DUAS VOLTAS, uma em cada fuso. Nao ha `new Date()` na suite (todo `hoje`
      # e string literal), e e isso que as duas voltas protegem: teste de data
      # aqui passa em UTC e nao ve o bug, porque a sandbox e America/Sao_Paulo e
      # o CI e UTC. Se qualquer caso passar a depender do relogio da maquina,
      # uma das duas reprova.
      #
      # OS QUATRO ULTIMOS CASOS falam do PORTAO de `/dashboard`, e sobre o
      # TEXTO-FONTE: invertido, o portao entrega o painel de 8 requisicoes a
      # quem ligou o modo e dois numeros a quem nao ligou -- e as duas pontas
      # existem, compilam e sao do mesmo tipo, entao tsc, lint e `next build`
      # passam todos. O cabecalho do portao menciona os dois nomes em prosa, e
      # por isso a assercao roda sobre o codigo SEM comentario; o primeiro dos
      # quatro casos e o controle desse strip -- sem ele os outros tres seriam
      # vacuos, lendo o comentario em vez do `return`.
      #
      # O ROTULO do primeiro cartao nao e medido aqui: a HMO-294 o encurtou para
      # "Salario", e quem le isso e a sonda de DOM do `test:papel-na-tela`
      # acima. Esta suite continua medindo so a conta, e o campo da resposta
      # continua `salario_previsto` -- ele e fio, nao tela.
      #
      # A HMO-295 (5/6) acrescentou o PASSO DE MES: a rota passou a receber
      # `?month=AAAA-MM` e a suite ganhou a secao do mes pedido. O `hoje` de
      # todos os casos dela e marco de 2026, e os meses pedidos sao outros --
      # esse desencontro NAO e detalhe de fixture: o mutante da issue e "ignorar
      # o `?month=` e usar sempre o corrente", e um caso que pedisse o mes
      # corrente passaria verde com o parametro inteiramente desligado.
      #
      # Os SEIS ultimos casos falam do TEXTO-FONTE do `route.ts`, e nao de valor
      # calculado: nenhuma suite deste repositorio importa um `route.ts` (ele
      # arrasta `next/server` e o cliente do Supabase), e a rota pode chamar a
      # funcao certa com o argumento errado -- `janelaDoMes(null, hoje)` compila,
      # passa no lint e desliga a feature. Por isso a ancora e o CALL SITE com os
      # argumentos, e nao o nome da funcao: um `exigido("janelaDoMes")` passaria
      # verde com o `import` intacto e a chamada apagada. O comentario e
      # arrancado antes (o cabecalho da rota menciona `month` em prosa), e um dos
      # casos e o controle desse strip.
      #
      # A HMO-296 (6/6) acrescentou a TERCEIRA PERNA (`receitas`) e o cartao que
      # sai dela. Duas coisas dessa parte sao criterio e nao detalhe:
      #
      #   * a perna nova e um `aceita` novo dentro do MESMO `somarPerna` --
      #     nenhuma consulta nova, nenhuma segunda soma de despesa. Os casos da
      #     secao "A perna das receitas" medem isso elo por elo (janela, status,
      #     parte do grupo, modulo do sinal): se alguem a reescrever como um
      #     `reduce` local, cada um deles quebra num elo diferente;
      #   * "Receitas" e TODA receita prevista do mes, e nao o salario. O fixture
      #     tem o aluguel recebido de R$ 2.500, entao as receitas (9.500) e o
      #     salario (7.000) NAO coincidem -- e um fixture em que coincidissem
      #     passaria verde com o salario no lugar das receitas, que e a
      #     alternativa que a issue descartou.
      - name: Os numeros do papel de pao (salario, total de contas, sobra ou falta)
        run: npm run test:papel-de-pao

      # Os mutantes do passo de mes, do lado da ROTA e da funcao pura. Doze, e o
      # primeiro e o que justifica o bloco: a rota ignorando o `?month=` responde
      # 200, com dois numeros CERTOS (os do mes corrente) debaixo do rotulo de
      # outro mes -- e tsc, lint e `next build` passam todos, porque as duas
      # pontas compilam e sao do mesmo tipo. E a familia de defeito da HMO-173.
      #
      # Runner puro: ~1,5s por volta, contra os ~5s do de navegador acima. Nao e
      # job novo -- e um passo deste mesmo job, que o custo aqui e o NUMERO DE
      # JOBS.
      - name: Os mutantes do mes pedido pelo painel de papel
        run: node scripts/mutantes-mes-do-painel.mjs

      # Os mutantes do TERCEIRO CARTAO -- "Quanto Sobra ou Quanto Falta"
      # (HMO-296, 6/6). Onze, e tres deles sao a issue inteira:
      #
      #   1. o SINAL DO TITULO (`>= 0` virando `<= 0`). O cartao exibe o valor em
      #      MODULO, entao +300 e -300 imprimem o MESMO numero: uma suite que
      #      medisse so o valor deixaria este mutante atravessar dezenas de
      #      assercoes verdes com o rotulo INVERTIDO -- "Quanto Falta" num mes
      #      que sobrou. E a familia de "campo de rotulo passa pela suite de
      #      aritmetica", e quem o mata sao as assercoes que leem o TITULO, com
      #      um mes positivo e um negativo no fixture;
      #   2. a ORDEM (`receitas - despesas` virando `despesas - receitas`). Pelo
      #      mesmo motivo do modulo, fixture simetrico nao o mata: ele morre no
      #      mes em que as duas magnitudes DIFEREM e o sinal vira;
      #   3. a PROPAGACAO DO `null`, trocada por `?? 0`. Exige fixture com UMA
      #      perna vazia e a outra cheia -- mes vazio dos dois lados nao
      #      distingue `null` de zero. O que o mutante imprimiria e "Quanto
      #      Sobra: R$ 9.500,00" num mes em que as contas nao foram lidas.
      #
      # Os outros oito sao as demais formas do mesmo defeito, e uma delas e a
      # ALTERNATIVA QUE A ISSUE DESCARTOU escrita como mutante: `receitas`
      # recortado pela categoria Salario. Ela FECHA a aritmetica na tela
      # (7.000 - 3.980,50) e mente no rotulo -- quem recebe aluguel veria uma
      # sobra MENOR do que a real, o erro na direcao cara.
      #
      # Runner puro, como o de cima, e no mesmo job pela mesma razao.
      - name: Os mutantes do cartao Quanto Sobra ou Quanto Falta
        run: node scripts/mutantes-sobra-ou-falta.mjs

      # Os mutantes do DETALHE que o chevron abre (HMO-300, 9/10). Vinte e um,
      # e o primeiro e a issue inteira: listar as linhas ANTES da divisao da
      # parte do grupo.
      #
      # Ele poe R$ 3.000 numa lista debaixo de um total que tem R$ 1.500 dela, e
      # nao quebra nada -- 200, numero grande certo, chevron abrindo, linhas com
      # nome e data. O que a tela passa a fazer e pior do que mostrar um numero
      # errado: ela EXPLICA o numero certo com valores que nao somam nele. E ele
      # passa por QUALQUER assercao que so conte linhas: so a soma
      # (`soma(detalhe) === total`, em todo fixture) o mata -- e so num fixture
      # que TENHA linha de grupo, porque sem grupo `parteDoMembro` devolve o
      # valor cheio e o mutante fica indistinguivel do codigo correto.
      #
      # Os outros vinte cobrem as demais familias: a lista que perde a fatura
      # aberta sintetizada (soma MENOS que o total, com o total certo),
      # `posso_editar` falhando ABERTO (botao na linha do outro membro, que a
      # RLS recusa com um `UPDATE` que volta 200 sem alterar nada), e a rota
      # ganhando uma QUARTA consulta -- que e o criterio "nenhuma consulta nova"
      # medido em vez de prometido.
      #
      # Este runner roda as DUAS suites por mutante (`test:papel-de-pao` e
      # `test:papel-na-tela`), e nao e desperdicio: um mutante de
      # `PainelDePapel.tsx` nao muda nada na pura, e um da lib nao muda nada na
      # de navegador. Rodar so uma faria metade dos mutantes sobreviver por
      # estar medindo o arquivo errado. Continua sendo um passo deste mesmo job.
      - name: Os mutantes da lista de detalhes do painel de papel
        run: node scripts/mutantes-detalhe-do-painel.mjs

      - name: Os botoes da home empilham alinhados e com espaco no celular
        run: npm run test:home-cta

      # Oito rotas do painel andavam para o lado no celular (HMO-168), por dois
      # mecanismos: linha de acao que nao quebra e barra de abas que nao rola.
      - name: Nenhuma tela do painel volta a empurrar a pagina para o lado
        run: npm run test:mobile-overflow

      # Controle negativo do passo acima, pelo mesmo motivo do de cores: um
      # teste que le classes por regex passa a sair verde se a regex parar de
      # encontrar o alvo, e verde-por-nao-olhar e indistinguivel de verde.
      - name: A verificacao de scroll horizontal sabe falhar
        run: |
          set -uo pipefail
          trap 'git checkout -- components/ui/tabs.tsx components/subscription/SoftFeatureGuard.tsx' EXIT

          # 1) A barra de abas volta a ter a largura do conteudo.
          sed -i 's/ overflow-x-auto//' components/ui/tabs.tsx
          if npm run test:mobile-overflow --silent > /dev/null 2>&1; then
            echo "::error::Passou verde com o TabsList sem overflow-x-auto."
            exit 1
          fi
          git checkout -- components/ui/tabs.tsx

          # 2) Os dois botoes do cartao Premium voltam a brigar por uma linha.
          sed -i 's/flex flex-wrap gap-2/flex gap-2/' components/subscription/SoftFeatureGuard.tsx
          if npm run test:mobile-overflow --silent > /dev/null 2>&1; then
            echo "::error::Passou verde com o cartao Premium sem flex-wrap."
            exit 1
          fi

          echo "A verificacao fica vermelha nos dois mecanismos da HMO-168."

      # Controle negativo da HMO-185, a outra familia que a mesma suite vigia:
      # a area util da tela no iPhone. Ela precisa de controle proprio porque
      # e MAIS invisivel que o scroll horizontal -- `env(safe-area-inset-top)`
      # vale 0 em todo navegador sem notch, inclusive o deste runner, entao
      # nem uma medicao em pixels aqui veria a regressao. Sobra afirmar sobre
      # o mecanismo, e mecanismo afirmado por regex sai verde no dia em que a
      # regex para de achar o alvo.
      #
      # Os tres mutantes sao os tres caminhos de volta, e o terceiro foi
      # medido em navegador antes de entrar aqui (sem o `min-w-0` do bloco da
      # esquerda a pagina volta a 614px numa viewport de 390).

      - name: 'A arvore voltou ao lugar depois de "A verificacao de scroll horizontal sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao de area util sabe falhar
        run: |
          set -uo pipefail
          # Os caminhos vao um a um e entre aspas: `app/(dashboard)/...` tem
          # parenteses, e desprotegido o shell le isso como subshell -- a
          # restauracao morreria com erro de sintaxe, deixando o repositorio
          # mutado para os passos seguintes.
          trap "git checkout -- app/globals.css 'app/(dashboard)/layout.tsx' 'app/(dashboard)/dashboard/personal-finance/page.tsx'" EXIT

          # 1) O espacador volta a ter altura escrita a mao, e para de
          #    acompanhar o header.
          sed -i 's/height: calc(var(--app-header) + var(--safe-top));/height: var(--app-header);/' app/globals.css
          if npm run test:mobile-overflow --silent > /dev/null 2>&1; then
            echo "::error::Passou verde com o espacador ignorando o recorte do topo."
            exit 1
          fi
          git checkout -- app/globals.css

          # 2) O painel volta a 100vh -- a altura que o Safari do iPhone so
          #    entrega depois que a pessoa rola.
          sed -i 's/className="min-h-app bg-background"/className="min-h-screen bg-background"/' 'app/(dashboard)/layout.tsx'
          if npm run test:mobile-overflow --silent > /dev/null 2>&1; then
            echo "::error::Passou verde com o painel de volta em min-h-screen."
            exit 1
          fi
          git checkout -- 'app/(dashboard)/layout.tsx'

          # 3) A linha de lancamento volta a se recusar a encolher.
          #
          # Este `sed` casa nas DUAS linhas da lista (a comum e a parte de
          # grupo), porque as duas tem a mesma cadeia -- e por isso ele nao
          # prova nada sobre a segunda: ficaria vermelho pela primeira. O
          # mutante 4 existe para essa metade.
          sed -i 's/gap-3 min-w-0 flex-1/gap-3 flex-1/' 'app/(dashboard)/dashboard/personal-finance/page.tsx'
          if npm run test:mobile-overflow --silent > /dev/null 2>&1; then
            echo "::error::Passou verde com a linha de lancamento sem min-w-0."
            exit 1
          fi
          git checkout -- 'app/(dashboard)/dashboard/personal-finance/page.tsx'

          # 4) HMO-215: a fila de metadados da PARTE DE GRUPO para de quebrar.
          #    A lista tem duas formas de linha desde a HMO-215, e os casos que
          #    ancoram em `{transaction.description}` nunca olham a segunda --
          #    ela poderia nascer sem `flex-wrap` e empurrar a pagina inteira
          #    com a suite verde. Esta linha carrega MAIS selos que a comum
          #    (tipo + categoria + data + nome do grupo + "a aprovar"), entao e
          #    a que tem o piso de min-content maior das duas.
          perl -0pi -e 's|(\{parte\.description\}</p>\s*<div className=")flex flex-wrap items-center gap-x-2 gap-y-1 |${1}flex items-center gap-x-2 |s' 'app/(dashboard)/dashboard/personal-finance/page.tsx'
          if npm run test:mobile-overflow --silent > /dev/null 2>&1; then
            echo "::error::Passou verde com a fila da parte de grupo sem flex-wrap."
            exit 1
          fi

          echo "A verificacao fica vermelha nos quatro caminhos de volta."

      # Terceiro inquilino sem filtro de path, pelo mesmo motivo dos dois de
      # cima -- e o que ele vigia nao tem dono topico nenhum: as 34 suites deste
      # repositorio compilam para `.tmp-<nome>/` e cada uma comeca com `rm -rf`
      # nesse caminho. Enquanto o diretorio estiver no .gitignore isso e inocuo.
      # Quando um escapa, nada fica vermelho: o .js compilado entra na main como
      # se fosse fonte, e quem rodar aquela suite passa a APAGAR um arquivo
      # rastreado e fica com uma delecao fantasma pronta para ser varrida para
      # dentro do commit seguinte. Aconteceu na HMO-166, que levou junto o
      # `.tmp-recorrencia-edicao/` da HMO-170 -- o unico dos 34 fora do
      # .gitignore.

      - name: 'A arvore voltou ao lugar depois de "A verificacao de area util sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: Nenhum artefato de build rastreado, nenhum .tmp-* fora do .gitignore
        run: node scripts/check-artefatos-de-build.mjs

      # Controle negativo, pela mesma razao dos outros dois: as duas metades da
      # verificacao sao varreduras que sairiam verdes se parassem de achar o
      # alvo. A segunda metade reproduz o estado exato em que a main ficou.
      - name: A verificacao de artefatos sabe falhar
        run: |
          set -uo pipefail
          trap 'git checkout -- .gitignore && rm -rf .tmp-contas' EXIT

          # 1) Um artefato de build rastreado pelo git.
          mkdir -p .tmp-contas && echo "compilado" > .tmp-contas/lixo.js
          git add -f .tmp-contas/lixo.js
          if node scripts/check-artefatos-de-build.mjs > /dev/null 2>&1; then
            echo "::error::Passou verde com .tmp-contas/lixo.js no indice."
            exit 1
          fi
          git rm -q --cached -f .tmp-contas/lixo.js
          rm -rf .tmp-contas

          # 2) A lacuna original: suite que compila para um diretorio que o
          #    .gitignore nao cobre.
          sed -i '/^\/\.tmp-recorrencia-edicao\/$/d' .gitignore
          if node scripts/check-artefatos-de-build.mjs > /dev/null 2>&1; then
            echo "::error::Passou verde com .tmp-recorrencia-edicao fora do .gitignore."
            exit 1
          fi

          echo "A verificacao fica vermelha nas duas formas de vazamento."

      - name: 'A arvore voltou ao lugar depois de "A verificacao de artefatos sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # OS TIPOS FECHAM
      # origem: build.yml (job `tipos`)
      # =======================================================================
      # Prova, a cada PR, as tres coisas que este repositorio nunca provou: que o
      # projeto COMPILA, que os TIPOS fecham, e que a IMAGEM DOCKER sobe.
      #
      # Isto e a HMO-119, e a razao de existir dela e um buraco que durou meses: dos
      # nove workflows que este repositorio tinha antes deste, NENHUM rodava
      # `next build` nem `tsc --noEmit`. Cada um prova uma regra de negocio muito bem
      # -- a mascara de dinheiro, o corte de Contas x Cartoes, o isolamento da RLS,
      # os icones do PWA -- e todos eles passam em verde num commit que nao compila.
      #
      # O modo de falha nao e teorico. O `type-check` existe no package.json desde o
      # inicio e so rodava quando alguem se lembrava de rodar; o `pre-commit` que o
      # chamaria sai 1 na main antes de chegar no lint, entao na pratica ninguem
      # executava nenhum dos dois. O unico lugar onde o build de verdade acontecia
      # era a Vercel, DEPOIS do merge -- ou seja, o sinal de "quebrou" chegava com o
      # codigo ja na main e, quando o autor do commit nao era verificado, a Vercel
      # nem comecava o build e o sinal nao chegava nunca.
      #
      # SEM FILTRO DE `paths`, e aqui isso nao e preferencia: um build quebra por
      # qualquer arquivo do projeto. Qualquer lista de caminhos que eu escrevesse
      # hoje estaria errada amanha, e foi exatamente assim que tres suites deste
      # repositorio ficaram paradas em verde -- elas so rodavam no db-verify, que e
      # filtrado por path.
      - name: tsc --noEmit
        run: npm run type-check

      # Controle negativo. Uma verificacao que nunca viu vermelho nao e
      # verificacao: se o tsconfig passar a excluir o projeto (um `include`
      # errado, um `exclude` novo), o passo acima continua saindo 0 e o job fica
      # verde sem checar uma linha. Aqui um erro de tipo OBVIO tem que reprovar.
      #
      # O arquivo nasce e morre dentro do job. Fica em `lib/` porque o `include`
      # de hoje e `**/*.ts` e pegaria qualquer lugar, mas um `include` futuro que
      # liste diretorios tende a citar `lib` e nao a raiz -- entao `lib/` e onde
      # o controle tem mais chance de continuar valendo.
      - name: Controle negativo (erro de tipo tem que reprovar)
        run: |
          set -u
          cat > lib/__controle_negativo__.ts <<'EOF'
          export const quantosCentavos: number = "isto nao e um numero";
          EOF
          if npm run type-check > /tmp/controle.log 2>&1; then
            rm -f lib/__controle_negativo__.ts
            echo "::error::O tsc APROVOU um erro de tipo obvio. A checagem de tipos nao esta olhando o projeto -- confira o include/exclude do tsconfig.json."
            exit 1
          fi
          rm -f lib/__controle_negativo__.ts
          echo "OK: o tsc reprovou o erro plantado, entao ele esta lendo o projeto."

          # E o arquivo plantado tem que ter ido embora, senao o proximo passo
          # herdaria um projeto que nao compila.
          test ! -f lib/__controle_negativo__.ts

      - name: 'A arvore voltou ao lugar depois de "Controle negativo (erro de tipo tem que reprovar)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # O AJUSTE FAZ A FATURA FECHAR IGUAL A REAL
      # origem: ajuste-de-saldo.yml
      # =======================================================================
      # O ajuste de saldo da fatura do cartao (HMO-253).
      #
      # POR QUE ELE MERECE VERIFICACAO PROPRIA
      # ------------------------------
      # Este e o unico lugar do app onde o usuario escreve um numero com SINAL no
      # dinheiro de uma fatura. A fatura e `SUM(invoice_amount)` de uma view que
      # inverte o sinal de `amount`, entao existem duas convencoes opostas sobre o
      # mesmo valor -- e um ajuste gravado com o sinal trocado faz a fatura andar para
      # o lado contrario ao que a pessoa pediu, com o numero certo, a tela coerente
      # consigo mesma, e nada vermelho.
      #
      # O resto dos modos de falha e da mesma familia: o ajuste de outubro caindo na
      # fatura de novembro; "Salvar" duas vezes somando o valor duas vezes; a previa
      # "a fatura passa para R$ 1.290" discordando do que o POST grava. Nenhum deles
      # da erro, e todos valem dinheiro.
      #
      # SEM FILTRO DE `paths`, pelo mesmo motivo do cartoes.yml: o comportamento nasce
      # de quatro lugares em tres diretorios (lib/ajuste-de-fatura.ts,
      # components/cartoes/*.tsx, a rota e os primitivos de components/ui), e um filtro
      # que liste os de hoje perde o dia em que alguem mexer no de amanha.
      #
      # O QUE ESTE JOB NAO COBRE: o banco. Que o dia 1 caia na fatura do mes certo e
      # que a view inverta o sinal e aritmetica do Postgres, e esta no db-verify
      # (database/tests/ajuste_de_fatura_test.sql). Uma afirmacao de TypeScript sobre
      # `card_invoice_month` provaria so que a conta foi repetida duas vezes.
      - name: As regras do ajuste de saldo
        run: npm run test:ajuste-de-fatura

      # =======================================================================
      # O ACERTO DE GRUPO VIRA LANCAMENTO (HMO-245, fase 11)
      # =======================================================================
      # `group_settlements` existia desde a 007 sem gerar lancamento nenhum: o
      # Pix de uma pessoa para a outra era invisivel nos dois lados e o saldo da
      # conta corrente nao se mexia. Era o defeito relatado.
      #
      # POR QUE AQUI, E NAO SO NO DB-VERIFY
      # -----------------------------------
      # A metade de banco (saldo antes/depois, o rateio que o trigger inventa se
      # a perna levar `group_id`, a RLS que recusa a perna da contraparte) esta
      # em database/tests/hmo245_acerto_vira_lancamento_test.sql, no db-verify,
      # porque e aritmetica de Postgres. Mas o db-verify e filtrado por `paths`,
      # e ESTE workflow nao e: `components/grupos/DialogoDeAcerto.tsx` nao esta
      # na lista de paths de ninguem, e foi exatamente assim que tres suites
      # deste repositorio ficaram paradas em verde.
      #
      # O que a suite pura prende -- cada item e dinheiro errado sem excecao
      # nenhuma:
      #   - o SINAL por direcao. Quem recebe soma, quem paga subtrai;
      #     `update_account_balance` faz `current_balance + NEW.amount` sem
      #     olhar o tipo, entao um sinal invertido afunda a conta de quem acabou
      #     de RECEBER, com todos os numeros plausiveis na tela;
      #   - o TIPO `transfer` NOS DOIS LADOS. `income` em quem recebe apaga a
      #     parte dela no painel pessoal: medido em Postgres, income 200 /
      #     expense 200 / net 0,00 onde o certo e -200,00, porque
      #     `personal_category_monthly_totals` (033) ja conta "a minha parte"
      #     das despesas de grupo e ignora `transfer`;
      #   - `group_id: null` e `is_shared: false` literais;
      #   - a moeda da perna saindo da CONTA pela taxa GRAVADA na quitacao, e a
      #     recusa (em vez da conversao) numa terceira moeda;
      #   - cartao de credito recusado: a perna cairia DENTRO da fatura;
      #   - a chave em `notes` carregando o id do acerto -- uma chave constante
      #     faria o desfazer de um acerto apagar a perna de todos os outros.
      - name: A perna do acerto de grupo (sinal, tipo, moeda e conta)
        run: npm run test:acerto-em-lancamento

      # Controle negativo. A suite afirma sobre coisas que "parecem certas" nas
      # duas direcoes -- um tipo plausivel, um sinal plausivel --, e assercao
      # desse tipo passa verde tambem quando deixa de achar o que vigiava.
      # Os quatro mutantes foram medidos antes de este bloco existir: os quatro
      # ficam vermelhos, e a arvore limpa fica verde.
      - name: 'A verificacao sabe falhar (acerto de grupo)'
        run: |
          set -uo pipefail
          REGRAS=lib/acerto-em-lancamento.ts
          cp $REGRAS $REGRAS.orig
          trap 'mv $REGRAS.orig $REGRAS; rm -rf .tmp-acerto-em-lancamento' EXIT

          # `sed` que nao casa SAI 0 e deixa o arquivo intacto: a suite roda
          # sobre o codigo correto, passa verde, e o mutante e dado por morto
          # medindo nada. `cmp` contra a copia e o que fecha essa porta.
          mutou() {
            if cmp -s "$1" "$1.orig"; then
              echo "::error::o mutante $2 nao se aplicou a $1 -- a ancora do sed mudou de forma"
              exit 1
            fi
          }

          # 1) O SINAL. As duas pernas positivas: registrar que PAGUEI passa a
          #    somar na minha conta. O valor e a tela ficam plausiveis.
          sed -i 's/params.direcao === "recebi" ? total : -total/total/' $REGRAS
          mutou $REGRAS 1
          if npm run test:acerto-em-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com as duas pernas somando no saldo."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 2) O TIPO de volta para `income`. E a decisao com medicao atras: o
          #    painel pessoal de quem recebe passa a fechar o mes melhor do que
          #    foi, apagando a parte que ela mesma consumiu.
          sed -i 's/export const TIPO_DA_PERNA = "transfer" as const;/export const TIPO_DA_PERNA = "income" as const;/' $REGRAS
          mutou $REGRAS 2
          if npm run test:acerto-em-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com a perna gravada como income."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 3) A COTACAO ESQUECIDA na conversao para real. US$ 50 entram valendo
          #    R$ 50 no saldo -- errado por um fator de 5, e sem erro nenhum: os
          #    dois numeros sao validos para a coluna.
          sed -i 's/valor = valorEmReais(bruto, taxa);/valor = bruto;/' $REGRAS
          mutou $REGRAS 3
          if npm run test:acerto-em-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com a conversao para real ignorando a cotacao."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 4) O CARTAO ACEITO. A perna cai dentro de `card_invoice_lines` e
          #    inventa uma compra que ninguem fez -- ou, de quem recebe, uma
          #    entrada que abate a fatura.
          sed -i 's/if (params.conta.account_type === "credit_card") {/if (false) {/' $REGRAS
          mutou $REGRAS 4
          if npm run test:acerto-em-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o acerto lancado em cartao de credito."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 5) E SABE NAO FALHAR, sobre a arvore correta.
          if ! npm run test:acerto-em-lancamento > /dev/null 2>&1; then
            echo "::error::A suite reprova a arvore correta."
            exit 1
          fi

          echo "Quatro mutantes mortos, e verde na arvore correta."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (acerto de grupo)"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .ts:
          # a suite seguinte leria o JS velho.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # A ARVORE. O teste puro acima passa verde com o bloco inteiro faltando na
      # tela, com a linha do ajuste sem rotulo, e com "Ajustar saldo" oferecido
      # sobre uma leitura que falhou.
      - name: O bloco de ajuste, renderizado na tela do cartao
        run: npm run test:ajuste-na-tela

      # Controle negativo. As suites afirmam sobre AUSENCIA -- "a previa NAO
      # aparece sem mes", "nenhuma linha recebe o rotulo sem categoria" -- e
      # assercao de ausencia passa verde tambem quando ela deixa de achar o que
      # deveria procurar. Uma verificacao que nunca viu vermelho nao e
      # verificacao.
      #
      # Cada mutante abaixo e um defeito que alguem escreveria de boa-fe.
      - name: 'A verificacao sabe falhar (ajuste-de-saldo)'
        run: |
          set -uo pipefail
          REGRAS=lib/ajuste-de-fatura.ts
          BLOCO=components/cartoes/AjusteDeSaldo.tsx
          TELA=components/cartoes/FaturaDoCartao.tsx
          cp $REGRAS $REGRAS.orig
          cp $BLOCO $BLOCO.orig
          cp $TELA $TELA.orig
          trap 'mv $REGRAS.orig $REGRAS; mv $BLOCO.orig $BLOCO; mv $TELA.orig $TELA' EXIT

          # ------------------------------------------------------------------
          # O GUARDA DE TODO MUTANTE: ELE TEM DE TER SIDO APLICADO
          # ------------------------------------------------------------------
          # `sed` que nao casa SAI 0 e deixa o arquivo INTACTO. A suite entao
          # roda sobre o codigo correto, passa verde, e este job acusa o codigo
          # em vez do mutante -- ou, pior, o mutante e dado por morto e a linha
          # que ele deveria vigiar deixou de existir. Aconteceu duas vezes: ao
          # escrever este job (mutante 6) e na 2a volta da HMO-253, quando os dois
          # botoes de direcao sairam da tela e os mutantes que os citavam
          # continuaram "passando".
          #
          # `cmp` compara com a copia intacta: se nada mudou, o mutante nao
          # existe mais e e ESTE job que esta quebrado.
          mutou() {
            if cmp -s "$1" "$1.orig"; then
              echo "::error::o mutante $2 nao se aplicou a $1 -- a ancora do sed mudou de forma"
              exit 1
            fi
          }

          # 1) O SINAL NAO INVERTIDO. O defeito central desta issue: a view
          #    publica `(-t.amount) AS invoice_amount`, entao gravar o valor cru
          #    faz o acrescimo ABATER da fatura e o abatimento somar. O numero
          #    aparece certo na lista de lancamentos e a fatura anda para o lado
          #    errado.
          sed -i 's#    amount: -params.valorNaFatura,#    amount: params.valorNaFatura,#' $REGRAS
          mutou $REGRAS 1
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com o ajuste gravado sem inverter o sinal."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 2) O TIPO TROCADO. 'income' no acrescimo deixa a fatura certa (a view
          #    soma invoice_amount) e inverte o lancamento no fluxo de caixa: a
          #    despesa nao detalhada entra como RECEITA do mes.
          sed -i 's#    transaction_type: params.valorNaFatura > 0 ? "expense" : "income",#    transaction_type: params.valorNaFatura > 0 ? "income" : "expense",#' $REGRAS
          mutou $REGRAS 2
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com o tipo do lancamento trocado."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 3) O MES PASSANDO POR new Date(). '2026-01-01' e lido como UTC e, em
          #    Sao Paulo, volta para 31/12/2025: o ajuste de janeiro gravado em
          #    dezembro, somando na fatura do ANO anterior. O runner do GitHub
          #    roda em UTC, e por isso a suite exige TZ=America/Sao_Paulo -- sem
          #    isso este mutante sobrevive no CI e morre na maquina de quem
          #    escreveu.
          sed -i 's#  return `${mes.slice(0, 7)}-01`;#  const d = new Date(mes); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-01`;#' $REGRAS
          mutou $REGRAS 3
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com o mes do ajuste passando por new Date()."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 4) MES ILEGIVEL CAINDO NUM PADRAO em vez de recusar. Gravar dinheiro
          #    num mes que o usuario nao escolheu: o valor esta certo, a fatura
          #    do mes errado fecha, e as duas parecem plausiveis.
          sed -i 's#  if (!mes || !/\^\\d{4}-\\d{2}(-\\d{2})?$/.test(mes)) return null;#  if (!mes) return "2026-01-01";#' $REGRAS
          mutou $REGRAS 4
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com mes ilegivel virando um mes qualquer."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 5) A CHAVE SEM O PRIMEIRO DIA. Gravar `ajuste-de-fatura:2026-10:<id>`
          #    enquanto o DELETE procura `2026-10-01`: remover responde 404 sobre
          #    um ajuste que esta na tela, e alterar cria um SEGUNDO -- o acumulo
          #    que a chave existe para impedir.
          sed -i 's#    notes: chaveAjuste(primeiroDia, params.accountId),#    notes: chaveAjuste(params.mes, params.accountId),#' $REGRAS
          mutou $REGRAS 5
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com a chave do ajuste sem o primeiro dia do mes."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 6) A CHAVE SEM ANCORA NO FIM. Sem o `$`, uma nota escrita a mao como
          #    "ajuste-de-fatura:2026-10-01:<id> conferi no app" passa por chave
          #    canonica, e a descricao livre do usuario vira regra de negocio.
          #
          #    O `\$` do padrao e obrigatorio: em BRE o `$` no meio da expressao
          #    e literal em GNU sed, mas escrever a intencao evita depender
          #    disso. E o `grep -c` antes existe porque um sed que nao casa sai 0
          #    e deixa o arquivo INTACTO -- a suite passaria verde sobre codigo
          #    correto e o controle acusaria o codigo em vez do mutante.
          #    Aconteceu ao escrever este job.
          test "$(grep -c ']{12})\$/;' $REGRAS)" = "1" || { echo "::error::ancora do mutante 6 mudou de forma"; exit 1; }
          sed -i 's#]{12})\$/;#]{12})/;#' $REGRAS
          mutou $REGRAS 6
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com a chave canonica sem ancora no fim."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 7) ZERO ACEITO. Uma linha de R$ 0,00 na fatura nao muda nada e ainda
          #    aparece como se fosse compra -- e, com o ajuste automatico, ela
          #    seria o que a rota grava quando o cartao JA BATE, em vez de tirar o
          #    ajuste velho que sobrou. `lancamentoDoAjuste` e a ultima porta
          #    antes do banco, e e por isso que a guarda e aqui e nao so na rota.
          sed -i 's#  if (!Number.isFinite(params.valorNaFatura) || params.valorNaFatura === 0) {#  if (!Number.isFinite(params.valorNaFatura)) {#' $REGRAS
          mutou $REGRAS 7
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com ajuste de R\$ 0,00 aceito."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 8) O ROTULO DA LINHA CARIMBADO SEM CATEGORIA CONHECIDA. Com
          #    `undefined` (a consulta falhou) toda linha viraria "Ajuste":
          #    chamaria de ajuste a compra de alguem.
          sed -i 's#  return Boolean(categoria) \&\& linha.category_id === categoria;#  return linha.category_id === categoria || categoria === undefined;#' $REGRAS
          mutou $REGRAS 8
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com o rotulo 'Ajuste' carimbado por adivinhacao."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 9) A PREVIA PARTINDO DO TOTAL DA TELA. `totalSemOAjuste` devolvendo
          #    `total` cru soma o ajuste novo em cima do velho: alterar de R$ 50
          #    para R$ 70 mostraria R$ 220 numa fatura que vai fechar em R$ 170.
          #    A conta que o usuario le antes de confirmar, errada.
          sed -i 's#  return total - Number(ajuste.invoice_amount);#  return total;#' $REGRAS
          mutou $REGRAS 9
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com a previa somando o ajuste novo em cima do velho."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 10) O VALOR DO AJUSTE LIDO DE `amount` EM VEZ DE `invoice_amount`. A
          #     tela mostraria "-R$ 50,00" para um ajuste que ACRESCENTA 50, e o
          #     formulario reabriria no lado errado -- salvar de novo inverteria
          #     o ajuste sem a pessoa ter mexido no valor.
          sed -i 's#  return Number(ajuste.invoice_amount);#  return Number(ajuste.amount);#' $REGRAS
          mutou $REGRAS 10
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com o valor do ajuste lido de amount."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 11) `undefined` TRATADO COMO "NAO TEM". A consulta da categoria
          #     falhou e a tela afirma, por omissao, que a fatura nao tem ajuste
          #     -- e oferece lancar um sobre uma fatura ja ajustada.
          sed -i 's#  return categoria !== undefined;#  return true;#' $REGRAS
          mutou $REGRAS 11
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde afirmando que nao ha ajuste sem ter conseguido conferir."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 12) O BLOCO FORA DA TELA. O slot removido: a feature existe no
          #     repositorio e nao no cartao, e a issue inteira deixa de existir.
          #     "essa opcao fica no cartao" sao as palavras dela.
          sed -i 's#^      {blocoDeAjuste}$##' $TELA
          mutou $TELA 12
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o bloco de ajuste fora da tela do cartao."
            exit 1
          fi
          cp $TELA.orig $TELA

          # 13) O ROTULO "Ajuste" FORA DA LINHA. A linha fica na lista (para a
          #     soma fechar com o total) e sem rotulo: um ajuste de R$ 50
          #     indistinguivel de uma compra de R$ 50 tres meses depois.
          sed -i 's#                    {ehLinhaDeAjuste(gasto, categoriaDeAjuste) ? (#                    {false ? (#' $TELA
          mutou $TELA 13
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a linha do ajuste sem rotulo nenhum."
            exit 1
          fi
          cp $TELA.orig $TELA

          # 14) O VALOR DO AJUSTE IMPRESSO SEM LEITURA BOA. O zero confiante de
          #     lib/offline-leitura.ts com outra roupa: numero vindo de uma
          #     leitura que falhou mente com a cara de numero certo.
          sed -i 's#  const mostraNumero = podeMostrarNumero(estado);#  const mostraNumero = true;#' $BLOCO
          mutou $BLOCO 14
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o valor do ajuste impresso sem dado atras dele."
            exit 1
          fi
          cp $BLOCO.orig $BLOCO

          # 15) A PREVIA SEM O MES. "A fatura passa de X para Y" sem dizer de
          #     QUAL fatura: o numero certo respondendo uma pergunta que o leitor
          #     nao sabe qual e, com o seletor de mes dois blocos acima.
          sed -i 's#            rotuloDoMes ? (#            true ? (#' $BLOCO
          mutou $BLOCO 15
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a previa impressa sem o mes que a nomeie."
            exit 1
          fi
          cp $BLOCO.orig $BLOCO

          # ==================================================================
          # 2a VOLTA DA HMO-253: O AJUSTE E AUTOMATICO
          # ==================================================================
          # "Eu lanco o valor real que esta hoje meu cartao e um metodo verifica
          # se e menor ou maior que a fatura, e lanca a diferenca somando ou
          # subtraindo." Agora quem decide o SINAL e uma subtracao, e nao um
          # clique -- entao os defeitos mudaram de lugar.

          # 16) A DIFERENCA INVERTIDA. `fatura - saldo` em vez de
          #     `saldo - fatura`: o cartao que diz R$ 1.290 sobre uma fatura de
          #     R$ 1.240 recebe um ABATIMENTO de R$ 50 e fecha em R$ 1.190 --
          #     R$ 100 longe do banco, pelo numero que a pessoa digitou certo.
          #     E o defeito central desta volta da issue, do mesmo jeito que o
          #     mutante 1 era o da primeira.
          sed -i 's#  const diferenca = centavosDoSaldo - centavosDaFatura;#  const diferenca = centavosDaFatura - centavosDoSaldo;#' $REGRAS
          mutou $REGRAS 16
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com a diferenca do ajuste calculada ao contrario."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 17) CAMPO VAZIO LIDO COMO ZERO. `Number("")` e 0 em JavaScript, e um
          #     saldo real de R$ 0,00 e uma afirmacao legitima. Confundir os dois
          #     nao da um ajuste vazio: da um ESTORNO DA FATURA INTEIRA, com a
          #     aritmetica visivelmente correta, oferecido a quem ainda nao
          #     digitou nada.
          sed -i 's#      : typeof valor === "string" \&\& valor.trim() !== ""#      : typeof valor === "string"#' $REGRAS
          mutou $REGRAS 17
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com campo vazio lido como R\$ 0,00."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 18) O TOTAL DA FATURA ILEGIVEL VIRANDO ZERO. "Nao sei quanto e a
          #     fatura" tratado como "a fatura e zero": o ajuste gravado passa a
          #     ser o saldo real INTEIRO, e a fatura dobra no instante em que a
          #     leitura voltar.
          sed -i 's#  if (centavosDaFatura === null) {#  if (false) {#' $REGRAS
          mutou $REGRAS 18
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde calculando a diferenca sem saber o total da fatura."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 19) "A FATURA JA BATE" VIRANDO UM AJUSTE DE R$ 0,00. Sem o ramo de
          #     `fecha`, a diferenca nula segue como ajuste -- uma linha na
          #     fatura que nao muda nada e parece compra -- e o ajuste VELHO que
          #     sobra deixa de ser removido, que e justamente o que faz a fatura
          #     parar de bater.
          sed -i 's#  if (diferenca === 0) return { ok: true, fecha: true, valorNaFatura: 0 };#  if (false) return { ok: true, fecha: true, valorNaFatura: 0 };#' $REGRAS
          mutou $REGRAS 19
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com a fatura que ja bate gerando ajuste em vez de fecha:true."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 20) CENTAVO TRUNCADO EM VEZ DE ARREDONDADO. `12.9 * 100` e
          #     1290.0000000000002 e `Math.trunc` devolve 1289: um centavo a
          #     menos num valor que o usuario digitou exato, e a fatura deixa de
          #     fechar exatamente no caso que o ajuste existe para fechar.
          sed -i 's#  return Math.round(numero \* 100);#  return Math.trunc(numero * 100);#' $REGRAS
          mutou $REGRAS 20
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com os centavos truncados em vez de arredondados."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 21) O AJUSTE EXISTENTE SUBTRAIDO EM VEZ DE SOMADO. `amount` e a
          #     coluna CRUA e a view publica `-amount`: tirar o ajuste do total e
          #     SOMAR o amount. Subtrair erra a base pelo DOBRO do ajuste que ja
          #     existe -- e so no SEGUNDO ajuste do mes, com tudo plausivel.
          sed -i 's#  return centavos + doAjuste;#  return centavos - doAjuste;#' $REGRAS
          mutou $REGRAS 21
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde com o ajuste existente saindo da base pelo sinal errado."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 22) LINHA ILEGIVEL PULADA EM VEZ DE INVALIDAR O TOTAL. A fatura fica
          #     menor do que ela e, e o ajuste calculado em cima disso
          #     ACRESCENTA o valor da linha pulada: a fatura fecha no numero do
          #     banco por um lancamento DUPLICADO -- a doenca que esta feature
          #     trata, com o sintoma invertido.
          sed -i 's#    if (daLinha === null) return null;#    if (daLinha === null) continue;#' $REGRAS
          mutou $REGRAS 22
          if npm run test:ajuste-de-fatura > /dev/null 2>&1; then
            echo "::error::Verde pulando linha ilegivel da fatura."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 23) O CAMPO COM O ROTULO DA VERSAO ANTERIOR. "Valor do ajuste" devolve
          #     a subtracao para as maos do usuario, que e exatamente o que esta
          #     volta da issue tirou dele -- e quem digitar a DIFERENCA num campo
          #     que espera o SALDO REAL grava a diferenca da diferenca.
          sed -i 's#                  Quanto o cartão diz hoje#                  Valor do ajuste#' $BLOCO
          mutou $BLOCO 23
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o campo pedindo o valor do ajuste em vez do saldo real."
            exit 1
          fi
          cp $BLOCO.orig $BLOCO

          # 24) "A FATURA JA BATE" SEM TEXTO NENHUM NA TELA. O melhor desfecho
          #     possivel fica indistinguivel de nada ter acontecido: o usuario
          #     digita o numero do banco, a tela nao diz nada, e ele procura o
          #     que errou. Pior: o aviso de que o ajuste velho VAI SAIR desaparece
          #     junto, e "Salvar" passa a remover dinheiro da fatura calado.
          sed -i 's#  const fecha = calculado.ok \&\& calculado.fecha;#  const fecha = false;#' $BLOCO
          mutou $BLOCO 24
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde sem dizer na tela que a fatura ja fecha nesse valor."
            exit 1
          fi
          cp $BLOCO.orig $BLOCO

          # 25) O BOTAO DIZENDO "SALVAR" QUANDO ELE VAI REMOVER. O clique apaga o
          #     ajuste que estava valendo, e o rotulo prometeu gravar um.
          sed -i 's#                    ? "Remover ajuste"#                    ? "Salvar ajuste"#' $BLOCO
          mutou $BLOCO 25
          if npm run test:ajuste-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o botao prometendo salvar o que ele vai remover."
            exit 1
          fi
          cp $BLOCO.orig $BLOCO

          echo "A verificacao fica vermelha nos vinte e cinco defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (ajuste-de-saldo)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # SO ESTA, DESTA EM DIANTE, OU TODAS
      # origem: alcance-da-serie.yml
      # =======================================================================
      # Apagar ou alterar uma conta parcelada ou fixa -- so esta, desta em diante, ou
      # todas (HMO-228, Fase 6 da HMO-208).
      #
      # POR QUE ISTO MERECE VERIFICACAO PROPRIA
      # -------------------------------
      # Sao DUAS tabelas respondendo a MESMA pergunta com barreiras diferentes, e todo
      # jeito errado de errar aqui grava dinheiro plausivel:
      #
      #   - "todas" com barreira de DATA em vez de status reescreve um mes ja
      #     conferido, e deixa de corrigir a conta vencida que a pessoa queria;
      #   - apagar "esta e as proximas" sem encerrar a regra faz a conta voltar alguns
      #     MESES depois, quando ninguem mais liga uma coisa a outra;
      #   - apagar a parcela 3 de 10 sem conhecer a serie deixa nove linhas, e a
      #     fatura de cada mes restante segue fechando num valor plausivel e errado;
      #   - "desta em diante" numa serie de cartao com barreira por data (e nao pelo
      #     NUMERO) alcanca a parcela errada quando duas caem no mesmo mes de fatura.
      #
      # Nenhum desses da erro. Todos produzem tela de aparencia normal.
      #
      # SEM FILTRO DE `paths`, pelo mesmo motivo do parcelamento.yml: o comportamento
      # nasce de duas regras puras, de tres rotas e de tres telas, e um filtro que
      # liste os arquivos de hoje perde o dia em que alguem mexer no de amanha.
      - name: As duas regras do alcance, e o texto que a tela declara
        run: npm run test:alcance-da-serie

      # A SUITE DA HMO-170 CONTINUA VALENDO. Ela cobre os dois primeiros
      # alcances na edicao, e e onde a assercao `ehAlcanceValido("todas")`
      # mudou de false para true -- com o porque escrito no lugar dela.
      - name: Os dois alcances que a HMO-170 ja entregou
        run: npm run test:recorrencia-edicao

      # OS MUTANTES. A suite acima passando nao diz, sozinha, que ela esta
      # medindo o que a justificativa dela afirma.
      #
      # Medido na HMO-228 ao escrever isto -- 23 mutantes, 23 mortos, TODOS por
      # assercao e nenhum so pelo compilador. Os dois que dao nome a issue
      # (`todas_barreira_por_data` e `parcelas_barreira_por_mes_de_fatura`)
      # trocam a barreira de status por uma de data. O proprio runner reprova se
      # nenhum mutante morrer por assercao -- uma suite vazia tiraria placar
      # perfeito.
      - name: Os mutantes das duas barreiras
        run: npm run mutantes:alcance-da-serie

      # A TELA DO CARTAO, RENDERIZADA. A regra pura passa verde com o botao de
      # apagar inteiro fora da tela -- e era a tela do cartao que nao tinha
      # caminho nenhum para apagar uma parcela.
      - name: O botao de apagar parcela na fatura
        run: npm run test:tela-do-cartao

      # CONTROLE NEGATIVO.
      #
      # As assercoes que mais importam nesta feature sao de AUSENCIA ("a parcela
      # paga NAO foi alterada", "a compra avulsa NAO ganha botao"), e assercao
      # de ausencia passa verde tambem quando ela deixa de achar o que deveria
      # procurar. Os mutantes acima cobrem as duas regras puras; estes dois
      # cobrem o que esta FORA delas.
      - name: 'A verificacao sabe falhar (alcance-da-serie)'
        run: |
          set -uo pipefail
          TELA=components/cartoes/FaturaDoCartao.tsx
          ROTA=app/api/scheduled-transactions/\[id\]/route.ts
          cp "$TELA" "$TELA.orig"
          cp "$ROTA" "$ROTA.orig"
          trap 'mv "$TELA.orig" "$TELA"; mv "$ROTA.orig" "$ROTA"' EXIT

          # 1) O botao de apagar parcela aparecendo em TODA linha da fatura, e
          #    nao so nas parcelas. Apagar uma compra avulsa cairia na rota de
          #    serie, que responde 400 sobre a linha que a pessoa clicou.
          sed -i 's#{aoApagarParcela && gasto.installment_number ? (#{aoApagarParcela ? (#' "$TELA"
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o botao de apagar parcela em toda linha da fatura."
            exit 1
          fi
          cp "$TELA.orig" "$TELA"

          # 2) O DELETE voltando a ignorar o alcance -- o estado anterior a esta
          #    issue. A rota passa a marcar so a ocorrencia clicada, em qualquer
          #    alcance, e a regra nunca recebe `end_date`.
          #
          #    Este controle NAO e redundante com o mutante `exclusao_sem_end_date`
          #    da regra pura. Aquele prova que o PLANO pede o `end_date`; este
          #    prova que a ROTA le o plano -- e um bloco apagado na rota passa
          #    pelos 23 mutantes sem arranhao, porque eles so mutam lib/.
          sed -i 's#\.update({ end_date: plano\.encerrarRegraEm })#.update({})#' "$ROTA"
          if ! grep -q "\.update({})" "$ROTA"; then
            echo "::error::O controle negativo nao aplicou -- o trecho mudou de forma na rota."
            exit 1
          fi
          if npm run test:alcance-da-serie > /dev/null 2>&1; then
            echo "::error::Verde com a rota deixando de gravar o end_date na regra."
            exit 1
          fi
          cp "$ROTA.orig" "$ROTA"

          echo "os dois controles negativos reprovaram, como deviam"

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (alcance-da-serie)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # CLICAR NO CARTAO MOSTRA OS GASTOS DELE
      # origem: cartoes.yml
      # =======================================================================
      # A tela de gastos de um cartao (HMO-210), que e a Fase 3 da HMO-208.
      #
      # POR QUE ELA MERECE VERIFICACAO PROPRIA
      # ------------------------------
      # A Fase 2 (HMO-209) tirou a compra individual de cartao de Contas a Pagar, para
      # a mesma despesa nao ser somada duas vezes ao lado da fatura cheia. Aquelas
      # compras passaram a nao ter tela nenhuma, e ESTA e a tela onde elas voltam a
      # aparecer. Se ela quebrar, a compra no cartao deixa de existir na interface --
      # o dinheiro esta no banco, a fatura soma certo, e nao ha onde olhar. Nada nisso
      # da erro.
      #
      # SEM FILTRO DE `paths`, pelo mesmo motivo do contas.yml: o comportamento desta
      # tela nasce de quatro lugares em tres diretorios (lib/fatura-do-cartao.ts,
      # components/cartoes/*.tsx, o formulario de lancamento e os primitivos de
      # components/ui), e um filtro que liste os de hoje perde o dia em que alguem
      # mexer no de amanha.
      #
      # As duas suites renderizam HTML em memoria, rodam em segundos e nao precisam de
      # banco.
      - name: As regras da tela do cartao
        run: npm run test:fatura-do-cartao

      # A ARVORE. O teste puro acima passa verde com o total impresso longe do
      # rotulo do mes, com a frase de vazio dita sem leitura, e com Arquivar
      # dentro do link do cartao.
      - name: A tela, renderizada
        run: npm run test:tela-do-cartao

      # O FORMULARIO que esta tela abre. "Lancar gasto neste cartao" entrega
      # natureza card e o cartao travado; com o seletor livre a pessoa clica num
      # cartao e grava no outro.
      - name: O cartao travado no formulario
        run: npm run test:campos-lancamento

      # A FATURA DO PERIODO (HMO-290). O rotulo "Fatura atual" imprimia
      # `current_balance` -- a divida INTEIRA do cartao, com as parcelas que o
      # trigger somou no INSERT. Uma compra de R$ 3.000 em 10x aparecia como
      # "Fatura atual: R$ 3.000" no mes da compra, que cobra R$ 300 dela.
      #
      # A suite guarda o que nenhum tipo alcanca: `null` nao e zero (o cartao
      # ausente da resposta nao e um mes sem compra), soma parcial nao vale como
      # total, e parcela futura nao e cobranca de hoje.
      - name: A fatura do periodo, e o que ainda vai ser cobrado
        run: npm run test:fatura-do-periodo

      # O NUMERO DO "POSSO GASTAR" (decisao 4.1 do plano da HMO-281).
      # O desconto deixou de ser a divida inteira do cartao e passou a ser o que
      # vence ate o fim do mes. E o ponto de maior risco de dinheiro da issue:
      # trocar a fonte da divida reabre a porta do desconto duplo que
      # `current_balance` mantinha fechada.
      - name: Quanto este mes cobra do cartao, e quanto fica para depois
        run: npm run test:safe-to-spend

      # Controle negativo das duas decisoes de dinheiro, plantado um por vez.
      #
      # A prova de mutacao completa e `npm run mutantes:fatura-do-periodo`
      # (15 mutantes, 15 mortos, com controle positivo nos dois alvos --
      # ferramenta de quem escreve o teste). Aqui ficam os tres que mais custam.
      #
      # O `cmp` DEPOIS DE CADA `sed` NAO E ZELO. Um `sed -i` cujo padrao nao casa
      # SAI 0 e nao muda nada: o `npm run` seguinte roda a fonte INTACTA, passa,
      # e o `if` o declara... morto. O mutante seria dado por morto medindo nada.
      - name: 'A verificacao sabe falhar (fatura do periodo)'
        run: |
          set -uo pipefail
          GASTAR=lib/safe-to-spend.ts
          PERIODO=lib/fatura-do-periodo.ts
          cp $GASTAR $GASTAR.orig
          cp $PERIODO $PERIODO.orig
          trap 'mv $GASTAR.orig $GASTAR; mv $PERIODO.orig $PERIODO' EXIT

          # 1) O DEFEITO DESTA ISSUE, INTACTO: a divida do cartao volta a ser
          #    descontada por inteiro. Uma compra de R$ 3.000 em 10x derruba o
          #    "posso gastar" em R$ 3.000 no mes da compra, quando aquele mes
          #    cobra R$ 300.
          sed -i 's#        divida: dividaTotal - diferida,#        divida: dividaTotal,#' $GASTAR
          if cmp -s $GASTAR $GASTAR.orig; then
            echo "::error::O sed 1 nao casou -- o mutante mediria a fonte intacta."
            exit 1
          fi
          if npm run test:safe-to-spend > /dev/null 2>&1; then
            echo "::error::Verde descontando a divida inteira do cartao."
            exit 1
          fi
          cp $GASTAR.orig $GASTAR

          # 2) O DESCONTO DUPLO DA FATURA FECHADA -- o caso que a issue manda
          #    provar por nome. A conta prevista da fatura volta para
          #    `compromissos`, por cima da mesma fatura que ja esta dentro do
          #    saldo do cartao: a armadilha 1 de volta, e o app diz que a pessoa
          #    pode gastar metade do que pode.
          sed -i 's#    if (ehFatura(p.notes)) continue;#    if (false) continue;#' $GASTAR
          if cmp -s $GASTAR $GASTAR.orig; then
            echo "::error::O sed 2 nao casou -- o mutante mediria a fonte intacta."
            exit 1
          fi
          if npm run test:safe-to-spend > /dev/null 2>&1; then
            echo "::error::Verde com a fatura fechada descontada duas vezes."
            exit 1
          fi
          cp $GASTAR.orig $GASTAR

          # 3) A SOMA PARCIAL publicada como total. Com um cartao fora da
          #    resposta, "Faturas em aberto" mostraria a soma dos outros -- um
          #    numero menor que o certo, plausivel, sem nada dizendo que falta
          #    uma parcela dele.
          sed -i 's#    if (parcial === null) return null;#    if (parcial === null) continue;#' $PERIODO
          if cmp -s $PERIODO $PERIODO.orig; then
            echo "::error::O sed 3 nao casou -- o mutante mediria a fonte intacta."
            exit 1
          fi
          if npm run test:fatura-do-periodo > /dev/null 2>&1; then
            echo "::error::Verde publicando soma parcial de faturas."
            exit 1
          fi
          cp $PERIODO.orig $PERIODO

          echo "os tres mutantes de dinheiro da HMO-290 morrem"

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (fatura do periodo)"'
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -u "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt"; then
            echo "::error::O controle negativo deixou arquivo mutado na arvore."
            exit 1
          fi

      # A FIACAO. `current_balance` e `number | string | null` e a fatura e
      # `number`: as duas atribuicoes compilam, e a fronteira da rota e `any`.
      # Nada disto aparece no tsc nem na tela -- o numero continua plausivel.
      - name: O rotulo de fatura le fatura, e nao o saldo do cartao
        run: npm run check-fatura-escolhida

      # Controle negativo da fiacao, nas DUAS direcoes que ela erra.
      #
      # A verificacao remove comentario antes de procurar, e isso nao e detalhe:
      # todos os arquivos citados EXPLICAM por escrito o que ela procura. No
      # texto cru as buscas proibidas reprovariam sempre (os cabecalhos citam
      # `current_balance` uma duzia de vezes) e as exigidas aprovariam por
      # prosa -- a metade perigosa, que nao avisa, so para de verificar.
      - name: 'A verificacao sabe falhar (fatura escolhida)'
        run: |
          set -uo pipefail
          LISTA=components/cartoes/CartaoDaLista.tsx
          TELA='app/(dashboard)/dashboard/cartoes/page.tsx'
          GASTAR=lib/safe-to-spend.ts
          ROTA=app/api/safe-to-spend/route.ts
          for f in "$LISTA" "$TELA" "$GASTAR" "$ROTA"; do cp "$f" "$f.orig"; done
          trap 'for f in "$LISTA" "$TELA" "$GASTAR" "$ROTA"; do mv "$f.orig" "$f"; done' EXIT

          # Antes de tudo: com a arvore intacta ela tem de APROVAR. Sem este
          # controle positivo, um "reprovou" abaixo poderia ser a verificacao
          # reprovando sempre -- por um caminho de arquivo errado, por exemplo.
          if ! npm run check-fatura-escolhida > /dev/null 2>&1; then
            echo "::error::A verificacao reprova a arvore INTACTA."
            exit 1
          fi

          # 1) O defeito desta issue, reintroduzido: o card volta a imprimir a
          #    divida inteira do cartao sob o rotulo de fatura.
          sed -i 's#const total = totalDaFatura(fatura);#const total = Math.abs(Number(conta.current_balance ?? 0));#' "$LISTA"
          if ! cmp -s "$LISTA" "$LISTA.orig"; then
            if npm run check-fatura-escolhida > /dev/null 2>&1; then
              echo "::error::Verde com current_balance de volta sob o rotulo de fatura."
              exit 1
            fi
          else
            echo "::error::O sed 1 nao casou -- o controle mediria a arvore intacta."
            exit 1
          fi
          cp "$LISTA.orig" "$LISTA"

          # 2) A SEGUNDA LEITURA removida "para simplificar". Duas chamadas onde
          #    havia uma parecem desperdicio, e o total volta a sair do saldo.
          sed -i 's#somaDasFaturas(faturas, idsAtivos)#totalDoEscopo(ativas, "cartao")#' "$TELA"
          if ! cmp -s "$TELA" "$TELA.orig"; then
            if npm run check-fatura-escolhida > /dev/null 2>&1; then
              echo "::error::Verde com a tela somando current_balance de novo."
              exit 1
            fi
          else
            echo "::error::O sed 2 nao casou -- o controle mediria a arvore intacta."
            exit 1
          fi
          cp "$TELA.orig" "$TELA"

          # 3) O desconto duplo da armadilha 1 de volta: a conta prevista da
          #    fatura fechada somando por cima da mesma fatura que ja esta no
          #    saldo do cartao. Este e o caso que a issue manda provar por nome.
          #
          #    A assercao e sobre a CHAMADA, e nao sobre o nome: `ehFatura`
          #    sozinho casaria com a linha do `import`, e a verificacao
          #    aprovaria um arquivo que importa a funcao e nunca a chama. Foi
          #    exatamente assim que este controle falhou ao ser escrito.
          sed -i 's#    if (ehFatura(p.notes)) continue;#    if (false) continue;#' "$GASTAR"
          if ! cmp -s "$GASTAR" "$GASTAR.orig"; then
            if npm run check-fatura-escolhida > /dev/null 2>&1; then
              echo "::error::Verde com a fatura fechada descontada duas vezes."
              exit 1
            fi
          else
            echo "::error::O sed 3 nao casou -- o controle mediria a arvore intacta."
            exit 1
          fi
          cp "$GASTAR.orig" "$GASTAR"

          # 4) A rota parando de passar as faturas. O campo e obrigatorio no
          #    tipo, mas o `?? []` dentro do calculo faz a omissao virar um
          #    numero menor e plausivel em vez de um erro de compilacao.
          sed -i 's#        faturas: Array.from(porFatura.values()),##' "$ROTA"
          if ! cmp -s "$ROTA" "$ROTA.orig"; then
            if npm run check-fatura-escolhida > /dev/null 2>&1; then
              echo "::error::Verde com a rota sem passar as faturas."
              exit 1
            fi
          else
            echo "::error::O sed 4 nao casou -- o controle mediria a arvore intacta."
            exit 1
          fi
          cp "$ROTA.orig" "$ROTA"

          # ---------------------------------------------------------------
          # 5 a 9) A FIACAO DA PARTE DO GRUPO NO "POSSO GASTAR" (HMO-306)
          # ---------------------------------------------------------------
          # A medicao de scripts/medicao-hmo298.mjs prova a CONTA: ela importa
          # `parteConfiguradaDoMembro` de lib/ e monta os insumos como esta rota
          # monta. O que ela NAO alcanca e a fiacao -- se a rota parar de chamar
          # a funcao, a medicao continua verde, porque quem chamou foi o script.
          # Os cinco mutantes abaixo sao as cinco formas de desligar essa fiacao,
          # e as cinco produzem um numero plausivel sem erro de tipo e sem log.
          #
          # O MUTANTE 9 JA COBROU, e e a razao de os dois ultimos existirem: a
          # primeira versao do guard exigia `.eq("user_id", user.id)` no arquivo
          # INTEIRO e ficou VERDE depois de trocar justamente aquele filtro por
          # um `.or(...)` -- a rota tem mais tres consultas, e duas delas filtram
          # por dono. A assercao parecia cobrar o recorte das previstas e cobrava
          # o das contas. Por isso o guard passou a recortar a CONSULTA
          # (`exigidoNaConsulta`), e por isso este mutante fica.
          # `perl -0p` E NAO `sed`, e o mutante 9 e a razao: ele troca DUAS
          # linhas contiguas, e `sed 's###'` nao casa atravessando `\n`. Com sed
          # aquele mutante nao casaria nada -- e um sed que nao casa SAI 0, ou
          # seja o controle mediria a arvore intacta e ficaria verde para
          # sempre. O `cmp` abaixo pega isso, mas o jeito de nao depender dele e
          # usar um motor que leia o arquivo inteiro.
          #
          # O argumento e a expressao perl JA PRONTA, com os metacaracteres
          # escapados na chamada. Montar a regex aqui dentro a partir de "de" e
          # "para" exigiria escapar duas vezes, e o segundo nivel e exatamente
          # onde uma ancora silenciosamente para de casar.
          estragar_rota() {
            local expr="$1" rotulo="$2"
            perl -0pi -e "$expr" "$ROTA"
            if cmp -s "$ROTA" "$ROTA.orig"; then
              cp "$ROTA.orig" "$ROTA"
              echo "::error::O sed de '$rotulo' nao casou -- o controle mediria a arvore intacta."
              exit 1
            fi
            if npm run check-fatura-escolhida > /dev/null 2>&1; then
              cp "$ROTA.orig" "$ROTA"
              echo "::error::Verde com a fiacao desligada: $rotulo"
              exit 1
            fi
            cp "$ROTA.orig" "$ROTA"
            echo "  vermelho em: $rotulo"
          }

          # 5) A CHAMADA MORRE E O IMPORT FICA. O caso que derrubou a primeira
          #    versao do check-cartao-pela-fatura: o nome continua "aparecendo"
          #    no arquivo, e um guard que lesse a lista de imports aprovaria.
          estragar_rota \
            's/amount: parteConfiguradaDoMembro\(/amount: Number(/' \
            'a rota para de dividir -- R$ 1.000,00 descontados de um grupo que cobra R$ 300,00'

          # 6) O `group_id` SAI DO `select`. O mais silencioso dos cinco: a
          #    chamada fica no lugar, recebe `undefined` e devolve o valor
          #    CHEIO. Nada no `tsc` acusa, porque o campo e opcional na
          #    assinatura da funcao.
          estragar_rota \
            's/notes, group_id, recurring_rule/notes, recurring_rule/' \
            'o select perde o group_id -- a chamada fica e nao divide nada'

          # 7) A CONSULTA DOS PESOS DESAPARECE. Mapa vazio e o "desconhecido" de
          #    `parteConfiguradaDoMembro`, que devolve o valor cheio de
          #    proposito -- a porta certa para a RLS, e a porta errada para um
          #    bug.
          estragar_rota \
            's/\.from\("group_members"\)/.from("expense_groups")/' \
            'os pesos nao sao lidos -- o mapa vazio devolve o valor cheio'

          # 8) `percentage` SAI DO `select` DOS MEMBROS. Este nao da valor cheio,
          #    e por isso e o que menos salta aos olhos: todos os pesos em zero
          #    fazem `ratearPorPeso` cair no degrau da divisao IGUAL, e o grupo
          #    70/30 passa a descontar R$ 500,00 onde cobra R$ 300,00.
          estragar_rota \
            's/"id, group_id, user_id, percentage, status"/"id, group_id, user_id, status"/' \
            'o percentual sai do select -- o grupo 70/30 volta a dividir igual'

          # 9) O RECORTE POR DONO CAI. A forma da tela de Despesas aplicada
          #    aqui: a conta do outro membro entra na MINHA conta de "quanto
          #    posso gastar", e os R$ 900,00 dele sao descontados duas vezes --
          #    uma em cada carteira.
          estragar_rota \
            's/\.eq\("user_id", user\.id\)\n(\s+\.eq\("status", "pending"\))/.or("user_id.eq." + user.id + ",group_id.not.is.null")\n$1/' \
            'o filtro de user_id cai -- a conta do outro membro entra na minha'

          echo "a verificacao de fatura escolhida sabe falhar nos nove casos"

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (fatura escolhida)"'
        run: |
          set -euo pipefail
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -u "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt"; then
            echo "::error::O controle negativo deixou arquivo mutado na arvore."
            exit 1
          fi
      # A FATURA ESCOLHIDA NO LANCAMENTO (HMO-281 / HMO-289)
      #
      # As suites puras acima provam as FUNCOES -- qual fatura e o padrao, que
      # meses entram na janela, e que a serie de parcelas conta a partir da
      # ancora. Nenhuma delas olha se o formulario MANDA o campo para o banco, e
      # esse defeito nao aparece no `tsc`: `invoice_month_override` e uma chave
      # opcional, entao esquece-la compila. A pessoa escolheria a fatura, a tela
      # diria "salvo", e a compra cairia na fatura da data.
      - name: A fatura escolhida esta ligada nos quatro escritores
        run: node scripts/check-fatura-no-lancamento.mjs

      # Controle negativo do guard acima -- e dos dois oraculos que ele nao
      # alcanca (a fila offline e a aritmetica da ancora).
      #
      # Em vez do `sed`+`cmp` dos outros passos deste arquivo, aqui o proprio
      # runner de mutantes faz o trabalho: ele confere que cada trecho procurado
      # aparece EXATAMENTE uma vez antes de mutar, roda um controle positivo por
      # oraculo, e confere o restauro byte a byte depois de cada mutante.
      #
      # `--so-typescript` porque a outra metade do arquivo muta a migration 041 e
      # exige um banco-template montado a mao (a cadeia ATE a 040, sem a 041) --
      # o que nenhum runner de CI tem. Ela e medida A MAO, e o placar dela esta
      # registrado no db-verify.yml, ao lado do teste da 041; o db-verify roda a
      # MIGRATION e o TESTE dela, nao os mutantes. Os modos sao explicitos
      # justamente para que nada seja PULADO em silencio e o placar nao saia
      # pela metade com cara de inteiro.
      #
      # Dois destes mutantes ja cobraram: `invoice_month_override` sem os dois
      # pontos casava com a LEITURA da edicao e ficava verde com a escrita
      # apagada, e a regex do `undefined` parava no `}` da interpolacao.
      - name: 'A verificacao sabe falhar (fatura escolhida no lancamento)'
        run: npm run mutantes:fatura-escolhida -- --so-typescript

      # Controle negativo. As suites afirmam sobre AUSENCIA -- "a lista NAO traz
      # a compra do outro cartao", "a tela NAO afirma o vazio sem ter lido" -- e
      # assercao de ausencia passa verde tambem quando ela deixa de achar o que
      # deveria procurar. Uma verificacao que nunca viu vermelho nao e
      # verificacao.
      - name: 'A verificacao sabe falhar (cartoes)'
        run: |
          set -uo pipefail
          REGRAS=lib/fatura-do-cartao.ts
          TELA=components/cartoes/FaturaDoCartao.tsx
          LISTA=components/cartoes/CartaoDaLista.tsx
          CAMPOS=components/movimentacoes/CamposDeLancamento.tsx
          cp $REGRAS $REGRAS.orig
          cp $TELA $TELA.orig
          cp $LISTA $LISTA.orig
          cp $CAMPOS $CAMPOS.orig
          trap 'mv $REGRAS.orig $REGRAS; mv $TELA.orig $TELA; mv $LISTA.orig $LISTA; mv $CAMPOS.orig $CAMPOS' EXIT

          # 1) A fatura escolhida pela POSICAO, e nao pelo id. O defeito central:
          #    os gastos do cartao errado embaixo do nome do cartao certo. Dois
          #    cartoes do mesmo dono, dois totais plausiveis, nada vermelho.
          sed -i 's#return faturas.find((f) => f.account_id === accountId) ?? null;#return faturas[0] ?? null;#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a fatura escolhida por posicao."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 2) A lista deixando passar a linha de outro cartao. E a assercao
          #    literal da issue, e o filtro e a unica coisa que a sustenta.
          #
          #    Os `\[` e `\]` sao obrigatorios: `[]` no padrao do sed abre uma
          #    expressao de colchete que consome tudo ate o proximo `]` --
          #    inclusive o `#` que delimita o comando. O sed sai com erro, o
          #    arquivo fica INTACTO, e a suite passa verde sobre codigo correto:
          #    o controle acusaria o codigo em vez do mutante. Aconteceu ao
          #    escrever este job.
          sed -i 's#return (fatura.lines ?? \[\]).filter((l) => l.account_id === accountId);#return fatura.lines ?? \[\];#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a compra de outro cartao na lista."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 3) O cartao da URL aceito sem conferir o dono. A RLS de
          #    financial_transactions tem um OR para membro de grupo, entao
          #    card_invoice_lines pode devolver a compra lancada no cartao de
          #    outra pessoa -- e a tela listaria gastos sem cabecalho que os
          #    explique.
          sed -i 's#    cartoes.find((c) => c.id === id \&\& c.account_type === "credit_card") ??#    cartoes.find((c) => c.id === id) ??#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com conta que nao e cartao abrindo a tela de fatura."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 4) As duas leituras reduzidas a MELHOR em vez da pior. O cadastro
          #    fresco libera o total de uma fatura que nao carregou, e "R$ 0,00"
          #    fica indistinguivel de um mes sem compra nenhuma.
          sed -i 's#if (GRAVIDADE.indexOf(estado) < GRAVIDADE.indexOf(pior)) pior = estado;#if (GRAVIDADE.indexOf(estado) > GRAVIDADE.indexOf(pior)) pior = estado;#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a tela tomando a melhor das duas leituras."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 5) O carregamento tratado como leitura boa. Mesmo zero confiante, no
          #    primeiro quadro -- e o quadro que todo mundo ve.
          #
          #    O mutante troca o RETORNO, e nao apaga a guarda. Apagar a guarda
          #    (`if (false)`) e um mutante EQUIVALENTE: `GRAVIDADE.indexOf(null)`
          #    e -1 e -1 ja ordena como o mais grave de todos, entao o laco
          #    abaixo devolve null de qualquer jeito. A guarda continua no codigo
          #    porque ela e a declaracao da intencao -- quem acrescentar um
          #    estado novo a GRAVIDADE nao depende daquele -1 por acidente --,
          #    mas ela nao da para medir por remocao.
          sed -i 's#if (estados.some((e) => e === null)) return null;#if (estados.some((e) => e === null)) return "fresco";#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com numero impresso durante o carregamento."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 6) O mes passando por new Date(). '2026-10-01' e lido como UTC e, no
          #    fuso de Sao Paulo, volta para 30/09: o rotulo diz "setembro" sobre
          #    a fatura de outubro. O total continua certo.
          sed -i 's#  return `${MESES\[numeroDoMes - 1\]} de ${mes.slice(0, 4)}`;#  const d = new Date(mes); return `${MESES[d.getMonth()]} de ${d.getFullYear()}`;#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o mes da fatura passando por new Date()."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 7) O total sem o rotulo do mes. Bloco sem eixo de tempo mente no
          #    rotulo: o numero esta certo e ninguem sabe de que mes ele e.
          sed -i 's#  const mostraTotal = podeMostrarNumero(estado) \&\& rotuloDoMes !== null;#  const mostraTotal = podeMostrarNumero(estado);#' $TELA
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o total impresso sem mes que o nomeie."
            exit 1
          fi
          cp $TELA.orig $TELA

          # 8) A frase de vazio dita sem leitura. "Nenhum gasto neste cartao"
          #    sobre uma fatura que a tela nao conseguiu ler -- uma afirmacao
          #    sobre o dinheiro da pessoa que o app nao tem como fazer.
          sed -i 's#            {podeAfirmarVazio(estado) \&\& rotuloDoMes ? (#            {true ? (#' $TELA
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde afirmando que o cartao nao teve gasto sem ter lido a fatura."
            exit 1
          fi
          cp $TELA.orig $TELA

          # 9) O total sem o pedagio de leitura. R$ 0,00 sem rede.
          sed -i 's#  const mostraTotal = podeMostrarNumero(estado) \&\& rotuloDoMes !== null;#  const mostraTotal = rotuloDoMes !== null;#' $TELA
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o total impresso sem dado atras dele."
            exit 1
          fi
          cp $TELA.orig $TELA

          # 10) Os botoes de volta para DENTRO do link do cartao. E o cuidado que
          #     a issue aponta nominalmente: arquivar um cartao tambem navega, e a
          #     pessoa arquiva e cai na tela dele.
          #
          #     O mutante MOVE o fechamento do <Link>: tira a linha de onde ela
          #     esta e repoe depois do bloco dos botoes. Os dois `sed` sao
          #     ancorados em linha inteira (`^...$`) e as duas ancoras sao unicas
          #     no arquivo. O `grep -c` antes existe porque um sed que nao casa
          #     sai 0 e deixa o arquivo INTACTO: a suite passaria verde sobre
          #     codigo correto e o controle acusaria o codigo.
          test "$(grep -c '^      </Link>$' $LISTA)" = "1" || { echo "::error::ancora </Link> do mutante 10 mudou de forma"; exit 1; }
          test "$(grep -c '^    </Card>$' $LISTA)" = "1" || { echo "::error::ancora </Card> do mutante 10 mudou de forma"; exit 1; }
          sed -i '/^      <\/Link>$/d' $LISTA
          sed -i 's#^    </Card>$#      </Link>\n    </Card>#' $LISTA
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com Editar e Arquivar dentro da area clicavel do cartao."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 11) O card da lista deixando de ser link. A issue inteira deixa de
          #     existir, e a tela fica exatamente como era antes dela.
          sed -i 's#        href={caminhoDoCartao(conta.id)}#        href="/dashboard/cartoes"#' $LISTA
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o card da lista sem link para o cartao."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 12) O link de novo gasto usando a chave `id`. Sob a rota [id] o Next
          #     consome a chave de mesmo nome ao montar params, e `?id=` ja
          #     significa "editar este lancamento" no formulario -- o gasto novo
          #     chegaria pedindo para editar o lancamento cujo id e o do cartao.
          sed -i 's#export const PARAM_DO_CARTAO = "cartao";#export const PARAM_DO_CARTAO = "id";#' $REGRAS
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o cartao viajando na chave id."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 13) O cartao travado destravado. A pessoa clica no Nubank, cai no
          #     formulario, e grava no Visa: dois cartoes dela, valor plausivel,
          #     e ela so descobre ao abrir a fatura do cartao em que nao lancou.
          sed -i 's#          {cartaoFixado ? (#          {false ? (#' $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o seletor de cartao livre vindo da tela do cartao."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          # 14) A natureza destravada no formulario que veio do cartao. "Despesa
          #     Fixa" ali gravaria uma regra mensal em recurring_rules em vez da
          #     compra -- e a tela de origem e a FATURA de um cartao.
          sed -i 's#  const naturezaTravada = Boolean(cartaoFixado);#  const naturezaTravada = false;#' $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o seletor de natureza livre vindo da tela do cartao."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          echo "A verificacao fica vermelha nos quatorze defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (cartoes)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # O PAINEL OBEDECE A CONFIGURACAO E O PERIODO, E O RESET APAGA NA ORDEM
      # origem: configuracoes.yml
      # =======================================================================
      # Prova, a cada PR, as duas regras da aba de Configuracoes (HMO-159):
      #
      #   1. o painel mostra tudo que existe, na ordem que o usuario escolheu;
      #   2. o "apagar tudo" apaga na ordem certa, e so o que e do usuario.
      #
      # SEM FILTRO DE `paths`, e por duas razoes diferentes:
      #
      #   * o teste do painel quebra quando alguem mexe em lib/dashboard-layout.ts,
      #     que nao esta em database/ nem em nenhuma das listas do db-verify;
      #
      #   * o teste do reset le database/migrations e confronta com o plano de
      #     apagamento. Ele precisa rodar quando a MIGRATION muda -- uma policy de
      #     DELETE removida numa migration nova deixa o reset apagando zero linhas em
      #     silencio, com a tela dizendo "pronto, a conta esta como nova".
      #
      # Um filtro de path acertaria um caso e perderia o outro. Os dois testes sao
      # aritmetica e leitura de arquivo, rodam em segundos, e nao precisam de
      # Postgres -- entao podem ser obrigatorios em todo PR sem virar pedagio.
      - name: Bloco novo nasce visivel, e arrastar para no lugar certo
        run: npm run test:dashboard-layout

      # HMO-173. Mora aqui, e nao no db-verify, pelo motivo que o cabecalho
      # deste arquivo ja explica: o db-verify tem filtro de `paths`, e
      # lib/periodo-do-painel.ts nao esta em nenhuma das listas dele -- a suite
      # ficaria no package.json sem nunca rodar num PR que mexesse nela.
      #
      # O que ela guarda: o mes corrente sai do fuso de Sao Paulo (em UTC, as
      # 22:00 de 30/09 o painel abria em outubro) e a transferencia fica FORA
      # da agregacao por intervalo (dentro dela, receita e despesa incham
      # juntas e o saldo liquido continua exato -- o erro nao aparece no numero
      # que as pessoas conferem).
      - name: O painel abre no mes certo, e a transferencia fica fora da soma
        run: npm run test:periodo-painel

      # HMO-186. Mora aqui pelo mesmo motivo das duas acima: lib/previsto-x-realizado.ts
      # nao esta em nenhuma lista de `paths` do db-verify, e a suite ficaria no
      # package.json sem nunca rodar num PR que mexesse nela.
      #
      # O que ela guarda: conta prevista JA PAGA continua dentro do previsto (sem
      # isso o mes fecha em "previsto R$ 0,00 x realizado R$ 6.000" justamente no
      # dia 30, quando a comparacao tem todos os dados), a receita prevista nao e
      # contada como despesa (`amount` tem CHECK > 0 -- a direcao nao esta no
      # sinal), e a diferenca e `realizado - previsto` nas tres linhas.
      - name: O previsto conta o que foi pago, e a diferenca nao inverte o sinal
        run: npm run test:previsto-x-realizado

      # A suite acima e aritmetica pura, e passaria verde com o JSX imprimindo o
      # previsto na coluna "Realizado" -- os dois numeros certos nos lugares
      # errados nao quebram build nem teste, e nao deixam a tela vazia. Esta
      # renderiza o bloco com react-dom/server e afirma sobre o HTML.
      #
      # Ela cobre tambem os dois estados que so existem na marcacao: agenda vazia
      # e direcao ilegivel NAO podem imprimir "previsto R$ 0,00" -- zero contra o
      # realizado se le como "tudo acima do previsto", e o que houve foi ausencia
      # de previsao.
      - name: O bloco imprime cada numero na coluna dele, e cala quando nao ha previsao
        run: npm run test:previsto-bloco

      # HMO-174. Mora aqui pelo mesmo motivo de todas as acima: lib/realizado-e-previsao.ts
      # nao esta em nenhuma lista de `paths` do db-verify.
      #
      # O que ela guarda: Realizado + Previsao = Total esperado, com as duas
      # parcelas DISJUNTAS. A conta prevista paga aparece so em Realizado (a
      # view `planned_vs_actual` tem o nome exato da feature e conta a paga nos
      # dois lados -- correto para variancia, falso aqui, e o total sai alto
      # pelo valor da conta), a transacao de data futura dentro do mes corrente
      # nao entra em "ja gastei", e transferencia e fatura de cartao ficam fora
      # dos dois lados.
      - name: Realizado + Previsao = Total esperado, e a conta paga conta uma vez so
        run: npm run test:realizado-e-previsao

      # A suite acima e aritmetica pura, e passaria verde com o JSX imprimindo
      # a Previsao debaixo do rotulo "Realizado": os dois numeros certos nas
      # posicoes trocadas nao quebram build nem teste, e nao deixam a tela
      # vazia. Esta renderiza os tiles com react-dom/server.
      #
      # Ela cobre tambem a frase que carrega a decisao de produto: o gasto
      # variavel e linha propria e a tela precisa DIZER que ele nao esta somado
      # -- sem isso o usuario soma os dois numeros de despesa de cabeca e
      # conclui que o app se contradiz.
      - name: Os tres numeros saem na ordem certa, e o gasto variavel diz que fica de fora
        run: npm run test:tres-numeros
      - name: O plano de reset bate com o schema, e os filhos vem antes dos pais
        run: npm run test:account-reset

      # Controle negativo. O teste do reset confere o plano contra as
      # migrations lendo arquivo e casando expressao regular -- ou seja, ele
      # passa a sair VERDE se parar de achar o que deveria conferir. Uma
      # verificacao que nunca viu vermelho nao e verificacao.
      #
      # Plantamos aqui os dois defeitos de maior consequencia e exigimos
      # vermelho nos dois.
      - name: A verificacao do reset sabe falhar
        run: |
          set -uo pipefail
          cp lib/account-reset.ts lib/account-reset.ts.orig
          trap 'mv lib/account-reset.ts.orig lib/account-reset.ts' EXIT

          # 1) Tabela que nao existe no schema. O plano usa `.from(variavel)`,
          #    entao o check-table-drift NAO enxerga estes nomes -- este teste
          #    e a unica coisa entre um nome errado e um reset que falha no
          #    meio, com parte da conta ja apagada.
          sed -i 's/tabela: "budgets"/tabela: "budgetz"/' lib/account-reset.ts
          if npm run test:account-reset > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com uma tabela inventada no plano."
            exit 1
          fi
          cp lib/account-reset.ts.orig lib/account-reset.ts

          # 2) Tabela real, com user_id, mas SEM policy de DELETE para
          #    authenticated. Este e o defeito mudo: a rota apaga com a sessao
          #    do usuario, e RLS sem policy de DELETE nao da erro -- apaga zero
          #    linhas e devolve sucesso.
          sed -i 's/tabela: "budgets"/tabela: "user_usage_limits"/' lib/account-reset.ts
          if npm run test:account-reset > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com uma tabela sem policy de DELETE."
            exit 1
          fi

          echo "A verificacao fica vermelha nos dois defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao do reset sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # CONTA TEM SALDO, CARTAO TEM FATURA
      # origem: contas.yml
      # =======================================================================
      # Prova, a cada PR, as duas coisas que a HMO-166 separou: as REGRAS do corte
      # (qual tipo mora em qual tela, o que entra em cada total, o que vai `null` para
      # o banco) e a ARVORE de cada tela -- Contas sem limite, sem dia de fechamento e
      # sem dia de vencimento.
      #
      # SEM FILTRO DE `paths`, e de proposito, pelo mesmo motivo do lancamento.yml: o
      # comportamento destas telas nasce de tres lugares em dois diretorios
      # (lib/contas.ts, components/contas/*.tsx e os primitivos de components/ui), e um
      # filtro que liste os de hoje perde o dia em que alguem mexer no de amanha. Foi
      # exatamente assim que tres suites deste repositorio ficaram paradas em verde:
      # elas so rodavam no db-verify, que e filtrado por path.
      #
      # As duas suites renderizam HTML em memoria, rodam em segundos e nao precisam de
      # banco -- podem ser obrigatorias em todo PR sem virar pedagio.
      - name: As regras do corte entre conta e cartao
        run: npm run test:contas

      # O que erra a TELA. A queixa da HMO-166 era de arvore: o cadastro era um
      # formulario so para os oito tipos, e quem abria para cadastrar uma conta
      # corrente via limite, fechamento e vencimento aparecerem e sumirem
      # conforme trocava o tipo.
      - name: 'Os campos que cada tela mostra (contas)'
        run: npm run test:campos-da-conta

      # O modo offline das duas. A tela antiga era precacheada; as duas novas
      # entraram no lugar dela. Deixar uma de fora apagaria metade do modo
      # offline por um caminho que nao parece com isso -- o menu abriria sem rede
      # com os dois itens e um deles cairia na pagina /offline.
      - name: As duas telas abrem sem rede
        run: npm run test:pwa-precache

      # O QUE DE UM CARTAO APARECE EM CONTAS A PAGAR (HMO-209). A compra
      # individual no cartao aparecia na agenda ao lado da fatura cheia daquele
      # mesmo cartao -- a despesa duas vezes na mesma tela, somada duas vezes no
      # cabecalho. As quatro maneiras de "consertar" isso errado passam verdes em
      # qualquer teste manual:
      #   - filtrar pelo TIPO DA CONTA e mais nada esconde a propria fatura, que
      #     tambem e uma previsao com o account_id do cartao -- a pessoa deixa de
      #     ver a unica conta de cartao que ela de fato paga;
      #   - reconhecer a fatura por texto livre em `notes` faz a descricao escrita
      #     a mao virar regra de negocio;
      #   - esconder a linha quando a conta nao e legivel (embed null por RLS, ou
      #     previsao sem conta) apaga conta a pagar comum em silencio;
      #   - filtrar so na LISTA deixa o total do cabecalho discordando das linhas
      #     logo abaixo dele, e o total e o numero errado.
      # Esta suite roda aqui, e nao no db-verify, porque o db-verify e filtrado
      # por path e as duas rotas que usam o filtro nao estao nesse filtro.
      - name: O que de um cartao aparece em Contas a Pagar
        run: npm run test:agenda-do-cartao

      # A FATURA ABERTA EM CONTAS A PAGAR (HMO-227). O pedido do dono era que o
      # total a pagar no cartao aparecesse em contas previstas, no vencimento do
      # cartao. O modelo de dados ja fazia isso -- depois de alguem clicar
      # "Fechar fatura" em /dashboard/budgets, uma tela que a maioria nunca
      # abre. A fatura ABERTA agora e sintetizada a cada leitura, e a sintese
      # tem quatro maneiras de dar errado sem erro em lugar nenhum:
      #   - SAIR EM DOBRO ao lado da fatura ja fechada: as duas linhas sao
      #     plausiveis uma ao lado da outra, e o cabecalho cobra o dobro;
      #   - INVENTAR VENCIMENTO num cartao sem `due_day`, e a pessoa pagar no
      #     dia errado por causa de um chute do app;
      #   - DESAPARECER CALADA no mesmo cartao -- o defeito da issue de volta,
      #     agora com o app tendo o dado para avisar;
      #   - SINTETIZAR SO NA LISTA, deixando o "a vencer" do cabecalho MENOR
      #     que a soma das linhas logo abaixo dele, na mesma tela.
      - name: A fatura aberta entra em Contas a Pagar, e uma vez so
        run: npm run test:fatura-prevista

      # O placar de mutantes da sintese. A suite acima passa com 27 assercoes
      # verdes, e isso sozinho nao diz nada -- aqui cada decisao dela e quebrada
      # de proposito e a suite tem de ficar vermelha. O mutante `sem_dedup` e o
      # controle negativo que a issue nomeou.
      - name: A sintese da fatura sabe falhar (mutantes)
        run: npm run mutantes:fatura-prevista

      # Controle negativo. As suites afirmam sobre AUSENCIA -- "a tela de Contas
      # nao tem limite" -- e uma asercao de ausencia passa verde tambem quando
      # ela deixa de achar o que deveria procurar. Uma verificacao que nunca viu
      # vermelho nao e verificacao.
      #
      # Plantamos os sete defeitos exatos que a separacao corrigiu ou evita.
      - name: 'A verificacao sabe falhar (contas)'
        run: |
          set -uo pipefail
          REGRAS=lib/contas.ts
          CAMPOS=components/contas/CamposDaConta.tsx
          PRECACHE=lib/pwa-precache.js
          AGENDA=lib/agenda-do-cartao.ts
          LISTA=app/api/scheduled-transactions/route.ts
          RESUMO=app/api/scheduled-transactions/summary/route.ts
          SERVICO=lib/services/fatura-prevista.ts
          cp $REGRAS $REGRAS.orig
          cp $CAMPOS $CAMPOS.orig
          cp $PRECACHE $PRECACHE.orig
          cp $AGENDA $AGENDA.orig
          cp $LISTA $LISTA.orig
          cp $RESUMO $RESUMO.orig
          cp $SERVICO $SERVICO.orig
          # O trap cobre TODOS os arquivos mutados, inclusive os da HMO-227 la
          # embaixo: um `exit 1` no meio do bloco nao roda o `cp` de restauracao
          # que vem depois dele, e o arquivo mutado ficaria no disco para o
          # proximo step -- que reprovaria por um defeito plantado, apontando
          # para o codigo errado.
          trap 'mv $REGRAS.orig $REGRAS; mv $CAMPOS.orig $CAMPOS; mv $PRECACHE.orig $PRECACHE; mv $AGENDA.orig $AGENDA; mv $LISTA.orig $LISTA; mv $RESUMO.orig $RESUMO; mv $SERVICO.orig $SERVICO' EXIT

          # 1) A tela de Contas volta a pedir os campos de fatura. E a issue ao
          #    contrario, e o caso mais obvio -- esta aqui para provar que o
          #    oraculo esta ligado no que a issue pediu.
          sed -i 's|return { tipo: true, fatura: false, substantivo: "conta" };|return { tipo: true, fatura: true, substantivo: "conta" };|' $REGRAS
          if npm run test:campos-da-conta > /dev/null 2>&1; then
            echo "::error::Verde com limite e dias de fatura na tela de Contas."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 2) O JSX ignorando a decisao. Este e o defeito que o teste de regra
          #    NAO pega: `camposDoEscopo` continua certo, e o formulario
          #    renderiza os tres campos nas duas telas do mesmo jeito. E a forma
          #    exata do bug que a tela antiga tinha.
          sed -i 's|{campos.fatura && (|{true \&\& (|' $CAMPOS
          if npm run test:campos-da-conta > /dev/null 2>&1; then
            echo "::error::Verde com o bloco de fatura renderizado nas duas telas."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          # 3) O limite voltando a ser gravado fora do cartao. Era o que a tela
          #    antiga fazia -- ela zerava os dois dias e mandava `credit_limit`
          #    sempre. Defeito MUDO: nenhuma tela le limite de conta corrente,
          #    entao o valor fica no banco sem nada que o denuncie.
          #
          #    O delimitador aqui e `#`, e nao `|`: o proprio trecho mutado tem
          #    um `||` dentro, e com `|` de delimitador o sed corta a expressao
          #    no meio. Ele sai com erro, o arquivo fica INTACTO, e a suite
          #    seguinte passa verde sobre o codigo correto -- um controle
          #    negativo que nao controla nada. Aconteceu ao escrever este job.
          sed -i 's#credit_limit: temFatura ? valores.credit_limit || null : null,#credit_limit: valores.credit_limit || null,#' $REGRAS
          if npm run test:contas > /dev/null 2>&1; then
            echo "::error::Verde com limite gravado numa conta corrente."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 4) A fatura somada com o sinal cru. O valor gravado e negativo, entao
          #    "Faturas em aberto" viraria -R$ 1.280,35. O saldo das contas
          #    continua certo, que e o que faz ninguem procurar.
          sed -i 's|return soma + (escopo === "cartao" ? Math.abs(valor) : valor);|return soma + valor;|' $REGRAS
          if npm run test:contas > /dev/null 2>&1; then
            echo "::error::Verde com a fatura somada com o sinal negativo."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 5) O cartao de debito mudando de tela. E a decisao que a issue mandou
          #    confirmar com o Helio: ela tem que estar escrita em um lugar so, e
          #    mexer nela tem que acender vermelho -- porque move um tipo inteiro
          #    de um total para o outro.
          sed -i 's|{ valor: "debit_card", rotulo: "Cartão de débito", escopo: "conta" },|{ valor: "debit_card", rotulo: "Cartão de débito", escopo: "cartao" },|' $REGRAS
          if npm run test:contas > /dev/null 2>&1; then
            echo "::error::Verde com o cartao de debito na tela de Cartoes, sem ninguem ter decidido isso."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 6) A frase que explica por que o tipo nao muda depois de criada a
          #    conta -- trocar o tipo de uma conta que ja tem lancamento
          #    reinterpreta o historico inteiro: o mesmo saldo passa a ser lido
          #    como fatura.
          #
          #    O mutante e a FRASE, e nao o `disabled={editando}`, porque o
          #    `disabled` do Select do radix nao aparece no HTML do servidor: o
          #    `<button role="combobox">` sai byte a byte igual nos dois estados.
          #    Um controle plantado nele ficaria verde sempre, e isso e pior do
          #    que nao ter controle -- foi tentado primeiro, e passou.
          sed -i 's#{editando \&\& (#{false \&\& (#' $CAMPOS
          if npm run test:campos-da-conta > /dev/null 2>&1; then
            echo "::error::Verde sem a frase que explica o tipo travado na edicao."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          # 7) Metade do modo offline apagada. A tela antiga era precacheada; se
          #    so uma das duas novas entrar, o toque no item que ficou de fora
          #    cai na pagina /offline -- com o app instalado e tudo no aparelho.
          sed -i '/^  "\/dashboard\/cartoes",$/d' $PRECACHE
          if npm run test:pwa-precache > /dev/null 2>&1; then
            echo "::error::Verde com a tela de Cartoes fora do precache."
            exit 1
          fi
          cp $PRECACHE.orig $PRECACHE

          # 8) O cartao nascendo como conta corrente. A tela de Cartoes nao tem
          #    seletor de tipo -- nao ha nada para o usuario escolher errado --,
          #    entao o `account_type` vem inteiro do padrao do escopo. Se ele
          #    errar, o POST grava `checking`, o cartao aparece na tela de
          #    Contas, e `POST /api/card-invoices/close` devolve 400 dizendo
          #    "Esta conta nao e um cartao de credito" sobre um cartao que a
          #    pessoa cadastrou na tela de Cartoes.
          sed -i 's#  tiposDoEscopo(escopo)\[0\].valor;#  tiposDoEscopo("conta")[0].valor;#' $REGRAS
          if npm run test:contas > /dev/null 2>&1; then
            echo "::error::Verde com o cartao sendo criado como conta corrente."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # ------------------------------------------------------------------
          # HMO-209: as quatro maneiras de esconder a coisa errada
          # ------------------------------------------------------------------

          # 9) O filtro nao filtra nada. E o estado ANTERIOR a esta issue: a
          #    compra individual volta para a agenda, ao lado da fatura que ja a
          #    contem, e o cabecalho soma as duas.
          sed -i 's#return ehFatura(linha.notes);#return true;#' $AGENDA
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a compra de cartao de volta em Contas a Pagar."
            exit 1
          fi
          cp $AGENDA.orig $AGENDA

          # 10) O filtro olhando SO o tipo da conta. A fatura fechada tambem e uma
          #     previsao com o account_id do cartao, entao ela desaparece junto --
          #     e a pessoa deixa de ser cobrada da unica conta de cartao que ela
          #     paga. Nada na tela diz que faltou uma linha.
          sed -i 's#return ehFatura(linha.notes);#return false;#' $AGENDA
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a FATURA desaparecendo de Contas a Pagar."
            exit 1
          fi
          cp $AGENDA.orig $AGENDA

          # 11) A chave canonica aplicada a toda linha, e nao so as de cartao.
          #     Aqui some a agenda INTEIRA: luz, agua, aluguel -- nada disso tem
          #     `notes` de fatura. A tela abre vazia, sem erro nenhum.
          sed -i 's#if (contaDaLinha(linha.account)?.account_type !== TIPO_CARTAO) return true;#if (false) return true;#' $AGENDA
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a conta a pagar comum fora da agenda."
            exit 1
          fi
          cp $AGENDA.orig $AGENDA

          # 12) Filtrado na LISTA e nao no RESUMO. O defeito de OMISSAO, e o mais
          #     caro dos quatro: as linhas e o total ficam lado a lado na mesma
          #     tela discordando, e quem acredita no total acredita no numero que
          #     contem a compra duas vezes. Nenhum teste de funcao pura ve isso --
          #     por isso a suite le as duas rotas.
          sed -i 's#agendaSemCompraNoCartao(linhasBrutas#(linhasBrutas#' $RESUMO
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o resumo somando o que a lista nao mostra."
            exit 1
          fi
          cp $RESUMO.orig $RESUMO

          # 13) O mesmo esquecimento do outro lado -- a lista sem filtro e o
          #     resumo com ele. Simetrico, e igualmente invisivel.
          sed -i 's#agendaSemCompraNoCartao(scheduled#(scheduled#' $LISTA
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a lista sem o filtro do cartao."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 14) O `select` do resumo perdendo o embed da conta. Este nao quebra
          #     nada: o embed vem `undefined`, toda linha cai no "nao sei, logo
          #     aparece" e o resumo volta a somar as compras de cartao. Verde, com
          #     o numero antigo -- o filtro continua no codigo, sem dado para ler.
          sed -i 's#, notes, account:financial_accounts(account_type)##' $RESUMO
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o resumo sem as colunas que o filtro le."
            exit 1
          fi
          cp $RESUMO.orig $RESUMO

          # 15) O embed tratado como objeto so. Sobre uma VIEW o supabase-js tipa
          #     o embed do PostgREST como ARRAY, e se a resposta vier nessa forma
          #     `linha.account.account_type` e `undefined` em toda linha: nenhuma
          #     casa com credit_card, o filtro para de filtrar, e a tela volta ao
          #     defeito da issue. Sem erro, sem log, sem teste vermelho -- se nao
          #     fosse por este caso.
          sed -i 's#if (Array.isArray(account)) return account\[0\] ?? null;#if (false) return account[0] ?? null;#' $AGENDA
          if npm run test:agenda-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o embed em array passando reto pelo filtro."
            exit 1
          fi
          cp $AGENDA.orig $AGENDA

          # ------------------------------------------------------------------
          # HMO-227: a sintese esquecida numa das duas rotas
          # ------------------------------------------------------------------
          # Os mutantes da FUNCAO PURA estao em scripts/mutantes-fatura-prevista.mjs,
          # que roda como step proprio acima. O que NAO cabe la e o defeito de
          # OMISSAO nas rotas -- ele nao esta na funcao, esta em quem a chama --,
          # e e o mesmo par 12/13 da HMO-209 com outra roupa.

          # 16) A fatura aberta sintetizada so na LISTA. O cabecalho "a vencer"
          #     fica MENOR que a soma das linhas logo abaixo dele, na mesma
          #     tela -- e o numero menor e o que parece certo a quem nao somou
          #     na mao. Nenhum teste de funcao pura ve isso.
          sed -i 's#^import { faturasPrevistasDaJanela } from "@/lib/services/fatura-prevista";#// mutante: o resumo esqueceu a sintese#' $RESUMO
          if npm run test:fatura-prevista > /dev/null 2>&1; then
            echo "::error::Verde com o resumo sem a fatura aberta que a lista mostra."
            exit 1
          fi
          cp $RESUMO.orig $RESUMO

          # 17) O mesmo esquecimento do outro lado -- o resumo soma a fatura
          #     aberta e a lista nao a mostra. Simetrico, e igualmente
          #     invisivel: o cabecalho fica MAIOR que as linhas.
          sed -i 's#^import { faturasPrevistasDaJanela } from "@/lib/services/fatura-prevista";#// mutante: a lista esqueceu a sintese#' $LISTA
          if npm run test:fatura-prevista > /dev/null 2>&1; then
            echo "::error::Verde com a lista sem a fatura aberta que o resumo soma."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 18) A leitura da fatura sem filtro de `user_id`. `card_invoice_lines`
          #     sai de `financial_transactions`, cuja policy (002) tem um OR para
          #     membro de grupo: sem o filtro a view devolve tambem a compra de
          #     grupo lancada no cartao de OUTRA pessoa, e o agrupamento por
          #     cartao somaria aquilo na fatura prevista. A linha extra e
          #     plausivel e a RLS nao reclama -- ela ja autorizou a leitura.
          #
          #     O sed apaga as DUAS ocorrencias (a da view e a da consulta de
          #     de-duplicacao), e as duas sao defeito de verdade: na segunda, a
          #     fatura que OUTRO membro fechou num cartao dele suprimiria a
          #     minha fatura prevista. A suite cobra as duas.
          sed -i 's#\.eq("user_id", userId)##' $SERVICO
          if npm run test:fatura-prevista > /dev/null 2>&1; then
            echo "::error::Verde com a fatura prevista somando a compra de grupo de outra pessoa."
            exit 1
          fi
          cp $SERVICO.orig $SERVICO

          echo "A verificacao fica vermelha nos dezoito defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (contas)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # A MASCARA MOSTRA DD/MM/AAAA E EMITE AAAA-MM-DD
      # origem: data-digitada.yml
      # =======================================================================
      # Prova, a cada PR, a mascara de data dd/mm/aaaa (HMO-238).
      #
      # O pedido da issue era de ergonomia: "digitar dia mes e ano sem ficar pulando
      # pro ano". O risco que a troca cria e de DINHEIRO, e em duas direcoes:
      #
      #   1. O valor emitido tem que continuar AAAA-MM-DD. `validarLancamento` recusa
      #      qualquer outra coisa com "Informe a data.", e o que passar por ela chega no
      #      PostgREST como 22007 -- que a tela mostra como "erro ao salvar", sem campo.
      #   2. Data incompleta tem que emitir VAZIO. Emitir "2026-01-10" para quem digitou
      #      "10/1" grava um dia que ninguem escolheu, e uma gravacao errada e pior que
      #      uma recusa porque ninguem vai olhar.
      #
      # E o defeito que a issue fechou e justamente do tipo que nao reclama: o controle
      # nativo lia "10/03" na ordem do APARELHO (mm/dd) e gravava 3 de outubro em vez de
      # 10 de marco. Data valida, plausivel, sem erro nenhum no caminho.
      #
      # SEM FILTRO DE `paths`, de proposito. A mascara e usada pela tela de lancamento e
      # vai ser usada pelas outras (a issue irma), e um filtro que liste os arquivos de
      # hoje perde o dia em que alguem mexer no de amanha. Foi assim que tres suites
      # deste repositorio ficaram paradas em verde: elas so rodavam no db-verify, que e
      # filtrado por path.
      #
      # Roda em segundos e nao precisa de banco.
      - name: A mascara, a data emitida e a recusa da data incompleta
        run: npm run test:data-digitada

      # Controle negativo. As asercoes da suite sao quase todas igualdades de
      # string, e igualdade de string continua verde quando o codigo vira outra
      # coisa por baixo -- desde que a outra coisa produza o mesmo texto nos
      # exemplos escolhidos. Uma verificacao que nunca viu vermelho nao e
      # verificacao.
      #
      # A lista de defeitos, o porque de cada um e a exigencia de vermelho moram
      # em scripts/mutantes-data-digitada.mjs, e nao num bloco de `sed` aqui: `sed`
      # que nao casa sai 0 sem mudar nada, entao um mutante desatualizado deixava o
      # CI vermelho pelo motivo errado -- acusando a mascara em vez do mutante.
      - name: 'A verificacao sabe falhar (data-digitada)'
        run: node scripts/mutantes-data-digitada.mjs

      # A SONDA NAO RODA AQUI, E ISSO E DELIBERADO
      #
      # `scripts/probe-campo-de-data.mjs` precisa de Playwright e de um Chromium
      # baixado -- minutos de instalacao num job que hoje leva segundos -- e o
      # Playwright nao e dependencia deste projeto. Ela e a medida que justificou a
      # troca (e a que vai dizer se um Chromium futuro mudou de comportamento), e
      # roda na mao, com as instrucoes no cabecalho do proprio arquivo.
      #
      # O que ela mede de unico e o GESTO: caret, selecao e posicao de clique. A
      # regra que o gesto exercita -- "digitar sobre uma data completa comeca uma
      # data nova" -- mora na mascara justamente para caber na suite acima, que
      # roda em todo PR.

      # =======================================================================
      # A MASCARA MOSTRA REAIS E EMITE NUMERO
      # origem: dinheiro.yml
      # =======================================================================
      # Prova, a cada PR, a mascara de valor (HMO-171) -- e principalmente o lado dela
      # que nao aparece na tela.
      #
      # O pedido da issue era de aparencia: "qualquer campo de valor deve ser aplicado
      # a mascara R$1.000,00". O risco que ele cria e de DINHEIRO. Todo formulario
      # deste app guarda o valor como string e converte com `Number.parseFloat` na
      # hora de gravar, e:
      #
      #   Number.parseFloat("1.000,00")  ->  1
      #
      # Se o texto mascarado vazar para o estado do formulario, mil reais entram no
      # banco como um real. Nao ha NaN, nao ha excecao, nao ha nada para um catch
      # pegar: a tela mostra "R$ 1.000,00", a validacao aprova (1 > 0), e o unico jeito
      # de descobrir e conferir lancamento por lancamento.
      #
      # SEM FILTRO DE `paths`, de proposito. A mascara e usada por dez telas em dois
      # diretorios (lib/dinheiro.ts, components/ui/campo-de-valor.tsx e os
      # formularios), e um filtro que liste os arquivos de hoje perde o dia em que
      # alguem mexer no de amanha. Foi assim que tres suites deste repositorio ficaram
      # paradas em verde: elas so rodavam no db-verify, que e filtrado por path.
      #
      # Roda em segundos e nao precisa de banco.
      - name: A mascara, e o valor plano por tras dela
        run: npm run test:dinheiro

      # Controle negativo. As asercoes da suite sao quase todas igualdades de
      # string, e igualdade de string continua verde quando o codigo vira outra
      # coisa por baixo -- desde que a outra coisa produza o mesmo texto nos
      # exemplos escolhidos. Uma verificacao que nunca viu vermelho nao e
      # verificacao.
      #
      # A lista de defeitos, o porque de cada um e a exigencia de vermelho moram
      # em scripts/mutantes-dinheiro.mjs, e nao num bloco de `sed` aqui. A razao
      # esta no cabecalho daquele arquivo: `sed` que nao casa sai 0 sem mudar
      # nada, entao um mutante desatualizado deixava o CI vermelho pelo motivo
      # errado -- acusando a mascara em vez do proprio mutante.
      - name: 'A verificacao sabe falhar (dinheiro)'
        run: node scripts/mutantes-dinheiro.mjs

      # A CALCULADORA DO CAMPO (a mesma issue, o mesmo risco)
      #
      # Ela mora neste workflow, e nao no db-verify, pela razao do comentario no
      # topo: aqui nao ha filtro de `paths`. E ela pertence a este job e nao a um
      # proprio porque compartilha a armadilha da mascara -- o que sai da conta
      # vai direto para o estado de um formulario que grava com `parseFloat`.
      # Entregar "1.000,00" em vez de "1000.00" gravaria um real.
      #
      # Alem disso a conta tem dois erros de dinheiro que so ela tem:
      # `Math.round(n * 100) / 100` perde o centavo de 1,005 (o double e
      # 1.00499999999999989), e um resultado negativo entregue a um campo de
      # despesa volta do banco positivo, porque as rotas aplicam `-Math.abs`.
      - name: A conta arredonda em decimal e recusa o que o campo nao aceita
        run: npm run test:calculadora-campo
      - name: A verificacao da conta sabe falhar
        run: node scripts/mutantes-calculadora-de-campo.mjs

      # A moeda oficial, a sugestao por lancamento e o periodo separado por
      # moeda (partes 2 e 3 da HMO-171). Mora neste workflow, e nao no db-verify,
      # pelo mesmo motivo da suite acima: o db-verify e filtrado por `database/**`
      # e nao dispararia num PR que so mexe em lib/moeda.ts ou numa tela.
      #
      # O ultimo caso da suite `dinheiro` tambem depende de rodar aqui: ele le o
      # CHECK da migration 022 e compara com `MOEDAS`, porque o catalogo de
      # moedas passou a ter duas copias (TypeScript e SQL) e elas divergem em
      # silencio na direcao mais provavel -- moeda nova no seletor que o banco
      # recusa, e a tela mostra "erro ao salvar".
      - name: A moeda oficial e o periodo separado por moeda
        run: npm run test:moeda

      # Controle negativo da suite de cima. As duas regras que mais importam aqui
      # sao PRECEDENCIAS -- "o lancamento ganha da conta", "a oficial vem
      # primeiro" -- e precedencia invertida passa pelo tsc e pelo lint sem nada.
      - name: A verificacao da moeda sabe falhar
        run: node scripts/mutantes-moeda.mjs

      # =======================================================================
      # PREVIEW NAO APONTA PARA O BANCO DE PRODUCAO
      # origem: env-preview.yml
      # =======================================================================
      # HMO-132: preview deployment da Vercel nao fala com o banco de producao.
      #
      # Preview de branch tambem e build de producao na Vercel, entao `NODE_ENV` nao
      # separa os dois -- quem separa e `VERCEL_ENV`. Sem o guard de
      # utils/supabase/env.ts, abrir um PR publica uma URL que escreve no banco real.
      #
      # SEM FILTRO DE `paths`, de proposito. O modo de falhar desta regra e a
      # ausencia de sintoma: se o guard parar de disparar, o preview sobe verde e a
      # unica pista e um lancamento de teste aparecendo na conta real dias depois.
      # Um filtro de path so acertaria se quem quebrasse o guard mexesse justamente
      # em utils/supabase/env.ts, e a quebra mais provavel nao e essa -- e alguem
      # mexer no fluxo de env por outro arquivo. O teste e aritmetica de string, roda
      # em segundos e nao precisa de Postgres, entao cabe em todo PR sem virar pedagio.
      - name: O guard reconhece o banco de producao, e so barra no preview
        run: npm run test:env-preview

      # Controle negativo. Uma verificacao que nunca viu vermelho nao e
      # verificacao: se o guard virar `return false` constante, os sete testes
      # acima precisam acusar. Sem este passo, um guard desligado passaria o
      # workflow inteiro em verde -- que e exatamente o estado que a HMO-132
      # existe para evitar.
      - name: 'A verificacao sabe falhar (env-preview)'
        run: |
          cp utils/supabase/env.ts /tmp/env.orig.ts
          sed -i 's|if (vercelEnv !== "preview") return false;|if (true) return false;|' \
            utils/supabase/env.ts
          if ! grep -q 'if (true) return false;' utils/supabase/env.ts; then
            echo "O mutante nao foi aplicado -- o sed nao casou com o codigo."
            echo "Controle negativo que nao muda nada passa verde por nao rodar nada."
            exit 1
          fi
          if npm run test:env-preview > /dev/null 2>&1; then
            echo "O guard foi desligado e a suite continuou verde."
            exit 1
          fi
          cp /tmp/env.orig.ts utils/supabase/env.ts
          echo "OK: com o guard desligado, a suite acusa."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (env-preview)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # RECEITA E DESPESA, CADA UMA COM OS SEUS CAMPOS
      # origem: lancamento.yml
      # =======================================================================
      # Prova, a cada PR, as duas coisas que a HMO-165 separou: as REGRAS de um
      # lancamento (sinal, categoria, campos obrigatorios) e a ARVORE de cada tela --
      # receita sem natureza de despesa, sem parcelamento e sem rateio.
      #
      # SEM FILTRO DE `paths`, e de proposito. O comportamento destas telas nasce de
      # tres lugares em dois diretorios (lib/lancamento.ts,
      # components/movimentacoes/*.tsx e os primitivos de components/ui), e um filtro
      # que liste os de hoje perde o dia em que alguem mexer no de amanha. Foi
      # exatamente assim que tres suites deste repositorio ficaram paradas em verde:
      # elas so rodavam no db-verify, que e filtrado por path.
      #
      # As duas suites renderizam HTML em memoria, rodam em segundos e nao precisam de
      # banco -- podem ser obrigatorias em todo PR sem virar pedagio.
      - name: As regras de um lancamento
        run: npm run test:lancamento

      # O que erra a TELA. A queixa da HMO-162 era de arvore: o formulario
      # antigo trocava os campos por `if (transaction_type === ...)`, e quem
      # abria para lancar uma receita via o seletor de natureza da despesa, o
      # parcelamento e o rateio aparecendo e desaparecendo.
      - name: 'Os campos que cada tela mostra (lancamento)'
        run: npm run test:campos-lancamento

      # O que erra o HISTORICO (HMO-170). Editar uma movimentacao que se repete
      # pergunta se a mudanca vale para uma ocorrencia ou para as seguintes, e a
      # issue e explicita: "nunca mudar o que ja passou". O defeito que esta
      # suite pega e a barreira errada -- filtrar por `hoje` em vez de pela
      # ocorrencia clicada passa em todo teste manual (onde a ancora E o mes
      # corrente) e reescreve os meses entre hoje e a ancora quando ela esta mais
      # a frente. A pessoa pede "daqui para frente" e recebe "desde sempre".
      - name: O alcance de uma edicao, e o que ele nunca toca
        run: npm run test:recorrencia-edicao

      # Controle negativo. As duas suites afirmam sobre AUSENCIA -- "a tela de
      # receita nao tem parcelamento" -- e uma asercao de ausencia passa verde
      # tambem quando ela deixa de achar o que deveria procurar. Uma verificacao
      # que nunca viu vermelho nao e verificacao.
      #
      # Plantamos os tres defeitos exatos que a separacao corrigiu.
      - name: 'A verificacao sabe falhar (lancamento)'
        run: |
          set -uo pipefail
          CAMPOS=components/movimentacoes/CamposDeLancamento.tsx
          REGRAS=lib/lancamento.ts
          # O filtro por tipo saiu do CAMPOS na HMO-216 -- ver a mutacao 2.
          CATEGORIAS=lib/categorias.ts
          cp $CAMPOS $CAMPOS.orig
          cp $REGRAS $REGRAS.orig
          cp $CATEGORIAS $CATEGORIAS.orig
          trap 'mv $CAMPOS.orig $CAMPOS; mv $REGRAS.orig $REGRAS; mv $CATEGORIAS.orig $CATEGORIAS' EXIT

          # 1) O rateio renderizado nas duas telas, que e o que a tela antiga
          #    fazia: o bloco existia sempre e so era escondido por condicao.
          sed -i 's|{campos.rateio && rateio}|{rateio}|' $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o bloco de rateio aparecendo na tela de receita."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          # 2) O seletor de categoria recebendo a lista inteira. Este e o defeito
          #    MUDO: a tela abre igual, e o seletor da despesa oferece "Salario".
          #
          #    A MUTACAO MUDOU DE ARQUIVO NA HMO-216, E ISSO QUASE PASSOU BATIDO.
          #    Ela era um sed em `const categoriasVisiveis = categoriasDoTipo(...)`
          #    dentro do CAMPOS. Aquela linha nao existe mais: o filtro foi para
          #    `categoriasDoSeletor` (lib/categorias.ts), que e quem tambem aplica a
          #    personalizacao e a ordem.
          #
          #    O sintoma de nao ter percebido: o `sed` casa com nada, o arquivo fica
          #    intacto, a suite passa -- e ESTE bloco reprova dizendo "verde com o
          #    seletor sem filtro". Ou seja, o erro acusa o filtro (que esta
          #    correto) em vez da sonda (que envelheceu). Mutante que nao aplica e
          #    indistinguivel de mutante que sobreviveu.
          sed -i 's|.filter((c) => c.is_expense === querDespesa)|.filter(() => true)|' $CATEGORIAS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o seletor de categoria sem filtro por tipo."
            exit 1
          fi
          cp $CATEGORIAS.orig $CATEGORIAS

          # 3) O sinal sem `Math.abs`. O input e `type=number` e aceita "-30":
          #    sem o abs, uma despesa digitada com o menos na frente vira +30 --
          #    dinheiro ENTRANDO -- e o saldo fecha errado para mais, que e o
          #    lado do qual ninguem reclama.
          sed -i 's|return tipo === "expense" ? -Math.abs(valor) : Math.abs(valor);|return tipo === "expense" ? -valor : valor;|' $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o sinal da despesa dependendo do que foi digitado."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 4) HMO-170: a barreira do alcance vira `hoje` em vez da ocorrencia
          #    clicada. Este e o defeito que reescreve o que a pessoa nao pediu,
          #    e ele passa em qualquer teste manual feito no mes corrente.
          #
          #    A SONDA ENVELHECEU NA HMO-228, E DE UM JEITO PIOR QUE O DA
          #    MUTACAO 2 ACIMA. Ela era
          #
          #      sed 's|if (irma.due_date < ancora.due_date) {|if (false) {|'
          #
          #    e aquela linha ganhou uma condicao quando o terceiro alcance
          #    (`todas`) chegou -- `todas` nao tem barreira de data, e e disso
          #    que ele consiste. O padrao velho deixou de casar em
          #    `planejarEdicao`... e passou a casar em `planejarExclusao`, que
          #    nasceu na mesma issue 200 linhas abaixo com a forma antiga.
          #
          #    Entao a mutacao ACONTECIA, na funcao errada.
          #    `test:recorrencia-edicao` nao cobre `planejarExclusao` (quem
          #    cobre e `test:alcance-da-serie`), a suite ficava verde e ESTE
          #    bloco reprovava acusando a edicao de alcancar meses anteriores --
          #    que e justamente o que ela nao faz. CI vermelho sobre codigo
          #    correto, apontando para o lugar errado.
          #
          #    O padrao agora e a linha INTEIRA, com a condicao do alcance: ela
          #    nao existe em mais nenhum lugar do arquivo. E a contagem abaixo
          #    transforma "a sonda envelheceu de novo" num erro que se explica,
          #    em vez de numa acusacao ao codigo.
          ALCANCE=lib/recorrencia-edicao.ts
          cp $ALCANCE $ALCANCE.orig
          PADRAO='if (alcance === "esta_e_proximas" && irma.due_date < ancora.due_date) {'
          CASOU=$(grep -cF "$PADRAO" $ALCANCE)
          if [ "$CASOU" != "1" ]; then
            echo "::error::A sonda do alcance casa ${CASOU}x, nao 1x -- a linha mudou de forma em lib/recorrencia-edicao.ts. Conserte a sonda, nao o codigo: mutante que nao aplica e indistinguivel de mutante que sobreviveu."
            exit 1
          fi
          sed -i "s|$PADRAO|if (false) {|" $ALCANCE
          if npm run test:recorrencia-edicao > /dev/null 2>&1; then
            echo "::error::Verde com a edicao alcancando meses ANTERIORES ao clicado."
            mv $ALCANCE.orig $ALCANCE
            exit 1
          fi
          cp $ALCANCE.orig $ALCANCE

          # 5) HMO-170: a ocorrencia PAGA volta a ser alteravel em lote. O mes
          #    pago tem uma transacao real amarrada nele -- mexer no valor
          #    reescreve um extrato que a pessoa ja conferiu.
          sed -i 's|if (irma.status !== "pending") {|if (false) {|' $ALCANCE
          if npm run test:recorrencia-edicao > /dev/null 2>&1; then
            echo "::error::Verde com a edicao em lote alterando ocorrencia JA PAGA."
            mv $ALCANCE.orig $ALCANCE
            exit 1
          fi
          mv $ALCANCE.orig $ALCANCE

          # 6) HMO-170: a receita volta a nao ter natureza, e salario deixa de
          #    poder ser fixo. O caso de cima ("receita nao tem natureza de
          #    despesa") afirma sobre AUSENCIA e continuaria verde com isto.
          #
          #    A INDENTACAO DO ANCORA E 4 ESPACOS, E ISSO JA CUSTOU O JOB INTEIRO.
          #    O mutante nasceu na HMO-170 com 6, porque a linha estava dentro de
          #    um objeto aninhado; a HMO-188 extraiu o `comum` e a dedentou para 4,
          #    e o ancora ficou para tras. Um `sed` que nao casa sai 0 e deixa o
          #    arquivo INTACTO: a suite roda sobre o codigo correto, passa, e o
          #    controle acusa "verde com o defeito plantado" -- apontando para o
          #    codigo quando o defeito e do proprio ancora. Este job ficou vermelho
          #    na main de 736fb65 (HMO-188) ate aqui por causa disso, e com ele os
          #    mutantes 7 a 12 abaixo, que nunca chegavam a rodar.
          sed -i '0,/    natureza: true,/s//    natureza: false,/' $REGRAS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com a tela de receita sem o seletor pontual x fixa."
            exit 1
          fi

          # O mutante 6 nao restaura: o trap faz isso no fim do step. Os casos
          # abaixo precisam do arquivo limpo.
          cp $REGRAS.orig $REGRAS

          # ------------------------------------------------------------------
          # HMO-209: o gasto no cartao, que ja aconteceu
          # ------------------------------------------------------------------

          # 7) A TRAVA NO LUGAR ERRADO -- o destino voltando a ler o estado da
          #    checkbox em vez dos campos da tela. E o defeito da issue com a
          #    roupa nova e pior: a checkbox nao esta mais na tela do cartao, mas
          #    `confirmado` sobrevive a troca de natureza, entao um `false`
          #    herdado de "pontual" manda a compra para `scheduled_transactions`
          #    com o campo FORA da tela. A compra reaparece em Contas a Pagar ao
          #    lado da fatura cheia, e nao ha nada na tela que explique por que.
          sed -i 's|if (!campos.dataDeRealizacao) return "previsao";|if (!valores.confirmado) return "previsao";|' $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o gasto no cartao indo para Contas a Pagar."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 8) A regra do cartao desligada: a checkbox "Ja paguei" volta, e com
          #    ela o caminho inteiro do defeito.
          sed -i 's|const ehCompraNoCartao = tipo === "expense" && natureza === "card";|const ehCompraNoCartao = false;|' $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com 'Ja paguei' de volta no gasto do cartao."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 9) A regra do cartao SEM o recorte por tipo. Este erra para o outro
          #    lado e e silencioso: `natureza: "card"` chega no estado da tela de
          #    receita pelo link de edicao, e a receita perderia "Ja recebi" e a
          #    data prevista -- todo salario previsto viraria transacao no ato,
          #    entrando no saldo antes de o dinheiro cair.
          sed -i 's|const ehCompraNoCartao = tipo === "expense" && natureza === "card";|const ehCompraNoCartao = natureza === "card";|' $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com a tela de receita perdendo a confirmacao."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 10) A data prevista de volta no cartao. Dois campos de data para uma
          #     compra que ja aconteceu, e o de baixo pedindo "quando voce espera
          #     pagar" sobre uma linha que nao espera pagamento nenhum.
          sed -i 's|dataPrevista: !ehFixa && !ehCompraNoCartao,|dataPrevista: !ehFixa,|' $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com data prevista no gasto do cartao."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 11) O rotulo mentindo. "Data do pagamento" no cartao e a pergunta
          #     errada: quem paga a fatura e outra tela, e a data daqui decide em
          #     que fatura a compra cai. O campo funciona igual -- so a frase esta
          #     errada --, e e exatamente o tipo de defeito que nenhum teste
          #     manual pega.
          sed -i 's|"Data da compra"|"Data do pagamento"|' $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o cartao pedindo a data do PAGAMENTO."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 12) O JSX ignorando a decisao: a checkbox renderizada sempre. A funcao
          #     pura continua certa, o teste de regra passa, e a tela de verdade
          #     mostra "Ja paguei" num gasto de cartao -- o campo que esta issue
          #     tirou de la.
          sed -i 's|{campos.confirmacao && (|{true && (|' $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com a checkbox de confirmacao renderizada sempre."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          # ------------------------------------------------------------------
          # HMO-247: a despesa fixa nao tem campo de data
          # ------------------------------------------------------------------
          # A queixa e literal: "se escolhemos qual o dia do vencimento da
          # despesa fixa, nao precisamos ter o campo Data, isso tem confundido o
          # usuario". Os tres defeitos abaixo sao as tres formas de o campo
          # voltar, e so uma delas e visivel na tela.
          #
          # Cada um checa o ancora ANTES de aplicar, pelo motivo que a mutacao 4
          # documenta: um `sed` que nao casa sai 0 e deixa o arquivo intacto, a
          # suite roda sobre codigo correto, passa, e o controle reprova acusando
          # o codigo em vez da sonda.

          # 13) O campo de data de volta na fixa, na funcao pura. O "Data" voltaria
          #     para a tela logo abaixo de "Vence todo dia 10" -- duas datas para
          #     uma pergunta, que e a confusao que a issue nomeia.
          PADRAO_FIXA='dataDeRealizacao: !ehPrevisao && !ehFixa,'
          CASOU=$(grep -cF "$PADRAO_FIXA" $REGRAS)
          if [ "$CASOU" != "1" ]; then
            echo "::error::A sonda do campo de data da fixa casa ${CASOU}x, nao 1x, em lib/lancamento.ts. Conserte a sonda, nao o codigo."
            exit 1
          fi
          sed -i "s|$PADRAO_FIXA|dataDeRealizacao: !ehPrevisao,|" $REGRAS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o campo 'Data' de volta na despesa fixa."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 14) O DEFEITO DE DINHEIRO DESTA ISSUE, e o unico invisivel na tela.
          #     `start_date` voltando a sair de `valores.data`: o estado do
          #     formulario e um objeto so, e a data digitada em "pontual"
          #     sobrevive a troca para "fixa". Ela viraria o inicio da regra --
          #     primeira cobranca meses no futuro, sem campo na tela e sem erro.
          PADRAO_START='start_date: hoje,'
          CASOU=$(grep -cF "$PADRAO_START" $REGRAS)
          if [ "$CASOU" != "1" ]; then
            echo "::error::A sonda do start_date casa ${CASOU}x, nao 1x, em lib/lancamento.ts. Conserte a sonda, nao o codigo."
            exit 1
          fi
          sed -i "s|$PADRAO_START|start_date: valores.data,|" $REGRAS
          if npm run test:lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o start_date da regra saindo de um campo que a tela nao mostra."
            exit 1
          fi
          cp $REGRAS.orig $REGRAS

          # 15) O JSX ignorando a decisao. Gemeo do mutante 12, e necessario pelo
          #     mesmo motivo: o bloco da data esta a 500 linhas do seletor de
          #     natureza, e `camposDoTipo` pode estar certa com o JSX renderizando
          #     o campo sempre -- test:lancamento ficaria verde.
          PADRAO_JSX='{campos.dataDeRealizacao && ('
          CASOU=$(grep -cF "$PADRAO_JSX" $CAMPOS)
          if [ "$CASOU" != "1" ]; then
            echo "::error::A sonda do bloco de data casa ${CASOU}x, nao 1x, em $CAMPOS. Conserte a sonda, nao o codigo."
            exit 1
          fi
          sed -i "s|{campos.dataDeRealizacao && (|{true \&\& (|" $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o bloco de data renderizado sempre, inclusive na fixa."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          # 16) A frase "a primeira cobranca e no proximo dia N" falando de
          #     COBRANCA na tela de receita. Com o campo "Data" fora da tela essa
          #     frase e a unica resposta para "quando isso cai?", e chamar o
          #     salario de cobranca e o defeito que deu nome a HMO-170.
          PADRAO_FRASE='"A primeira cobrança" : "A primeira entrada"'
          CASOU=$(grep -cF "$PADRAO_FRASE" $CAMPOS)
          if [ "$CASOU" != "1" ]; then
            echo "::error::A sonda da frase da primeira cobranca casa ${CASOU}x, nao 1x, em $CAMPOS. Conserte a sonda, nao o codigo."
            exit 1
          fi
          sed -i "s|$PADRAO_FRASE|\"A primeira cobrança\" : \"A primeira cobrança\"|" $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com a tela de receita anunciando uma COBRANCA."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          echo "A verificacao fica vermelha nos dezesseis defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (lancamento)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # A LISTA MOSTRA TUDO, E DIZ PARA ONDE O DINHEIRO FOI
      # origem: lancamentos-completos.yml
      # =======================================================================
      # Prova, a cada PR, as duas coisas que a HMO-215 pediu da aba Financas Pessoais
      # -- "todos os lancamentos, indiferente de onde foi" e "indicar o tipo, o valor,
      # o destino, a categoria":
      #
      #   1. O DESTINO de cada linha (lib/destino-do-lancamento.ts). `account_id` esta
      #      em financial_transactions desde o 001 e nao tinha leitor na lista. Sem
      #      ele, duas despesas iguais em contas diferentes -- mesmo mercado, mesmo
      #      valor, mesmo dia, uma no cartao e uma no debito -- ficam IDENTICAS na
      #      tela, e a leitura natural e que a despesa foi lancada em duplicata. Essa
      #      leitura termina em alguem apagando uma despesa real.
      #
      #   2. A MINHA PARTE das despesas de grupo que outra pessoa pagou
      #      (lib/parte-de-grupo-na-lista.ts). Ela esta gravada em
      #      group_expense_splits, o painel ja a conta como realizado (migration 033),
      #      e a lista nunca a mostrou -- o mes de quem nao pagou parecia mais barato
      #      do que foi.
      #
      # SEM FILTRO DE `paths`, como o workflow lancamento. As duas suites rodam em
      # milissegundos e nao precisam de banco, entao podem ser obrigatorias em todo PR
      # sem virar pedagio -- e um filtro que liste os arquivos de hoje perde o dia em
      # que alguem mexer no de amanha. Foi exatamente assim que tres suites deste
      # repositorio ficaram paradas em verde (ver scripts/check-tests-in-ci.mjs).
      - name: O destino de cada linha, e a minha parte do que outros pagaram
        run: npm run test:lancamentos-completos

      # Controle negativo. A suite afirma sobre SINAL, sobre CONTAGEM e sobre
      # SENTIDO -- tres coisas que erram dinheiro na tela sem levantar excecao
      # nenhuma. Uma verificacao que nunca viu vermelho nao e verificacao.
      #
      # A prova de mutacao completa e `node scripts/mutantes-lancamentos-completos.mjs`
      # (26 mutantes, ferramenta de quem escreve o teste). Aqui ficam os quatro
      # que mais custam, plantados um por vez.
      - name: 'A verificacao sabe falhar (lancamentos-completos)'
        run: |
          set -uo pipefail
          DESTINO=lib/destino-do-lancamento.ts
          PARTE=lib/parte-de-grupo-na-lista.ts
          cp $DESTINO $DESTINO.orig
          cp $PARTE $PARTE.orig
          trap 'mv $DESTINO.orig $DESTINO; mv $PARTE.orig $PARTE' EXIT

          # 1) A PARTE DE GRUPO ENTRANDO POSITIVA. A view do 033 devolve a parte
          #    POSITIVA (200.00 para uma despesa de -400.00) e a lista pinta pelo
          #    sinal. Sem o `-Math.abs`, a minha parte do jantar aparece em VERDE,
          #    como receita -- e o numero exibido continua certo, porque a tela
          #    usa Math.abs para formatar. Nada nessa linha parece errado.
          sed -i 's|amount: -Math.abs(parte.amount),|amount: parte.amount,|' $PARTE
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a minha parte da despesa de grupo entrando como RECEITA."
            exit 1
          fi
          cp $PARTE.orig $PARTE

          # 2) A CONTAGEM DUPLA. A view devolve tambem a MINHA parte da despesa
          #    que eu mesmo paguei (`paguei_eu`), e os R$ 400 cheios ja estao na
          #    lista como transacao minha. Sem a guarda, o hotel aparece duas
          #    vezes e soma R$ 600 de um gasto de R$ 400.
          sed -i 's|if (parte.paguei_eu) continue;|if (false) continue;|' $PARTE
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a despesa que EU paguei contada duas vezes."
            exit 1
          fi
          cp $PARTE.orig $PARTE

          # 3) A BARRA DE ABAS DISCORDANDO DA LISTA. A contagem ao lado de
          #    "Despesas" tem que casar com o que a aba mostra; ignorando as
          #    partes, a aba anuncia 4 e abre com 6 linhas.
          sed -i 's|todos: minhas.length + partes.length,|todos: minhas.length,|' $PARTE
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a contagem da barra ignorando as partes de grupo."
            exit 1
          fi
          cp $PARTE.orig $PARTE

          # 4) A SETA DA TRANSFERENCIA AO CONTRARIO. As duas pernas sao duas
          #    linhas com a mesma descricao e o mesmo valor; o sentido sai do
          #    SINAL. Invertido, a tela afirma que o dinheiro foi da poupanca
          #    para a corrente quando foi o contrario -- e se le como fato.
          sed -i 's|const souASaida = mov.amount < 0;|const souASaida = mov.amount > 0;|' $DESTINO
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a seta da transferencia apontando para o lado errado."
            exit 1
          fi

          echo "A verificacao fica vermelha nos quatro defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (lancamentos-completos)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # A LINHA DA PARTE DE GRUPO DIZ QUEM PAGOU
      # origem: HMO-274
      # =======================================================================
      # Prova, a cada PR, que a linha da minha parte de uma despesa que OUTRA
      # pessoa pagou mostra o nome dessa pessoa -- e que, quando o perfil nao e
      # legivel, ela mostra um ROTULO escrito no lugar do nome.
      #
      # O caminho sem nome nao e excepcional: as policies de SELECT de `profiles`
      # sao `id = auth.uid()`, `is_public = TRUE` (002) e "conexao aceita" (010),
      # e NENHUMA olha `group_members`. Dividir a conta com alguem nao da acesso
      # ao perfil dele, e o PostgREST nao levanta erro nesse caso -- devolve
      # menos linhas. Entao o fallback roda em producao, e o defeito a evitar e
      # ele sair em branco: uma linha de parte sem nenhuma mencao a outra pessoa
      # se le como despesa PROPRIA.
      #
      # SEM FILTRO DE `paths`, pelo mesmo motivo do `lancamentos-completos`: a
      # suite roda em milissegundos, nao precisa de banco, e um filtro que liste
      # os arquivos de hoje perde o dia em que alguem mexer no de amanha.
      - name: Quem pagou aparece na linha, e o perfil invisivel vira rotulo
        run: npm run test:pagador-da-parte

      # Controle negativo. A suite afirma sobre o CONTEUDO de um elemento -- e
      # uma assercao por presenca de palavra passaria com o selo inexistente,
      # porque o nome do grupo tambem sai no HTML. Tres mutantes plantados um por
      # vez, cada um com a trava do `cmp`: um `sed` que nao casa sai com status 0
      # e o mutante seria dado por morto sem nunca ter existido.
      - name: 'A verificacao sabe falhar (pagador-da-parte)'
        run: |
          set -uo pipefail
          LIB=lib/parte-de-grupo-na-lista.ts
          LINHA=components/movimentacoes/LinhaDaParteDeGrupo.tsx

          # 1) O NOME NUNCA CHEGA. A fiacao cortada no fim: o mapa de perfis e
          #    lido, o `user_id` vem na consulta, e o campo sai nulo de todo
          #    jeito. A tela mostra o rotulo de fallback em TODA linha, inclusive
          #    nas de perfil publico -- e o rotulo e plausivel, entao ninguem
          #    procura o defeito.
          cp $LIB $LIB.orig
          sed -i 's@pagador: nomes.get(despesa.user_id) ?? null,@pagador: null,@' $LIB
          if cmp -s $LIB $LIB.orig; then
            echo "::error::O sed do mutante 1 nao casou. A ancora mudou de forma -- o mutante nao mediu nada."
            exit 1
          fi
          if npm run test:pagador-da-parte > /dev/null 2>&1; then
            echo "::error::Verde com o nome de quem pagou nunca chegando na linha."
            exit 1
          fi
          mv $LIB.orig $LIB

          # 2) O ROTULO DE FALLBACK VIRA VAZIO. Sai "Pago por " e um espaco. O
          #    selo existe, o HTML tem o elemento, e a informacao sumiu -- este e
          #    exatamente o "espaco em branco em silencio" que a HMO-274 nomeia.
          cp $LIB $LIB.orig
          sed -i 's@texto: `Pago por ${limpo || PAGADOR_SEM_NOME}`,@texto: `Pago por ${limpo}`,@' $LIB
          if cmp -s $LIB $LIB.orig; then
            echo "::error::O sed do mutante 2 nao casou. A ancora mudou de forma -- o mutante nao mediu nada."
            exit 1
          fi
          if npm run test:pagador-da-parte > /dev/null 2>&1; then
            echo "::error::Verde com o rotulo de fallback saindo em branco."
            exit 1
          fi
          mv $LIB.orig $LIB

          # 3) O SELO DESAPARECE QUANDO NAO HA NOME. A linha volta a ser
          #    "R$ 200,00 · Minha parte · Praia", que e como ela era antes desta
          #    issue -- e que se le como despesa propria.
          cp $LINHA $LINHA.orig
          sed -i 's@{pagador.texto}@{pagador.temNome ? pagador.texto : null}@' $LINHA
          if cmp -s $LINHA $LINHA.orig; then
            echo "::error::O sed do mutante 3 nao casou. A ancora mudou de forma -- o mutante nao mediu nada."
            exit 1
          fi
          if npm run test:pagador-da-parte > /dev/null 2>&1; then
            echo "::error::Verde com o selo de pagador sumindo quando o perfil nao e legivel."
            exit 1
          fi
          mv $LINHA.orig $LINHA

          echo "A verificacao fica vermelha nos tres defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (pagador-da-parte)"'
        run: |
          # O `.tmp-*` compilado guarda o mutante mesmo depois do restore do
          # fonte, e o dump do proximo passo leria o compilado velho.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # O X APARECE SO COM O MENU ABERTO
      # origem: menu-mobile.yml
      # =======================================================================
      # Prova, a cada PR, a regra que a HMO-161 pediu em uma linha: existe X na tela
      # quando, e somente quando, o menu do celular esta aberto.
      #
      # O bug que originou isto era invisivel para todo o resto do CI. O X da gaveta
      # era renderizado sempre e posicionado FORA dos limites do painel; com a gaveta
      # fechada, a translacao levava o painel para fora da tela e o botao reaparecia
      # em cima do hamburguer do header. Compila, nao ha erro de runtime, nenhum teste
      # reclama -- o unico sintoma e visual, e so no celular.
      #
      # SEM FILTRO DE `paths`, pelo mesmo motivo do configuracoes.yml: o cromo do menu
      # depende de tres arquivos em dois diretorios (components/MobileMenuChrome.tsx,
      # components/ui/button.tsx e lib/utils.ts), e o botao do header vive num quarto.
      # Um filtro que liste os tres perde o dia em que alguem mexer no quarto. O teste
      # renderiza HTML em memoria, roda em segundos e nao precisa de banco, entao pode
      # ser obrigatorio em todo PR sem virar pedagio.
      - name: Um controle na tela por vez, e o X so com a gaveta aberta
        run: npm run test:menu-mobile

      # Controle negativo. O teste renderiza o componente e conta icones no
      # HTML -- ou seja, ele passa a sair VERDE se parar de achar o que deveria
      # contar. Uma verificacao que nunca viu vermelho nao e verificacao.
      #
      # Plantamos aqui os dois defeitos que a HMO-161 corrigiu, nas formas
      # exatas em que eles existiam, e exigimos vermelho nos dois.
      #
      # Cada defeito passa por `planta`, que CONFERE que o sed mexeu no arquivo
      # antes de rodar a suite. Sem essa conferencia, um padrao que para de
      # casar -- porque alguem editou a linha por um motivo legitimo -- deixa o
      # arquivo intacto, a suite sai verde como deve e o controle acusa
      # "passou verde com o defeito", apontando o dedo para a suite. Foi o que
      # aconteceu entre a HMO-185 (que trocou `pt-3` pelo calculo do recorte do
      # iPhone) e a HMO-199: 57 runs vermelhos seguidos, na main inclusive, por
      # um defeito que nunca foi plantado. Vermelho mentiroso e pior que check
      # ausente, porque ensina a mergear por cima do vermelho.
      - name: A verificacao do menu sabe falhar
        run: |
          set -uo pipefail
          cp components/MobileMenuChrome.tsx components/MobileMenuChrome.tsx.orig
          trap 'mv components/MobileMenuChrome.tsx.orig components/MobileMenuChrome.tsx' EXIT

          # planta <rotulo> <expressao sed>: restaura o arquivo, aplica o sed,
          # exige que ele tenha mudado algo e exige que a suite fique VERMELHA.
          planta() {
            local rotulo="$1" expressao="$2"
            cp components/MobileMenuChrome.tsx.orig components/MobileMenuChrome.tsx
            sed -i "$expressao" components/MobileMenuChrome.tsx
            if cmp -s components/MobileMenuChrome.tsx components/MobileMenuChrome.tsx.orig; then
              echo "::error::O defeito \"$rotulo\" nao foi plantado: o padrao do sed nao casa mais com components/MobileMenuChrome.tsx. Corrija o padrao neste workflow -- a suite do menu nao esta em causa."
              exit 1
            fi
            if npm run test:menu-mobile > /dev/null 2>&1; then
              echo "::error::A verificacao passou verde com o defeito \"$rotulo\" plantado."
              exit 1
            fi
            echo "  defeito \"$rotulo\": plantado, e a suite ficou vermelha."
          }

          # 1) O X renderizado sempre, sem depender do estado. Era assim antes:
          #    a gaveta ficava montada o tempo todo e o botao junto com ela.
          planta "X tambem com o menu fechado" \
            's|  if (!aberto) return null;|  // defeito plantado|'

          # 2) O X de volta para fora do painel, por margem negativa. Este e o
          #    defeito mudo: com o gate acima intacto, o X so aparece com o menu
          #    aberto -- e ainda assim fica inalcancavel em tela de 320px, onde o
          #    painel ocupa a largura inteira e empurra o botao para fora da area
          #    visivel. Sem X alcancavel e com o veu todo coberto, a gaveta nao
          #    fecha mais.
          #
          #    O padrao ancora no que e estrutural (`absolute top-0 right-0`, a
          #    ancoragem do botao no canto do painel) e troca so o afastamento
          #    `pr-3` por margem negativa. O valor do `pt-` fica de fora de
          #    proposito: ele muda por motivo legitimo -- ja mudou na HMO-185 --
          #    e nao tem nada a ver com o defeito que estamos plantando.
          planta "X fora do painel, por margem negativa" \
            '/absolute top-0 right-0/ s|pr-3"|-mr-12"|'

          echo "A verificacao fica vermelha nos dois defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao do menu sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # A BARRA DA VIAGEM E A MESMA NAS DUAS TELAS
      # origem: orcamento-de-grupo.yml (job `cartao`)
      # =======================================================================
      # Prova, a cada PR, que a barra "quanto ja gastamos da viagem" desenha a MESMA
      # coisa nas duas telas que a mostram: a aba Grupo de Orcamento (HMO-138) e a
      # tela do grupo (HMO-180).
      #
      # O erro que este workflow existe para pegar nao quebra nada. Se alguem refizer
      # a soma dentro do JSX de uma das duas, os numeros batem no dia do commit e
      # divergem no dia em que uma das duas mudar -- e o sintoma e duas telas
      # mostrando percentuais diferentes para a mesma viagem, sem erro no console,
      # sem teste vermelho, e sem que quem olha tenha como saber qual das duas esta
      # certa. Por isso o desenho mora em um arquivo so e este job afirma sobre o HTML
      # que sai dele.
      #
      # SEM FILTRO DE `paths`, e de proposito, pelo mesmo motivo do contas.yml: o que
      # a barra mostra nasce de tres lugares em dois diretorios
      # (lib/orcamento-de-grupo.ts, components/financial/CartaoOrcamentoGrupo.tsx e os
      # primitivos de components/ui), e um filtro que liste os de hoje perde o dia em
      # que alguem mexer no de amanha. Foi exatamente assim que tres suites deste
      # repositorio ficaram paradas em verde: elas so rodavam no db-verify, que e
      # filtrado por path.
      #
      # A suite renderiza HTML em memoria, roda em segundos e nao precisa de banco --
      # pode ser obrigatoria em todo PR sem virar pedagio. A suite da CONTA
      # (test:orcamento-de-grupo) continua no db-verify, junto das outras funcoes
      # puras de dinheiro.
      - name: O cartao do orcamento de grupo, renderizado
        run: npm run test:cartao-orcamento-grupo

      # =======================================================================
      # PARCELA N DE M, COM BASE PARCELA OU TOTAL
      # origem: parcelamento.yml
      # =======================================================================
      # A compra parcelada no cartao (HMO-211), que e a Fase 4 da HMO-208.
      #
      # POR QUE ELA MERECE VERIFICACAO PROPRIA
      # ------------------------------
      # Sao quatro entradas que se combinam -- o valor, se ele e da parcela ou do
      # total, o N e o M de "parcela N de M" -- e TODO jeito errado de combina-las
      # grava dinheiro plausivel. Ler o valor como total em vez de parcela divide a
      # compra por dez. Trocar N por M cria a serie ao contrario. Um off-by-one no laco
      # poe uma parcela a mais numa fatura de um mes que ainda nao chegou. Nenhum
      # desses da erro, e a tela que os produz nao mostra nenhum deles.
      #
      # A suite pura e os mutantes rodam em segundos e nao precisam de banco. A parte
      # que precisa -- a parcela aparecendo na fatura do mes certo, e as parcelas
      # anteriores NAO existindo -- esta no db-verify, no teste da 035.
      #
      # SEM FILTRO DE `paths`, pelo mesmo motivo do cartoes.yml: o comportamento nasce
      # de lib/lancamento.ts, do componente de campos, da rota de parcelas e da tela da
      # fatura, e um filtro que liste os de hoje perde o dia em que alguem mexer no de
      # amanha.
      - name: As regras da serie de parcelas
        run: npm run test:parcelamento

      # OS MUTANTES. A suite acima passando nao diz, sozinha, que ela esta
      # medindo o que a justificativa dela afirma. Cada mutante quebra UMA decisao
      # e tem de reprovar alguma assercao.
      #
      # Medido na HMO-211 ao escrever isto: 16 mutantes, 16 mortos, todos por
      # assercao e nenhum so pelo compilador. O proprio runner falha se nenhum
      # mutante morrer por assercao -- uma suite vazia tiraria placar perfeito.
      - name: Os mutantes da serie
        run: npm run mutantes:parcelamento

      # A ARVORE. A suite pura passa verde com o bloco inteiro fora da tela: ela
      # nao sabe se a checkbox existe, se a pergunta "parcela ou total" aparece,
      # nem se o resumo que avisa sobre as parcelas anteriores esta renderizado.
      - name: O bloco de parcelamento, renderizado
        run: npm run test:campos-lancamento

      # O CAMPO DE PARCELAS QUE DEIXA APAGAR O "1" (HMO-226), E POR QUE ELE TEM
      # RUNNER PROPRIO
      #
      # O conserto mora em `onChange`, `onFocus` e `onBlur`, e
      # `renderToStaticMarkup` nao chama nenhum dos tres -- eles nao saem no
      # HTML. Toda assercao sobre o markup e, por isso, cega para ele: o `|| 1`
      # pode voltar ao `onChange` e o `value=""` do teste de render continua
      # saindo igual, porque o estado exibido e escolhido pelo teste. Sem este
      # runner, o mutante central da issue sobrevive com a assercao "certa" verde
      # ao lado dele.
      #
      # Medido na HMO-226 ao escrever isto, em 88s: 12 mutantes, 12 mortos, 10
      # por assercao. Os outros 2 so compilavam com os campos voltando a ser
      # `number`, e morrer no `tsc` ali e a prova de que a troca de tipo carrega
      # peso. O runner reprova sozinho se NENHUM morrer por assercao.
      - name: Os mutantes do campo de parcelas
        run: npm run mutantes:campo-de-parcelas

      # O ROTULO NA FATURA. E aqui que a parcela aparece para o usuario -- o
      # "caminho de volta" sem o qual esta feature grava e desaparece.
      - name: O rotulo parcela N de M na tela do cartao
        run: npm run test:tela-do-cartao

      # Controle negativo. As assercoes mais importantes desta feature sao de
      # AUSENCIA ("as parcelas 1 e 2 NAO foram criadas", "a compra avulsa NAO
      # ganha rotulo"), e assercao de ausencia passa verde tambem quando ela
      # deixa de achar o que deveria procurar. Os mutantes acima cobrem
      # lib/lancamento.ts; estes dois cobrem o que esta fora dele.
      - name: 'A verificacao sabe falhar (parcelamento)'
        run: |
          set -uo pipefail
          TELA=components/cartoes/FaturaDoCartao.tsx
          CAMPOS=components/movimentacoes/CamposDeLancamento.tsx
          cp $TELA $TELA.orig
          cp $CAMPOS $CAMPOS.orig
          trap 'mv $TELA.orig $TELA; mv $CAMPOS.orig $CAMPOS' EXIT

          # 1) A fatura voltando a imprimir so a data, sem o rotulo da parcela.
          #    E o estado ANTERIOR a esta issue: as parcelas no banco, a fatura
          #    somando certo, e nada na tela dizendo que aquilo e uma parcela.
          sed -i 's#{rotuloDaParcela(#{((#' $TELA
          if npm run test:tela-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a fatura sem o rotulo de parcela."
            exit 1
          fi
          cp $TELA.orig $TELA

          # 2) O resumo fora da tela. Ele e o UNICO lugar que avisa, antes de
          #    salvar, que lancar "parcela 3 de 10" grava 8 linhas e nao 10 --
          #    a decisao (A) da HMO-208. Sem ele a tela anuncia 10x, grava 8, e a
          #    pessoa so descobre procurando nas faturas passadas uma parcela que
          #    nunca existiu.
          sed -i 's#{resumo && (#{false \&\& (#' $CAMPOS
          if npm run test:campos-lancamento > /dev/null 2>&1; then
            echo "::error::Verde com o resumo das parcelas fora da tela."
            exit 1
          fi
          cp $CAMPOS.orig $CAMPOS

          echo "os dois controles negativos reprovaram, como deviam"

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (parcelamento)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # A PAGINA DE PLANOS NAO ANUNCIA RECURSO QUE NAO EXISTE
      # origem: planos.yml
      # =======================================================================
      # Prova, a cada PR, que a interface nao volta a vender um recurso que nao
      # existe (HMO-198).
      #
      # A pagina publica de Planos anunciava sinal de trading em tempo real como
      # recurso incluido no plano de R$ 79,90/mes, sem tabela, rota nem origem de dado
      # por tras. Nao e divida tecnica comum -- e promessa comercial com preco ao
      # lado. O conserto foi o rotulo ("em breve"), nunca o recurso, porque
      # recomendacao de compra e venda e atividade regulada pela CVM.
      #
      # SEM FILTRO DE `paths`, e a razao aqui e mais forte que a do configuracoes.yml.
      # Uma das assercoes varre app/, components/, lib/ e types/ INTEIROS atras da
      # frase antiga -- e a rede que pega o canto que ninguem lembrou de renderizar,
      # porque o texto vivia em dois mapas separados e ninguem garante que nao vai
      # nascer um terceiro. Um filtro de path tornaria essa varredura decorativa: o
      # arquivo novo com a frase antiga nao casaria com padrao nenhum, o job seria
      # pulado, e o PR ficaria verde com a promessa de volta na tela.
      #
      # A suite renderiza com react-dom/server, roda em segundos e nao precisa de
      # Postgres -- cabe como obrigatoria em todo PR sem virar pedagio.
      - name: O recurso de sinais aparece como "em breve", e o texto antigo sumiu
        run: npm run test:planos-em-breve

      # Controle negativo. A suite acima e quase toda de assercao NEGATIVA
      # ("este texto nao esta na tela"), e assercao negativa e o tipo que passa
      # verde quando para de enxergar o alvo -- basta o seletor deixar de casar,
      # ou a pagina deixar de renderizar, para tudo ficar ausente e portanto
      # aprovado. Plantamos a promessa de volta e exigimos vermelho.
      - name: 'A verificacao sabe falhar (planos)'
        run: |
          set -uo pipefail
          cp lib/planos.ts lib/planos.ts.orig
          trap 'mv lib/planos.ts.orig lib/planos.ts' EXIT

          # 1) O rotulo volta a anunciar o recurso como pronto. Este e o defeito
          #    original, literalmente o texto que estava em producao.
          sed -i 's/trading_signals: "Sinais de trading",/trading_signals: "Sinais de trading em tempo real",/' lib/planos.ts
          if diff -q lib/planos.ts lib/planos.ts.orig > /dev/null; then
            echo "::error::O mutante 1 nao alterou lib/planos.ts -- o controle negativo esta medindo a si mesmo."
            exit 1
          fi
          if npm run test:planos-em-breve > /dev/null 2>&1; then
            echo "::error::A suite passou verde com o rotulo antigo de volta na pagina de Planos."
            exit 1
          fi
          cp lib/planos.ts.orig lib/planos.ts

          # 2) O recurso sai da lista de "em breve". O rotulo perde o aviso, o
          #    item volta a levar o sinal de recurso incluido, e o segundo mapa
          #    (PlanGuards) volta a anunciar junto -- tudo sem tocar em JSX.
          sed -i 's/= \["trading_signals"\];/= [];/' lib/planos.ts
          if diff -q lib/planos.ts lib/planos.ts.orig > /dev/null; then
            echo "::error::O mutante 2 nao alterou lib/planos.ts -- o controle negativo esta medindo a si mesmo."
            exit 1
          fi
          if npm run test:planos-em-breve > /dev/null 2>&1; then
            echo "::error::A suite passou verde com o recurso fora da lista de em breve."
            exit 1
          fi

          echo "A verificacao fica vermelha nos dois defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (planos)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # TODO ASSET DECLARADO EXISTE E E O QUE DIZ SER
      # origem: pwa-assets.yml (job `assets`)
      # =======================================================================
      # Prova, a cada mudanca no codigo, que o app continua INSTALAVEL no celular.
      #
      # O modo de falha aqui foi o mais silencioso que este projeto ja teve. Os dez
      # arquivos de `public/icons/*.png` eram documentos SVG com nome `.png`, e o
      # `favicon.ico` tambem. Nada reclamava:
      #
      #   * a Vercel escolhe o `Content-Type` pela EXTENSAO, entao ela servia os
      #     arquivos como `image/png` com HTTP 200 -- o servidor concordava;
      #   * o manifest declarava `"type": "image/png"` -- o manifest concordava;
      #   * `next build`, `tsc` e o lint nao olham dentro de arquivo em `public/`.
      #
      # E o Chrome no Android so oferece instalar quando consegue DECODIFICAR um
      # icone de 192px ou mais do manifest; ele nao aceita SVG nesse papel. Como
      # nenhum dos dez decodificava, o evento `beforeinstallprompt` nunca era
      # emitido e o banner "Instalar Pulo do Gato" -- escrito, correto e commitado --
      # nunca aparecia. O app nao podia ser instalado, e a unica evidencia disso era
      # a ausencia de um banner que ninguem sabia que deveria estar la.
      #
      # Junto com os icones havia catorze caminhos declarados para arquivos que nunca
      # existiram (sete telas de abertura do iOS, `/logo_pulodogato.svg`, os icones
      # dos atalhos, as capturas de tela) e dois atalhos apontando para rotas sem
      # `page.tsx`. Nenhum deles quebra build: um `<link>` morto nao gera erro.
      #
      # SEM FILTRO DE `paths`, de proposito. A regressao nasce de qualquer lado --
      # trocar um icone, renomear uma rota que um atalho cita, acrescentar um
      # `<link>` no layout. A verificacao e Node puro e roda em segundos, entao pode
      # ser obrigatoria em todo PR sem virar pedagio.
      - name: Assets do manifest, do layout e do browserconfig
        run: npm run check-pwa-assets
      - name: O codec PNG le e escreve o que promete
        run: npm run test:png
      - name: O guard reprova cada defeito que ja esteve em producao
        run: npm run test:pwa-assets

      # `additionalManifestEntries` SUBSTITUI a varredura de `public/` no
      # next-pwa 5.6, em vez de somar. Quem mexer em `lib/pwa-precache.js` e
      # devolver so as rotas tira do precache o manifest e os 20 icones -- e o
      # app volta a nao ser instalavel, com build verde e 200 em tudo. E o
      # mesmo modo de falha que motivou este workflow inteiro.
      - name: O precache leva as telas offline SEM perder os icones
        run: npm run test:pwa-precache

      # Controle negativo. Uma verificacao que nunca viu vermelho nao e
      # verificacao -- e esta, em particular, passaria verde se parasse de
      # achar os arquivos que deve conferir.
      - name: 'A verificacao sabe falhar (pwa-assets)'
        run: |
          set -uo pipefail
          trap 'git checkout -- public/icons/icon-192x192.png public/manifest.json next.config.js' EXIT

          # 1) O defeito original: SVG com nome .png, servido como image/png.
          printf '<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"><svg/>' \
            > public/icons/icon-192x192.png
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com um SVG chamado icon-192x192.png."
            exit 1
          fi
          git checkout -- public/icons/icon-192x192.png

          # 2) Atalho apontando para rota que nao existe -- os dois atalhos
          #    originais faziam isso, e so aparece depois do app instalado.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("public/manifest.json", "utf8"));
            m.shortcuts[0].url = "/dashboard/rota-que-nao-existe";
            fs.writeFileSync("public/manifest.json", JSON.stringify(m, null, 2));
          '
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com atalho para rota inexistente."
            exit 1
          fi
          git checkout -- public/manifest.json

          # 3) O desvio para /offline desligado. Este e o defeito que estava em
          #    producao ate aqui: a pagina existia, estava pronta, e NADA
          #    navegava ate ela -- o sw.js de producao tinha zero desvios. Com o
          #    default (`{}`), o next-pwa procura `pages/_offline.*`, nao acha
          #    (este projeto e App Router) e desliga os fallbacks sem imprimir
          #    nada no log do build.
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("next.config.js", "utf8");
            fs.writeFileSync("next.config.js", s.replace(/fallbacks:\s*\{[^}]*\},?/s, ""));
          '
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde sem o desvio para /offline."
            exit 1
          fi
          git checkout -- next.config.js

          # 4) O desvio apontando para rota que nao existe -- o jeito de
          #    reintroduzir o mesmo defeito sem apagar nenhuma linha.
          sed -i 's|document: "/offline"|document: "/rota-que-nao-existe"|' next.config.js
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com o desvio para rota inexistente."
            exit 1
          fi

          echo "A verificacao fica vermelha nas quatro formas de regressao."

      # Prova que os icones commitados sao os que o gerador produz hoje. Sem
      # isto, alguem pode editar um icone a mao e o proximo `npm run
      # generate-pwa-icons` desfaz a edicao sem aviso -- ou, pior, o gerador
      # quebra e ninguem descobre ate precisar dele.
      #
      # `--check` compara os PIXELS decodificados, nao os bytes do arquivo: o
      # tamanho do fluxo deflate muda com a versao do zlib, entao `git diff`
      # daria vermelho sempre que o Node do CI diferisse do de quem gerou --
      # um vermelho sem defeito atras, que ensina todo mundo a ignorar o job.

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (pwa-assets)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: Os icones commitados saem do gerador
        run: node scripts/generate-pwa-icons.mjs --check

      # =======================================================================
      # O CONVITE DE INSTALACAO APARECE NA PLATAFORMA CERTA
      # origem: pwa-assets.yml (job `convite`)
      # =======================================================================
      # Prova, a cada mudanca no codigo, que o app continua INSTALAVEL no celular.
      #
      # O modo de falha aqui foi o mais silencioso que este projeto ja teve. Os dez
      # arquivos de `public/icons/*.png` eram documentos SVG com nome `.png`, e o
      # `favicon.ico` tambem. Nada reclamava:
      #
      #   * a Vercel escolhe o `Content-Type` pela EXTENSAO, entao ela servia os
      #     arquivos como `image/png` com HTTP 200 -- o servidor concordava;
      #   * o manifest declarava `"type": "image/png"` -- o manifest concordava;
      #   * `next build`, `tsc` e o lint nao olham dentro de arquivo em `public/`.
      #
      # E o Chrome no Android so oferece instalar quando consegue DECODIFICAR um
      # icone de 192px ou mais do manifest; ele nao aceita SVG nesse papel. Como
      # nenhum dos dez decodificava, o evento `beforeinstallprompt` nunca era
      # emitido e o banner "Instalar Pulo do Gato" -- escrito, correto e commitado --
      # nunca aparecia. O app nao podia ser instalado, e a unica evidencia disso era
      # a ausencia de um banner que ninguem sabia que deveria estar la.
      #
      # Junto com os icones havia catorze caminhos declarados para arquivos que nunca
      # existiram (sete telas de abertura do iOS, `/logo_pulodogato.svg`, os icones
      # dos atalhos, as capturas de tela) e dois atalhos apontando para rotas sem
      # `page.tsx`. Nenhum deles quebra build: um `<link>` morto nao gera erro.
      #
      # SEM FILTRO DE `paths`, de proposito. A regressao nasce de qualquer lado --
      # trocar um icone, renomear uma rota que um atalho cita, acrescentar um
      # `<link>` no layout. A verificacao e Node puro e roda em segundos, entao pode
      # ser obrigatoria em todo PR sem virar pedagio.
      - name: iOS recebe instrucao, Android recebe o prompt, instalado nao recebe nada
        run: npm run test:pwa-install

      # =======================================================================
      # SEM REDE, A TELA NAO AFIRMA O QUE NAO SABE
      # origem: pwa-assets.yml (job `leitura-honesta`)
      # =======================================================================
      # Prova, a cada mudanca no codigo, que o app continua INSTALAVEL no celular.
      #
      # O modo de falha aqui foi o mais silencioso que este projeto ja teve. Os dez
      # arquivos de `public/icons/*.png` eram documentos SVG com nome `.png`, e o
      # `favicon.ico` tambem. Nada reclamava:
      #
      #   * a Vercel escolhe o `Content-Type` pela EXTENSAO, entao ela servia os
      #     arquivos como `image/png` com HTTP 200 -- o servidor concordava;
      #   * o manifest declarava `"type": "image/png"` -- o manifest concordava;
      #   * `next build`, `tsc` e o lint nao olham dentro de arquivo em `public/`.
      #
      # E o Chrome no Android so oferece instalar quando consegue DECODIFICAR um
      # icone de 192px ou mais do manifest; ele nao aceita SVG nesse papel. Como
      # nenhum dos dez decodificava, o evento `beforeinstallprompt` nunca era
      # emitido e o banner "Instalar Pulo do Gato" -- escrito, correto e commitado --
      # nunca aparecia. O app nao podia ser instalado, e a unica evidencia disso era
      # a ausencia de um banner que ninguem sabia que deveria estar la.
      #
      # Junto com os icones havia catorze caminhos declarados para arquivos que nunca
      # existiram (sete telas de abertura do iOS, `/logo_pulodogato.svg`, os icones
      # dos atalhos, as capturas de tela) e dois atalhos apontando para rotas sem
      # `page.tsx`. Nenhum deles quebra build: um `<link>` morto nao gera erro.
      #
      # SEM FILTRO DE `paths`, de proposito. A regressao nasce de qualquer lado --
      # trocar um icone, renomear uma rota que um atalho cita, acrescentar um
      # `<link>` no layout. A verificacao e Node puro e roda em segundos, entao pode
      # ser obrigatoria em todo PR sem virar pedagio.
      - name: O service worker carimba a resposta que veio do aparelho
        run: npm run test:pwa-runtime-cache
      - name: Nenhum total, nenhuma frase de vazio sem dado que os sustente
        run: npm run test:offline-leitura

      # =======================================================================
      # PARA ONDE VOLTA, E O QUE FICA NA TELA
      # origem: retorno-do-lancamento.yml
      # =======================================================================
      # Prova, a cada PR, as duas metades da HMO-249: para onde o modal de lancamento
      # volta depois de salvar, e o que o "Salvar e continuar" deixa na tela.
      #
      # AS TRES COISAS QUE ESTA SUITE IMPEDE, E NENHUMA LEVANTA EXCECAO
      # ---------------------------------------------------------------
      #   1. REDIRECIONAMENTO ABERTO. O `?origem=` vem da URL. Empurrar para ele sem
      #      peneirar faz o proprio app levar a pessoa para um host de fora logo DEPOIS
      #      de ela confirmar um lancamento -- o instante em que ela mais confia na
      #      tela. `//golpe.example` e o caso traicoeiro: ele comeca com `/`, entao a
      #      guarda obvia (`startsWith("/")`) aprova e o navegador sai do dominio.
      #
      #   2. O MESMO GASTO GRAVADO DUAS VEZES. Com "Salvar e continuar" ligado, a tela
      #      nao fecha. Se `valor` e `descricao` ficarem preenchidos, UM segundo clique
      #      em Salvar grava o lancamento de novo -- dois registros identicos, nada na
      #      tela dizendo que foram dois, e o saldo da conta errado pelo valor inteiro.
      #      Na transferencia custa o dobro, porque sao duas pernas (migration 015).
      #
      #   3. A VOLTA PARA A TELA ERRADA. A origem carrega a query (`?de=&ate=`), que e
      #      o periodo escolhido. Perde-la devolve a pessoa ao mes corrente depois de
      #      ela lancar uma despesa de janeiro: a despesa esta gravada e fora da tela,
      #      que se le exatamente como "nao salvou".
      #
      # SEM FILTRO DE `paths`, como os workflows `lancamento` e `telas-de-movimentacao`.
      # A suite roda em milissegundos e nao precisa de banco, entao pode ser
      # obrigatoria em todo PR sem virar pedagio -- e um filtro que liste os arquivos
      # de hoje perde o dia em que alguem mexer no de amanha. Foi assim que tres suites
      # deste repositorio ficaram paradas em verde (ver scripts/check-tests-in-ci.mjs).
      - name: A peneira da origem e o reset do formulario
        run: npm run test:retorno-lancamento

      # Controle negativo. A suite afirma sobre STRINGS DE ROTA e sobre CAMPOS
      # DE FORMULARIO -- as duas coisas que passam verdes por acaso com mais
      # facilidade: "o destino e /dashboard/personal-finance" continua
      # verdadeiro numa funcao que devolve aquela constante SEMPRE, isto e, numa
      # funcao que desfaz a issue inteira.
      #
      # A prova de mutacao completa e `npm run mutantes:retorno-lancamento`
      # (21 mutantes, ferramenta de quem escreve o teste). Aqui ficam os quatro
      # que mais custam, plantados um por vez.
      - name: 'A verificacao sabe falhar (retorno-do-lancamento)'
        run: |
          set -euo pipefail
          LIB=lib/retorno-do-lancamento.ts
          cp $LIB $LIB.orig
          trap 'mv $LIB.orig $LIB' EXIT

          # O mutador e `node`, e nao `sed`, por duas razoes que ja mordereram
          # este repositorio:
          #
          #   - `sed` nao casa trecho de VARIAS LINHAS, e dois dos quatro
          #     mutantes abaixo precisam de duas linhas para serem
          #     inequivocos (`valor:` sozinho aparece em mais de um lugar);
          #   - `String.replace` troca a PRIMEIRA ocorrencia. Um trecho que
          #     aparece duas vezes muta o lugar errado e o mutante morre verde
          #     com o rotulo mentindo sobre o que foi medido. Aqui a troca
          #     ABORTA quando o trecho nao e unico -- que e a unica forma de o
          #     controle negativo saber que ainda esta medindo algo.
          cat > /tmp/mutar.mjs <<'FIM'
          import { readFileSync, writeFileSync } from "node:fs";
          const [arquivo, de, para] = process.argv.slice(2);
          const s = readFileSync(arquivo, "utf8");
          const n = s.split(de).length - 1;
          if (n !== 1) {
            console.error(
              `::error::O trecho a mutar aparece ${n}x em ${arquivo} -- o controle negativo nao esta medindo nada.`
            );
            process.exit(1);
          }
          writeFileSync(arquivo, s.replace(de, para));
          FIM

          reprova() {
            if npm run test:retorno-lancamento > /dev/null 2>&1; then
              echo "::error::$1"
              exit 1
            fi
            cp $LIB.orig $LIB
          }

          # 1) REDIRECIONAMENTO ABERTO. Sem a exigencia de caminho interno,
          #    `?origem=https://golpe.example` e empurrado como esta.
          node /tmp/mutar.mjs $LIB \
            '  if (!crua.startsWith("/")) return null;' \
            '  if (!crua.startsWith("/")) return crua;'
          reprova "Verde com um HOST DE FORA aceito como tela de origem."

          # 2) PROTOCOLO-RELATIVO. `//golpe.example/dashboard` comeca com `/` e
          #    passa pela guarda ingenua; o navegador vai para o host de fora.
          #    Quem o fecha e a LISTA DE PERMISSAO -- e e ela que este mutante
          #    derruba, trocando-a por "basta comecar com barra". Uma guarda
          #    separada contra `//` existiu aqui e foi removida justamente por
          #    nenhum mutante conseguir mata-la: ela era inalcancavel.
          node /tmp/mutar.mjs $LIB \
            '  if (caminho !== "/dashboard" && !caminho.startsWith("/dashboard/")) {' \
            '  if (!caminho.startsWith("/")) {'
          reprova "Verde com //golpe.example aceito como tela de origem."

          # 3) O MESMO GASTO DUAS VEZES -- o mutante de dinheiro. O `valor` fica
          #    na tela depois de salvar, e o segundo clique em Salvar grava o
          #    lancamento de novo.
          #
          #    TRES linhas no trecho, e nao uma: `proximaTransferencia` tem as
          #    mesmas duas linhas de cima (`valor:` + `notas:`), e o mutador
          #    ABORTA trecho ambiguo. A linha de `parcelado` e o que o torna
          #    unico -- ela so existe em `proximoLancamento`.
          node /tmp/mutar.mjs $LIB \
            $'    valor: inicial.valor,\n    notas: inicial.notas,\n    parcelado: inicial.parcelado,' \
            $'    notas: inicial.notas,\n    parcelado: inicial.parcelado,'
          reprova "Verde com o VALOR sobrevivendo ao Salvar e continuar -- o segundo clique grava o mesmo gasto de novo."

          # 4) O INTERRUPTOR QUE NAO FAZ NADA. `continuar` ignorado: o modal
          #    fecha de qualquer jeito, e a metade da issue que foi pedida por
          #    escrito desaparece sem erro nenhum.
          node /tmp/mutar.mjs $LIB \
            '  if (opcoes.continuar) return null;' \
            '  if (false) return null;'
          reprova "Verde com o 'Salvar e continuar' sendo ignorado."

          echo "A verificacao fica vermelha nas quatro armadilhas."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (retorno-do-lancamento)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # TOTAL, PREVISTO E REALIZADO DE CADA TIPO
      # origem: telas-de-movimentacao.yml
      # =======================================================================
      # Prova, a cada PR, a aritmetica das tres telas que a HMO-246 pediu -- uma so de
      # receitas, uma so de despesas, uma so de transferencias, cada uma com Total,
      # Previsto e Realizado do periodo escolhido.
      #
      # As cinco armadilhas estao no cabecalho de lib/telas-de-movimentacao.ts, e as
      # cinco produzem um numero PLAUSIVEL:
      #
      #   1. previsto (+) e realizado (-) tem sinal OPOSTO e se cancelam: a tela de
      #      Despesas fecha o mes em R$ 0,00 com as duas despesas na lista ao lado;
      #   2. a conta prevista com baixa ja virou transacao e esta no lado realizado --
      #      somar as duas da R$ 319,80 de uma conta de R$ 159,90;
      #   3. a transferencia e gravada em DUAS pernas com a mesma data: contar as duas
      #      faz um Pix de R$ 1.000 virar R$ 2.000, e a lista mostra as duas linhas;
      #   4. a perna de saida de uma transferencia e negativa e tem categoria de
      #      despesa -- quem filtrar por SINAL poe todo Pix entre contas proprias no
      #      total de despesas do mes;
      #   5. a compra no cartao esta DENTRO da fatura, e o lado previsto soma a fatura
      #      inteira: contar a compra tambem no realizado faz uma compra de R$ 400
      #      fechar o mes em R$ 800, com as duas linhas visiveis na lista (HMO-260).
      #
      # Nenhuma delas levanta excecao, nenhuma aparece no tsc, e quatro delas deixam a
      # lista visivelmente coerente com o total errado.
      #
      # SEM FILTRO DE `paths`, como os workflows `lancamento` e
      # `lancamentos-completos`. As duas suites rodam em milissegundos e nao precisam
      # de banco, entao podem ser obrigatorias em todo PR sem virar pedagio -- e um
      # filtro que liste os arquivos de hoje perde o dia em que alguem mexer no de
      # amanha. Foi exatamente assim que tres suites deste repositorio ficaram paradas
      # em verde (ver scripts/check-tests-in-ci.mjs).
      - name: A aritmetica das tres telas
        run: npm run test:telas-de-movimentacao

      # A aritmetica acima pode estar exata e a tela imprimir o previsto no
      # cartao "Realizado": os dois numeros sao plausiveis, nada fica vazio e
      # nenhuma das 34 assercoes puras olha a marcacao. Este passo renderiza os
      # tres cartoes com react-dom/server e le o HTML -- incluindo os estados em
      # que o numero NAO pode aparecer, que e propriedade da marcacao e nao da
      # funcao.
      - name: Qual numero sai em qual cartao
        run: npm run test:cartoes-da-tela

      # O calculo e a marcacao podem estar os dois certos e a tela mostrar
      # R$ 0,00: `await res.json()` e `any`, entao um campo renomeado entre a
      # rota e o componente nao e checado pelo tsc. Chega `undefined`, o `??`
      # vira zero.
      - name: Os nomes dos campos entre a rota e a tela
        run: npm run test:contrato-das-telas-de-movimentacao

      # Controle negativo. A suite afirma sobre SINAL, sobre CONTAGEM e sobre
      # TIPO -- tres coisas que erram dinheiro na tela sem levantar excecao
      # nenhuma. Uma verificacao que nunca viu vermelho nao e verificacao.
      #
      # A prova de mutacao completa e `npm run mutantes:telas-de-movimentacao`
      # (32 mutantes, ferramenta de quem escreve o teste). Aqui ficam os cinco
      # que mais custam, um por armadilha, plantados um por vez.
      - name: 'A verificacao sabe falhar (telas-de-movimentacao)'
        run: |
          set -uo pipefail
          LIB=lib/telas-de-movimentacao.ts
          cp $LIB $LIB.orig
          trap 'mv $LIB.orig $LIB' EXIT

          # 1) OS DOIS LADOS SE CANCELANDO. `financial_transactions.amount` de
          #    despesa e negativo e `scheduled_transactions.amount` tem
          #    CHECK (> 0): sem o `Math.abs`, R$ 159,90 previstos anulam
          #    R$ 159,90 realizados e o mes fecha em ZERO -- com as duas
          #    despesas visiveis na lista logo abaixo do total.
          sed -i 's|const quantia = Number.isFinite(bruto) ? Math.abs(bruto) : 0;|const quantia = Number.isFinite(bruto) ? bruto : 0;|' $LIB
          if npm run test:telas-de-movimentacao > /dev/null 2>&1; then
            echo "::error::Verde com o previsto CANCELANDO o realizado no total."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 2) A MESMA CONTA DUAS VEZES. A conta prevista com baixa ja virou
          #    linha de financial_transactions, ou seja ja esta no lado
          #    realizado desta mesma tela.
          sed -i 's|if (STATUS_QUE_SAI_DO_PREVISTO.has(String(crua.status))) return null;|if (false) return null;|' $LIB
          if npm run test:telas-de-movimentacao > /dev/null 2>&1; then
            echo "::error::Verde com a conta prevista JA PAGA contada duas vezes."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 3) AS DUAS PERNAS DA TRANSFERENCIA. Elas tem a mesma
          #    transaction_date (015), entao caem sempre no mesmo periodo.
          sed -i 's|if (tipo === "transfer" \&\& ehPernaDeEntrada(crua)) continue;|if (false) continue;|' $LIB
          if npm run test:telas-de-movimentacao > /dev/null 2>&1; then
            echo "::error::Verde com as DUAS pernas do Pix somando: R\$ 1.000 virando R\$ 2.000."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 4) O TIPO SAINDO DO SINAL. A perna de saida de uma transferencia e
          #    negativa e tem categoria de despesa: pelo sinal ela e um gasto.
          sed -i 's|if (classificarMovimentacao(crua) !== tipo) continue;|if ((Number(crua.amount) < 0 ? "expense" : "income") !== tipo) continue;|' $LIB
          if npm run test:telas-de-movimentacao > /dev/null 2>&1; then
            echo "::error::Verde com a transferencia entrando no total de DESPESAS pelo sinal."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 5) O CARTAO CONTADO DUAS VEZES (HMO-260). A compra no cartao esta
          #    DENTRO da fatura, e o lado previsto desta tela soma a fatura
          #    inteira. `Total` e `previsto + realizado`, entao a compra solta
          #    no realizado faz uma compra de R$ 400 fechar o mes em R$ 800 --
          #    com as DUAS linhas visiveis na lista, o que faz a soma "fechar"
          #    com a tela.
          sed -i 's|if (tipo === "expense" \&\& ehGastoNoCartao(crua)) continue;|if (false) continue;|' $LIB
          if npm run test:telas-de-movimentacao > /dev/null 2>&1; then
            echo "::error::Verde com a compra no cartao somando junto da FATURA que ja a contem: R\$ 800 de uma compra de R\$ 400."
            exit 1
          fi

          echo "A verificacao fica vermelha nas cinco armadilhas."

      # O MESMO CONTROLE PARA A MARCACAO. Os dois defeitos que a aritmetica
      # aprova: o numero certo no cartao errado, e o zero confiante.

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (telas-de-movimentacao)"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
      - name: A verificacao da marcacao sabe falhar
        run: |
          set -uo pipefail
          CARTOES=components/movimentacoes/CartoesDaTela.tsx
          cp $CARTOES $CARTOES.orig
          trap 'mv $CARTOES.orig $CARTOES' EXIT

          # 6) O PREVISTO IMPRESSO NO CARTAO "REALIZADO". As 34 assercoes puras
          #    e os 32 mutantes passam verdes nisto: a conta esta certa e a tela
          #    e que esta mostrando o numero do vizinho.
          sed -i 's|<CardTitle className="text-2xl">{numero(resumo?.realizado)}</CardTitle>|<CardTitle className="text-2xl">{numero(resumo?.previsto)}</CardTitle>|' $CARTOES
          if npm run test:cartoes-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com o PREVISTO impresso no cartao Realizado."
            exit 1
          fi
          cp $CARTOES.orig $CARTOES

          # 7) O ZERO CONFIANTE. Sem `podeMostrarNumero`, a tela imprime
          #    "R$ 0,00" antes de a leitura responder -- e num mes com despesa
          #    isso nao parece erro, parece um mes barato.
          sed -i 's|podeMostrarNumero(estado) \&\& resumo ? (|true ? (|' $CARTOES
          if npm run test:cartoes-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com R\$ 0,00 impresso SEM leitura nenhuma."
            exit 1
          fi

          echo "A verificacao da marcacao fica vermelha nos dois defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao da marcacao sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # O ICONE, O ROTULO E O CLIQUE DA LINHA (HMO-287)
      # =======================================================================
      # "Nas despesas, deveria ter um icone ou algo do genero mostrando a
      # categoria da despesa."
      #
      # A HMO-285 fez `natureza` e `fatura` existirem, com 50 blocos de unidade
      # e 40 mutantes. Toda aquela suite passa verde com a MARCACAO ignorando os
      # dois campos: a linha de fatura desenhada igual a uma despesa comum nao
      # quebra build, nao fica vazia e nao muda numero nenhum.
      - name: O icone, o rotulo e o href da linha
        run: npm run test:secao-da-tela

      # Controle negativo. Os cinco defeitos abaixo tem o mesmo formato: a tela
      # continua inteira, o valor ao lado continua certo, e nada fica vermelho.
      - name: A verificacao da linha sabe falhar
        run: |
          set -uo pipefail
          SECAO=components/movimentacoes/SecaoDaTela.tsx
          FATURA=lib/fatura-do-cartao.ts
          cp $SECAO $SECAO.orig
          cp $FATURA $FATURA.orig
          trap 'mv $SECAO.orig $SECAO; mv $FATURA.orig $FATURA' EXIT

          # `cmp` depois de cada `sed`: uma ancora que a feature renomeou faz o
          # `sed` sair 0 sem trocar nada, e o bloco inteiro passaria por verde
          # tendo medido ZERO mutantes.
          mutou() {
            if cmp -s "$1" "$1.orig"; then
              echo "::error::A ancora do mutante $2 nao casou -- nada foi mutado."
              exit 1
            fi
          }

          # 1) O ROTULO TROCADO. "fixo" numa fatura e "fatura de cartão" numa
          #    conta fixa sao os dois plausiveis: as duas linhas existem, as
          #    duas tem vencimento, e o valor ao lado esta certo nas duas.
          sed -i 's|rotulo: "fatura de cartão",|rotulo: "fixo",|' $SECAO
          mutou $SECAO 1
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com a FATURA rotulada como conta fixa."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 2) SO O ICONE, SEM O ROTULO. E a feature pela metade: tres icones
          #    cinzentos de 12px numa linha de celular sao indistinguiveis, e
          #    quem olha ve que HA um icone, nao QUAL.
          sed -i 's|{rotulo \&\& <span>{rotulo}</span>}|{false \&\& <span>{rotulo}</span>}|' $SECAO
          mutou $SECAO 2
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com o rotulo de texto apagado da linha."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 3) TODA LINHA VIRA LINK. Linha que PARECE clicavel e nao e custa
          #    mais que linha que nao parece: a pessoa toca, nada acontece, e a
          #    conclusao natural e que o app travou.
          sed -i 's|  if (linha.fatura) {|  if (true) {|' $SECAO
          mutou $SECAO 3
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com TODA linha virando <a>."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 4) O ICONE DA FATURA VIRA O DA TELA. Todas as assercoes de TEXTO
          #    desta suite continuam verdes: o rotulo escrito nao muda.
          sed -i 's|      Icone: CreditCard,|      Icone: aparencia.Icone,|' $SECAO
          mutou $SECAO 4
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com as tres naturezas desenhando o MESMO icone."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 5) O MES DO `href` SAI EM 10 CHARS. O destino EXISTE e abre no mes
          #    corrente: o valor certo, o mes errado, e nada dizendo que o mes
          #    trocou. E o unico defeito desta issue que nenhum texto denuncia.
          sed -i 's|  return mes.slice(0, 7);|  return mes;|' $FATURA
          mutou $FATURA 5
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com o href levando AAAA-MM-01 em vez de AAAA-MM."
            exit 1
          fi
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o mes inicial da tela do cartao sem normalizar."
            exit 1
          fi
          cp $FATURA.orig $FATURA

          # 6) A TELA DO CARTAO IGNORA O `?mes=`. A ponta que recebe desligada
          #    da a tela de destino perfeitamente correta -- no mes errado.
          sed -i 's|return mesDeSeteChars(mesDaUrl) ?? mesCorrenteDaFatura(agora);|return mesCorrenteDaFatura(agora);|' $FATURA
          mutou $FATURA 6
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a tela do cartao ignorando o ?mes= da URL."
            exit 1
          fi

          echo "A verificacao da linha fica vermelha nos seis defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao da linha sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # EDITAR, EXCLUIR E CONFIRMAR EM TODO LANCAMENTO (HMO-301)
      # =======================================================================
      # "E em ambos os modos verificar pois todos lancamentos devem ter botoes
      # de editar, excluir ou confirmar pra validar que foi pago ou recebido."
      #
      # Tres passos, e os tres medem coisas que os outros dois nao alcancam:
      #
      #   test:acoes-da-linha  -- a REGRA (quais botoes, para onde cada um vai,
      #                           e o texto de cada pergunta). Os cinco modos de
      #                           falha dela produzem o MESMO resultado na tela
      #                           (um botao que aparece) e se separam so depois
      #                           do clique: 404 da chave sintetica da fatura
      #                           aberta, 409 da fatura sem conta pagadora, a
      #                           segunda perna do mesmo dinheiro, a perna de
      #                           transferencia orfa, e o caro -- a linha de
      #                           outro membro do grupo, onde o UPDATE recusado
      #                           pela RLS volta 200 SEM ALTERAR NADA;
      #   test:secao-da-tela   -- a MARCACAO, que o passo acima ja roda;
      #   test:lista-na-tela   -- o GESTO, em navegador. Ver abaixo.
      - name: Quais acoes cada estado de linha ganha
        run: npm run test:acoes-da-linha

      # Controle negativo. Cada mutante abaixo e uma das cinco regras removida,
      # e as cinco falham do mesmo jeito: a tela continua inteira.
      - name: A verificacao das acoes sabe falhar
        run: |
          set -uo pipefail
          ACOES=lib/acoes-da-linha.ts
          cp $ACOES $ACOES.orig
          trap 'mv $ACOES.orig $ACOES' EXIT

          mutou() {
            if diff -q "$1.orig" "$1" > /dev/null; then
              echo "::error::O mutante $2 nao alterou $1 -- a ancora do sed mudou."
              exit 1
            fi
          }

          # 1) CONFIRMAR TAMBEM NO REALIZADO. Confirmar o que ja aconteceu grava
          #    a segunda perna do mesmo dinheiro -- que e como este app ja
          #    contou despesa duas vezes.
          sed -i 's|return podeAgirNaLinha(linha) \&\& linha.origem === "previsto";|return podeAgirNaLinha(linha);|' $ACOES
          mutou $ACOES 1
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com Confirmar aparecendo em linha realizada."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com Confirmar em linha realizada."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 2) A LINHA DE OUTRO MEMBRO GANHA BOTAO. O modo de falha caro: a RLS
          #    recusa, e o UPDATE recusado volta 200 sem alterar nada.
          sed -i '/if (!linha.posso_editar) return false;/d' $ACOES
          mutou $ACOES 2
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com botao sobre linha que a RLS recusaria."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com botao sobre linha alheia."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 3) A LINHA NAO GRAVADA GANHA BOTAO. A fatura aberta sintetizada nao
          #    tem id de banco: a baixa com a chave sintetica responde 404, que
          #    para quem clicou se le como "o app nao conseguiu".
          sed -i '/if (!linha.gravada) return false;/d' $ACOES
          mutou $ACOES 3
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com botao sobre linha que nao existe no banco."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 4) A FATURA GANHA BOTAO. A baixa dela exige a conta pagadora, entao
          #    o botao erraria em TODO clique -- e ela e um <a>, onde botao e
          #    aninhamento interativo invalido.
          sed -i '/if (linha.natureza === "fatura") return false;/d' $ACOES
          mutou $ACOES 4
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com acao sobre a linha de fatura."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 5) UM ROTULO SO PARA AS TRES TELAS. "Confirmar pagamento" embaixo de
          #    um salario previsto e um verbo errado sobre um numero certo.
          sed -i '/if (tipo === "income") return "Confirmar recebimento";/d' $ACOES
          mutou $ACOES 5
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com o mesmo verbo de baixa nas tres telas."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com um rotulo so de baixa."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 6) A EDICAO VAI PARA A ROTA DA TELA, E NAO PARA A DO FORMULARIO.
          #    As duas existem e so uma le `?id=`: com a da lista, o Editar
          #    recarrega a propria tela e o clique nao faz NADA VISIVEL. Este
          #    defeito estava no codigo intacto desta issue, e quem o pegou foi
          #    a sonda de navegador -- nenhuma assercao de unidade o alcanca,
          #    porque ela passa a string que ela mesma escolheu.
          LISTA=components/movimentacoes/ListaDeMovimentacao.tsx
          cp $LISTA $LISTA.orig
          sed -i 's|caminhoDeEdicao(linha, aparencia.rotaDeLancar, origem)|caminhoDeEdicao(linha, tela.rota, origem)|' $LISTA
          mutou $LISTA 6
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o Editar apontando para a propria lista."
            exit 1
          fi
          mv $LISTA.orig $LISTA

          echo "A verificacao das acoes fica vermelha nos seis defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao das acoes sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # O GESTO, em navegador de verdade. As duas suites acima passam verde com o
      # `onClick` VAZIO -- `onClick` nao sai no HTML e nunca e chamado por um
      # render de servidor, e a tela sai identica.
      #
      # E o que se mede aqui NAO e "a rota foi chamada": e que A LINHA SAIU de
      # "Previsto no periodo" e APARECEU em "Realizado no periodo". Essa e a
      # unica assercao que distingue "chamou a rota" de "o app refletiu o
      # resultado" -- um aoConfirmar que chamasse a baixa e esquecesse a
      # releitura responde 200, move o dinheiro no banco, e deixa a linha onde
      # estava ate alguem trocar de mes e voltar. A pessoa clica de novo, e a
      # segunda baixa volta 409 em cima de uma operacao que deu certo.
      #
      # A sonda tambem substitui `window.confirm` e LE a frase que o app passou:
      # e assim que "o dialogo diz qual das duas coisas vai acontecer" (tirar a
      # ocorrencia de um gasto fixo da agenda NAO e encerrar a serie) deixa de
      # ser uma promessa de comentario. As duas respondem 200 e as duas tiram a
      # linha da tela.
      #
      # Sem navegador a suite FALHA, e nao pula: suite que se desliga sozinha e
      # indistinguivel de suite que passou.
      - name: Confirmar move a linha de Previsto para Realizado
        run: npm run test:lista-na-tela

      # Controle negativo da sonda de navegador. Os dois defeitos abaixo sao os
      # que SO ela ve.
      - name: A sonda do gesto sabe falhar
        run: |
          set -uo pipefail
          LISTA=components/movimentacoes/ListaDeMovimentacao.tsx
          cp $LISTA $LISTA.orig
          trap 'mv $LISTA.orig $LISTA' EXIT

          mutou() {
            if diff -q "$1.orig" "$1" > /dev/null; then
              echo "::error::O mutante $2 nao alterou $1 -- a ancora do sed mudou."
              exit 1
            fi
          }

          # 1) A ACAO CHAMA A ROTA E NAO RELE. O caso que a issue chama de "a
          #    assercao que importa": a rota responde 200, o dinheiro anda, e a
          #    linha fica em Previsto.
          sed -i '/await carregar();/d' $LISTA
          mutou $LISTA 1
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a acao chamando a rota e nao relendo a lista."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 2) A PERGUNTA APARECE E O "NAO" E IGNORADO. O unico sintoma seria a
          #    linha sumindo depois de alguem clicar em Cancelar.
          sed -i 's|if (!confirm(aviso)) return;|confirm(aviso);|' $LISTA
          mutou $LISTA 2
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a exclusao acontecendo apesar do Cancelar."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          echo "A sonda do gesto fica vermelha nos dois defeitos."

      - name: 'A arvore voltou ao lugar depois de "A sonda do gesto sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .tsx.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # O CARTAO CONTA PELA FATURA PAGA, NAO PELA COMPRA
      # origem: HMO-265 (nasceu aqui -- ver o item 1 do cabecalho deste arquivo)
      # =======================================================================
      # "Despesa do cartao so e realizada quando fatura do cartao e paga, usar o
      # valor total do cartao como parametro pra saber se ja foi realizada ou
      # nao."
      #
      # A tela de Despesas ja seguia essa regra (HMO-260). O painel nao: o
      # Realizado dele soma `financial_transactions`, e ali a compra no cartao
      # era uma despesa como qualquer outra, contada no dia da COMPRA.
      #
      # AS DUAS METADES SAO UMA SO MUDANCA, e e por isso que um passo so nao
      # bastaria: tirar a compra sem por a fatura faz o mes em que a fatura foi
      # paga sair R$ 1.290 MAIS BARATO (um total menor nao parece erro, parece um
      # mes barato -- HMO-264), e por a fatura sem tirar a compra faz o cartao
      # contar DUAS vezes (a HMO-149 de volta). Os dois numeros errados sao
      # plausiveis e nenhum levanta excecao.
      #
      # SEM FILTRO DE `paths`, como todo bloco deste arquivo: a suite roda em
      # milissegundos, nao precisa de banco, e um filtro escrito hoje perde o dia
      # em que alguem mexer no arquivo de amanha.
      - name: O cartao no Realizado do painel
        run: npm run test:realizado-do-caixa

      # Controle negativo. A suite afirma sobre TOTAL -- nao sobre a lista --
      # porque todos os erros desta regra produzem a lista "certa" e o numero
      # errado. Uma verificacao que nunca viu vermelho nao e verificacao.
      #
      # A prova de mutacao completa e `npm run mutantes:realizado-do-caixa`
      # (12 mutantes, ferramenta de quem escreve o teste). Aqui ficam os quatro
      # que mais custam, plantados um por vez.
      #
      # O `cmp` DEPOIS DE CADA `sed` NAO E ZELO. Um `sed -i` cujo padrao nao casa
      # SAI 0 e nao muda nada: o `npm run` seguinte roda a fonte INTACTA, passa,
      # e o `if` o declara... morto. O mutante seria dado por morto medindo nada,
      # e o passo ficaria verde para sempre -- foi assim que um mutante deste
      # repositorio parou de aplicar quando uma issue renomeou a ancora dele.
      - name: 'A verificacao sabe falhar (realizado-do-caixa)'
        run: |
          set -uo pipefail
          LIB=lib/realizado-do-caixa.ts
          cp $LIB $LIB.orig
          trap 'mv $LIB.orig $LIB' EXIT

          mutou() {
            if cmp -s $LIB $LIB.orig; then
              echo "::error::o sed de '$1' nao casou nada -- o mutante nao foi aplicado e o passo mediria a fonte intacta"
              exit 1
            fi
          }

          # 1) O DEFEITO DESTA ISSUE, INTACTO. A compra no cartao conta no dia
          #    da compra E a fatura conta de novo no dia do pagamento.
          sed -i 's|if (ehCompraNoCartao(linha)) continue;|if (false) continue;|' $LIB
          mutou "compra no cartao fica"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com a compra no cartao contada no dia da COMPRA, junto da fatura que ja a contem."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 2) O CARTAO DESAPARECIDO (HMO-264). A fatura paga nao entra em lugar
          #    nenhum: o mes em que se pagou R$ 1.290 fica R$ 1.290 mais barato.
          sed -i 's|if (ehSaidaDePagamentoDeFatura(linha)) {|if (false) {|' $LIB
          mutou "fatura paga nao entra"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com a fatura PAGA fora do Realizado: o cartao sumiu dos dois lados."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 3) A FATURA EM DOBRO. As duas pernas do pagamento tem a mesma data,
          #    a mesma chave e o mesmo tipo, e `agregarTransacoes` aplica
          #    Math.abs antes de somar -- entao elas NAO se anulam.
          sed -i 's|  return Number(linha.amount) < 0;|  return true;|' $LIB
          mutou "as duas pernas entram"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com as DUAS pernas do pagamento somando: a fatura em dobro no total de despesas."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 4) A COLUNA QUE NINGUEM VE. `account_type` nao aparece na tela, e
          #    tirar do `select` nao quebra tsc nem assercao de unidade: a regra
          #    recebe `undefined`, deixa de casar com credit_card, para de
          #    filtrar, e o painel volta ao defeito. Foi este o modo de falha da
          #    HMO-260.
          sed -i 's|, account:financial_accounts(account_type)";|";|' $LIB
          mutou "select sem o embed da conta"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com a consulta SEM account_type: a regra nao tem como saber que a linha esta na fatura."
            exit 1
          fi

          echo "A verificacao fica vermelha nas quatro armadilhas."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (realizado-do-caixa)"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois de o .ts voltar, e
          # os passos seguintes rodariam contra ele.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # A REGRA PODE ESTAR PERFEITA E NAO ESTAR LIGADA.
      #
      # As 15 assercoes e os 12 mutantes acima provam `lib/realizado-do-caixa.ts`
      # e nao olham quem o chama. O defeito que sobra e de fiacao, e e mudo: o
      # painel para de mandar `&cartao=fatura`, ou a rota para de aplicar a regra,
      # e /api/reports/cash-flow responde 200 com o total de ANTES desta issue --
      # sem erro, sem campo faltando, sem log, e com a suite inteira verde.
      #
      # O guard varre o fonte SEM comentario e SEM a lista de imports. As duas
      # remocoes foram medidas: sem a primeira ele le a prosa que descreve o
      # defeito, e sem a segunda tres das mutacoes do controle negativo abaixo
      # SOBREVIVIAM -- matar a chamada deixa o `import` intacto e o nome continua
      # "aparecendo" no arquivo.
      - name: A regra do cartao pela fatura esta ligada de ponta a ponta
        run: node scripts/check-cartao-pela-fatura.mjs

      - name: 'A verificacao sabe falhar (fiacao do cartao pela fatura)'
        run: |
          set -uo pipefail
          GUARD=scripts/check-cartao-pela-fatura.mjs

          # Cada mutacao desliga UM ponto da fiacao e restaura em seguida. O
          # `cmp` existe porque um `sed -i` que nao casa SAI 0: sem ele, uma
          # ancora renomeada por outra issue faria este passo medir a arvore
          # intacta e ficar verde para sempre.
          desligar() {
            local arquivo="$1" de="$2" para="$3" rotulo="$4"
            cp "$arquivo" "$arquivo.orig265"
            sed -i "s@$de@$para@" "$arquivo"
            if cmp -s "$arquivo" "$arquivo.orig265"; then
              mv "$arquivo.orig265" "$arquivo"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            if node "$GUARD" > /dev/null 2>&1; then
              mv "$arquivo.orig265" "$arquivo"
              echo "::error::Verde com a fiacao desligada: $rotulo"
              exit 1
            fi
            mv "$arquivo.orig265" "$arquivo"
            echo "  vermelho em: $rotulo"
          }

          desligar 'app/(dashboard)/dashboard/page.tsx' '\&cartao=fatura' '' \
            'o painel para de PEDIR a regra -- a rota responde o total antigo'
          desligar 'app/api/reports/cash-flow/route.ts' 'realizadoComCartaoPelaFatura(linhas)' 'linhas.slice()' \
            'a rota importa a regra e NAO a chama'
          desligar 'app/api/dashboard/previsao/route.ts' 'agendaSemCompraNoCartao(' 'Array.from(' \
            'a Previsao para de tirar a compra no cartao -- o cartao em dobro'
          desligar 'app/api/dashboard/previsao/route.ts' 'faturasPrevistasDaJanela(supabase' 'naoChama(supabase' \
            'a Previsao para de sintetizar a fatura ABERTA -- o cartao desaparece'
          desligar 'lib/realizado-e-previsao.ts' '  direction: string | null | undefined' '  direction: string | null | undefined, ehFatura: boolean' \
            'direcaoNoPainel volta a receber o segundo argumento que a HMO-265 tirou'

          echo "A verificacao fica vermelha nos cinco pontos de fiacao."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (fiacao do cartao pela fatura)"'
        run: |
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore -- procure por um .orig265 esquecido."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # A DIVISAO CONFIGURADA DO GRUPO SOMA 100% CRAVADO
      # origem: nova (HMO-245, fase 1 -- HMO-267)
      # =======================================================================
      # `lib/divisao-configurada.ts` e a regra por tras do slider de porcentagem
      # do grupo: "o total deve ser 100% entao se eu mexer em um, automaticamente
      # o outro de ajustar". A porcentagem que ela produz e o PESO com que o
      # fechamento do mes rateia a conta da casa, entao os defeitos dela sao
      # defeitos de dinheiro -- e nenhum deles aparece na tela:
      #
      #   * uma configuracao que soma 99,99% divide 99,99% do aluguel. O
      #     residual de um centesimo nao tem onde aparecer; ele vira saldo que
      #     pagamento nenhum zera, semanas depois;
      #   * com todos os membros em zero -- que e o estado de TODO grupo que
      #     existe hoje, porque `group_members.percentage` nasce `DEFAULT 0.00`
      #     e ninguem nunca escreveu nessa coluna -- a proporcao e `0/0`. `NaN`
      #     nao estoura em JavaScript: atravessa a aritmetica calado e chega na
      #     tela como "NaN%";
      #   * membro em 0% entrando na despesa com parte zerada derruba o INSERT
      #     INTEIRO em 23514, porque `group_members.percentage` aceita 0 e
      #     `expense_splits.percentage` exige `> 0`.
      #
      # SEM `paths:`, como todo o resto deste workflow: a suite e pura, roda em
      # dois segundos, e o dia em que o slider mudar de arquivo um filtro escrito
      # hoje estaria errado.
      #
      # A suite roda o node DUAS VEZES, em America/Sao_Paulo e em UTC. O modulo
      # nao tem data nenhuma, e e por isso que o fuso e verificado: a sandbox de
      # quem escreve e Sao Paulo e o CI e UTC, entao um `new Date()` que aparecesse
      # aqui amanha (uma semeadura por mes, um "vigente desde") passaria verde na
      # maquina de quem escreveu e viraria porcentagem diferente no CI.
      - name: O rebalanceamento da divisao do grupo fecha 100% em centesimos inteiros
        run: npm run test:divisao-configurada

      # Controle negativo. A suite afirma sobre uma SOMA e sobre uma AUSENCIA
      # ("a config soma 10000", "o membro em 0% nao tem parte"), e as duas passam
      # verde tambem quando deixam de medir o que deveriam.
      #
      # Os quatro mutantes abaixo sao os que `scripts/mutantes-divisao-configurada.mjs`
      # mede inteiro (49 deles, todos mortos -- os 8 ultimos sao de
      # `divisaoDoPeriodo`, a fase 4); estes quatro estao aqui porque sao os que
      # viram dinheiro. O primeiro e o controle negativo que a issue pede por
      # nome.
      - name: 'A verificacao sabe falhar (divisao configurada do grupo)'
        run: |
          set -uo pipefail
          REGRAS=lib/divisao-configurada.ts

          # O `cmp` existe porque um `sed -i` que nao casa SAI 0: sem ele, uma
          # ancora reescrita por outra issue faria este passo medir a arvore
          # INTACTA e ficar verde para sempre, com o rotulo mentindo sobre o que
          # foi provado.
          estragar() {
            local de="$1" para="$2" rotulo="$3"
            cp "$REGRAS" "$REGRAS.orig267"
            sed -i "s@$de@$para@" "$REGRAS"
            if cmp -s "$REGRAS" "$REGRAS.orig267"; then
              mv "$REGRAS.orig267" "$REGRAS"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            if npm run test:divisao-configurada > /dev/null 2>&1; then
              mv "$REGRAS.orig267" "$REGRAS"
              echo "::error::Verde com a regra estragada: $rotulo"
              exit 1
            fi
            mv "$REGRAS.orig267" "$REGRAS"
            echo "  vermelho em: $rotulo"
          }

          # 1) MAIOR RESTO -> ARREDONDAMENTO. O controle que a issue nomeia.
          #    `70/3` NAO distingue os dois (23,33 arredonda e trunca para o
          #    mesmo 2333); o que distingue e uma sobra com parte fracionaria
          #    >= 0,5 em mais de um membro -- 3500 centesimos entre tres da
          #    1166,67 cada, e tres arredondamentos para cima somam 3501. A
          #    config passa a somar 100,01%.
          estragar 'const base = efetivos\.map((p) => Math\.floor((total \* p) / soma));' \
                   'const base = efetivos.map((p) => Math.round((total * p) / soma));' \
                   'o maior resto vira arredondamento -- a config soma 100,01%'

          # 2) O DEGRAU DO 0/0. Sem ele, o grupo que ninguem configurou (todos em
          #    0,00) sai com a lista inteira em `NaN`, e a tela mostra "NaN%".
          estragar 'const soma = somaPesos > 0 ? somaPesos : pesos\.length;' \
                   'const soma = somaPesos;' \
                   'o degrau da divisao igual some -- todos em zero viram NaN%'

          # 3) O MEMBRO EM 0% VOLTANDO PARA A DESPESA. `expense_splits.percentage`
          #    exige `> 0`: uma linha com 0,00 derruba o INSERT inteiro, e a
          #    mensagem do CHECK nao diz nada a quem lancou a despesa.
          estragar '\.filter((m) => m\.peso > 0)' \
                   '.filter((m) => m.peso >= 0)' \
                   'membro em 0% volta a entrar na despesa com parte zerada'

          # 4) A CONFERENCIA DA SOMA NA LEITURA. O que chega em `divisaoDaDespesa`
          #    vem do banco, uma linha por membro, e a RLS `group_members_update`
          #    deixa qualquer membro escrever a PROPRIA `percentage` pelo
          #    PostgREST. Nao ha CHECK que veja a soma: um "eu pago 1%" feito por
          #    fora faria a despesa fechar 96% do valor, em silencio.
          estragar 'if (soma !== CENTESIMOS_TOTAIS) {' \
                   'if (false) {' \
                   'a conferencia da soma some -- a despesa fecha 96% do valor'

          echo "A verificacao fica vermelha nos quatro pontos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (divisao configurada do grupo)"'
        run: |
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore -- procure por um .orig267 esquecido."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # =======================================================================
      # PAGAR A FATURA: A DECISAO E A SEQUENCIA, FORA DA TELA
      # origem: nova (HMO-245, fase 13 -- HMO-310)
      # =======================================================================
      # Pagar fatura escolhendo a conta pagadora ja funcionava inteiro -- e so
      # funcionava DENTRO de app/(dashboard)/dashboard/bills/page.tsx. A fase 13
      # tirou de la a decisao (lib/pagamento-da-fatura.ts) e o dialogo
      # (components/fatura/DialogoDePagamentoDaFatura.tsx) para que a tela de
      # Despesas os use sem copiar uma linha.
      #
      # O DEFEITO QUE A SUITE EXISTE PARA PEGAR e um galho trocado. Os TRES
      # sabores de fatura casam em `natureza === "fatura"`; o que separa UMA
      # escrita de DUAS e `gravada`:
      #
      #   aberta sintetizada   gravada: false  ->  close + pay
      #   fechada na agenda    gravada: true   ->  so pay
      #   previsao ligada      gravada: true   ->  so pay   (o elo, HMO-305)
      #
      # Com o galho por `natureza`, a previsao DIGITADA que alguem ligou a fatura
      # passa pelo POST /api/card-invoices/close: a fatura do CARTAO e fechada
      # porque a pessoa pagou a previsao da CONTA CORRENTE. O `close` responde
      # 201 -- nenhum erro, nenhum log --, e o unico sintoma e uma conta a pagar
      # que ninguem pediu no mes seguinte.
      #
      # E ELE SO MORRE POR UM CASO SOBRE A PREVISAO LIGADA. Na fatura ABERTA as
      # duas expressoes dao a mesma resposta, entao uma suite que so olhe aquele
      # sabor passa VERDE com a troca feita. O mutante `galho_por_natureza` e a
      # medicao disso.
      #
      # DOIS FUSOS, porque a suite toca `mes` / `invoice_month`: a sandbox e
      # America/Sao_Paulo e o CI e UTC. `mesDoClose` e fatia de string e nao
      # deveria depender do relogio; rodar nos dois e o que prova que nao passou
      # a depender.
      #
      # SEM `paths:`, como o resto deste workflow: a suite e pura e roda em dois
      # segundos, e um filtro escrito hoje estaria errado no dia em que a decisao
      # mudar de arquivo.
      - name: A decisao e a sequencia do pagamento de fatura (dois fusos)
        run: npm run test:pagamento-da-fatura

      - name: Mutantes da decisao e da sequencia do pagamento de fatura
        run: npm run mutantes:pagamento-da-fatura

      # A OUTRA METADE: a decisao pode estar perfeita e nao estar LIGADA.
      #
      # Quatro defeitos de fiacao, nenhum deles visivel ao `tsc`: o dialogo sem a
      # frase do patrimonio no toast (quem pagou R$ 1.000 ve o patrimonio parado,
      # conclui que a baixa nao registrou e paga de novo), o botao desabilitado
      # sem motivo escrito, a tela sem o dialogo, e -- a exigencia NEGATIVA -- a
      # tela montando a sequencia das escritas de novo, que e a segunda
      # implementacao da de-duplicacao de fatura.
      - name: A fiacao do pagamento da fatura esta ligada
        run: npm run check-pagamento-da-fatura

      - name: 'A verificacao sabe falhar (fiacao do pagamento da fatura)'
        run: |
          set -uo pipefail
          GUARD=scripts/check-pagamento-da-fatura.mjs

          # Cada mutacao desliga UM ponto da fiacao e restaura em seguida. O
          # `cmp` existe porque um `sed -i` que nao casa SAI 0: sem ele, uma
          # ancora renomeada por outra issue faria este passo medir a arvore
          # intacta e ficar verde para sempre.
          desligar() {
            local arquivo="$1" de="$2" para="$3" rotulo="$4"
            cp "$arquivo" "$arquivo.orig310"
            sed -i "s@$de@$para@" "$arquivo"
            if cmp -s "$arquivo" "$arquivo.orig310"; then
              mv "$arquivo.orig310" "$arquivo"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            if node "$GUARD" > /dev/null 2>&1; then
              mv "$arquivo.orig310" "$arquivo"
              echo "::error::Verde com a fiacao desligada: $rotulo"
              exit 1
            fi
            mv "$arquivo.orig310" "$arquivo"
            echo "  vermelho em: $rotulo"
          }

          DIALOGO='components/fatura/DialogoDePagamentoDaFatura.tsx'
          TELA='app/(dashboard)/dashboard/bills/page.tsx'

          desligar "$DIALOGO" 'description: FRASE_DO_PATRIMONIO' 'description: undefined' \
            'o toast de sucesso perde a frase do patrimonio -- e o pagamento em dobro volta'
          desligar "$DIALOGO" 'MOTIVO_SEM_CONTA_PAGADORA}' 'null}' \
            'o botao desabilitado perde o motivo escrito'
          desligar "$DIALOGO" 'pagarAFatura({' 'naoChama({' \
            'o dialogo importa a sequencia e NAO a chama'
          desligar "$DIALOGO" 'decisaoDePagamentoDaFatura(linha)' 'naoDecide(linha)' \
            'o dialogo redecide por conta propria em vez de perguntar a lib'
          desligar "$TELA" '<DialogoDePagamentoDaFatura' '<DialogoDeAlcance' \
            'a tela para de renderizar o dialogo -- a fatura fica sem onde ser paga'
          # OS DOIS CALL SITES DA TELA, SEPARADOS, e isso foi medido: a primeira
          # versao do guard exigia `linhaParaPagarDaAgenda(` solto, e matar o
          # galho de `pedirBaixa` deixava a prop do dialogo satisfazendo a
          # exigencia -- verde com a tela de volta ao proprio criterio de "isto e
          # fatura?", que e o segundo dono da pergunta.
          desligar "$TELA" 'decisaoDePagamentoDaFatura(linhaParaPagarDaAgenda(conta))' 'ehFatura(conta.notes)' \
            'pedirBaixa volta a ter o proprio criterio de "isto e fatura?"'
          desligar "$TELA" 'linhaParaPagarDaAgenda(faturaParaPagar)' 'faturaParaPagar' \
            'a prop do dialogo deixa de ser normalizada -- a decisao le campos que nao existem'

          # A EXIGENCIA NEGATIVA, medida ao contrario: o guard tem de ficar
          # VERMELHO quando a sequencia das escritas VOLTA para dentro da tela.
          # Sem este caso, a parte do guard que impede a segunda implementacao
          # nunca foi exercitada.
          cp "$TELA" "$TELA.orig310"
          printf '\nconst voltou = () => fetch("/api/card-invoices/close");\n' >> "$TELA"
          if node "$GUARD" > /dev/null 2>&1; then
            mv "$TELA.orig310" "$TELA"
            echo "::error::Verde com a sequencia das escritas de volta dentro da tela"
            exit 1
          fi
          mv "$TELA.orig310" "$TELA"
          echo "  vermelho em: a sequencia das escritas volta para dentro da tela"

          echo "A verificacao fica vermelha nos oito pontos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (fiacao do pagamento da fatura)"'
        run: |
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore -- procure por um .orig310 esquecido."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi
