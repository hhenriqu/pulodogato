      # nota: verificacao-notas.md -> "Os tiles do painel levam a janela da tela"
      - name: Os tiles do painel levam a janela da tela
        run: npm run test:painel-clicavel

      # nota: verificacao-notas.md -> "A sonda do painel clicavel sabe falhar"
      - name: A sonda do painel clicavel sabe falhar
        run: |
          set -uo pipefail
          PAINEL='app/(dashboard)/dashboard/page.tsx'
          PERIODO='lib/periodo-do-painel.ts'
          cp "$PAINEL" "$PAINEL.orig"
          cp "$PERIODO" "$PERIODO.orig"
          trap 'mv "$PAINEL.orig" "$PAINEL"; mv "$PERIODO.orig" "$PERIODO"' EXIT

          mutou() {
            if diff -q "$1.orig" "$1" > /dev/null; then
              echo "::error::O mutante $2 nao alterou $1 -- a ancora do sed mudou."
              exit 1
            fi
          }

          # 1) O LINK FICA NU. O defeito da issue, exatamente: o clique leva para
          #    a tela certa e para o MES CORRENTE, partindo de um numero de
          #    agosto.
          sed -i 's|rotaDaTelaDoLado("receita", periodo) as Route|"/dashboard/receitas" as Route|' "$PAINEL"
          mutou "$PAINEL" 1
          if npm run test:painel-clicavel > /dev/null 2>&1; then
            echo "::error::Verde com o tile de Receitas levando para a tela sem a janela do periodo."
            exit 1
          fi
          cp "$PAINEL.orig" "$PAINEL"

          # 2) O ENDERECO LEVA O MES CORRENTE, e nao o periodo que esta na tela.
          #    O gemeo do 1, e o que a armadilha da issue nomeia: o `href` tem
          #    `de`/`ate`, parece completo, e aponta para o mes errado.
          sed -i 's|?${periodoParaQuery(periodo)}`;|?${periodoParaQuery(periodoCorrente())}`;|' "$PERIODO"
          mutou "$PERIODO" 2
          if npm run test:painel-clicavel > /dev/null 2>&1; then
            echo "::error::Verde com o link do tile levando o mes corrente em vez do periodo da tela."
            exit 1
          fi
          cp "$PERIODO.orig" "$PERIODO"

          # 3) SO O `de` VAI. Meia janela e o mesmo que nenhuma: sem o `ate`, o
          #    `lerPeriodo` do destino descarta o par inteiro e cai no mes
          #    corrente.
          sed -i 's|?${periodoParaQuery(periodo)}`;|?de=${periodo.de}`;|' "$PERIODO"
          mutou "$PERIODO" 3
          if npm run test:painel-clicavel > /dev/null 2>&1; then
            echo "::error::Verde com o link levando so o de, sem o ate."
            exit 1
          fi
          cp "$PERIODO.orig" "$PERIODO"

          # 4) COPIA-E-COLA: o tile de Despesas aponta para Receitas. Os dois
          #    blocos de JSX sao irmaos identicos a menos de uma palavra, e este
          #    e o erro que se comete escrevendo o segundo.
          #
          #    A ANCORA LEVA A INDENTACAO, e nao e enfeite: desde a HMO-415 esta
          #    chamada aparece DUAS vezes no arquivo -- no tile (10 espacos) e no
          #    «Abrir Despesas» da legenda do cartao de quanto posso gastar (14).
          #    `sed` sem endereco mutaria as duas, e mutante que muta dois
          #    lugares nao mede nenhum dos dois: a suite reprova pelo primeiro e
          #    o nome do mutante passa a descrever o que ele nao mediu. Dai o
          #    `^...$`, e dai a conferencia de que ele casa UMA linha -- que e o
          #    que apodrece calado no dia em que alguem dedentar o JSX.
          CASOU=$(grep -c '^          href={rotaDaTelaDoLado("despesa", periodo) as Route}$' "$PAINEL")
          if [ "$CASOU" != 1 ]; then
            echo "::error::A ancora do tile de Despesas casa $CASOU linhas de $PAINEL -- devia casar 1."
            exit 1
          fi
          sed -i 's|^          href={rotaDaTelaDoLado("despesa", periodo) as Route}$|          href={rotaDaTelaDoLado("receita", periodo) as Route}|' "$PAINEL"
          mutou "$PAINEL" 4
          if npm run test:painel-clicavel > /dev/null 2>&1; then
            echo "::error::Verde com o tile de Despesas abrindo a tela de Receitas."
            exit 1
          fi
          cp "$PAINEL.orig" "$PAINEL"

          # 5) O `lado` E IGNORADO na lib. Mesmo destino do 4, do outro lado da
          #    fronteira: aqui os DOIS tiles vao para Receitas, e o periodo
          #    continua certo nos dois.
          sed -i 's|const tela = lado === "receita" ? "receitas" : "despesas";|const tela = "receitas";|' "$PERIODO"
          mutou "$PERIODO" 5
          if npm run test:painel-clicavel > /dev/null 2>&1; then
            echo "::error::Verde com os dois tiles apontando para a mesma tela."
            exit 1
          fi
          cp "$PERIODO.orig" "$PERIODO"

          # 6) O «ABRIR DESPESAS» DA LEGENDA DO CARTAO DE QUANTO POSSO GASTAR
          #    FICA NU (HMO-415). O defeito do mutante 1 no terceiro link do
          #    arquivo, com uma diferenca que e a razao de ele ter mutante
          #    proprio: o cartao e CONDICIONAL -- so desenha quando o periodo
          #    contem hoje --, entao nos periodos dos casos A e B o anchor nao
          #    existe e toda assercao sobre o `href` dele passaria verde numa
          #    lista vazia. Quem mata este mutante e o caso D da sonda, que e um
          #    intervalo contendo hoje SEM ser o mes corrente.
          #
          #    Mesma ancora indentada do 4, pelo mesmo motivo -- do outro lado:
          #    aqui sao os 14 espacos.
          CASOU=$(grep -c '^              href={rotaDaTelaDoLado("despesa", periodo) as Route}$' "$PAINEL")
          if [ "$CASOU" != 1 ]; then
            echo "::error::A ancora do «Abrir Despesas» do cartao casa $CASOU linhas de $PAINEL -- devia casar 1."
            exit 1
          fi
          sed -i 's|^              href={rotaDaTelaDoLado("despesa", periodo) as Route}$|              href={"/dashboard/despesas" as Route}|' "$PAINEL"
          mutou "$PAINEL" 6
          if npm run test:painel-clicavel > /dev/null 2>&1; then
            echo "::error::Verde com o «Abrir Despesas» do cartao de quanto posso gastar levando para a tela sem a janela do periodo."
            exit 1
          fi
          cp "$PAINEL.orig" "$PAINEL"

          echo "A sonda do painel clicavel fica vermelha nos seis defeitos."

      - name: 'A arvore voltou ao lugar depois de "A sonda do painel clicavel sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .tsx.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

