      # nota: verificacao-notas.md -> "Nenhuma tela converte coluna date com new Date"
      - name: Nenhuma tela converte coluna date com new Date
        run: npm run check-data-na-tela

      # nota: verificacao-notas.md -> "A verificacao da data na tela sabe falhar, e sabe nao falhar"
      - name: A verificacao da data na tela sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          guard='scripts/check-data-na-tela.mjs'

          alvo='components/movimentacoes/LinhaDaParteDeGrupo.tsx'
          cp "$alvo" /tmp/data-na-tela-alvo.orig
          cp lib/utils.ts /tmp/data-na-tela-utils.orig
          trap 'cp /tmp/data-na-tela-alvo.orig "$alvo"; cp /tmp/data-na-tela-utils.orig lib/utils.ts' EXIT

          # 1) O defeito da issue de volta: new Date sobre a coluna date.
          perl -0pi -e 's{\{dataNaTela\(parte\.transactionDate\)\}}{\{new Date(parte.transactionDate).toLocaleDateString("pt-BR")\}}' "$alvo"
          if cmp -s /tmp/data-na-tela-alvo.orig "$alvo"; then
            echo "::error::a mutacao 1 nao casou em $alvo -- a ancora mudou e o controle negativo mediria o conjunto vazio."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com new Date sobre parte.transactionDate -- o defeito da HMO-353."
            exit 1
          fi
          cp /tmp/data-na-tela-alvo.orig "$alvo"

          # 2) A data simplesmente APAGADA da tela. A peneira 1 nao ve nada para
          #    acusar: nao ha mais new Date nenhum. Quem pega e a contagem.
          perl -0pi -e 's{\{dataNaTela\(parte\.transactionDate\)\}}{\{null\}}' "$alvo"
          if cmp -s /tmp/data-na-tela-alvo.orig "$alvo"; then
            echo "::error::a mutacao 2 nao casou em $alvo -- a ancora mudou."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com a data APAGADA da linha da parte de grupo."
            exit 1
          fi
          cp /tmp/data-na-tela-alvo.orig "$alvo"

          # 3) formatDate de lib/utils.ts volta a converter com new Date. Era UMA
          #    linha servindo tres telas, e ela mora fora das raizes da peneira 1.
          perl -0pi -e 's{return dataOuMomentoNaTela\(date\);}{return new Intl.DateTimeFormat("pt-BR").format(new Date(date));}' lib/utils.ts
          if cmp -s /tmp/data-na-tela-utils.orig lib/utils.ts; then
            echo "::error::a mutacao 3 nao casou em lib/utils.ts -- a ancora mudou."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com formatDate convertendo coluna date com new Date."
            exit 1
          fi
          cp /tmp/data-na-tela-utils.orig lib/utils.ts

          # 4) E SABE NAO FALHAR. Os arquivos corrigidos citam new Date em PROSA,
          #    para explicar o que foi consertado -- um guard que lesse comentario
          #    reprovaria justamente eles, o avesso do que ele mede.
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard reprova a arvore correta."
            exit 1
          fi

          echo "O guard fica vermelho nos tres defeitos e verde na arvore correta."

      - name: 'A arvore voltou ao lugar depois de "A verificacao da data na tela sabe falhar, e sabe nao falhar"'
        run: |
          # Um mutante nao restaurado contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git diff --quiet -- components/movimentacoes/LinhaDaParteDeGrupo.tsx lib/utils.ts || {
            echo "::error::a arvore nao voltou ao lugar depois do controle negativo da data na tela."
            exit 1
          }

      # nota: verificacao-notas.md -> "A data da lista nao aparece um dia mais cedo"
      - name: A data da lista nao aparece um dia mais cedo
        run: npm run test:data-na-tela

      # nota: verificacao-notas.md -> "Nenhuma tela congela a data de hoje em constante de modulo"
      - name: Nenhuma tela congela a data de hoje em constante de modulo
        run: npm run check-data-no-clique

      # nota: verificacao-notas.md -> "A verificacao da data no clique sabe falhar, e sabe nao falhar"
      - name: A verificacao da data no clique sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          guard='scripts/check-data-no-clique.mjs'

          bills='app/(dashboard)/dashboard/bills/page.tsx'
          budgets='app/(dashboard)/dashboard/budgets/page.tsx'
          lista='components/movimentacoes/ListaDeMovimentacao.tsx'
          dialogo='components/fatura/DialogoDePagamentoDaFatura.tsx'

          cp "$bills" /tmp/no-clique-bills.orig
          cp "$budgets" /tmp/no-clique-budgets.orig
          cp "$lista" /tmp/no-clique-lista.orig
          cp "$dialogo" /tmp/no-clique-dialogo.orig
          trap 'cp /tmp/no-clique-bills.orig "$bills"; cp /tmp/no-clique-budgets.orig "$budgets"; cp /tmp/no-clique-lista.orig "$lista"; cp /tmp/no-clique-dialogo.orig "$dialogo"' EXIT

          # 1) O defeito da issue de volta, na forma MULTILINHA em que ele
          #    existia. A forma importa: a primeira versao do detector cortava o
          #    inicializador no primeiro statement de coluna 0, e o prettier poe
          #    o fecho de uma chamada multilinha exatamente ali -- ela via "="
          #    e ia embora. As quatro ocorrencias reais eram multilinha.
          perl -0pi -e 's{import \{ today \} from "\@/lib/recurrence";}{$&\nconst HOJE = new Intl.DateTimeFormat("en-CA", \{\n  timeZone: "America/Sao_Paulo",\n\}).format(new Date());}' "$bills"
          if cmp -s /tmp/no-clique-bills.orig "$bills"; then
            echo "::error::a mutacao 1 nao casou em $bills -- a ancora mudou e o controle negativo mediria o conjunto vazio."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com a constante de modulo MULTILINHA de volta -- o defeito da HMO-315."
            exit 1
          fi
          cp /tmp/no-clique-bills.orig "$bills"

          # 2) A mesma coisa numa linha so, e sem Intl: o mes corrente de
          #    budgets deixa de ser funcao e vira constante. Era literalmente
          #    assim antes da HMO-315, e o preco la e a tela inteira (tetos,
          #    gasto, sobra) falando do mes ERRADO depois da virada do mes.
          perl -0pi -e 's{const mesCorrente = \(\) => today\(\)\.slice\(0, 7\);}{const mesCorrente = today().slice(0, 7);}' "$budgets"
          if cmp -s /tmp/no-clique-budgets.orig "$budgets"; then
            echo "::error::a mutacao 2 nao casou em $budgets -- a ancora mudou."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com o mes corrente congelado em constante de modulo."
            exit 1
          fi
          cp /tmp/no-clique-budgets.orig "$budgets"

          # 3) A PORTA DO MEIO: a data nao congela no modulo, congela no RENDER.
          #    `hoje={today()}` era como ListaDeMovimentacao estava escrita, e o
          #    que a achou foi o tipo da prop deixando de compilar. O guard
          #    tambem tem de pegar, porque `tsc` so roda no `next build`.
          #
          #    A ancora leva a LINHA SEGUINTE de proposito, e isso nao e
          #    firula. `hoje={today}` aparece DUAS vezes no arquivo: primeiro no
          #    comentario que explica a HMO-315, depois no JSX. Sem `/g` o perl
          #    casa a primeira, que e a do comentario -- e `semComentarios`
          #    apaga comentario antes da varredura, entao o guard nao via
          #    mutacao nenhuma e este controle passava verde sobre um mutante
          #    que nunca tocou no codigo. O `cmp` nao salvava: o arquivo MUDOU,
          #    so que no lugar errado. Medido aqui, nao suposto.
          perl -0pi -e 's{hoje=\{today\}\n(\s*)aoFechar=}{hoje=\{today()\}\n$1aoFechar=}' "$lista"
          if cmp -s /tmp/no-clique-lista.orig "$lista"; then
            echo "::error::a mutacao 3 nao casou em $lista -- a ancora mudou."
            exit 1
          fi
          if ! grep -q 'hoje={today()}' "$lista"; then
            echo "::error::a mutacao 3 mudou $lista mas nao produziu hoje={today()} -- casou no lugar errado."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com hoje={today()} -- a data lida no render, e o paid_date e do clique."
            exit 1
          fi
          cp /tmp/no-clique-lista.orig "$lista"

          # 4) E a porta do meio pela RAIZ: o tipo da prop volta a aceitar
          #    string. Sem ele nada impede as duas telas de congelar de novo, e
          #    a mutacao 3 deixaria de ser sequer um erro de compilacao.
          perl -0pi -e 's{hoje: \(\) => string;}{hoje: string;}' "$dialogo"
          if cmp -s /tmp/no-clique-dialogo.orig "$dialogo"; then
            echo "::error::a mutacao 4 nao casou em $dialogo -- a ancora mudou."
            exit 1
          fi
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard passou verde com a prop hoje voltando a ser string."
            exit 1
          fi
          cp /tmp/no-clique-dialogo.orig "$dialogo"

          # 5) E SABE NAO FALHAR. Os quatro arquivos corrigidos citam
          #    `const HOJE = ... new Date()` em PROSA, para explicar o que saiu
          #    dali -- um guard que lesse comentario reprovaria justamente eles.
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::O guard reprova a arvore correta."
            exit 1
          fi

          echo "O guard fica vermelho nas quatro mutacoes e verde na arvore correta."

      - name: 'A arvore voltou ao lugar depois de "A verificacao da data no clique sabe falhar, e sabe nao falhar"'
        run: |
          # Um mutante nao restaurado contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .tsx.
          rm -rf .tmp-*
          git diff --quiet -- 'app/(dashboard)/dashboard/bills/page.tsx' 'app/(dashboard)/dashboard/budgets/page.tsx' components/movimentacoes/ListaDeMovimentacao.tsx components/fatura/DialogoDePagamentoDaFatura.tsx || {
            echo "::error::a arvore nao voltou ao lugar depois do controle negativo da data no clique."
            exit 1
          }

      # nota: verificacao-notas.md -> "A baixa grava a data do clique, nao a da montagem"
      - name: A baixa grava a data do clique, nao a da montagem
        run: npm run test:data-no-clique

      # nota: verificacao-notas.md -> "A suite da data no clique sabe falhar"
      - name: A suite da data no clique sabe falhar
        run: |
          set -uo pipefail
          alvo='lib/recurrence.ts'
          cp "$alvo" /tmp/no-clique-recurrence.orig
          trap 'cp /tmp/no-clique-recurrence.orig "$alvo"; rm -rf .tmp-data-no-clique' EXIT

          perl -0pi -e 's{export function today\(timeZone = "America/Sao_Paulo"\)}{export function today(timeZone = "UTC")}' "$alvo"
          if cmp -s /tmp/no-clique-recurrence.orig "$alvo"; then
            echo "::error::a mutacao nao casou em $alvo -- a ancora mudou e este controle mediria o conjunto vazio."
            exit 1
          fi

          rm -rf .tmp-data-no-clique
          if npm run test:data-no-clique > /dev/null 2>&1; then
            echo "::error::a suite passou verde com today() em UTC -- ela nao esta medindo o fuso."
            exit 1
          fi

          cp /tmp/no-clique-recurrence.orig "$alvo"
          rm -rf .tmp-data-no-clique
          if ! npm run test:data-no-clique > /dev/null 2>&1; then
            echo "::error::a suite reprova a arvore correta."
            exit 1
          fi

          echo "A suite fica vermelha com today() em UTC e verde na arvore correta."

      - name: 'A arvore voltou ao lugar depois de "A suite da data no clique sabe falhar"'
        run: |
          rm -rf .tmp-*
          git diff --quiet -- lib/recurrence.ts || {
            echo "::error::a arvore nao voltou ao lugar depois do controle negativo da suite da data no clique."
            exit 1
          }

