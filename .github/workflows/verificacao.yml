          # existe mais, e e ESTE passo que esta quebrado.
          mutou() {
            if cmp -s "$1" "$1.orig"; then
              echo "::error::o mutante $2 nao se aplicou a $1 -- a ancora do sed mudou de forma. Conserte o padrao NESTE workflow, nao o codigo."
              exit 1
            fi
          }

          # 6) O PREVISTO IMPRESSO NO CARTAO "REALIZADO". As 34 assercoes puras
          #    e os 32 mutantes passam verdes nisto: a conta esta certa e a tela
          #    e que esta mostrando o numero do vizinho.
          sed -i 's|<CardTitle className="text-2xl">{numero(resumo?.realizado)}</CardTitle>|<CardTitle className="text-2xl">{numero(resumo?.previsto)}</CardTitle>|' $CARTOES
          mutou $CARTOES 6
          if npm run test:cartoes-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com o PREVISTO impresso no cartao Realizado."
            exit 1
          fi
          cp $CARTOES.orig $CARTOES

          # 7) O ZERO CONFIANTE. Sem `podeMostrarNumero`, a tela imprime
          #    "R$ 0,00" antes de a leitura responder -- e num mes com despesa
          #    isso nao parece erro, parece um mes barato.
          sed -i 's|podeMostrarNumero(estado) \&\& resumo ? (|true ? (|' $CARTOES
          mutou $CARTOES 7
          if npm run test:cartoes-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com R\$ 0,00 impresso SEM leitura nenhuma."
            exit 1
          fi

          echo "A verificacao da marcacao fica vermelha nos dois defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao da marcacao sabe falhar"'
        run: |
          # Em 21 jobs separados, um mutante que nao fosse restaurado morria
          # com o VM. Aqui ele contaminaria os passos seguintes -- e o
          # .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "O icone, o rotulo e o href da linha"
      - name: O icone, o rotulo e o href da linha
        run: npm run test:secao-da-tela

      # nota: verificacao-notas.md -> "A verificacao da linha sabe falhar"
      - name: A verificacao da linha sabe falhar
        run: |
          set -uo pipefail
          SECAO=components/movimentacoes/SecaoDaTela.tsx
          FATURA=lib/fatura-do-cartao.ts
          cp $SECAO $SECAO.orig
          cp $FATURA $FATURA.orig
          trap 'mv $SECAO.orig $SECAO; mv $FATURA.orig $FATURA' EXIT

          # `cmp` depois de cada `sed`: uma ancora que a feature renomeou faz o
          # `sed` sair 0 sem trocar nada, e o bloco inteiro passaria por verde
          # tendo medido ZERO mutantes.
          mutou() {
            if cmp -s "$1" "$1.orig"; then
              echo "::error::A ancora do mutante $2 nao casou -- nada foi mutado."
              exit 1
            fi
          }

          # 1) O ROTULO TROCADO. "fixo" numa fatura e "fatura de cartão" numa
          #    conta fixa sao os dois plausiveis: as duas linhas existem, as
          #    duas tem vencimento, e o valor ao lado esta certo nas duas.
          sed -i 's|rotulo: "fatura de cartão",|rotulo: "fixo",|' $SECAO
          mutou $SECAO 1
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com a FATURA rotulada como conta fixa."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 2) SO O ICONE, SEM O ROTULO. E a feature pela metade: tres icones
          #    cinzentos de 12px numa linha de celular sao indistinguiveis, e
          #    quem olha ve que HA um icone, nao QUAL.
          sed -i 's|{rotulo \&\& <span>{rotulo}</span>}|{false \&\& <span>{rotulo}</span>}|' $SECAO
          mutou $SECAO 2
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com o rotulo de texto apagado da linha."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 3) TODA LINHA VIRA LINK. Linha que PARECE clicavel e nao e custa
          #    mais que linha que nao parece: a pessoa toca, nada acontece, e a
          #    conclusao natural e que o app travou.
          #
          #    O ancora era `  if (linha.fatura) {` e apodreceu na HMO-311, que
          #    moveu o criterio para dentro da linha e o transformou no ternario
          #    de `destinoDoCartao`. O `mutou` abaixo pegaria isso -- ele existe
          #    para isso -- mas pegaria como job vermelho, nao como aviso.
          #
          #    MUTA O LADO `: null`, E NAO A CONDICAO. Forcar a condicao para
          #    `true` NAO COMPILA (`linha.fatura` fica possibly-null em
          #    `caminhoDoCartaoNoMes(linha.fatura.accountId, ...)`), e mutante que
          #    nao compila "morre" por erro de tipo sem nunca exercitar assercao
          #    nenhuma -- indistinguivel de sonda que mede a fonte intacta. Pelo
          #    lado do `else` toda linha ganha um destino de verdade, a suite
          #    compila, e quem fica vermelho sao as assercoes certas: "a despesa
          #    comum NAO e link" e "a previsao LIGADA AO ELO nao ganha o link".
          sed -i 's|      : null;|      : "/dashboard/cartoes";|' $SECAO
          mutou $SECAO 3
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com TODA linha virando <a>."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 4) O ICONE DA FATURA VIRA O DA TELA. Todas as assercoes de TEXTO
          #    desta suite continuam verdes: o rotulo escrito nao muda.
          sed -i 's|      Icone: CreditCard,|      Icone: aparencia.Icone,|' $SECAO
          mutou $SECAO 4
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com as tres naturezas desenhando o MESMO icone."
            exit 1
          fi
          cp $SECAO.orig $SECAO

          # 5) O MES DO `href` SAI EM 10 CHARS. O destino EXISTE e abre no mes
          #    corrente: o valor certo, o mes errado, e nada dizendo que o mes
          #    trocou. E o unico defeito desta issue que nenhum texto denuncia.
          sed -i 's|  return mes.slice(0, 7);|  return mes;|' $FATURA
          mutou $FATURA 5
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::Verde com o href levando AAAA-MM-01 em vez de AAAA-MM."
            exit 1
          fi
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com o mes inicial da tela do cartao sem normalizar."
            exit 1
          fi
          cp $FATURA.orig $FATURA

          # 6) A TELA DO CARTAO IGNORA O `?mes=`. A ponta que recebe desligada
          #    da a tela de destino perfeitamente correta -- no mes errado.
          sed -i 's|return mesDeSeteChars(mesDaUrl) ?? mesCorrenteDaFatura(agora);|return mesCorrenteDaFatura(agora);|' $FATURA
          mutou $FATURA 6
          if npm run test:fatura-do-cartao > /dev/null 2>&1; then
            echo "::error::Verde com a tela do cartao ignorando o ?mes= da URL."
            exit 1
          fi

          echo "A verificacao da linha fica vermelha nos seis defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao da linha sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "Quais acoes cada estado de linha ganha"
      - name: Quais acoes cada estado de linha ganha
        run: npm run test:acoes-da-linha

      # nota: verificacao-notas.md -> "A verificacao das acoes sabe falhar"
      - name: A verificacao das acoes sabe falhar
        run: |
          set -uo pipefail
          ACOES=lib/acoes-da-linha.ts
          cp $ACOES $ACOES.orig
          trap 'mv $ACOES.orig $ACOES' EXIT

          mutou() {
            if diff -q "$1.orig" "$1" > /dev/null; then
              echo "::error::O mutante $2 nao alterou $1 -- a ancora do sed mudou."
              exit 1
            fi
          }

          # 1) CONFIRMAR TAMBEM NO REALIZADO. Confirmar o que ja aconteceu grava
          #    a segunda perna do mesmo dinheiro -- que e como este app ja
          #    contou despesa duas vezes.
          sed -i 's|return podeAgirNaLinha(linha) \&\& linha.origem === "previsto";|return podeAgirNaLinha(linha);|' $ACOES
          mutou $ACOES 1
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com Confirmar aparecendo em linha realizada."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com Confirmar em linha realizada."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 2) A LINHA DE OUTRO MEMBRO GANHA BOTAO. O modo de falha caro: a RLS
          #    recusa, e o UPDATE recusado volta 200 sem alterar nada.
          sed -i '/if (!linha.posso_editar) return false;/d' $ACOES
          mutou $ACOES 2
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com botao sobre linha que a RLS recusaria."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com botao sobre linha alheia."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 3) A LINHA NAO GRAVADA GANHA BOTAO. A fatura aberta sintetizada nao
          #    tem id de banco: a baixa com a chave sintetica responde 404, que
          #    para quem clicou se le como "o app nao conseguiu".
          sed -i '/if (!linha.gravada) return false;/d' $ACOES
          mutou $ACOES 3
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com botao sobre linha que nao existe no banco."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 4) A FATURA GANHA BOTAO. A baixa dela exige a conta pagadora, entao
          #    o botao erraria em TODO clique -- e ela e um <a>, onde botao e
          #    aninhamento interativo invalido.
          sed -i '/if (linha.natureza === "fatura") return false;/d' $ACOES
          mutou $ACOES 4
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com acao sobre a linha de fatura."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 5) UM ROTULO SO PARA AS TRES TELAS. "Confirmar pagamento" embaixo de
          #    um salario previsto e um verbo errado sobre um numero certo.
          sed -i '/if (tipo === "income") return "Confirmar recebimento";/d' $ACOES
          mutou $ACOES 5
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com o mesmo verbo de baixa nas tres telas."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com um rotulo so de baixa."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 6) A EDICAO VAI PARA A ROTA DA TELA, E NAO PARA A DO FORMULARIO.
          #    As duas existem e so uma le `?id=`: com a da lista, o Editar
          #    recarrega a propria tela e o clique nao faz NADA VISIVEL. Este
          #    defeito estava no codigo intacto desta issue, e quem o pegou foi
          #    a sonda de navegador -- nenhuma assercao de unidade o alcanca,
          #    porque ela passa a string que ela mesma escolheu.
          LISTA=components/movimentacoes/ListaDeMovimentacao.tsx
          cp $LISTA $LISTA.orig
          sed -i 's|caminhoDeEdicao(linha, aparencia.rotaDeLancar, origem)|caminhoDeEdicao(linha, tela.rota, origem)|' $LISTA
          mutou $LISTA 6
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o Editar apontando para a propria lista."
            exit 1
          fi
          mv $LISTA.orig $LISTA

          # 7) O BOTAO PAGAR DA FATURA PERDE O `posso_editar` (HMO-311, fase 14).
          #    O mesmo modo de falha caro da regra 4, agora no caminho NOVO: a
          #    lista de Despesas inclui linha de outro membro do grupo desde a
          #    HMO-303, e **UPDATE filtrado pela RLS volta 200 sem alterar
          #    nada**. O dialogo diria "Fatura paga", o saldo nao mudaria, e a
          #    pessoa pagaria de novo pelo banco.
          #
          #    O `sed` E LIMITADO AO CORPO DA FUNCAO, por endereco de faixa: a
          #    MESMA linha existe em `podeAgirNaLinha` (mutante 2), e um `/d`
          #    solto apagaria as duas -- o mutante deixaria de ser "a regra 4 no
          #    botao novo" e passaria a ser "a regra 4 em tudo".
          sed -i '/^export function podePagarAFatura/,/^}/{/if (!linha.posso_editar) return false;/d}' $ACOES
          mutou $ACOES 7
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com Pagar sobre a fatura de outro membro do grupo."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com Pagar sobre fatura alheia."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 8) O CRITERIO DO BOTAO PAGAR VIRA `gravada` EM VEZ DE `natureza`.
          #    Os dois criterios se CONTRADIZEM de proposito (ver
          #    `podePagarAFatura`), e trocar um pelo outro faz duas coisas de uma
          #    vez: a fatura ABERTA -- a maior fonte do «Previsto» desta tela --
          #    perde o botao, e TODA conta prevista comum ganha um "Pagar" cuja
          #    baixa a rota recusa com 400 por falta de `payment_account_id`.
          sed -i 's|if (linha.natureza !== "fatura") return false;|if (!linha.gravada) return false;|' $ACOES
          mutou $ACOES 8
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com o botao Pagar decidido por gravada, e nao por natureza."
            exit 1
          fi
          if npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::A marcacao ficou verde com Pagar em toda conta prevista."
            exit 1
          fi
          cp $ACOES.orig $ACOES

          # 9) A FATURA SINTETIZADA PERDE O DONO. O defeito que ESCAPOU de 104
          #    assercoes verdes e foi para producao na HMO-311: sem `user_id`,
          #    `linhaPrevista` marca a fatura aberta `posso_editar: false` e o
          #    botao Pagar some -- exatamente no sabor que a fase existe para
          #    alcancar.
          #
          #    Ele nao mora em `acoes-da-linha.ts`, e esta aqui de proposito: o
          #    que ele mede e a CADEIA (sintetizar -> linhaPrevista ->
          #    podePagarAFatura), que e a unica coisa que teria pego o defeito.
          #    Toda fixture escrita a mao concordava com as outras.
          AGENDA=lib/agenda-do-cartao.ts
          cp $AGENDA $AGENDA.orig
          sed -i '/^      user_id: userId,$/d' $AGENDA
          mutou $AGENDA 9
          if npm run test:acoes-da-linha > /dev/null 2>&1; then
            echo "::error::Verde com a fatura sintetizada chegando a tela como linha de outra pessoa."
            mv $AGENDA.orig $AGENDA
            exit 1
          fi
          if npm run test:fatura-prevista > /dev/null 2>&1; then
            echo "::error::A sintese ficou verde sem carimbar o dono da leitura."
            mv $AGENDA.orig $AGENDA
            exit 1
          fi
          mv $AGENDA.orig $AGENDA

          echo "A verificacao das acoes fica vermelha nos nove defeitos."

      - name: 'A arvore voltou ao lugar depois de "A verificacao das acoes sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .ts.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "Confirmar move a linha de Previsto para Realizado"
      - name: Confirmar move a linha de Previsto para Realizado
        run: npm run test:lista-na-tela

      # nota: verificacao-notas.md -> "A sonda do gesto sabe falhar"
      - name: A sonda do gesto sabe falhar
        run: |
          set -uo pipefail
          LISTA=components/movimentacoes/ListaDeMovimentacao.tsx
          cp $LISTA $LISTA.orig
          trap 'mv $LISTA.orig $LISTA' EXIT

          mutou() {
            if diff -q "$1.orig" "$1" > /dev/null; then
              echo "::error::O mutante $2 nao alterou $1 -- a ancora do sed mudou."
              exit 1
            fi
          }

          # 1) A ACAO CHAMA A ROTA E NAO RELE. O caso que a issue chama de "a
          #    assercao que importa": a rota responde 200, o dinheiro anda, e a
          #    linha fica em Previsto.
          sed -i '/await carregar();/d' $LISTA
          mutou $LISTA 1
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a acao chamando a rota e nao relendo a lista."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 2) A PERGUNTA APARECE E O "NAO" E IGNORADO. O unico sintoma seria a
          #    linha sumindo depois de alguem clicar em Cancelar.
          sed -i 's|if (!confirm(aviso)) return;|confirm(aviso);|' $LISTA
          mutou $LISTA 2
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a exclusao acontecendo apesar do Cancelar."
            exit 1
          fi
          cp $LISTA.orig $LISTA

          # 3) O BOTAO PAGAR APARECE E O CLIQUE NAO FAZ NADA (HMO-311, fase 14).
          #    O defeito que SO esta sonda ve, e o mais caro dos tres estados que
          #    o cabecalho de lib/acoes-da-linha.ts enumera: `onClick` nao sai no
          #    HTML e nunca e chamado por um render de servidor, entao a tela sai
          #    IDENTICA -- `test:secao-da-tela` continua verde, e e por isso que
          #    as duas asserçoes abaixo estao no mesmo mutante.
          SECAO=components/movimentacoes/SecaoDaTela.tsx
          cp $SECAO $SECAO.orig
          sed -i 's|onClick={() => acoes.aoPagarFatura(linha)}||' $SECAO
          mutou $SECAO 3
          if ! npm run test:secao-da-tela > /dev/null 2>&1; then
            echo "::error::test:secao-da-tela reprovou o onClick apagado -- o mutante 3 deixou de medir o que so a sonda ve. Rever este bloco."
            mv $SECAO.orig $SECAO
            exit 1
          fi
          if npm run test:lista-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o botao Pagar aparecendo e o clique nao abrindo o dialogo."
            mv $SECAO.orig $SECAO
            exit 1
          fi
          mv $SECAO.orig $SECAO

          echo "A sonda do gesto fica vermelha nos tres defeitos."

      - name: 'A arvore voltou ao lugar depois de "A sonda do gesto sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .tsx.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "O Fluxo de Caixa avisa que o numero e copia do aparelho"
      - name: O Fluxo de Caixa avisa que o numero e copia do aparelho
        run: npm run test:fluxo-na-tela

      # nota: verificacao-notas.md -> "A sonda do aviso de copia sabe falhar"
      - name: A sonda do aviso de copia sabe falhar
        run: |
          set -uo pipefail
          FLUXO='app/(dashboard)/dashboard/cash-flow/page.tsx'
          cp "$FLUXO" "$FLUXO.orig"
          trap 'mv "$FLUXO.orig" "$FLUXO"' EXIT

          mutou() {
            if diff -q "$1.orig" "$1" > /dev/null; then
              echo "::error::O mutante $2 nao alterou $1 -- a ancora do sed mudou."
              exit 1
            fi
          }

          # 1) A TELA VOLTA A CALAR. O defeito da issue, exatamente: a copia de
          #    ate sete dias na tela, completa e plausivel, sem uma palavra sobre
          #    de quando e.
          sed -i 's|{estado === "do-aparelho" \&\& (|{false \&\& (|' "$FLUXO"
          mutou "$FLUXO" 1
          if npm run test:fluxo-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a tela mostrando a copia do aparelho sem avisar que e copia."
            exit 1
          fi
          cp "$FLUXO.orig" "$FLUXO"

          # 2) A FAIXA VIRA MOLDURA. O gemeo do 1: ela passa a aparecer tambem
          #    sobre a resposta da REDE, e deixa de significar alguma coisa.
          sed -i 's|{estado === "do-aparelho" \&\& (|{true \&\& (|' "$FLUXO"
          mutou "$FLUXO" 2
          if npm run test:fluxo-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a faixa de dado velho aparecendo sobre dado fresco."
            exit 1
          fi
          cp "$FLUXO.orig" "$FLUXO"

          # 3) A TELA VOLTA A AFIRMAR O VAZIO. Com a copia do aparelho a lista
          #    pode ser de ANTES da primeira conta cadastrada, e "Cadastre suas
          #    contas" convida a cadastrar de novo o que ja existe.
          sed -i 's|eventos.length === 0 \&\& podeAfirmarVazio(estado)|eventos.length === 0|' "$FLUXO"
          mutou "$FLUXO" 3
          if npm run test:fluxo-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a tela afirmando 'nenhum compromisso previsto' sobre copia guardada."
            exit 1
          fi
          cp "$FLUXO.orig" "$FLUXO"

          # 4) O BOTAO "ATUALIZAR" NAO FURA A COPIA. Ele responderia com a mesma
          #    copia e a mesma faixa: botao que nao muda nada e pior que botao
          #    nenhum, porque a pessoa conclui que o app travou.
          sed -i 's|if (semCopia) query.set(PARAM_SEM_COPIA, String(Date.now()));||' "$FLUXO"
          mutou "$FLUXO" 4
          if npm run test:fluxo-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com o botao Atualizar pedindo a mesma copia de novo."
            exit 1
          fi
          cp "$FLUXO.orig" "$FLUXO"

          # 5) O DESVIO VIRA REGRA. O gemeo do 4, e o mais caro dos dois: o
          #    parametro em TODA carga apaga a leitura offline justamente da tela
          #    mais pesada do app, que e onde ela mais serve.
          sed -i 's|if (semCopia) query.set(PARAM_SEM_COPIA|query.set(PARAM_SEM_COPIA|' "$FLUXO"
          mutou "$FLUXO" 5
          if npm run test:fluxo-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a tela furando o cache do aparelho em toda carga."
            exit 1
          fi
          cp "$FLUXO.orig" "$FLUXO"

          # 6) SEM REDE VOLTA AO ZERO CONFIANTE. Sem o painel, a tela sem rede
          #    nenhuma volta a desenhar o que sobrou do estado anterior.
          sed -i 's|estado === "sem-rede" ? (|false ? (|' "$FLUXO"
          mutou "$FLUXO" 6
          if npm run test:fluxo-na-tela > /dev/null 2>&1; then
            echo "::error::Verde com a tela sem rede nenhuma nao mostrando o painel de sem conexao."
            exit 1
          fi
          cp "$FLUXO.orig" "$FLUXO"

          echo "A sonda do aviso de copia fica vermelha nos seis defeitos."

      - name: 'A arvore voltou ao lugar depois de "A sonda do aviso de copia sabe falhar"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois do restore do .tsx.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "O cartao no Realizado do painel"
      - name: O cartao no Realizado do painel
        run: npm run test:realizado-do-caixa

      # nota: verificacao-notas.md -> "'A verificacao sabe falhar (realizado-do-caixa)'"
      - name: 'A verificacao sabe falhar (realizado-do-caixa)'
        run: |
          set -uo pipefail
          LIB=lib/realizado-do-caixa.ts
          # O DONO do criterio "esta linha e pagamento de fatura" (HMO-265). O
          # sinal estrito do mutante 3 mora AQUI desde que a copia local saiu
          # deste arquivo -- ver o cabecalho de `ehPagamentoDaFatura`.
          DONO=lib/telas-de-movimentacao.ts
          cp $LIB $LIB.orig
          cp $DONO $DONO.orig
          trap 'mv $LIB.orig $LIB; mv $DONO.orig $DONO' EXIT

          # Recebe o ARQUIVO, porque os mutantes desta sonda nao estao todos no
          # mesmo: o 3 planta no dono do criterio, nao em `realizado-do-caixa`.
          mutou() {
            if cmp -s "$1" "$1.orig"; then
              echo "::error::o sed de '$2' nao casou nada em $1 -- o mutante nao foi aplicado e o passo mediria a fonte intacta"
              exit 1
            fi
          }

          # 1) O DEFEITO DESTA ISSUE, INTACTO. A compra no cartao conta no dia
          #    da compra E a fatura conta de novo no dia do pagamento.
          sed -i 's|if (ehCompraNoCartao(linha)) continue;|if (false) continue;|' $LIB
          mutou $LIB "compra no cartao fica"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com a compra no cartao contada no dia da COMPRA, junto da fatura que ja a contem."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 2) O CARTAO DESAPARECIDO (HMO-264). A fatura paga nao entra em lugar
          #    nenhum: o mes em que se pagou R$ 1.290 fica R$ 1.290 mais barato.
          #
          #    O ancora era `ehSaidaDePagamentoDeFatura`, a copia LOCAL do
          #    criterio, que a HMO-265 apagou deste arquivo em favor do dono
          #    unico (`ehPagamentoDaFatura`, importado). Renomeou-se a chamada,
          #    e o ancora ficou para tras.
          sed -i 's|if (ehPagamentoDaFatura(linha)) {|if (false) {|' $LIB
          mutou $LIB "fatura paga nao entra"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com a fatura PAGA fora do Realizado: o cartao sumiu dos dois lados."
            exit 1
          fi
          cp $LIB.orig $LIB

          # 3) A FATURA EM DOBRO. As duas pernas do pagamento tem a mesma data,
          #    a mesma chave e o mesmo tipo, e `agregarTransacoes` aplica
          #    Math.abs antes de somar -- entao elas NAO se anulam.
          #
          #    PLANTA NO $DONO, E NAO EM $LIB. O sinal estrito era
          #    `Number(linha.amount) < 0` dentro da copia local que a HMO-265
          #    apagou; hoje a decisao e uma so, a ultima linha de
          #    `ehPagamentoDaFatura`, e `crua` e o nome do parametro la.
          sed -i 's|  return Number(crua.amount) < 0;|  return true;|' $DONO
          mutou $DONO "as duas pernas entram"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com as DUAS pernas do pagamento somando: a fatura em dobro no total de despesas."
            exit 1
          fi
          # Restaura o $DONO, que foi quem este mutante plantou. Restaurar $LIB
          # aqui deixaria o mutante 4 medindo uma arvore AINDA mutada.
          cp $DONO.orig $DONO

          # 4) A COLUNA QUE NINGUEM VE. `account_type` nao aparece na tela, e
          #    tirar do `select` nao quebra tsc nem assercao de unidade: a regra
          #    recebe `undefined`, deixa de casar com credit_card, para de
          #    filtrar, e o painel volta ao defeito. Foi este o modo de falha da
          #    HMO-260.
          sed -i 's|, account:financial_accounts(account_type)";|";|' $LIB
          mutou $LIB "select sem o embed da conta"
          if npm run test:realizado-do-caixa > /dev/null 2>&1; then
            echo "::error::Verde com a consulta SEM account_type: a regra nao tem como saber que a linha esta na fatura."
            exit 1
          fi

          echo "A verificacao fica vermelha nas quatro armadilhas."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (realizado-do-caixa)"'
        run: |
          # O .tmp-* compilado guarda o mutante mesmo depois de o .ts voltar, e
          # os passos seguintes rodariam contra ele.
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore. Os passos seguintes rodariam sobre codigo mutado."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "A regra do cartao pela fatura esta ligada de ponta a ponta"
      - name: A regra do cartao pela fatura esta ligada de ponta a ponta
        run: node scripts/check-cartao-pela-fatura.mjs

      - name: 'A verificacao sabe falhar (fiacao do cartao pela fatura)'
        run: |
          set -uo pipefail
          GUARD=scripts/check-cartao-pela-fatura.mjs

          # Cada mutacao desliga UM ponto da fiacao e restaura em seguida. O
          # `cmp` existe porque um `sed -i` que nao casa SAI 0: sem ele, uma
          # ancora renomeada por outra issue faria este passo medir a arvore
          # intacta e ficar verde para sempre.
          desligar() {
            local arquivo="$1" de="$2" para="$3" rotulo="$4"
            cp "$arquivo" "$arquivo.orig265"
            sed -i "s@$de@$para@" "$arquivo"
            if cmp -s "$arquivo" "$arquivo.orig265"; then
              mv "$arquivo.orig265" "$arquivo"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            if node "$GUARD" > /dev/null 2>&1; then
              mv "$arquivo.orig265" "$arquivo"
              echo "::error::Verde com a fiacao desligada: $rotulo"
              exit 1
            fi
            mv "$arquivo.orig265" "$arquivo"
            echo "  vermelho em: $rotulo"
          }

          desligar 'app/(dashboard)/dashboard/page.tsx' '\&cartao=fatura' '' \
            'o painel para de PEDIR a regra -- a rota responde o total antigo'
          desligar 'app/api/reports/cash-flow/route.ts' 'realizadoComCartaoPelaFatura(linhas)' 'linhas.slice()' \
            'a rota importa a regra e NAO a chama'
          desligar 'app/api/dashboard/previsao/route.ts' 'agendaSemCompraNoCartao(' 'Array.from(' \
            'a Previsao para de tirar a compra no cartao -- o cartao em dobro'
          desligar 'app/api/dashboard/previsao/route.ts' 'faturasPrevistasDaJanela(supabase' 'naoChama(supabase' \
            'a Previsao para de sintetizar a fatura ABERTA -- o cartao desaparece'
          # OS DOIS DE lib/realizado-do-caixa.ts. Eram os UNICOS pontos da lista
          # do guard sem mutante -- e por isso o par mais barato de apodrecer: a
          # HMO-317 renomeou a leitura local `ehFatura(notes)` para o dono unico
          # `ehPagamentoDaFatura(linha)`, a exigencia ficou no nome antigo, e o
          # guard entrou VERMELHO na main na #211. O vermelho so apareceu quando
          # o Actions voltou a iniciar job (HMO-242) -- dez controles negativos
          # aqui e nenhum cobria estas duas linhas.
          desligar 'lib/realizado-do-caixa.ts' 'if (ehPagamentoDaFatura(linha)) {' 'if (false) {' \
            'a fatura PAGA para de virar despesa do mes em que o dinheiro saiu'
          desligar 'lib/realizado-do-caixa.ts' ', account:financial_accounts(account_type)"' '"' \
            'a consulta para de pedir account_type -- a regra nao sabe o que esta na fatura'

          desligar 'lib/realizado-e-previsao.ts' '  direction: string | null | undefined' '  direction: string | null | undefined, ehFatura: boolean' \
            'direcaoNoPainel volta a receber o segundo argumento que a HMO-265 tirou'

          # OS QUATRO DA HMO-266: a legenda que separa as duas leituras.
          #
          # A HMO-266 decidiu NAO estender a regra do cartao a tela de
          # relatorios, e o preco e que as duas telas divergem de proposito --
          # medidos R$ 3.345 no painel contra R$ 7.545 nos relatorios, na fixture
          # de 6 meses. A legenda e o que separa isso de um defeito aos olhos de
          # quem compara, e ela e tao muda quanto a fiacao acima quando quebra.
          desligar 'app/api/reports/cash-flow/route.ts' 'cartao: "compra",' '' \
            'o ramo mensal da rota para de dizer qual criterio usou'

          # O RENOMEIO, e nao a remocao. Este e o caso que passou VERDE na
          # primeira versao da exigencia: a tela le `d.cartao`, entao renomear o
          # campo quebra a legenda -- e `includes('cartao: "compra"')` casa DENTRO
          # de `grao_do_cartao: "compra"`. Por isso aquela exigencia e a unica da
          # lista escrita como regex.
          desligar 'app/api/reports/cash-flow/route.ts' 'cartao: "compra",' 'grao_do_cartao: "compra",' \
            'o campo do criterio e RENOMEADO -- a tela le d.cartao e nao acha nada'

          desligar 'app/(dashboard)/dashboard/reports/page.tsx' 'legendaDoCartao(fluxo?.cartao)' 'legendaDoCartao("compra")' \
            'a tela de relatorios crava o criterio em vez de ler o da resposta'

          # CHAMA E NAO RENDERIZA. O mais silencioso dos cinco: a chamada fica no
          # lugar, `legendaDoFluxo` continua sendo calculado, e a tela nao mostra
          # nada. Nenhum lint reclama de uma variavel usada uma vez a menos no
          # JSX, e o guard do import nao ajuda aqui porque o import e usado.
          desligar 'app/(dashboard)/dashboard/reports/page.tsx' '{legendaDoFluxo}' '{null}' \
            'a tela de relatorios calcula a legenda e NAO a renderiza'

          desligar 'app/(dashboard)/dashboard/page.tsx' 'LEGENDA_DO_CARTAO.fatura' '""' \
            'o painel perde a legenda gemea -- so UMA das duas telas explica'

          echo "A verificacao fica vermelha nos doze pontos de fiacao."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (fiacao do cartao pela fatura)"'
        run: |
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore -- procure por um .orig265 esquecido."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "As duas legendas do criterio do cartao formam um par que se explica"
      - name: As duas legendas do criterio do cartao formam um par que se explica
        run: npm run test:criterio-do-cartao

      # nota: verificacao-notas.md -> "'A verificacao sabe falhar (legendas do criterio do cartao)'"
      - name: 'A verificacao sabe falhar (legendas do criterio do cartao)'
        run: |
          set -uo pipefail
          FONTE=lib/criterio-do-cartao.ts

          estragar() {
            local de="$1" para="$2" rotulo="$3"
            cp "$FONTE" "$FONTE.orig266"
            # `g` no final, e nao por gosto: sem ele o `sed` troca a primeira
            # ocorrencia de cada linha e deixa as outras -- e a troca das duas
            # legendas abaixo depende de casar as DUAS chaves.
            sed -i "s@$de@$para@g" "$FONTE"
            if cmp -s "$FONTE" "$FONTE.orig266"; then
              mv "$FONTE.orig266" "$FONTE"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            # O .tmp-* compilado guarda o mutante mesmo depois de o .ts voltar.
            # Aqui o alvo recompila por hash de conteudo (HMO-263), mas o rm e
            # barato e nao depende disso estar certo.
            rm -rf .tmp-criterio-do-cartao
            if npm run test:criterio-do-cartao > /dev/null 2>&1; then
              mv "$FONTE.orig266" "$FONTE"
              echo "::error::Verde com a legenda estragada: $rotulo"
              exit 1
            fi
            mv "$FONTE.orig266" "$FONTE"
            rm -rf .tmp-criterio-do-cartao
            echo "  vermelho em: $rotulo"
          }

          # 1) AS DUAS TROCADAS DE LUGAR. O mutante central desta suite: cada
          #    tela passa a exibir a legenda da outra, e as duas prometem a
          #    diferenca com o sinal invertido.
          #    Nao usa o `estragar` porque e um sed de TRES substituicoes
          #    encadeadas (compra -> TROCA -> fatura -> compra), e o helper
          #    recebe um par so.
          cp "$FONTE" "$FONTE.orig266"
          sed -i 's@^  compra:$@  TROCA:@; s@^  fatura:$@  compra:@; s@^  TROCA:$@  fatura:@' "$FONTE"
          if cmp -s "$FONTE" "$FONTE.orig266"; then
            mv "$FONTE.orig266" "$FONTE"
            echo "::error::a troca das duas legendas nao casou nada -- as chaves do mapa mudaram de nome"
            exit 1
          fi
          rm -rf .tmp-criterio-do-cartao
          if npm run test:criterio-do-cartao > /dev/null 2>&1; then
            mv "$FONTE.orig266" "$FONTE"
            echo "::error::Verde com as duas legendas TROCADAS de lugar."
            exit 1
          fi
          mv "$FONTE.orig266" "$FONTE"
          rm -rf .tmp-criterio-do-cartao
          echo "  vermelho em: as duas legendas trocadas de lugar"

          # 2) A FUNCAO IGNORA O CAMPO. Devolver sempre a legenda do consumo faz
          #    a tela afirmar "conta na compra" debaixo de um total que pode ter
          #    sido calculado pela fatura.
          estragar 'if (cartao !== "compra" \&\& cartao !== "fatura") return null;' 'if (false) return null;' \
            'legendaDoCartao aceita qualquer valor como criterio'

          # 3) A LEGENDA PARA DE NOMEAR A OUTRA TELA. O defeito que parece
          #    inofensivo: a frase continua verdadeira e deixa de resolver o
          #    problema de quem esta comparando as duas telas.
          estragar 'O painel conta no mês ' 'Este total conta no mês ' \
            'a legenda dos relatorios para de nomear o painel'

          # 4) A DIRECAO INVERTIDA EM UM LADO SO.
          estragar 'menor enquanto houver fatura' 'maior enquanto houver fatura' \
            'a legenda dos relatorios inverte a direcao da diferenca'

          # 5) "OS DOIS ESTAO CERTOS" SAI DO TEXTO. Sem isso a legenda explica a
          #    divergencia e deixa de pe a pergunta que a pessoa foi fazer.
          estragar 'os dois estão certos, e são ' 'são ' \
            'a legenda para de dizer que os dois totais estao certos'

          # 6 e 7) O CONTRATO COM A ROTA, que e a unica assercao da suite que
          #    nao e sobre texto. O arquivo mutado aqui e a ROTA, nao o modulo,
          #    e e por isso que estes dois nao usam o `estragar` acima.
          #
          #    "consumo" nao e um nome inventado para o mutante: e como a
          #    HMO-266 chama este criterio em prosa, inclusive no cabecalho de
          #    lib/criterio-do-cartao.ts. Renomear o valor para a palavra que
          #    todo mundo usa e a forma mais plausivel de quebrar isto, e nao
          #    aparece em lugar nenhum -- a tela recebe o campo, nao reconhece, e
          #    nao renderiza legenda.
          estragar_rota() {
            local de="$1" para="$2" rotulo="$3"
            local R=app/api/reports/cash-flow/route.ts
            cp "$R" "$R.orig266"
            sed -i "s@$de@$para@g" "$R"
            if cmp -s "$R" "$R.orig266"; then
              mv "$R.orig266" "$R"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora na rota mudou"
              exit 1
            fi
            rm -rf .tmp-criterio-do-cartao
            if npm run test:criterio-do-cartao > /dev/null 2>&1; then
              mv "$R.orig266" "$R"
              echo "::error::Verde com a rota emitindo um criterio sem legenda: $rotulo"
              exit 1
            fi
            mv "$R.orig266" "$R"
            rm -rf .tmp-criterio-do-cartao
            echo "  vermelho em: $rotulo"
          }

          estragar_rota 'cartao: "compra",' 'cartao: "consumo",' \
            'o ramo mensal renomeia o VALOR para "consumo" -- a tela fica sem legenda'
          estragar_rota 'cartao: cartaoPelaFatura ? "fatura" : "compra",' 'cartao: cartaoPelaFatura ? "caixa" : "compra",' \
            'o ramo de intervalo renomeia o valor para "caixa" -- o painel fica sem legenda'

          echo "A verificacao fica vermelha nos sete modos de falha do par de legendas."

      - name: 'A arvore voltou ao lugar depois de "A verificacao sabe falhar (legendas do criterio do cartao)"'
        run: |
          rm -rf .tmp-*
          git status --porcelain > "$RUNNER_TEMP/arvore-agora.txt"
          if ! diff -q "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" > /dev/null; then
            echo "::error::O controle negativo acima nao restaurou a arvore -- procure por um .orig266 esquecido."
            diff "$RUNNER_TEMP/arvore-base.txt" "$RUNNER_TEMP/arvore-agora.txt" || true
            exit 1
          fi

      # nota: verificacao-notas.md -> "O rebalanceamento da divisao do grupo fecha 100% em centesimos inteiros"
      - name: O rebalanceamento da divisao do grupo fecha 100% em centesimos inteiros
        run: npm run test:divisao-configurada

      # nota: verificacao-notas.md -> "'A verificacao sabe falhar (divisao configurada do grupo)'"
      - name: 'A verificacao sabe falhar (divisao configurada do grupo)'
        run: |
          set -uo pipefail
          REGRAS=lib/divisao-configurada.ts

          # O `cmp` existe porque um `sed -i` que nao casa SAI 0: sem ele, uma
          # ancora reescrita por outra issue faria este passo medir a arvore
          # INTACTA e ficar verde para sempre, com o rotulo mentindo sobre o que
          # foi provado.
          estragar() {
            local de="$1" para="$2" rotulo="$3"
            cp "$REGRAS" "$REGRAS.orig267"
            sed -i "s@$de@$para@" "$REGRAS"
            if cmp -s "$REGRAS" "$REGRAS.orig267"; then
              mv "$REGRAS.orig267" "$REGRAS"
              echo "::error::o sed de '$rotulo' nao casou nada -- a ancora mudou e este controle mediria a arvore intacta"
              exit 1
            fi
            if npm run test:divisao-configurada > /dev/null 2>&1; then
              mv "$REGRAS.orig267" "$REGRAS"
              echo "::error::Verde com a regra estragada: $rotulo"
              exit 1
            fi
            mv "$REGRAS.orig267" "$REGRAS"
            echo "  vermelho em: $rotulo"
          }

          # 1) MAIOR RESTO -> ARREDONDAMENTO. O controle que a issue nomeia.
          #    `70/3` NAO distingue os dois (23,33 arredonda e trunca para o
          #    mesmo 2333); o que distingue e uma sobra com parte fracionaria
          #    >= 0,5 em mais de um membro -- 3500 centesimos entre tres da
          #    1166,67 cada, e tres arredondamentos para cima somam 3501. A
          #    config passa a somar 100,01%.
          estragar 'const base = efetivos\.map((p) => Math\.floor((total \* p) / soma));' \
                   'const base = efetivos.map((p) => Math.round((total * p) / soma));' \
                   'o maior resto vira arredondamento -- a config soma 100,01%'

          # 2) O DEGRAU DO 0/0. Sem ele, o grupo que ninguem configurou (todos em
          #    0,00) sai com a lista inteira em `NaN`, e a tela mostra "NaN%".
          estragar 'const soma = somaPesos > 0 ? somaPesos : pesos\.length;' \
                   'const soma = somaPesos;' \
                   'o degrau da divisao igual some -- todos em zero viram NaN%'

          # 3) O MEMBRO EM 0% VOLTANDO PARA A DESPESA. `expense_splits.percentage`
          #    exige `> 0`: uma linha com 0,00 derruba o INSERT inteiro, e a
          #    mensagem do CHECK nao diz nada a quem lancou a despesa.
          estragar '\.filter((m) => m\.peso > 0)' \
                   '.filter((m) => m.peso >= 0)' \
                   'membro em 0% volta a entrar na despesa com parte zerada'

          # 4) A CONFERENCIA DA SOMA NA LEITURA. O que chega em `divisaoDaDespesa`
          #    vem do banco, uma linha por membro, e a RLS `group_members_update`
          #    deixa qualquer membro escrever a PROPRIA `percentage` pelo
          #    PostgREST. Nao ha CHECK que veja a soma: um "eu pago 1%" feito por
          #    fora faria a despesa fechar 96% do valor, em silencio.
          estragar 'if (soma !== CENTESIMOS_TOTAIS) {' \
                   'if (false) {' \
                   'a conferencia da soma some -- a despesa fecha 96% do valor'

          echo "A verificacao fica vermelha nos quatro pontos."

