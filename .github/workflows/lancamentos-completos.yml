name: lancamentos completos

# Prova, a cada PR, as duas coisas que a HMO-215 pediu da aba Financas Pessoais
# -- "todos os lancamentos, indiferente de onde foi" e "indicar o tipo, o valor,
# o destino, a categoria":
#
#   1. O DESTINO de cada linha (lib/destino-do-lancamento.ts). `account_id` esta
#      em financial_transactions desde o 001 e nao tinha leitor na lista. Sem
#      ele, duas despesas iguais em contas diferentes -- mesmo mercado, mesmo
#      valor, mesmo dia, uma no cartao e uma no debito -- ficam IDENTICAS na
#      tela, e a leitura natural e que a despesa foi lancada em duplicata. Essa
#      leitura termina em alguem apagando uma despesa real.
#
#   2. A MINHA PARTE das despesas de grupo que outra pessoa pagou
#      (lib/parte-de-grupo-na-lista.ts). Ela esta gravada em
#      group_expense_splits, o painel ja a conta como realizado (migration 033),
#      e a lista nunca a mostrou -- o mes de quem nao pagou parecia mais barato
#      do que foi.
#
# SEM FILTRO DE `paths`, como o workflow lancamento. As duas suites rodam em
# milissegundos e nao precisam de banco, entao podem ser obrigatorias em todo PR
# sem virar pedagio -- e um filtro que liste os arquivos de hoje perde o dia em
# que alguem mexer no de amanha. Foi exatamente assim que tres suites deste
# repositorio ficaram paradas em verde (ver scripts/check-tests-in-ci.mjs).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lancamentos-completos:
    name: a lista mostra tudo, e diz para onde o dinheiro foi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # O `--include=dev` e explicito porque um ambiente com NODE_ENV=production
      # poda as devDeps na instalacao e o tsc some sem mensagem que explique.
      - run: npm ci --include=dev

      - name: O destino de cada linha, e a minha parte do que outros pagaram
        run: npm run test:lancamentos-completos

      # Controle negativo. A suite afirma sobre SINAL, sobre CONTAGEM e sobre
      # SENTIDO -- tres coisas que erram dinheiro na tela sem levantar excecao
      # nenhuma. Uma verificacao que nunca viu vermelho nao e verificacao.
      #
      # A prova de mutacao completa e `node scripts/mutantes-lancamentos-completos.mjs`
      # (26 mutantes, ferramenta de quem escreve o teste). Aqui ficam os quatro
      # que mais custam, plantados um por vez.
      - name: A verificacao sabe falhar
        run: |
          set -uo pipefail
          DESTINO=lib/destino-do-lancamento.ts
          PARTE=lib/parte-de-grupo-na-lista.ts
          cp $DESTINO $DESTINO.orig
          cp $PARTE $PARTE.orig
          trap 'mv $DESTINO.orig $DESTINO; mv $PARTE.orig $PARTE' EXIT

          # 1) A PARTE DE GRUPO ENTRANDO POSITIVA. A view do 033 devolve a parte
          #    POSITIVA (200.00 para uma despesa de -400.00) e a lista pinta pelo
          #    sinal. Sem o `-Math.abs`, a minha parte do jantar aparece em VERDE,
          #    como receita -- e o numero exibido continua certo, porque a tela
          #    usa Math.abs para formatar. Nada nessa linha parece errado.
          sed -i 's|amount: -Math.abs(parte.amount),|amount: parte.amount,|' $PARTE
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a minha parte da despesa de grupo entrando como RECEITA."
            exit 1
          fi
          cp $PARTE.orig $PARTE

          # 2) A CONTAGEM DUPLA. A view devolve tambem a MINHA parte da despesa
          #    que eu mesmo paguei (`paguei_eu`), e os R$ 400 cheios ja estao na
          #    lista como transacao minha. Sem a guarda, o hotel aparece duas
          #    vezes e soma R$ 600 de um gasto de R$ 400.
          sed -i 's|if (parte.paguei_eu) continue;|if (false) continue;|' $PARTE
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a despesa que EU paguei contada duas vezes."
            exit 1
          fi
          cp $PARTE.orig $PARTE

          # 3) A BARRA DE ABAS DISCORDANDO DA LISTA. A contagem ao lado de
          #    "Despesas" tem que casar com o que a aba mostra; ignorando as
          #    partes, a aba anuncia 4 e abre com 6 linhas.
          sed -i 's|todos: minhas.length + partes.length,|todos: minhas.length,|' $PARTE
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a contagem da barra ignorando as partes de grupo."
            exit 1
          fi
          cp $PARTE.orig $PARTE

          # 4) A SETA DA TRANSFERENCIA AO CONTRARIO. As duas pernas sao duas
          #    linhas com a mesma descricao e o mesmo valor; o sentido sai do
          #    SINAL. Invertido, a tela afirma que o dinheiro foi da poupanca
          #    para a corrente quando foi o contrario -- e se le como fato.
          sed -i 's|const souASaida = mov.amount < 0;|const souASaida = mov.amount > 0;|' $DESTINO
          if npm run test:lancamentos-completos > /dev/null 2>&1; then
            echo "::error::Verde com a seta da transferencia apontando para o lado errado."
            exit 1
          fi

          echo "A verificacao fica vermelha nos quatro defeitos."
