name: pwa-assets

# Prova, a cada mudanca no codigo, que o app continua INSTALAVEL no celular.
#
# O modo de falha aqui foi o mais silencioso que este projeto ja teve. Os dez
# arquivos de `public/icons/*.png` eram documentos SVG com nome `.png`, e o
# `favicon.ico` tambem. Nada reclamava:
#
#   * a Vercel escolhe o `Content-Type` pela EXTENSAO, entao ela servia os
#     arquivos como `image/png` com HTTP 200 -- o servidor concordava;
#   * o manifest declarava `"type": "image/png"` -- o manifest concordava;
#   * `next build`, `tsc` e o lint nao olham dentro de arquivo em `public/`.
#
# E o Chrome no Android so oferece instalar quando consegue DECODIFICAR um
# icone de 192px ou mais do manifest; ele nao aceita SVG nesse papel. Como
# nenhum dos dez decodificava, o evento `beforeinstallprompt` nunca era
# emitido e o banner "Instalar Pulo do Gato" -- escrito, correto e commitado --
# nunca aparecia. O app nao podia ser instalado, e a unica evidencia disso era
# a ausencia de um banner que ninguem sabia que deveria estar la.
#
# Junto com os icones havia catorze caminhos declarados para arquivos que nunca
# existiram (sete telas de abertura do iOS, `/logo_pulodogato.svg`, os icones
# dos atalhos, as capturas de tela) e dois atalhos apontando para rotas sem
# `page.tsx`. Nenhum deles quebra build: um `<link>` morto nao gera erro.
#
# SEM FILTRO DE `paths`, de proposito. A regressao nasce de qualquer lado --
# trocar um icone, renomear uma rota que um atalho cita, acrescentar um
# `<link>` no layout. A verificacao e Node puro e roda em segundos, entao pode
# ser obrigatoria em todo PR sem virar pedagio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assets:
    name: todo asset declarado existe e e o que diz ser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem `npm ci`: guard e testes sao Node puro, so com a biblioteca padrao.
      - name: Assets do manifest, do layout e do browserconfig
        run: npm run check-pwa-assets

      - name: O codec PNG le e escreve o que promete
        run: npm run test:png

      - name: O guard reprova cada defeito que ja esteve em producao
        run: npm run test:pwa-assets

      # Controle negativo. Uma verificacao que nunca viu vermelho nao e
      # verificacao -- e esta, em particular, passaria verde se parasse de
      # achar os arquivos que deve conferir.
      - name: A verificacao sabe falhar
        run: |
          set -uo pipefail
          trap 'git checkout -- public/icons/icon-192x192.png public/manifest.json next.config.js' EXIT

          # 1) O defeito original: SVG com nome .png, servido como image/png.
          printf '<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"><svg/>' \
            > public/icons/icon-192x192.png
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com um SVG chamado icon-192x192.png."
            exit 1
          fi
          git checkout -- public/icons/icon-192x192.png

          # 2) Atalho apontando para rota que nao existe -- os dois atalhos
          #    originais faziam isso, e so aparece depois do app instalado.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("public/manifest.json", "utf8"));
            m.shortcuts[0].url = "/dashboard/rota-que-nao-existe";
            fs.writeFileSync("public/manifest.json", JSON.stringify(m, null, 2));
          '
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com atalho para rota inexistente."
            exit 1
          fi
          git checkout -- public/manifest.json

          # 3) O desvio para /offline desligado. Este e o defeito que estava em
          #    producao ate aqui: a pagina existia, estava pronta, e NADA
          #    navegava ate ela -- o sw.js de producao tinha zero desvios. Com o
          #    default (`{}`), o next-pwa procura `pages/_offline.*`, nao acha
          #    (este projeto e App Router) e desliga os fallbacks sem imprimir
          #    nada no log do build.
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("next.config.js", "utf8");
            fs.writeFileSync("next.config.js", s.replace(/fallbacks:\s*\{[^}]*\},?/s, ""));
          '
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde sem o desvio para /offline."
            exit 1
          fi
          git checkout -- next.config.js

          # 4) O desvio apontando para rota que nao existe -- o jeito de
          #    reintroduzir o mesmo defeito sem apagar nenhuma linha.
          sed -i 's|document: "/offline"|document: "/rota-que-nao-existe"|' next.config.js
          if npm run check-pwa-assets > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com o desvio para rota inexistente."
            exit 1
          fi

          echo "A verificacao fica vermelha nas quatro formas de regressao."

      # Prova que os icones commitados sao os que o gerador produz hoje. Sem
      # isto, alguem pode editar um icone a mao e o proximo `npm run
      # generate-pwa-icons` desfaz a edicao sem aviso -- ou, pior, o gerador
      # quebra e ninguem descobre ate precisar dele.
      #
      # `--check` compara os PIXELS decodificados, nao os bytes do arquivo: o
      # tamanho do fluxo deflate muda com a versao do zlib, entao `git diff`
      # daria vermelho sempre que o Node do CI diferisse do de quem gerou --
      # um vermelho sem defeito atras, que ensina todo mundo a ignorar o job.
      - name: Os icones commitados saem do gerador
        run: node scripts/generate-pwa-icons.mjs --check

  convite:
    name: o convite de instalacao aparece na plataforma certa
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Este precisa do tsc, que e devDependency. O `--include=dev` e explicito
      # porque um ambiente com NODE_ENV=production poda as devDeps na
      # instalacao e o `tsc` some sem mensagem que explique o motivo.
      - run: npm ci --include=dev

      - name: iOS recebe instrucao, Android recebe o prompt, instalado nao recebe nada
        run: npm run test:pwa-install
