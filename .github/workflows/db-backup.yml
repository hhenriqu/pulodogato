name: db-backup

# Backup diario do banco de producao + deteccao de drift entre o banco real e
# database/migrations/001_baseline.sql.
#
# Precisa de dois secrets no repositorio (Settings -> Secrets and variables ->
# Actions). Enquanto eles nao existirem este job FALHA de proposito: um backup
# que nao roda em silencio e pior do que nenhum backup.
#
#   SUPABASE_DB_URL    Session Pooler, porta 5432 (nao o 6543, nao o host IPv6)
#                      Supabase -> Settings -> Database -> Connection string
#   BACKUP_PASSPHRASE  frase forte; sem ela nao ha como abrir o dump depois

on:
  schedule:
    - cron: '0 6 * * *'   # 03:00 em Brasilia
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'So testar a conexao, sem guardar artefato'
        type: boolean
        default: false

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: dump + conferencia de drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Conferir os secrets
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          faltando=''
          [ -z "$DB_URL" ]     && faltando="$faltando SUPABASE_DB_URL"
          [ -z "$PASSPHRASE" ] && faltando="$faltando BACKUP_PASSPHRASE"
          if [ -n "$faltando" ]; then
            echo "::error::Secrets faltando:$faltando -- nenhum backup esta sendo feito."
            exit 1
          fi

      # O pg_dump precisa ser >= a versao do servidor. O ubuntu-latest traz o 16;
      # o PGDG tem o 17.
      - name: Instalar pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          chmod +x scripts/db-backup.sh
          ./scripts/db-backup.sh "$RUNNER_TEMP/backups"

      # Sobe antes da conferencia de drift: se o drift falhar, o backup do dia
      # ja esta salvo.
      - name: Guardar o backup
        if: ${{ inputs.skip_upload != true }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backups
          retention-days: 90
          if-no-files-found: error

      - name: Estado da RLS em producao
        run: |
          inv="$(ls "$RUNNER_TEMP"/backups/*-roles-rls.txt | head -1)"
          {
            echo '## RLS em producao'
            if grep -q '^TABELA_SEM_RLS:' "$inv"; then
              echo '> [!CAUTION]'
              echo '> Ha tabelas sem RLS em `public` -- dado aberto para a chave anon publica.'
              echo '```'; grep '^TABELA_SEM_RLS:' "$inv"; echo '```'
            else
              echo 'Todas as tabelas de `public` estao com RLS ligada.'
            fi
            echo "Policies: $(grep -c '^POLICY:' "$inv" || true)"
            echo '### Privilegios da role anon'
            echo '```'; grep '^GRANT_ANON:' "$inv" || echo '(nenhum)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q '^TABELA_SEM_RLS:' "$inv"; then
            echo "::warning::Producao tem tabela sem RLS. Ver HMO-120 / database/migrations/002_rls_lockdown.sql"
          fi

      # O motivo original da HMO-117: o repositorio nao refletia o banco real.
      # Aqui isso vira erro visivel em vez de descoberta tardia.
      - name: Drift entre producao e 001_baseline.sql
        run: |
          dump="$(ls "$RUNNER_TEMP"/backups/*-schema.sql | head -1)"
          tabelas_prod=$(grep -oE '^CREATE TABLE (IF NOT EXISTS )?(public\.)?[a-z_]+' "$dump" \
            | sed -E 's/.* ([a-z_]+)$/\1/' | sort -u)
          tabelas_repo=$(grep -oiE '^CREATE TABLE (IF NOT EXISTS )?(public\.)?[a-z_]+' database/migrations/001_baseline.sql \
            | sed -E 's/.* ([a-z_]+)$/\1/' | tr 'A-Z' 'a-z' | sort -u)

          if diff <(echo "$tabelas_prod") <(echo "$tabelas_repo") > "$RUNNER_TEMP/drift.txt"; then
            echo 'Sem drift: producao e `001_baseline.sql` tem as mesmas tabelas.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Drift de schema'
              echo '`<` so em producao, `>` so no repositorio:'
              echo '```diff'; cat "$RUNNER_TEMP/drift.txt"; echo '```'
              echo 'Atualize `database/migrations/001_baseline.sql` com uma migration nova.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::O schema de producao divergiu de database/migrations/001_baseline.sql"
            exit 1
          fi
