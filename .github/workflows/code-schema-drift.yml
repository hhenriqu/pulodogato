name: code-schema-drift

# Prova, a cada mudanca no codigo, que toda tabela consultada pela aplicacao
# existe no schema versionado.
#
# Vive separado do db-verify de proposito, por duas razoes:
#
#   1. O db-verify e filtrado por `paths: ['database/**', ...]`. A deriva que a
#      HMO-124 encontrou nasce do lado do CODIGO -- uma rota nova que cita uma
#      tabela que ninguem criou nao toca em database/ nenhuma vez, e passaria
#      por baixo daquele filtro. Este job nao tem filtro de path.
#
#   2. Nao precisa de Postgres. Roda em segundos, entao pode ser obrigatorio em
#      todo PR sem virar pedagio.
#
# O modo de falha que ele cobre e o silencioso: o cliente do Supabase aceita
# qualquer string em `.from()`, o `tsc` e o `next build` passam, e o erro so
# aparece em producao como PGRST205 dentro de um catch que devolve 500 --
# tela vazia para o usuario, CI verde para nos.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  drift:
    name: codigo nao cita tabela fora do schema
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem `npm ci`: a verificacao e Node puro, so com a biblioteca padrao.
      # Instalar dependencia aqui so somaria minuto e um jeito novo de quebrar.
      - name: Tabelas citadas pelo codigo existem nas migrations
        run: node scripts/check-table-drift.mjs

      # A mesma deriva um nivel abaixo, e a que escapou por meses: o nome da
      # TABELA certo e o da COLUNA inventado. `GET /api/anomalies` respondia 500
      # em producao para todo usuario porque lia `transaction_categories.user_id`,
      # coluna que nunca existiu, e o passo acima nao tinha como ver -- a tabela
      # existe. Le o schema de database/schema-columns.json; o db-verify prova que
      # aquele arquivo continua igual ao banco que as migrations constroem.
      - name: Colunas pedidas pelo codigo existem nas relacoes
        run: node scripts/check-column-drift.mjs

      # Mora aqui, e nao no db-verify, pela mesma razao do passo acima: o
      # db-verify e filtrado por `paths` e este job nao. Uma migration nova
      # TOCA em database/, entao o filtro nao e o problema -- o problema e que
      # quem esquece o step do db-verify recebe o job VERDE, porque o arquivo
      # esquecido e justamente o que nao roda. A verificacao precisa vir de um
      # job que nao dependa do db-verify ter sido atualizado (HMO-145).
      - name: Toda migration e exercitada pelo db-verify
        run: node scripts/check-migrations-in-ci.mjs

      # Mesma familia do passo acima, e pela mesma razao. O
      # test:recurrence-detector entrou na main pelo PR #20 e ficou dias sem
      # rodar em workflow nenhum: o script existia, nada o chamava, e os jobs
      # continuavam verdes. Uma suite que ninguem executa da sensacao de
      # cobertura enquanto a regressao passa.
      - name: Toda suite de teste roda em algum workflow
        run: node scripts/check-tests-in-ci.mjs

      # Mora aqui pela mesma razao dos passos acima: e deriva do lado do CODIGO,
      # nao toca em database/, e o sintoma e a AUSENCIA de sintoma. Um modulo de
      # interface sem importador compila, passa no tsc, passa no next build e
      # nao cresce o bundle -- o empacotador nunca chega nele. O custo aparece
      # quando alguem abre o arquivo de nome mais obvio para "evoluir a tela" e
      # edita codigo que usuario nenhum ve (HMO-163: 2555 linhas assim, e o
      # arquivo mais convidativo era um dos mortos).
      - name: Nenhum modulo de interface fica sem importador
        run: node scripts/check-dead-components.mjs

      # Mesma familia: deriva do lado do CODIGO, invisivel para tsc e para o
      # next build, e o sintoma so existe em producao. Numa rota sob `[id]`, o
      # Next usa a query string para carregar o segmento e consome a chave de
      # mesmo nome ao montar `params` -- entao `searchParams.get("id")` volta
      # null com o parametro chegando inteiro na URL. Desfazer aporte
      # (DELETE /api/goals/[id]/contributions) ficou 100% quebrado assim, com a
      # tela acusando o usuario de nao informar o que ele informou (HMO-142).
      - name: Rota nao le query com nome de segmento dinamico
        run: node scripts/check-rota-query-colidente.mjs

      # Mora aqui porque e deriva de CODIGO contra SCHEMA, e porque o gatilho
      # dela nao e uma mudanca no codigo -- e uma migration que altera o
      # significado de codigo que ninguem tocou. Quando a 038 ganhou a segunda
      # FK de `recurring_rules` para `financial_accounts`, o embed curto
      # `account:financial_accounts(...)` deixou de ter resposta unica e TRES
      # rotas intactas passaram a responder 500 com PGRST201 em producao -- a
      # tela de gastos fixos nao listava nada, e o POST da conta prevista e o
      # PATCH da baixa gravavam a linha antes de falhar no select do retorno.
      # tsc, next build e teste puro passam todos verdes nesse estado (HMO-236).
      - name: Embed do PostgREST qualifica a FK quando ha mais de uma
        run: node scripts/check-embed-ambiguo.mjs

      # Mora aqui, e nao num workflow proprio, porque e guard textual sem filtro
      # de `paths` -- o campo que ele pega nasce numa TELA NOVA, que por
      # definicao nao esta em nenhuma lista de caminhos escrita hoje.
      #
      # O que ele guarda: o controle de data nativo le os tres segmentos na
      # ordem do APARELHO, e essa ordem nao se forca pelo codigo. Quem digitou
      # 10 de marco grava 3 de outubro -- data valida, plausivel, sem erro
      # nenhum no caminho (medido em Chromium na HMO-238). Num app de dinheiro
      # esse e o pior dos tres modos de errar do controle nativo, porque e o
      # unico que nada denuncia.
      - name: Nenhuma tela usa o campo de data nativo
        run: node scripts/check-campo-de-data.mjs

      # Controle negativo. As duas peneiras do guard acima sao busca textual, e
      # busca textual sai VERDE quando para de achar o que deveria conferir.
      #
      # A segunda peneira (o piso de chamadas) existe exatamente por isso: a
      # primeira, sozinha, aprova a tela em que o campo foi APAGADO. Os dois
      # defeitos sao plantados, e os dois tem que ficar vermelhos.
      - name: A verificacao do campo de data sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          alvo='app/(dashboard)/dashboard/goals/page.tsx'
          cp "$alvo" /tmp/campo-de-data-alvo.orig
          trap 'cp /tmp/campo-de-data-alvo.orig "$alvo"' EXIT

          # 1) O campo nativo de volta numa tela. E o defeito da issue.
          perl -0pi -e 's{<CampoDeData\n                    id="prazo"}{<Input\n                    type="date"\n                    id="prazo"}' "$alvo"
          if node scripts/check-campo-de-data.mjs > /dev/null 2>&1; then
            echo "::error::O guard passou verde com um campo de data nativo na tela de metas."
            exit 1
          fi
          cp /tmp/campo-de-data-alvo.orig "$alvo"

          # 2) O campo simplesmente APAGADO. A primeira peneira nao ve: nao ha
          #    campo nativo nenhum. Quem pega e o piso.
          perl -0pi -e 's{<CampoDeData\n                    id="prazo"}{<span data-sem-campo="1"\n                    id="prazo"}' "$alvo"
          if node scripts/check-campo-de-data.mjs > /dev/null 2>&1; then
            echo "::error::O guard passou verde com um campo de data apagado da tela."
            exit 1
          fi
          cp /tmp/campo-de-data-alvo.orig "$alvo"

          # 3) E SABE NAO FALHAR. Os seis arquivos corrigidos citam o controle
          #    nativo em PROSA, e um guard que lesse comentario reprovaria
          #    justamente eles -- o avesso do que ele mede.
          if ! node scripts/check-campo-de-data.mjs > /dev/null 2>&1; then
            echo "::error::O guard reprova a arvore correta."
            exit 1
          fi

          echo "O guard fica vermelho nos dois defeitos e verde na arvore correta."

      # Controles negativos. Uma verificacao que nunca viu vermelho nao e
      # verificacao: se a regex quebrar numa refatoracao, o passo acima passa a
      # sair verde por nao achar NADA, que e indistinguivel de estar tudo certo.
      # Aqui plantamos as duas formas de deriva e exigimos vermelho nas duas.
      - name: A verificacao sabe falhar
        run: |
          set -uo pipefail
          probe='app/api/_drift_probe/route.ts'
          mkdir -p "$(dirname "$probe")"
          trap 'rm -rf "$(dirname "$probe")"' EXIT

          # 1) A forma obvia: .from("nome").
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase.from("tabela_que_nao_existe").select("*");
          }
          TS
          if node scripts/check-table-drift.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com um .from() inventado."
            exit 1
          fi

          # 2) A forma que escapa da leitura humana, e que foi exatamente o caso
          #    de app/api/groups/route.ts: o .from() aponta para tabela que
          #    existe, e o nome inventado esta no embed do .select().
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase.from("profiles").select(`
              id,
              tabela_que_nao_existe ( nome )
            `);
          }
          TS
          if node scripts/check-table-drift.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com um embed inventado."
            exit 1
          fi

          echo "A verificacao fica vermelha nas duas formas de deriva."

      # Mesmo tratamento para a deriva de COLUNA, e aqui o controle POSITIVO
      # importa tanto quanto o negativo: um guard de coluna que reprova coluna
      # valida seria desligado na primeira semana, e a primeira versao deste
      # mesmo script fazia isso -- a cadeia de `.from()` vazava pela virgula de
      # um `Promise.all([...])` e ele acusou nove colunas que o codigo nunca
      # pediu daquelas relacoes.
      - name: A verificacao de coluna sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          probe='app/api/_column_probe/route.ts'
          mkdir -p "$(dirname "$probe")"
          trap 'rm -rf "$(dirname "$probe")"' EXIT

          # 1) .select() com coluna inventada numa tabela que existe.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase.from("transaction_categories").select("id, name, coluna_inventada");
          }
          TS
          if node scripts/check-column-drift.mjs > /dev/null 2>&1; then
            echo "::error::Passou verde com uma coluna inventada no .select()."
            exit 1
          fi

          # 2) A forma que produziu o 500 da HMO-145: o nome esta no FILTRO, e a
          #    lista de colunas do .select() esta impecavel.
          #
          #    A COLUNA PLANTADA AQUI ERA `user_id`, E A 036 A CRIOU (HMO-216).
          #    O controle nao reprovou por bug: ele parou de controlar. Com
          #    `transaction_categories.user_id` existindo, o guard passa a ter
          #    RAZAO em ficar verde, e este bloco leu isso como "o guard nao
          #    pega filtro". Foi o unico aviso de que a sonda tinha envelhecido
          #    -- um controle negativo que aponta para coluna REAL e
          #    indistinguivel de um guard quebrado.
          #
          #    Trocada por um nome que nao pode passar a existir por acidente:
          #    nenhuma migration vai chamar uma coluna de
          #    `coluna_que_nao_existe_no_filtro`. Plantar outro nome plausivel
          #    (`owner_id`, `created_by`) so adiaria o mesmo envelhecimento
          #    para a proxima migration.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase
              .from("transaction_categories")
              .select("id, name")
              .or("coluna_que_nao_existe_no_filtro.eq.1,coluna_que_nao_existe_no_filtro.is.null");
          }
          TS
          if node scripts/check-column-drift.mjs > /dev/null 2>&1; then
            echo "::error::Passou verde com coluna inventada dentro de .or()."
            exit 1
          fi

          # 3) CONTROLE POSITIVO: cadeias irmas num Promise.all, cada uma com
          #    coluna que so existe na SUA relacao. Tem que ficar verde.
          cat > "$probe" <<'TS'
          export async function GET() {
            await Promise.all([
              supabase.from("transaction_categories").select("id, name, service_id"),
              supabase.from("financial_accounts").select("id, current_balance").eq("account_type", "checking"),
              supabase.from("financial_transactions").select("amount, transaction_type").gte("transaction_date", "2026-01-01"),
            ]);
          }
          TS
          if ! node scripts/check-column-drift.mjs > /dev/null 2>&1; then
            echo "::error::Reprovou colunas VALIDAS em cadeias irmas de um Promise.all."
            node scripts/check-column-drift.mjs || true
            exit 1
          fi

          echo "Vermelho nas duas derivas de coluna, verde no uso legitimo."

      # O mesmo tratamento para a verificacao de suite fora do CI: ela tambem
      # sai verde por nao achar nada se a leitura do package.json quebrar.
      - name: A verificacao de teste fora do CI sabe falhar
        run: |
          set -uo pipefail
          cp package.json package.json.orig
          trap 'mv package.json.orig package.json' EXIT

          node -e '
            const fs = require("node:fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.scripts["test:sonda-que-nenhum-workflow-roda"] = "node -e 0";
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '

          if node scripts/check-tests-in-ci.mjs > /dev/null 2>&1; then
            echo "::error::A verificacao passou verde com uma suite que nenhum workflow roda."
            exit 1
          fi

          echo "A verificacao fica vermelha quando uma suite fica fora do CI."

      # E o mesmo para o codigo morto. Aqui o controle da varredura CEGA e o que
      # mais importa: se a regex do `from` quebrar, ela le quase nenhum import,
      # conclui que nada esta morto e sai VERDE -- indistinguivel de uma arvore
      # limpa. O script tem um piso de especificadores lidos justamente por
      # isso, e a sonda 4 prova que o piso morde.
      - name: A verificacao de codigo morto sabe falhar
        run: |
          set -uo pipefail
          guard='scripts/check-dead-components.mjs'
          cp "$guard" /tmp/guard.orig
          trap 'cp /tmp/guard.orig "$guard"; rm -rf components/_sonda_morta components/_sonda.tsx.bak' EXIT

          # 1) Um componente novo que ninguem importa.
          mkdir -p components/_sonda_morta
          cat > components/_sonda_morta/SondaSemImportador.tsx <<'TS'
          export function SondaSemImportador() {
            return null;
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um componente que ninguem importa."
            exit 1
          fi
          rm -rf components/_sonda_morta

          # 2) Copia de rascunho: extensao que import nenhum alcanca.
          echo '// rascunho' > components/_sonda.tsx.bak
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um arquivo .bak na arvore."
            exit 1
          fi
          rm -f components/_sonda.tsx.bak

          # 3) O registro de ESPERANDO_TELA tem que se invalidar sozinho. Uma
          #    lista de perdao que so cresce e envelhece calada e exatamente o
          #    mecanismo que este guard existe para quebrar.
          node -e '
            const fs = require("node:fs");
            const p = "scripts/check-dead-components.mjs";
            let s = fs.readFileSync(p, "utf8");
            const antes = s;
            s = s.replace(
              "const ESPERANDO_TELA = [",
              "const ESPERANDO_TELA = [\n  { arquivo: \"components/ArquivoQueNaoExiste.tsx\", tela: \"/sonda\", issue: \"SONDA\" },"
            );
            if (s === antes) { console.error("sonda 3 nao aplicou"); process.exit(2); }
            fs.writeFileSync(p, s);
          '
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um registro apontando para arquivo inexistente."
            exit 1
          fi
          cp /tmp/guard.orig "$guard"

          # 4) Varredura cega: quebra o padrao que le quase todo import. Sem o
          #    piso, este e o caso que sai VERDE.
          node -e '
            const fs = require("node:fs");
            const p = "scripts/check-dead-components.mjs";
            let s = fs.readFileSync(p, "utf8");
            const antes = s;
            s = s.replace("/\\bfrom\\s*", "/\\bZZZZfrom\\s*");
            if (s === antes) { console.error("sonda 4 nao aplicou"); process.exit(2); }
            fs.writeFileSync(p, s);
          '
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com a varredura cega -- o piso nao mordeu."
            exit 1
          fi
          cp /tmp/guard.orig "$guard"

          # Controle POSITIVO: restaurado, a arvore de verdade passa. Sem isto,
          # os quatro testes acima estariam satisfeitos por um script que
          # simplesmente sempre falha.
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou a arvore limpa."
            node "$guard" || true
            exit 1
          fi

          echo "Vermelho nas quatro sondas, verde na arvore limpa."

      # Controle do guard de colisao query x segmento dinamico. As duas sondas
      # cobrem as duas formas reais: o acesso direto e o por apelido, que foi
      # justamente o que a primeira versao do guard deixou passar.
      - name: A verificacao de colisao sabe falhar
        run: |
          set -uo pipefail
          guard='scripts/check-rota-query-colidente.mjs'
          probe='app/api/_colisao_probe/[id]/route.ts'
          mkdir -p "$(dirname "$probe")"
          trap 'rm -rf app/api/_colisao_probe' EXIT

          # 1) Acesso direto: searchParams.get("id") sob o segmento [id].
          cat > "$probe" <<'TS'
          import { NextRequest, NextResponse } from "next/server";
          export async function DELETE(request: NextRequest) {
            const alvo = new URL(request.url).searchParams.get("id");
            return NextResponse.json({ alvo });
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com a colisao direta."
            exit 1
          fi

          # 2) Por apelido. Esta e a forma que escapa de uma regex ingenua, e o
          #    guard nasceu cego para ela.
          cat > "$probe" <<'TS'
          import { NextRequest, NextResponse } from "next/server";
          export async function DELETE(request: NextRequest) {
            const sp = new URL(request.url).searchParams;
            return NextResponse.json({ alvo: sp.get("id") });
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com a colisao por apelido."
            exit 1
          fi

          # 3) Controle NEGATIVO de falso positivo: parametro de outro nome sob
          #    [id] e legitimo e chega normalmente em producao (medido com
          #    ?purge=true). Se o guard reprovasse isto, seria desligado.
          cat > "$probe" <<'TS'
          import { NextRequest, NextResponse } from "next/server";
          export async function DELETE(request: NextRequest) {
            const sp = new URL(request.url).searchParams;
            return NextResponse.json({ purge: sp.get("purge") });
          }
          TS
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou parametro que NAO colide."
            node "$guard" || true
            exit 1
          fi

          rm -rf app/api/_colisao_probe
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou a arvore limpa."
            exit 1
          fi

          echo "Vermelho nas duas colisoes, verde no parametro legitimo e na arvore limpa."

      # Controle do guard de embed ambiguo. O controle POSITIVO (sonda 2) pesa
      # tanto quanto o negativo: um guard que reprovasse o embed qualificado
      # obrigaria a desfazer a correcao para ficar verde.
      #
      # A sonda 3 e a que importa mais no longo prazo. Este guard depende de
      # LER as FKs das migrations, e se esse parser quebrar ele nao acha par
      # ambiguo nenhum, nao tem o que conferir, e sai VERDE -- indistinguivel
      # de uma arvore correta. O piso de pares lidos existe para isso, e aqui
      # exigimos que ele morda.
      - name: A verificacao de embed ambiguo sabe falhar, e sabe nao falhar
        run: |
          set -uo pipefail
          guard='scripts/check-embed-ambiguo.mjs'
          probe='app/api/_embed_probe/route.ts'
          mkdir -p "$(dirname "$probe")"
          cp "$guard" /tmp/embed-guard.orig
          trap 'cp /tmp/embed-guard.orig "$guard"; rm -rf app/api/_embed_probe' EXIT

          # 1) O defeito da HMO-236: embed curto a partir de uma tabela que tem
          #    duas FKs para o alvo.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase
              .from("recurring_rules")
              .select(`
                *,
                account:financial_accounts(id, name)
              `);
          }
          TS
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com um embed ambiguo de financial_accounts."
            exit 1
          fi

          # 2) CONTROLE POSITIVO: a mesma query com a FK qualificada passa.
          cat > "$probe" <<'TS'
          export async function GET() {
            await supabase
              .from("recurring_rules")
              .select(`
                *,
                account:financial_accounts!recurring_rules_account_id_fkey(id, name)
              `);
          }
          TS
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou um embed com a FK JA qualificada."
            node "$guard" || true
            exit 1
          fi
          rm -rf app/api/_embed_probe

          # 3) Parser de migration cego. Sem o piso de pares lidos, este e o
          #    caso que sai verde sem ter medido nada.
          node -e '
            const fs = require("node:fs");
            const p = "scripts/check-embed-ambiguo.mjs";
            let s = fs.readFileSync(p, "utf8");
            const antes = s;
            s = s.replace("FOREIGN\\s+KEY", "ZZZFOREIGN\\s+KEY");
            if (s === antes) { console.error("sonda 3 nao aplicou"); process.exit(2); }
            fs.writeFileSync(p, s);
          '
          if node "$guard" > /dev/null 2>&1; then
            echo "::error::Passou verde com o parser de FK cego -- o piso nao mordeu."
            exit 1
          fi
          cp /tmp/embed-guard.orig "$guard"

          # Controle POSITIVO final: a arvore de verdade passa.
          if ! node "$guard" > /dev/null 2>&1; then
            echo "::error::Reprovou a arvore limpa."
            node "$guard" || true
            exit 1
          fi

          echo "Vermelho no embed ambiguo e no parser cego, verde no qualificado e na arvore limpa."
